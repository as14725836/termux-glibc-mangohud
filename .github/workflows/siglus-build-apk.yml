name: Build siglus APK

# 说明：本 workflow 放在你自己的仓库里运行，
# 但真正构建的是外部仓库 xmoezzz/siglus_rs（会 checkout 到子目录 siglus_rs/）。
# 产物 APK 发布到你自己的仓库 Release。

on:
  workflow_dispatch:
    inputs:
      abis:
        description: "Android ABI（空格分隔）"
        required: false
        default: "arm64-v8a"
      variant:
        description: "构建类型：release 或 debug"
        required: false
        default: "release"
      tag:
        description: "发布用 tag（留空则自动 siglus-apk-<run号>）"
        required: false
        default: ""
      ref:
        description: "siglus_rs 的分支/tag/commit"
        required: false
        default: "main"
  push:
    tags:
      - "siglus-v*"

permissions:
  contents: write

env:
  SIGLUS_REPO: xmoezzz/siglus_rs

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_PLATFORM: "24"
      NDK_VERSION: "28.2.13676358"   # 必须与 siglus_rs 的 app/build.gradle.kts ndkVersion 一致
      BUILD_TOOLS: "36.0.0"
      COMPILE_SDK: "36"

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout siglus_rs
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SIGLUS_REPO }}
          ref: ${{ inputs.ref || 'main' }}
          path: siglus_rs
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: siglus_rs

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}"     >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: siglus_rs
        env:
          VARIANT: ${{ inputs.variant || 'release' }}
          ABIS: ${{ inputs.abis || 'arm64-v8a' }}
        run: |
          set -euo pipefail
          chmod +x platform/scripts/package_android_apk.sh
          ./platform/scripts/package_android_apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: siglus-apk-${{ inputs.variant || 'release' }}
          path: siglus_rs/platform/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release
    needs: apk
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -name '*.apk' -exec cp -v {} out/ \;
          ls -l out

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('siglus-apk-{0}', github.run_number) }}
          name: siglus APK build ${{ github.run_number }}
          files: out/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
