name: termux-glibc Wine and Proton

on:
  schedule:
    # Proton 构建 - 每月1号和15号
    - cron: '0 0 1,15 * *'

    # Wine 构建 - 每月5号和20号
    - cron: '0 2 5,20 * *'

  workflow_dispatch:
    inputs:
      build_type:
        description: '选择构建类型'
        required: true
        default: 'proton'
        type: choice
        options:
          - proton
          - wine-wow64

      proton_branch:
        description: 'Proton 分支 (仅 Proton 构建)'
        required: false
        default: 'proton_11.0'
        type: choice
        options:
          - proton_11.0
          - proton_9.0
          - experimental_10.0
          - experimental_11.0
          - proton_11.0-2
          - proton-9.0-arm64ec
          - ge-proton11-5-bionic-staging
          - proton_10.0
          - ge-proton11-bionic
          - bleeding-edge
          - main
          - master
          - dwproton/11.0-14
          - dwproton/11.0-13
          - dwproton/10.0-26

      wine_branch:
        description: 'Wine 分支 (仅 Wine 构建)'
        required: false
        default: 'staging'
        type: choice
        options:
          - vanilla
          - staging
          - staging-tkg
          - staging-tkg-fsync
          - proton-9.0-x86_64

      wine_version:
        description: 'Wine 版本 (仅 Wine 构建)'
        required: false
        default: 'latest'
        type: string

      apply_dxgi_patch:
        description: '应用 DXGI 补丁'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

      apply_box64_icache_patch:
        description: 'box64 指令缓存失效补丁（加壳程序自解密后能刷新 JIT 缓存）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_termux_env_tweaks:
        description: 'Termux 环境优化（D:->/sdcard、Z:->Termux 前缀、preloader 判定）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      proton_repo:
        description: 'Proton 源码仓库（proton_branch 必须存在于该仓库）'
        required: false
        default: 'WinNative-Emu/proton-wine'
        type: choice
        options:
          - WinNative-Emu/proton-wine
          - Pipetto-crypto/wine
          - GameNative/proton-wine
          - dawn.wine/dawn-winery/wine-dwproton

      gst_decoders_version:
        description: 'GStreamer(decoders)版本：作为编译依赖头文件/版本，替代 apt 自带的 1.22.0（来源：termux-glibc-GStreamer Releases）'
        required: false
        default: '1.29.2'
        type: string

      gst_decoders_repo:
        description: 'GStreamer decoders 发布仓库'
        required: false
        default: 'as14725836/termux-glibc-GStreamer'
        type: string

env:
  USE_CCACHE: true
  BUILD_DIR: /tmp/build_wine

permissions:
  contents: write

# ============================================================
# Proton
# ============================================================

jobs:

  build-proton:

    runs-on: ubuntu-24.04

    if: >
      github.event.inputs.build_type == 'proton'
      ||
      (
        github.event_name == 'schedule'
        &&
        github.event.schedule == '0 0 1,15 * *'
      )

    timeout-minutes: 240

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 构建依赖
      # --------------------------------------------------------

      - name: 安装构建依赖
        run: |

          set -e

          sudo apt update

          sudo apt --fix-broken install -y

          BASE_DEPS="\
            debootstrap \
            perl \
            git \
            wget \
            xz-utils \
            bubblewrap \
            autoconf \
            flex \
            bison \
            gcc-multilib \
            g++-multilib \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            pkg-config \
            libegl-dev \
            libgbm-dev \
            libdrm-dev \
            libepoxy-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxxf86vm-dev \
            libxrender-dev \
            libxinerama-dev \
            libgl-dev \
            libsdl2-dev \
            libglu-dev \
            libosmesa6-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libpcap-dev \
            libdbus-1-dev \
            libssl-dev \
            libasound2-dev \
            libswscale-dev \
            libswresample-dev \
            libpulse-dev \
            libudev-dev \
            libcups2-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libxml2-dev \
            libvulkan-dev \
            vulkan-tools \
            libvulkan1 \
            mesa-vulkan-drivers \
            mingw-w64 \
            gettext \
            libgettextpo-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            locales \
            language-pack-zh-hans \
            ccache"

          sudo apt install -y $BASE_DEPS

      # --------------------------------------------------------
      # GStreamer
      # --------------------------------------------------------

      - name: 安装多媒体和音频依赖
        run: |

          set -e

          sudo apt update

          sudo apt install -y \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-* \
            libmpg123-dev \
            libopenal-dev

      # --------------------------------------------------------
      # GStreamer decoders sysroot（用 1.29.2 头文件/版本替换 apt 的 1.22.0）
      # --------------------------------------------------------

      - name: 安装 GStreamer decoders sysroot
        shell: bash
        env:
          GST_REPO: ${{ inputs.gst_decoders_repo || 'as14725836/termux-glibc-GStreamer' }}
          GST_TAG: ${{ inputs.gst_decoders_version || '1.29.2' }}
        run: |
          set -eux
          DEST="/opt/gst-sysroot"
          ASSET="termux-glibc-gst-decoders-${GST_TAG}.tar.gz"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          echo "GStreamer decoders: ${GST_REPO} @ ${GST_TAG}"
          curl -fSL --retry 5 --retry-all-errors --max-time 900 \
            -o /tmp/gst-decoders.tar.gz \
            "https://github.com/${GST_REPO}/releases/download/${GST_TAG}/${ASSET}"

          tar -xzf /tmp/gst-decoders.tar.gz -C "${DEST}" --strip-components=1   # 去掉 'glibc/' 顶层
          test -f "${DEST}/lib/pkgconfig/gstreamer-1.0.pc"

          # 生成“仅 GStreamer”的 pkg-config 目录（遵守两个约束）：
          #  1) 绝不整体前置 sysroot/lib/pkgconfig —— freetype2/fontconfig 等同名 .pc 会遮蔽系统库检查；
          #  2) 不让 sysroot 的 aarch64 .so 参与本机 x86_64 链接。
          #  策略：Cflags 指向 sysroot（头文件/版本号=所选版本），Libs 指向本机 apt 的 x86_64 目录（同 SONAME 链接桩）。
          #  说明：sysroot 头文件是架构无关的 GStreamer 头；Wine 的 winegstreamer 只做 GStreamer API 调用，
          #        1.29.2 头 + 1.22.0 运行库的 ABI 兼容在 wine.yml 的 aarch64 交叉构建中已验证可行。
          HOST_LIBDIR="/usr/lib/x86_64-linux-gnu"
          PCGST="${DEST}/pc-gst"
          rm -rf "${PCGST}"
          mkdir -p "${PCGST}"
          for pc in gstreamer-1.0 gstreamer-base-1.0 gstreamer-app-1.0 gstreamer-video-1.0 gstreamer-audio-1.0 gstreamer-tag-1.0 gstreamer-pbutils-1.0 gstreamer-controller-1.0; do
            if [ -f "${DEST}/lib/pkgconfig/${pc}.pc" ]; then cp "${DEST}/lib/pkgconfig/${pc}.pc" "${PCGST}/${pc}.pc"; fi
          done
          sed -i "s|^prefix=.*|prefix=${DEST}|" "${PCGST}"/*.pc
          sed -i "s|^libdir=.*|libdir=${HOST_LIBDIR}|" "${PCGST}"/*.pc
          sed -i '/^Requires\.private:/d;/^Libs\.private:/d' "${PCGST}"/*.pc

          GSTV=$(PKG_CONFIG_LIBDIR="${PCGST}:${HOST_LIBDIR}/pkgconfig:/usr/share/pkgconfig" \
                 PKG_CONFIG_PATH="${PCGST}:${HOST_LIBDIR}/pkgconfig:/usr/share/pkgconfig" \
                 pkg-config --modversion gstreamer-1.0)
          echo "gstreamer-1.0.pc 版本 = ${GSTV}"
          [ "${GSTV}" = "${GST_TAG}" ] || { echo "FATAL: 版本 ${GSTV} != 期望 ${GST_TAG}"; exit 1; }

          for p in gstreamer-1.0 gstreamer-base-1.0 gstreamer-app-1.0 gstreamer-video-1.0 gstreamer-audio-1.0 gstreamer-tag-1.0; do
            PKG_CONFIG_LIBDIR="${PCGST}:${HOST_LIBDIR}/pkgconfig:/usr/share/pkgconfig" \
            PKG_CONFIG_PATH="${PCGST}:${HOST_LIBDIR}/pkgconfig:/usr/share/pkgconfig" \
            pkg-config --exists "$p" || { echo "FATAL: 缺 ${p}.pc"; exit 1; }
          done
          echo "✅ GStreamer ${GSTV} 编译依赖就绪（Cflags=${DEST}，Libs=apt x86_64 桩）"
          echo "GST_SYSROOT=${DEST}" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Locale
      # --------------------------------------------------------

      - name: 设置中文语言环境
        run: |

          sudo locale-gen zh_CN.UTF-8
          sudo update-locale LANG=zh_CN.UTF-8

          echo "LANG=zh_CN.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=zh_CN.UTF-8" >> "$GITHUB_ENV"
          echo "LANGUAGE=zh_CN:zh:en_US:en" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # ccache
      # --------------------------------------------------------

      - name: 启用 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ github.ref }}
          max-size: 5G

      # --------------------------------------------------------
      # Proton Build
      # --------------------------------------------------------

      - name: 构建 Proton WOW64
        run: |

          set -e

          echo "=========================================="
          echo "开始构建 Proton WOW64"
          echo "=========================================="

          export LANG=zh_CN.UTF-8
          export LC_ALL=zh_CN.UTF-8
          export LANGUAGE=zh_CN:zh:en_US:en

          rm -rf "$BUILD_DIR/proton"

          mkdir -p "$BUILD_DIR/proton"

          cd "$BUILD_DIR/proton"

          # ----------------------------------------------------
          # Clone
          # ----------------------------------------------------

          PROTON_REPO="${{ github.event.inputs.proton_repo || 'WinNative-Emu/proton-wine' }}"
          echo "Proton 源码仓库: ${PROTON_REPO}"

          # ---- 自动判定 host：非 GitHub 仓库（如 dawn.wine / GitLab）走裸 URL ----
          case "$PROTON_REPO" in
            http://*|https://*)  CLONE_URL="$PROTON_REPO" ;;
            dawn.wine/*)         CLONE_URL="https://${PROTON_REPO}.git" ;;
            gitlab.*/*)          CLONE_URL="https://${PROTON_REPO}.git" ;;
            *)                   CLONE_URL="https://github.com/${PROTON_REPO}.git" ;;
          esac
          echo "Clone URL: ${CLONE_URL}"

          # dwproton 的 wine 子模块仓库（wine-dwproton）本身就是完整 Wine 树，
          # 不含任何 git submodule；深度 1 克隆以省时间。
          case "$PROTON_REPO" in
            *wine-dwproton*|*dwproton*)
              git clone --depth 1 --branch "${{ github.event.inputs.proton_branch || 'dwproton/11.0-14' }}" \
                "$CLONE_URL" wine || {
                  echo "浅克隆失败，回退全量克隆"
                  git clone "$CLONE_URL" wine
                }
              ;;
            *)
              git clone "$CLONE_URL" wine
              ;;
          esac

          cd wine

          PROTON_BRANCH="${{ github.event.inputs.proton_branch || 'proton_10.0' }}"

          echo "Proton 分支: $PROTON_BRANCH"

          # 浅克隆已 checkout 到目标分支；全量克隆才需要显式 checkout
          if ! git rev-parse --verify -q HEAD >/dev/null; then
            git checkout "$PROTON_BRANCH"
          else
            echo "当前 HEAD: $(git rev-parse --short HEAD) ($(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo detached))"
          fi

          # 无 submodule 的仓库（如 wine-dwproton）跳过，避免无谓报错
          if [ -f .gitmodules ]; then
            git submodule update --init --recursive
          else
            echo "无 .gitmodules —— 跳过 submodule 初始化"
          fi
          # ---------------- Termux 环境优化（幂等，不冲突）----------------
          if [ "${{ github.event.inputs.enable_termux_env_tweaks || 'true' }}" = "true" ]; then
            echo "=== Termux 环境优化 ==="
            PY=python3
            command -v python3 >/dev/null 2>&1 || PY=python
            "${PY}" "$GITHUB_WORKSPACE/patches/termux-env/termux_env_tweaks.py" "$PWD" || true
          fi

          # ----------------------------------------------------
          # Termux / Android /tmp 路径修复
          # ----------------------------------------------------

          echo "修复 Termux 路径问题..."

          find . \
            -type f \
            \( \
              -name "*.c" \
              -o -name "*.h" \
              -o -name "*.in" \
              -o -name "*.spec" \
            \) \
            -exec grep -l "/tmp" {} \; \
            | xargs -r sed -i \
              's|/tmp/|/data/data/com.termux/files/usr/tmp/|g'

          find server \
            -type f \
            \( -name "*.c" -o -name "*.h" \) \
            -exec sed -i \
              's|"/tmp"|"/data/data/com.termux/files/usr/tmp"|g' {} +

          find . \
            -name "file.c" \
            -exec sed -i \
              's|"/tmp"|"/data/data/com.termux/files/usr/tmp"|g' {} +

          find . \
            -name "loader.c" \
            -exec sed -i \
              's|"/tmp"|"/data/data/com.termux/files/usr/tmp"|g' {} +

          find . \
            -name "server.c" \
            -exec sed -i \
              's|"/tmp"|"/data/data/com.termux/files/usr/tmp"|g' {} +

          # ----------------------------------------------------
          # 自定义补丁
          # ----------------------------------------------------

          PATCH_FILE="$GITHUB_WORKSPACE/0001-ohos-default-to-grayscale-font-antialiasing.patch"

          if [ -f "$PATCH_FILE" ]; then

            echo "Applying $PATCH_FILE..."

            patch -p1 < "$PATCH_FILE"

          else

            echo "Warning: Patch file not found"

          fi

          # ----------------------------------------------------
          # Autogen
          # ----------------------------------------------------

          # ---------------- 冲突标记守卫（任何补丁冲突都不许带进编译）----------------
          MARKERS=$(grep -rl -E '^<<<<<<< ' --include=*.c --include=*.h --include=*.in --include=*.ac . 2>/dev/null | head -60)
          if [ -n "${MARKERS}" ]; then
            echo "⚠ 检测到冲突标记，回滚以下文件（保持源码可编译）："
            echo "${MARKERS}"
            for f in ${MARKERS}; do
              git checkout -- "$f" 2>/dev/null || true
              git clean -f -- "$f" 2>/dev/null || true
            done
          else
            echo "✔ 无冲突标记"
          fi

          if [ -x ./autogen.sh ]; then
            echo "使用仓库自带 autogen.sh"
            ./autogen.sh
          elif [ -f ./configure ]; then
            echo "仓库无 autogen.sh，使用自带的 configure（如 brunodev85/wine-10.10-custom）"
            chmod +x ./configure || true
          else
            echo "既无 autogen.sh 也无 configure，尝试 autoreconf -fiv"
            autoreconf -fiv || true
          fi

          # ----------------------------------------------------
          # Build directory
          # ----------------------------------------------------

          mkdir -p build-wow64

          cd build-wow64

          # machine-id：/etc/machine-id 与 /var/lib/dbus/machine-id 在 Termux 上读不到，
          # 导致 SID 退化、系统 UUID 全 FF；改指 Termux glibc 路径。
          python3 "${GITHUB_WORKSPACE}/patches/wow64/fix_termux_machine_id.py" ..
          # WINEVMEMMAXSIZE (Pipetto f9224d6b): idempotent anchor inject
          if [ -f ../dlls/ntdll/unix/virtual.c ] && ! grep -q WINEVMEMMAXSIZE ../dlls/ntdll/unix/virtual.c; then
            python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_vmem_max_size.py" .. || echo "WARN: vmem inject"
          fi
          # Termux: uffd writewatch 禁用 + shm_open -> Termux tmp（Pipetto 270a7ce5 适配，幂等）
          if [ -f ../dlls/ntdll/unix/virtual.c ] && ! grep -q 'termux_shm_open' ../dlls/ntdll/unix/virtual.c; then
            python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_termux_uffd_shm.py" .. || echo "WARN: uffd/shm inject"
          fi
          # noexec: 允许 noexec 分区（/sdcard 等）映射回退 read()（Pipetto b0fdd49f 适配，幂等）
          if [ -f ../dlls/ntdll/unix/virtual.c ] && ! grep -q 'noexec relax' ../dlls/ntdll/unix/virtual.c; then
            python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_noexec_relax.py" .. || echo "WARN: noexec relax inject"
          fi
          # seccomp: 放宽 install_bpf 低地址拒绝 + 测试 mmap 不限地址（Pipetto 441c0fe6 适配，幂等；新旧树自动跳过）
          if [ -f ../dlls/ntdll/unix/signal_x86_64.c ] && ! grep -q 'seccomp relax' ../dlls/ntdll/unix/signal_x86_64.c; then
            python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_seccomp_relax.py" .. || echo "WARN: seccomp relax inject"
          fi
          # winegstreamer: GstGL 可条件关闭 WINE_GST_NO_GL（Pipetto 76f6eab3 适配，幂等；新旧树自动跳过）
          if [ -f ../dlls/winegstreamer/unixlib.c ] && ! grep -q 'wine_gst_no_gl' ../dlls/winegstreamer/unixlib.c; then
            python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_gst_no_gl.py" .. || echo "WARN: gst-no-gl inject"
          fi
          python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_media_converter_gates.py" .. || true
          python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_dpi_v2_awareness.py" .. || true
          # 解码器注册补全（Pipetto proton-9.0-arm64ec 21 条提交：quartz/l3codecx.ax/colorcnv/
          # mfasfsrcsnk/mfh264enc/mfmp4srcsnk/msauddecmft/msmpeg2vdec/msvproc/resampledmo/wmadmod）
          # 已存在则按哨兵跳过；打不上仅告警，不阻断构建。
          python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_decoder_registrations.py" .. || echo "WARN: decoder-reg inject"
          # MediaFoundation byte stream handler：默认优先 GStreamer（上游行为）。
          # 兼容 Proton(return FALSE) / 上游(return TRUE) / dwproton(PROTON_MEDIA_FORCE_GST) 三种树；
          # 已有 return TRUE 或已注入 WINE_USE_DMO 则自动跳过。
          # 运行时 WINE_USE_DMO=1 可强制退回 winedmo/FFmpeg。
          python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_gst_priority.py" .. || echo "WARN: gst-priority inject"

          # ====================================================
          # 编译优化
          # ====================================================

          export CC="ccache gcc"
          export CXX="ccache g++"

          export CROSSCC="ccache x86_64-w64-mingw32-gcc"
          export CROSSCXX="ccache x86_64-w64-mingw32-g++"

          # GStreamer 编译依赖走所选 decoders 版本（Cflags=sysroot 头文件；Libs=apt x86_64 同 SONAME 桩）
          export GST_SYSROOT="${GST_SYSROOT:-/opt/gst-sysroot}"
          export PKG_CONFIG_PATH="${GST_SYSROOT}/pc-gst:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="${GST_SYSROOT}/pc-gst:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          echo "GStreamer(sysroot): $(pkg-config --modversion gstreamer-1.0 2>/dev/null) @ $(pkg-config --variable=prefix gstreamer-1.0 2>/dev/null)"

          # ----------------------------------------------------
          # Unix compiler
          # ----------------------------------------------------

          export CFLAGS="\
          -march=x86-64 \
          -msse3 \
          -mfpmath=sse \
          -O2 \
          -pipe \
          -fno-plt \
          -fno-semantic-interposition \
          -fno-math-errno \
          -fno-trapping-math \
          -ffunction-sections \
          -fdata-sections \
          -fmerge-all-constants \
          -fno-ident"

          export CXXFLAGS="$CFLAGS"

          # ----------------------------------------------------
          # PE compiler
          # ----------------------------------------------------

          export CROSSCFLAGS="\
          -march=x86-64 \
          -msse3 \
          -mfpmath=sse \
          -O2 \
          -pipe \
          -fno-plt \
          -fno-math-errno \
          -ffunction-sections \
          -fdata-sections \
          -fmerge-all-constants \
          -fno-ident"

          export CROSSCXXFLAGS="$CROSSCFLAGS"

          # ----------------------------------------------------
          # Linker
          # ----------------------------------------------------

          export LDFLAGS="\
          -Wl,-O2 \
          -Wl,--as-needed \
          -Wl,--gc-sections \
          -Wl,--build-id=none"

          echo "=========================================="
          echo "CFLAGS:"
          echo "$CFLAGS"
          echo
          echo "LDFLAGS:"
          echo "$LDFLAGS"
          echo "=========================================="

          # ====================================================
          # Configure
          # ====================================================

          # ---- adapted-11.18 补丁（自动探测源码目录，子 shell 内应用，不改动 cwd）----
          _wsrc=""
          for _d in . .. source wine wine-tkg wine-src ./wine ../wine; do
            if [ -f "$_d/dlls/quartz/Makefile.in" ]; then _wsrc="$_d"; break; fi
          done
          if [ -n "$_wsrc" ]; then
            ( cd "$_wsrc"
              # ---- adapted-11.18 user patches (quartz colour / qasf asf / termux-dns) ----
              for _up in 0060-quartz-implement-colour-filter.patch \
                         0061-qasf-deliver-compressed-asf-streams.patch \
                         termux-dns-fix.patch; do
                _u="${GITHUB_WORKSPACE:-$PWD}/patches/adapted-11.18/$_up"
                [ -f "$_u" ] || _u="/tmp/wine-termux/$_up"
                if [ ! -f "$_u" ]; then
                  mkdir -p /tmp/wine-termux
                  curl -fsSL -o "$_u" "https://raw.githubusercontent.com/as14725836/wine-termux/main/$_up" \
                    || wget -q -O "$_u" "https://raw.githubusercontent.com/as14725836/wine-termux/main/$_up" \
                    || { echo "WARN: adapted 补丁下载失败，跳过 $_up"; continue; }
                fi
                _out="$(patch -p1 --batch --dry-run --forward --no-backup-if-mismatch < "$_u" 2>&1)" || true
                if echo "$_out" | grep -qE 'FAILED|hunk ignored|can.t find file'; then
                  echo "SKIP: $_up 与当前源码不兼容（hunk 打不上）→ 跳过"
                  echo "$_out" | grep -E 'FAILED|hunk ignored' | head -3 || true
                elif patch -p1 --batch --forward --no-backup-if-mismatch < "$_u" >/dev/null 2>&1; then
                  echo "OK  : $_up 已应用"
                else
                  echo "SKIP: $_up 应用失败 → 跳过"
                fi
              done
              echo "adapted-11.18 self-check: colour.c=$(ls dlls/quartz/colour.c 2>/dev/null || echo MISSING) dns=$(grep -c init_dns_config dlls/ntdll/unix/loader.c 2>/dev/null || echo 0)"
              if find . -name '*.rej' | head -1 | grep -q .; then echo 'WARN: 存在 .rej 文件:'; find . -name '*.rej' | head -5; fi
              # ---- adapted-11.18 end ----
            )
          else
            echo "SKIP: adapted-11.18 —— 当前目录下没找到 wine 源码树"
          fi
          ../configure \
            --enable-win64 \
            --enable-archs=i386,x86_64 \
            --prefix=/tmp/wine-install-proton \
            --with-x \
            --with-vulkan \
            --with-alsa \
            --with-pulse \
            --with-freetype \
            --with-fontconfig \
            --with-gstreamer \
            --with-gettext \
            --with-sdl \
            --enable-nls \
            --disable-winemenubuilder \
            --disable-win16 \
            --disable-tests \
            --without-ldap \
            --without-capi \
            --without-oss \
            --without-cups \
            --without-dbus \
            --without-coreaudio \
            --without-gphoto \
            --without-osmesa \
            --without-sane \
            --without-pcap \
            --without-pcsclite \
            --without-udev \
            --without-unwind \
            --without-usb \
            --without-v4l2 \
            --without-wayland

          # ====================================================
          # Build
          # ====================================================

          echo "开始构建 Proton WOW64..."

          make -j"$(nproc)"

          make install

          # ====================================================
          # 版本信息
          # ====================================================

          cd ../..

          VERSION_PROTON=$(
            cd wine
            git describe --tags --abbrev=0 2>/dev/null \
              || echo "$PROTON_BRANCH"
          )

          COMMIT_HASH=$(
            cd wine
            git rev-parse --short HEAD
          )

          PROTON_VERSION="${VERSION_PROTON}-${COMMIT_HASH}"

          echo "PROTON_VERSION=$PROTON_VERSION" >> "$GITHUB_ENV"

          echo "BUILD_NAME=proton-${PROTON_VERSION}-wow64" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Proton 瘦身
      # --------------------------------------------------------

      - name: Proton 安装包瘦身
        run: |

          set -e

          PREFIX="/tmp/wine-install-proton"

          echo "=========================================="
          echo "原始安装大小"
          echo "=========================================="

          du -sh "$PREFIX"

          # 删除静态库
          find "$PREFIX" \
            -type f \
            \( \
              -name "*.a" \
              -o -name "*.la" \
            \) \
            -print \
            -delete

          # 删除 debug 文件
          find "$PREFIX" \
            -type f \
            \( \
              -name "*.debug" \
              -o -name "*.dwo" \
            \) \
            -print \
            -delete

          # 删除开发目录
          rm -rf "$PREFIX/include"

          # 删除文档
          rm -rf "$PREFIX/share/man"
          rm -rf "$PREFIX/share/doc"

          # Strip
          # 确保有 llvm-strip / file（llvm-strip 能同时处理 PE/COFF，GNU strip 做不到）
          if ! command -v llvm-strip >/dev/null 2>&1; then
            sudo apt-get install -y -qq llvm >/dev/null 2>&1 || true
          fi
          if ! command -v file >/dev/null 2>&1; then
            sudo apt-get install -y -qq file >/dev/null 2>&1 || true
          fi
          echo "开始 Strip（llvm-strip：ELF + PE）..."

          if command -v llvm-strip >/dev/null 2>&1; then
            SZ_B=$(du -sb "$PREFIX" | cut -f1)
            ELF_N=0
            PE_N=0
            while IFS= read -r -d '' f; do
              case "$(file -b "$f" 2>/dev/null || true)" in
                ELF*)
                  llvm-strip --strip-unneeded "$f" >/dev/null 2>&1 && ELF_N=$((ELF_N+1)) || true
                  ;;
                PE32*)
                  llvm-strip --strip-all "$f" >/dev/null 2>&1 && PE_N=$((PE_N+1)) || true
                  ;;
              esac
            done < <(find "$PREFIX" -type f -print0)
            SZ_A=$(du -sb "$PREFIX" | cut -f1)
            echo "Strip 完成：ELF=${ELF_N} 个，PE=${PE_N} 个"
            echo "体积：${SZ_B} -> ${SZ_A} bytes（减少 $(( (SZ_B - SZ_A) / 1024 / 1024 )) MiB）"

            # 健全性检查：bin/wine 的 INTERP、PE 导出表必须还在
            if [ -x "$PREFIX/bin/wine" ] && command -v llvm-readelf >/dev/null 2>&1; then
              if llvm-readelf -l "$PREFIX/bin/wine" 2>/dev/null | grep -q INTERP; then
                echo "OK: bin/wine INTERP 仍存在"
              fi
            fi
            if command -v llvm-readobj >/dev/null 2>&1; then
              for D in ntdll kernelbase; do
                for DIR in "$PREFIX"/lib/wine/*-windows; do
                  DLL="$DIR/$D.dll"
                  [ -f "$DLL" ] || continue
                  N=$(llvm-readobj --coff-exports "$DLL" 2>/dev/null | grep -c 'Name:' || true)
                  echo "  $(basename "$DIR")/$D.dll 导出数: ${N:-0}"
                  if [ "${N:-0}" -gt 100 ]; then :; else echo "FATAL: $DLL 导出表异常"; exit 1; fi
                done
              done
            fi
          else
            echo "WARN: 没有 llvm-strip，退回 GNU strip（仅 ELF）"
            find "$PREFIX" \
              -type f \
              \( \
                -name "*.so" \
                -o -name "*.so.*" \
                -o -perm -u+x \
              \) \
              -exec strip --strip-unneeded {} + \
              2>/dev/null || true
          fi

          # 删除空目录
          find "$PREFIX" \
            -type d \
            -empty \
            -delete \
            2>/dev/null || true

          echo "=========================================="
          echo "最终安装大小"
          echo "=========================================="

          du -sh "$PREFIX"

          echo
          echo "各目录大小："

          du -sh "$PREFIX"/* \
            2>/dev/null \
            | sort -h || true

      # --------------------------------------------------------
      # Proton 检查
      # --------------------------------------------------------

      - name: 检查 Proton 运行时
        run: |

          set -e

          PREFIX="/tmp/wine-install-proton"

          echo "检查 Wine..."

          test -f "$PREFIX/bin/wine"

          echo "✓ wine"

          test -f "$PREFIX/bin/wineserver"

          echo "✓ wineserver"

          if [ -f "$PREFIX/bin/wine64" ]; then
            echo "✓ wine64"
          fi

          if [ -d "$PREFIX/share/wine" ]; then
            echo "✓ share/wine"
          else
            echo "⚠️ share/wine 不存在"
          fi

          echo
          echo "DLL 数量:"

          find "$PREFIX" \
            -type f \
            \( -name "*.dll" -o -name "*.dll.so" \) \
            | wc -l

          echo
          echo "SO 数量:"

          find "$PREFIX" \
            -type f \
            \( -name "*.so" -o -name "*.so.*" \) \
            | wc -l

      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------

      - name: 准备 Proton 打包
        run: |

          set -e

          PACKAGE_NAME="${BUILD_NAME}"

          mkdir -p "wine-package/$PACKAGE_NAME"

          cp -a \
            /tmp/wine-install-proton/. \
            "wine-package/$PACKAGE_NAME/"

      # --------------------------------------------------------
      # Tar XZ
      # --------------------------------------------------------

      - name: 创建 Proton 压缩包
        run: |

          set -e

          PACKAGE_NAME="${BUILD_NAME}"

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -I 'xz -T0 -9e' \
            -cf "$PACKAGE_NAME.tar.xz" \
            -C wine-package \
            "$PACKAGE_NAME"

          ls -lh "$PACKAGE_NAME.tar.xz"

      # --------------------------------------------------------
      # Checksum
      # --------------------------------------------------------

      - name: Generate checksums
        run: |

          sha256sum *.tar.xz > checksums.txt

          cat checksums.txt

      # --------------------------------------------------------
      # Artifact
      # --------------------------------------------------------

      - name: Upload Proton artifacts
        uses: actions/upload-artifact@v4

        with:
          # 分支名可能含 '/'（如 dwproton/11.0-14），GitHub artifact 名禁止斜杠
          name: Proton-${{ replace(github.event.inputs.proton_branch || 'proton_10.0', '/', '-') }}-WoW64

          path: |
            ${{ github.workspace }}/*.tar.xz
            ${{ github.workspace }}/checksums.txt

          retention-days: 30

      # --------------------------------------------------------
      # Release
      # --------------------------------------------------------

      - name: 发布 Proton 到 GitHub Release
        uses: softprops/action-gh-release@v1

        if: >
          github.event_name == 'workflow_dispatch'
          &&
          github.event.inputs.build_type == 'proton'

        with:

          tag_name: proton-${{ replace(github.event.inputs.proton_branch || 'proton_10.0', '/', '-') }}-wow64

          name: Proton ${{ replace(github.event.inputs.proton_branch || 'proton_10.0', '/', '-') }} (WOW64 with Vulkan & GStreamer for Termux)

          body: |

            # Proton ${{ replace(github.event.inputs.proton_branch || 'proton_10.0', '/', '-') }} - Termux WOW64

            ## 版本信息

            - Proton 分支: `${{ github.event.inputs.proton_branch || 'proton_10.0' }}`
            - 架构: True WOW64
            - 平台: Termux / Android
            - Vulkan: Enabled
            - GStreamer: Enabled
            - OpenGL: Enabled
            - 中文环境: Enabled

            ## 优化

            - GCC O2
            - Function sections
            - Data sections
            - Linker garbage collection
            - As-needed linking
            - Strip unused symbols
            - 移除静态库
            - 移除 libtool 文件
            - 移除 debug 文件
            - 移除开发头文件
            - 移除 man/doc

            ## 注意

            `share/wine` 等 Wine runtime 数据保持不变。

          files: |
            ${{ github.workspace }}/${{ env.BUILD_NAME }}.tar.xz
            ${{ github.workspace }}/checksums.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ============================================================
# Wine WOW64
# ============================================================

  build-wine-wow64:

    runs-on: ubuntu-24.04

    if: >
      github.event.inputs.build_type == 'wine-wow64'
      ||
      (
        github.event_name == 'schedule'
        &&
        github.event.schedule == '0 2 5,20 * *'
      )

    timeout-minutes: 240

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Build dependencies
      # --------------------------------------------------------

      - name: 安装构建依赖
        run: |

          set -e

          sudo apt update

          sudo apt --fix-broken install -y

          BASE_DEPS="\
            debootstrap \
            perl \
            git \
            wget \
            xz-utils \
            bubblewrap \
            autoconf \
            flex \
            bison \
            gcc-multilib \
            g++-multilib \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libegl-dev \
            libgbm-dev \
            libdrm-dev \
            pkg-config \
            libepoxy-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libwayland-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxxf86vm-dev \
            libxrender-dev \
            libxinerama-dev \
            libgl-dev \
            libsdl2-dev \
            libglu-dev \
            libosmesa6-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libpcap-dev \
            libdbus-1-dev \
            libssl-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libcups2-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libxml2-dev \
            libvulkan-dev \
            vulkan-tools \
            libvulkan1 \
            mesa-vulkan-drivers \
            mingw-w64 \
            gettext \
            libgettextpo-dev \
            locales \
            language-pack-zh-hans \
            ccache"

          sudo apt install -y $BASE_DEPS

      # --------------------------------------------------------
      # GStreamer
      # --------------------------------------------------------

      - name: 安装多媒体和音频依赖
        run: |

          set -e

          sudo apt update

          sudo apt install -y \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-good1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-alsa \
            gstreamer1.0-gl \
            gstreamer1.0-qt5 \
            gstreamer1.0-gtk3 \
            libmpg123-dev \
            libopenal-dev \
            libfaad-dev \
            libflac-dev \
            libvorbis-dev \
            libx264-dev \
            libx265-dev \
            libvpx-dev \
            libtheora-dev

      # --------------------------------------------------------
      # GStreamer decoders sysroot（用 1.29.2 头文件/版本替换 apt 的 1.22.0）
      # --------------------------------------------------------

      - name: 安装 GStreamer decoders sysroot
        shell: bash
        env:
          GST_REPO: ${{ inputs.gst_decoders_repo || 'as14725836/termux-glibc-GStreamer' }}
          GST_TAG: ${{ inputs.gst_decoders_version || '1.29.2' }}
        run: |
          set -eux
          DEST="/opt/gst-sysroot"
          ASSET="termux-glibc-gst-decoders-${GST_TAG}.tar.gz"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          echo "GStreamer decoders: ${GST_REPO} @ ${GST_TAG}"
          curl -fSL --retry 5 --retry-all-errors --max-time 900 \
            -o /tmp/gst-decoders.tar.gz \
            "https://github.com/${GST_REPO}/releases/download/${GST_TAG}/${ASSET}"

          tar -xzf /tmp/gst-decoders.tar.gz -C "${DEST}" --strip-components=1   # 去掉 'glibc/' 顶层
          test -f "${DEST}/lib/pkgconfig/gstreamer-1.0.pc"

          # 生成“仅 GStreamer”的 pkg-config 目录（遵守两个约束）：
          #  1) 绝不整体前置 sysroot/lib/pkgconfig —— freetype2/fontconfig 等同名 .pc 会遮蔽系统库检查；
          #  2) 不让 sysroot 的 aarch64 .so 参与本机 x86_64 链接。
          #  策略：Cflags 指向 sysroot（头文件/版本号=所选版本），Libs 指向本机 apt 的 x86_64 目录（同 SONAME 链接桩）。
          HOST_LIBDIR="/usr/lib/x86_64-linux-gnu"
          PCGST="${DEST}/pc-gst"
          rm -rf "${PCGST}"
          mkdir -p "${PCGST}"
          for pc in gstreamer-1.0 gstreamer-base-1.0 gstreamer-app-1.0 gstreamer-video-1.0 gstreamer-audio-1.0 gstreamer-tag-1.0 gstreamer-pbutils-1.0 gstreamer-controller-1.0; do
            if [ -f "${DEST}/lib/pkgconfig/${pc}.pc" ]; then cp "${DEST}/lib/pkgconfig/${pc}.pc" "${PCGST}/${pc}.pc"; fi
          done
          sed -i "s|^prefix=.*|prefix=${DEST}|" "${PCGST}"/*.pc
          sed -i "s|^libdir=.*|libdir=${HOST_LIBDIR}|" "${PCGST}"/*.pc
          sed -i '/^Requires\.private:/d;/^Libs\.private:/d' "${PCGST}"/*.pc

          GSTV=$(PKG_CONFIG_LIBDIR="${PCGST}:${HOST_LIBDIR}/pkgconfig:/usr/share/pkgconfig" \
                 PKG_CONFIG_PATH="${PCGST}:${HOST_LIBDIR}/pkgconfig:/usr/share/pkgconfig" \
                 pkg-config --modversion gstreamer-1.0)
          echo "gstreamer-1.0.pc 版本 = ${GSTV}"
          [ "${GSTV}" = "${GST_TAG}" ] || { echo "FATAL: 版本 ${GSTV} != 期望 ${GST_TAG}"; exit 1; }

          for p in gstreamer-1.0 gstreamer-base-1.0 gstreamer-app-1.0 gstreamer-video-1.0 gstreamer-audio-1.0 gstreamer-tag-1.0; do
            PKG_CONFIG_LIBDIR="${PCGST}:${HOST_LIBDIR}/pkgconfig:/usr/share/pkgconfig" \
            PKG_CONFIG_PATH="${PCGST}:${HOST_LIBDIR}/pkgconfig:/usr/share/pkgconfig" \
            pkg-config --exists "$p" || { echo "FATAL: 缺 ${p}.pc"; exit 1; }
          done
          echo "✅ GStreamer ${GSTV} 编译依赖就绪（Cflags=${DEST}，Libs=apt x86_64 桩）"
          echo "GST_SYSROOT=${DEST}" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Locale
      # --------------------------------------------------------

      - name: 设置中文语言环境
        run: |

          sudo locale-gen zh_CN.UTF-8
          sudo update-locale LANG=zh_CN.UTF-8

          echo "LANG=zh_CN.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=zh_CN.UTF-8" >> "$GITHUB_ENV"
          echo "LANGUAGE=zh_CN:zh:en_US:en" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # ccache
      # --------------------------------------------------------

      - name: 启用 ccache
        uses: hendrikmuhs/ccache-action@v1.2

        with:
          key: ${{ github.job }}-${{ github.ref }}
          max-size: 5G

      # ========================================================
      # Wine Build
      # ========================================================

      - name: 构建 Wine WOW64
        run: |

          set -e

          export WINE_BRANCH="${{ github.event.inputs.wine_branch || 'staging' }}"
          export WINE_VERSION="${{ github.event.inputs.wine_version || 'latest' }}"
          export APPLY_DXGI_PATCH="${{ github.event.inputs.apply_dxgi_patch || 'true' }}"

          export BUILD_DIR="/tmp/build_wine_${WINE_BRANCH}_${WINE_VERSION}"

          echo "=========================================="
          echo "Wine WOW64 Build"
          echo "=========================================="

          echo "Branch: $WINE_BRANCH"
          echo "Version: $WINE_VERSION"
          echo "DXGI patch: $APPLY_DXGI_PATCH"

          export LANG=zh_CN.UTF-8
          export LC_ALL=zh_CN.UTF-8
          export LANGUAGE=zh_CN:zh:en_US:en

          rm -rf "$BUILD_DIR"

          mkdir -p "$BUILD_DIR"

          cd "$BUILD_DIR"

          # Source selection

          if [ "$WINE_BRANCH" = "staging-tkg" ] || \
             [ "$WINE_BRANCH" = "staging-tkg-fsync" ]; then

            echo "处理 TKG"

            if [ "$WINE_BRANCH" = "staging-tkg" ]; then

              git clone \
                https://github.com/Kron4ek/wine-tkg.git \
                wine-tkg

            else

              git clone \
                -b fsync \
                https://github.com/Kron4ek/wine-tkg.git \
                wine-tkg

            fi

            SOURCE_DIR="wine-tkg"

            cd "$SOURCE_DIR"

            if [ "$WINE_VERSION" != "latest" ]; then

              git checkout "$WINE_VERSION" \
                2>/dev/null \
                || \
              git checkout "wine-$WINE_VERSION" \
                2>/dev/null \
                || true

            fi

            if [ -f "VERSION" ]; then

              WINE_VERSION_ACTUAL="$(
                cat VERSION | tail -c +14
              )"

            else

              WINE_VERSION_ACTUAL="$(
                git describe --tags --abbrev=0 \
                2>/dev/null \
                || echo "$WINE_VERSION"
              )"

            fi

            COMMIT_HASH="$(
              git rev-parse --short HEAD
            )"

            BUILD_NAME="wine-${WINE_VERSION_ACTUAL}-${WINE_BRANCH}-wow64"

          elif [ "$WINE_BRANCH" = "staging" ]; then

            echo "处理 Wine Staging"

            git clone \
              https://github.com/wine-mirror/wine.git \
              wine

            SOURCE_DIR="wine"

            cd "$SOURCE_DIR"

            git config advice.detachedHead false

            if [ "$WINE_VERSION" != "latest" ]; then

              git checkout "wine-$WINE_VERSION"

            else

              # latest：自动对齐到最新稳定 tag，避免 master tip 与 staging 补丁集错配
              WINE_LATEST_TAG="$(git tag -l 'wine-*' --sort=-v:refname | grep -E '^wine-[0-9]+\.[0-9]+$' | head -1)"

              if [ -n "$WINE_LATEST_TAG" ]; then

                echo "latest：自动切换到最新稳定 tag: $WINE_LATEST_TAG"

                git checkout "$WINE_LATEST_TAG"

              else

                echo "WARN: 未找到稳定版本 tag，保持当前 HEAD（可能与补丁集错配）"

              fi

            fi

            WINE_VERSION_ACTUAL="$(
              git describe --tags --abbrev=0 \
              2>/dev/null \
              || echo "$WINE_VERSION"
            )"

            COMMIT_HASH="$(
              git rev-parse --short HEAD
            )"

            BUILD_NAME="wine-${WINE_VERSION_ACTUAL}-${COMMIT_HASH}-staging-wow64"

            PURE_VERSION="$(
              echo "$WINE_VERSION_ACTUAL" \
              | sed 's/^wine-//'
            )"

            STAGING_VERSION="v${PURE_VERSION}"

            wget \
              -O "wine-staging-${PURE_VERSION}.tar.gz" \
              "https://github.com/wine-staging/wine-staging/archive/refs/tags/${STAGING_VERSION}.tar.gz" \
              || \
            wget \
              -O "wine-staging-${PURE_VERSION}.tar.gz" \
              "https://github.com/wine-staging/wine-staging/archive/refs/tags/v${PURE_VERSION}.tar.gz"

            if [ -f "wine-staging-${PURE_VERSION}.tar.gz" ]; then

              tar -xzf \
                "wine-staging-${PURE_VERSION}.tar.gz"

              if [ -d "wine-staging-${PURE_VERSION}" ]; then

                cd "wine-staging-${PURE_VERSION}/staging"

                chmod +x patchinstall.py

                ./patchinstall.py \
                  --all \
                  --destdir=../../

                cd "../.."

              elif [ -d "wine-staging-v${PURE_VERSION}" ]; then

                cd "wine-staging-v${PURE_VERSION}/staging"

                chmod +x patchinstall.py

                ./patchinstall.py \
                  --all \
                  --destdir=../../

                cd "../.."

              fi

            fi

          elif [ "$WINE_BRANCH" = "vanilla" ]; then

            echo "处理 Vanilla"

            git clone \
              https://github.com/brunodev85/wine-10.10-custom.git \
              wine

            SOURCE_DIR="wine"

            cd "$SOURCE_DIR"

            git config advice.detachedHead false

            if [ "$WINE_VERSION" != "latest" ]; then

              git checkout "wine-$WINE_VERSION"

            fi

            WINE_VERSION_ACTUAL="$(
              git describe --tags --abbrev=0 \
              2>/dev/null \
              || echo "$WINE_VERSION"
            )"

            COMMIT_HASH="$(
              git rev-parse --short HEAD
            )"

            BUILD_NAME="wine-${WINE_VERSION_ACTUAL}-${COMMIT_HASH}-vanilla-wow64"

          elif [ "$WINE_BRANCH" = "proton-9.0-x86_64" ]; then

            echo "处理 Pipetto proton-9.0-x86_64"

            git clone \
              --depth 1 \
              -b proton-9.0-x86_64 \
              https://github.com/Pipetto-crypto/wine.git \
              wine

            SOURCE_DIR="wine"

            cd "$SOURCE_DIR"

            git config advice.detachedHead false

            WINE_VERSION_ACTUAL="$(
              sed 's/^Wine version //' VERSION 2>/dev/null || echo "9.0"
            )"

            COMMIT_HASH="$(
              git rev-parse --short HEAD
            )"

            BUILD_NAME="wine-${WINE_VERSION_ACTUAL}-${COMMIT_HASH}-proton-wow64"

          else

            echo "未知 Wine 分支: $WINE_BRANCH"

            exit 1

          fi

          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"

          echo "WINE_VERSION_ACTUAL=$WINE_VERSION_ACTUAL" >> "$GITHUB_ENV"

          echo "当前源码目录: $(pwd)"

          echo "构建名称: $BUILD_NAME"

          # Custom patches

          echo "应用自定义补丁"

          # 能打就打，打不上就跳过：先用 --dry-run 预检，只有整份补丁
          # 都能干净应用时才真正打。这样不会留下 .rej，也不会因为一份
          # 面向新 Wine 的补丁被硬套到旧源码上而中断整个构建
          # （proton-9.0-x86_64 是 Wine 9.0，自带了更高版本才引入的
          # LAA / quartz 色彩滤镜 / qasf ASF 等功能）。
          for patch in "$GITHUB_WORKSPACE"/patch11.16/*.patch; do

            if [ -f "$patch" ]; then

              _name="$(basename "$patch")"

              echo "Applying $_name ..."

              _out="$(patch -p1 --batch --dry-run --forward \
                        --no-backup-if-mismatch < "$patch" 2>&1)" || true

              if echo "$_out" | grep -qE 'FAILED|hunk ignored|can.t find file|Reversed'; then

                echo "SKIP: $_name 与当前源码不兼容（hunk 打不上）→ 跳过"

                echo "$_out" | grep -E 'FAILED|hunk ignored|Reversed' | head -3 || true

              elif patch -p1 --batch --forward --no-backup-if-mismatch \
                     < "$patch" >/dev/null 2>&1; then

                echo "OK  : $_name 已应用"

              else

                echo "SKIP: $_name 应用失败 → 跳过"

              fi

            fi

          done

          # 兜底：清掉任何残留的 .rej/.orig，避免后续检查误判
          find . -name '*.rej' -delete 2>/dev/null || true
          find . -name '*.orig' -delete 2>/dev/null || true

          # DXGI patch

          if [ "$APPLY_DXGI_PATCH" = "true" ]; then

            echo "=========================================="
            echo "启用 DXGI 补丁"
            echo "=========================================="

            PURE_VERSION="$(
              echo "$WINE_VERSION_ACTUAL" \
              | sed 's/^wine-//'
            )"

            VERSION_MAJOR="$(
              echo "$PURE_VERSION" \
              | cut -d. -f1
            )"

            VERSION_MINOR="$(
              echo "$PURE_VERSION" \
              | cut -d. -f2
            )"

            echo "Wine version: $WINE_VERSION_ACTUAL"
            echo "Pure version: $PURE_VERSION"
            echo "Major: $VERSION_MAJOR"
            echo "Minor: $VERSION_MINOR"

            # 幂等检测：proton-9.0-x86_64 / Proton 分支往往已自带
            # WINE_DO_NOT_CREATE_DXGI_DEVICE_MANAGER 支持，重复应用会导致
            #   dlls/mfplat/main.c: error: redefinition of 'do_not_create'
            if [ -f dlls/mfplat/main.c ] && \
               grep -q 'WINE_DO_NOT_CREATE_DXGI_DEVICE_MANAGER' dlls/mfplat/main.c; then
              echo "SKIP: dlls/mfplat/main.c 已自带 DXGI 修复 → 跳过"

            elif [ "$VERSION_MAJOR" -gt 9 ] || \
               [ "$VERSION_MAJOR" -eq 9 -a "$VERSION_MINOR" -ge 10 ]; then

              echo "使用 9.10+ DXGI 修复"

              wget \
                -O wine_do_not_create_dxgi_device_manager2.patch \
                https://raw.githubusercontent.com/as14725836/wine-termux/main/wine_do_not_create_dxgi_device_manager2.patch

              if [ -f "dlls/mfplat/main.c" ]; then

                patch -p1 --forward --batch \
                  < wine_do_not_create_dxgi_device_manager2.patch \
                  || echo "WARN: DXGI 补丁未完全应用（可能已应用过）"

                echo "✓ DXGI patch applied"

              else

                echo "目标文件不存在：dlls/mfplat/main.c"

                exit 1

              fi

            else

              echo "使用 Wine 9.10 以下修复"

              wget \
                -O fix_wine9.2_mfplat.sh \
                https://github.com/afeimod/linbox/raw/main/path/fix_wine9.2_mfplat.sh

              chmod +x fix_wine9.2_mfplat.sh

              ./fix_wine9.2_mfplat.sh || echo "WARN: Wine 9.10 以下修复脚本未成功（可能已应用过）"

              echo "✓ Wine 9.10 以下修复完成"

            fi

            # 无论哪条路径，都要保证最终只有一份定义
            if [ -f dlls/mfplat/main.c ]; then
              _cnt=$(grep -c 'WINE_DO_NOT_CREATE_DXGI_DEVICE_MANAGER' dlls/mfplat/main.c || true)
              echo "mfplat/main.c 中 WINE_DO_NOT_CREATE_DXGI_DEVICE_MANAGER 出现次数: $_cnt"
            fi

          else

            echo "DXGI patch disabled"

          fi

          # 检查补丁残留
          if find . -name '*.rej' | grep -q .; then
            echo "!!! 存在未应用的补丁片段 !!!"
            find . -name '*.rej'
            if [ "$WINE_BRANCH" = "proton-9.0-x86_64" ]; then
              # proton-9.0-x86_64 是 Wine 9.0，自带了 Wine 11.x 才引入的功能
              # （LAA、quartz 色彩滤镜、qasf ASF 等），patch11.16 里的对应补丁
              # 只会重复报 hunk FAILED。这些不是错误，只是补丁比源码旧。
              echo "WARN: proton-9.0-x86_64 自带上述功能，忽略这些 .rej 并清理"
              find . -name '*.rej' -delete
            else
              echo "!!! 补丁应用失败 !!!"
              exit 1
            fi
          fi

          # 重新生成 ntsyscalls.h（LAA 补丁改了 ntdll.spec）
          echo "=== 运行 tools/make_specfiles ==="
          perl tools/make_specfiles || { echo "make_specfiles 失败"; exit 1; }

          echo "=== 确认 LAA syscall 已生成 ==="
          grep -n "large_address_aware" dlls/ntdll/ntsyscalls.h || {
            echo "!!! ntsyscalls.h 中没有 large_address_aware !!!"; exit 1; }

          # autotools 引导
          # 有些分支（如 Pipetto 的 proton-9.0-x86_64）是纯 autotools 树，
          # 仓库里不带 configure，必须先跑 autogen.sh 生成，否则后面
          # 的 ../configure 会以 127 退出。
          if [ ! -f configure ]; then
            if [ -x ./autogen.sh ]; then
              echo "=== 无 configure，运行 ./autogen.sh ==="
              ./autogen.sh
            elif [ -f ./autogen.sh ]; then
              echo "=== 无 configure，运行 sh ./autogen.sh ==="
              sh ./autogen.sh
            else
              echo "=== 无 configure 也无 autogen.sh，尝试 autoreconf -fiv ==="
              autoreconf -fiv
            fi
            [ -f configure ] || { echo "!!! autogen 后仍未生成 configure !!!"; exit 1; }
            echo "OK: configure 已生成"
          else
            echo "OK: 仓库自带 configure"
          fi

          # 补齐缺失的生成物（Pipetto proton-9.0-x86_64 分支裁剪过）
          # dlls/wineandroid.drv/Makefile.in 仍然引用 build.gradle.in，
          # 但该分支把 build.gradle.in 删掉了，导致 configure 阶段
          #   makedep: error: open build.gradle.in : No such file or directory
          # 这里在需要时从上游 wine-mirror/wine 补回来。
          if [ ! -f dlls/wineandroid.drv/build.gradle.in ] &&              [ -f dlls/wineandroid.drv/Makefile.in ] &&              grep -q 'build.gradle.in' dlls/wineandroid.drv/Makefile.in; then
            echo "=== 补 dlls/wineandroid.drv/build.gradle.in ==="
            _bg_url="https://raw.githubusercontent.com/wine-mirror/wine/master/dlls/wineandroid.drv/build.gradle.in"
            if curl -fsSL "$_bg_url" -o dlls/wineandroid.drv/build.gradle.in; then
              echo "OK: 已补入 build.gradle.in ($(wc -c < dlls/wineandroid.drv/build.gradle.in) 字节)"
            else
              echo "WARN: 下载失败，改用最小占位文件"
              printf '/* placeholder - wineandroid.drv not built on this platform */\n' \
                > dlls/wineandroid.drv/build.gradle.in
            fi
          else
            echo "OK: build.gradle.in 无需补齐"
          fi

          # 同理，Pipetto 分支的 .gitignore 里有 "build*"，
          # 把 tools/winebuild/build.h 这个手写源文件也误伤了，
          # 导致 winebuild 编译时报 build.h: No such file or directory。
          # 必须用 wine-9.0 tag 的版本：该分支 VERSION=9.0 但 cherry-pick
          # 了后续改动，只有 9.0 的 build.h 结构体布局能对上 import.c。
          if [ ! -f tools/winebuild/build.h ] && [ -f tools/winebuild/import.c ]; then
            echo "=== 补 tools/winebuild/build.h（wine-9.0 tag）==="
            _bh_url="https://raw.githubusercontent.com/wine-mirror/wine/wine-9.0/tools/winebuild/build.h"
            if curl -fsSL "$_bh_url" -o tools/winebuild/build.h; then
              echo "OK: 已补入 build.h ($(wc -c < tools/winebuild/build.h) 字节)"
            else
              echo "!!! 下载 build.h 失败 !!!"; exit 1
            fi
          else
            echo "OK: tools/winebuild/build.h 无需补齐"
          fi

          # 记录源码树绝对路径，供下一步（拆分出的编译步骤）使用
          echo "$PWD" > /tmp/wine_srcdir.txt
          echo "WINE_SRCDIR=$PWD"


      - name: 配置并编译 Wine WOW64
        run: |

          set -e

          # Build
          # 本步骤由原「构建 Wine WOW64」拆分而来；shell 状态不跨步骤，
          # 因此从第 1 步落盘的源码树路径重新进入。

          if [ -f /tmp/wine_srcdir.txt ]; then
            WINE_SRCDIR="$(cat /tmp/wine_srcdir.txt)"
          else
            echo "!!! 找不到 /tmp/wine_srcdir.txt（第 1 步未成功落盘）"; exit 1
          fi

          [ -d "$WINE_SRCDIR" ] || { echo "!!! 源码树不存在: $WINE_SRCDIR"; exit 1; }

          cd "$WINE_SRCDIR"

          echo "WINE_SRCDIR=$WINE_SRCDIR"

          mkdir -p build-wow64

          cd build-wow64

          # Compiler optimization

          export CC="ccache gcc"
          export CXX="ccache g++"

          export CROSSCC="ccache x86_64-w64-mingw32-gcc"
          export CROSSCXX="ccache x86_64-w64-mingw32-g++"

          # GStreamer 编译依赖走所选 decoders 版本（Cflags=sysroot 头文件；Libs=apt x86_64 同 SONAME 桩）
          export GST_SYSROOT="${GST_SYSROOT:-/opt/gst-sysroot}"
          export PKG_CONFIG_PATH="${GST_SYSROOT}/pc-gst:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="${GST_SYSROOT}/pc-gst:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          echo "GStreamer(sysroot): $(pkg-config --modversion gstreamer-1.0 2>/dev/null) @ $(pkg-config --variable=prefix gstreamer-1.0 2>/dev/null)"

          # CFLAGS

          export CFLAGS="\
          -march=x86-64 \
          -msse3 \
          -mfpmath=sse \
          -O2 \
          -pipe \
          -fno-plt \
          -fno-semantic-interposition \
          -fno-math-errno \
          -fno-trapping-math \
          -ffunction-sections \
          -fdata-sections \
          -fmerge-all-constants \
          -fno-ident \
          -DWINE_DISABLE_REPARSE_RESOLVE"

          export CXXFLAGS="$CFLAGS"

          # PE CFLAGS

          export CROSSCFLAGS="\
          -march=x86-64 \
          -msse3 \
          -mfpmath=sse \
          -O2 \
          -pipe \
          -fno-plt \
          -fno-math-errno \
          -ffunction-sections \
          -fdata-sections \
          -fmerge-all-constants \
          -fno-ident"

          export CROSSCXXFLAGS="$CROSSCFLAGS"

          # Linker

          export LDFLAGS="\
          -Wl,-O2 \
          -Wl,--as-needed \
          -Wl,--gc-sections \
          -Wl,--build-id=none"

          echo "=========================================="
          echo "CFLAGS"
          echo "$CFLAGS"
          echo
          echo "LDFLAGS"
          echo "$LDFLAGS"
          echo "=========================================="

          # Configure

          # ---- adapted-11.18 补丁（自动探测源码目录，子 shell 内应用，不改动 cwd）----
          _wsrc=""
          for _d in . .. source wine wine-tkg wine-src ./wine ../wine; do
            if [ -f "$_d/dlls/quartz/Makefile.in" ]; then _wsrc="$_d"; break; fi
          done
          if [ -n "$_wsrc" ]; then
            ( cd "$_wsrc"
              # ---- adapted-11.18 user patches (quartz colour / qasf asf / termux-dns) ----
              for _up in 0060-quartz-implement-colour-filter.patch \
                         0061-qasf-deliver-compressed-asf-streams.patch \
                         termux-dns-fix.patch; do
                _u="${GITHUB_WORKSPACE:-$PWD}/patches/adapted-11.18/$_up"
                [ -f "$_u" ] || _u="/tmp/wine-termux/$_up"
                if [ ! -f "$_u" ]; then
                  mkdir -p /tmp/wine-termux
                  curl -fsSL -o "$_u" "https://raw.githubusercontent.com/as14725836/wine-termux/main/$_up" \
                    || wget -q -O "$_u" "https://raw.githubusercontent.com/as14725836/wine-termux/main/$_up" \
                    || { echo "WARN: adapted 补丁下载失败，跳过 $_up"; continue; }
                fi
                _out="$(patch -p1 --batch --dry-run --forward --no-backup-if-mismatch < "$_u" 2>&1)" || true
                if echo "$_out" | grep -qE 'FAILED|hunk ignored|can.t find file'; then
                  echo "SKIP: $_up 与当前源码不兼容（hunk 打不上）→ 跳过"
                  echo "$_out" | grep -E 'FAILED|hunk ignored' | head -3 || true
                elif patch -p1 --batch --forward --no-backup-if-mismatch < "$_u" >/dev/null 2>&1; then
                  echo "OK  : $_up 已应用"
                else
                  echo "SKIP: $_up 应用失败 → 跳过"
                fi
              done
              echo "adapted-11.18 self-check: colour.c=$(ls dlls/quartz/colour.c 2>/dev/null || echo MISSING) dns=$(grep -c init_dns_config dlls/ntdll/unix/loader.c 2>/dev/null || echo 0)"
              if find . -name '*.rej' | head -1 | grep -q .; then echo 'WARN: 存在 .rej 文件:'; find . -name '*.rej' | head -5; fi
              # ---- adapted-11.18 end ----
            )
          else
            echo "SKIP: adapted-11.18 —— 当前目录下没找到 wine 源码树"
          fi
          # box64 指令缓存失效补丁
          #
          # proton-9.0-x86_64 构建 x86_64，因此 virtual.c 里
          #   #if defined(__x86_64__) || defined(__i386__)
          #       /* no-op */
          # 把 NtFlushInstructionCache 当真空操作。真 x86_64 CPU 上成立
          # （store 与 I-cache 硬件一致），box64 下不成立：guest 镜像被翻译
          # 成 box64 自缓存里的宿主代码，没有 CPU 机制失效它。加壳程序自解密
          # 后调这个 API 发布代码，于是拿到过期 dynablock。
          #
          # box64 唯一认的“代码变了”信号是某段范围的 PROT_EXEC 被清掉
          # （custommem.c 的 updateProtection()）。这里按页降成 read/write
          # 再逐页恢复原保护 —— 经 box64 包装过的 mprotect
          # (x64syscall.c case 10 -> my_mprotect) 触发失效。
          #
          # 用内容锚点注入而非 patch -p1：Wine 9/10/11 的 virtual.c 行号
          # 差异极大，但这段骨架逐字相同。
          if [ "${{ github.event.inputs.apply_box64_icache_patch || 'true' }}" = "true" ]; then

            echo "=========================================="
            echo "注入 box64 指令缓存失效补丁"
            echo "=========================================="

            # build-wow64/ 是 out-of-tree 构建目录，源码树在上一层（同 ../configure）
            python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_box64_icache.py" ..

            echo "--- 注入结果 ---"
            grep -n 'box64_icache_bounce' ../dlls/ntdll/unix/virtual.c

            test "$(grep -c 'box64_icache_bounce' ../dlls/ntdll/unix/virtual.c)" -ge 2 \
              || { echo "FATAL: 注入失败"; exit 1; }

            grep -q 'WINE_BOX64_ICACHE_BOUNCE' ../dlls/ntdll/unix/virtual.c \
              || { echo "FATAL: 环境变量开关缺失"; exit 1; }

            echo "OK: box64 icache 补丁已注入"

          else

            echo "box64 icache 补丁已禁用"

          fi

          # Termux /tmp 修复：wineserver 用 /tmp/.wine-<uid>，Android 上不可写
          # -> "wineserver: mkdir /tmp/.wine-10521: Permission denied"
          # Wine 的 #ifdef __ANDROID__ 只对 bionic 生效，x86_64 glibc 走 #else。
          # 上游 11.16 补丁按行号写，套 Wine 9.0 打不上 → 用内容锚点注入。
          python3 "${GITHUB_WORKSPACE}/patches/wow64/fix_termux_wine_tmp.py" ..

          # machine-id：/etc/machine-id 与 /var/lib/dbus/machine-id 在 Termux 上读不到，
          # 导致 SID 退化、系统 UUID 全 FF；改指 Termux glibc 路径。
          python3 "${GITHUB_WORKSPACE}/patches/wow64/fix_termux_machine_id.py" ..
          # WINEVMEMMAXSIZE (Pipetto f9224d6b): idempotent anchor inject
          if [ -f ../dlls/ntdll/unix/virtual.c ] && ! grep -q WINEVMEMMAXSIZE ../dlls/ntdll/unix/virtual.c; then
            python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_vmem_max_size.py" .. || echo "WARN: vmem inject"
          fi
          # Termux: uffd writewatch 禁用 + shm_open -> Termux tmp（Pipetto 270a7ce5 适配，幂等）
          if [ -f ../dlls/ntdll/unix/virtual.c ] && ! grep -q 'termux_shm_open' ../dlls/ntdll/unix/virtual.c; then
            python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_termux_uffd_shm.py" .. || echo "WARN: uffd/shm inject"
          fi
          # noexec: 允许 noexec 分区（/sdcard 等）映射回退 read()（Pipetto b0fdd49f 适配，幂等）
          if [ -f ../dlls/ntdll/unix/virtual.c ] && ! grep -q 'noexec relax' ../dlls/ntdll/unix/virtual.c; then
            python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_noexec_relax.py" .. || echo "WARN: noexec relax inject"
          fi
          # seccomp: 放宽 install_bpf 低地址拒绝 + 测试 mmap 不限地址（Pipetto 441c0fe6 适配，幂等；新旧树自动跳过）
          if [ -f ../dlls/ntdll/unix/signal_x86_64.c ] && ! grep -q 'seccomp relax' ../dlls/ntdll/unix/signal_x86_64.c; then
            python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_seccomp_relax.py" .. || echo "WARN: seccomp relax inject"
          fi
          # winegstreamer: GstGL 可条件关闭 WINE_GST_NO_GL（Pipetto 76f6eab3 适配，幂等；新旧树自动跳过）
          if [ -f ../dlls/winegstreamer/unixlib.c ] && ! grep -q 'wine_gst_no_gl' ../dlls/winegstreamer/unixlib.c; then
            python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_gst_no_gl.py" .. || echo "WARN: gst-no-gl inject"
          fi
          python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_media_converter_gates.py" .. || true
          python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_dpi_v2_awareness.py" .. || true
          # 解码器注册补全（Pipetto proton-9.0-arm64ec 21 条提交：quartz/l3codecx.ax/colorcnv/
          # mfasfsrcsnk/mfh264enc/mfmp4srcsnk/msauddecmft/msmpeg2vdec/msvproc/resampledmo/wmadmod）
          # 已存在则按哨兵跳过；打不上仅告警，不阻断构建。
          python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_decoder_registrations.py" .. || echo "WARN: decoder-reg inject"
          # MediaFoundation byte stream handler：默认优先 GStreamer（上游行为）。
          # 兼容 Proton(return FALSE) / 上游(return TRUE) / dwproton(PROTON_MEDIA_FORCE_GST) 三种树；
          # 已有 return TRUE 或已注入 WINE_USE_DMO 则自动跳过。
          # 运行时 WINE_USE_DMO=1 可强制退回 winedmo/FFmpeg。
          python3 "${GITHUB_WORKSPACE}/patches/wow64/inject_gst_priority.py" .. || echo "WARN: gst-priority inject"

          ../configure \
            --enable-win64 \
            --enable-archs=i386,x86_64 \
            --prefix=/tmp/wine-install-wow64 \
            --with-x \
            --with-vulkan \
            --with-alsa \
            --with-pulse \
            --with-freetype \
            --with-fontconfig \
            --with-gstreamer \
            --with-gettext \
            --with-opengl \
            --with-sdl \
            --enable-nls \
            --without-wayland \
            --disable-winemenubuilder \
            --disable-win16 \
            --without-ffmpeg \
            --disable-tests \
            --without-ldap \
            --without-capi \
            --without-oss \
            --without-cups \
            --without-dbus \
            --without-coreaudio \
            --without-gphoto \
            --without-osmesa \
            --without-sane \
            --without-pcap \
            --without-pcsclite \
            --without-udev \
            --without-unwind \
            --without-usb \
            --without-v4l2

          # Build

          echo "=========================================="
          echo "开始构建 Wine WOW64"
          echo "=========================================="

          make -j"$(nproc)"

          make install

      # Wine 瘦身

      - name: Wine 安装包瘦身
        run: |

          set -e

          PREFIX="/tmp/wine-install-wow64"

          echo "=========================================="
          echo "Wine 原始安装大小"
          echo "=========================================="

          du -sh "$PREFIX"

          # ----------------------------------------------------
          # 删除静态库
          # ----------------------------------------------------

          echo
          echo "删除静态库和 libtool 文件"

          find "$PREFIX" \
            -type f \
            \( \
              -name "*.a" \
              -o -name "*.la" \
            \) \
            -print \
            -delete

          # ----------------------------------------------------
          # 删除 debug
          # ----------------------------------------------------

          echo
          echo "删除 debug 文件"

          find "$PREFIX" \
            -type f \
            \( \
              -name "*.debug" \
              -o -name "*.dwo" \
            \) \
            -print \
            -delete

          # ----------------------------------------------------
          # 删除开发头文件
          # ----------------------------------------------------

          echo
          echo "删除 include"

          rm -rf "$PREFIX/include"

          # ----------------------------------------------------
          # 删除文档
          # ----------------------------------------------------

          echo
          echo "删除文档"

          rm -rf "$PREFIX/share/man"
          rm -rf "$PREFIX/share/doc"

          # ----------------------------------------------------
          # Strip
          # ----------------------------------------------------

          echo
          echo "=========================================="
          echo "Strip ELF + PE（llvm-strip）"
          echo "=========================================="

          if command -v llvm-strip >/dev/null 2>&1; then
            SZ_B=$(du -sb "$PREFIX" | cut -f1)
            ELF_N=0
            PE_N=0
            while IFS= read -r -d '' f; do
              case "$(file -b "$f" 2>/dev/null || true)" in
                ELF*)
                  llvm-strip --strip-unneeded "$f" >/dev/null 2>&1 && ELF_N=$((ELF_N+1)) || true
                  ;;
                PE32*)
                  llvm-strip --strip-all "$f" >/dev/null 2>&1 && PE_N=$((PE_N+1)) || true
                  ;;
              esac
            done < <(find "$PREFIX" -type f -print0)
            SZ_A=$(du -sb "$PREFIX" | cut -f1)
            echo "Strip 完成：ELF=${ELF_N} 个，PE=${PE_N} 个"
            echo "体积：${SZ_B} -> ${SZ_A} bytes（减少 $(( (SZ_B - SZ_A) / 1024 / 1024 )) MiB）"

            # 健全性检查：bin/wine 的 INTERP、PE 导出表必须还在
            if [ -x "$PREFIX/bin/wine" ] && command -v llvm-readelf >/dev/null 2>&1; then
              if llvm-readelf -l "$PREFIX/bin/wine" 2>/dev/null | grep -q INTERP; then
                echo "OK: bin/wine INTERP 仍存在"
              fi
            fi
            if command -v llvm-readobj >/dev/null 2>&1; then
              for D in ntdll kernelbase; do
                for DIR in "$PREFIX"/lib/wine/*-windows; do
                  DLL="$DIR/$D.dll"
                  [ -f "$DLL" ] || continue
                  N=$(llvm-readobj --coff-exports "$DLL" 2>/dev/null | grep -c 'Name:' || true)
                  echo "  $(basename "$DIR")/$D.dll 导出数: ${N:-0}"
                  if [ "${N:-0}" -gt 100 ]; then :; else echo "FATAL: $DLL 导出表异常"; exit 1; fi
                done
              done
            fi
          else
            echo "WARN: 没有 llvm-strip，退回 GNU strip（仅 ELF）"
            find "$PREFIX" \
              -type f \
              \( \
                -name "*.so" \
                -o -name "*.so.*" \
                -o -perm -u+x \
              \) \
              -exec strip --strip-unneeded {} + \
              2>/dev/null || true
          fi

          # ----------------------------------------------------
          # 清理空目录
          # ----------------------------------------------------

          find "$PREFIX" \
            -type d \
            -empty \
            -delete \
            2>/dev/null || true

          # ----------------------------------------------------
          # Final size
          # ----------------------------------------------------

          echo
          echo "=========================================="
          echo "Wine 最终安装大小"
          echo "=========================================="

          du -sh "$PREFIX"

          echo
          echo "=========================================="
          echo "各目录大小"
          echo "=========================================="

          du -sh "$PREFIX"/* \
            2>/dev/null \
            | sort -h || true

          echo
          echo "=========================================="
          echo "最大文件 TOP 30"
          echo "=========================================="

          find "$PREFIX" \
            -type f \
            -printf '%s %p\n' \
            | sort -n \
            | tail -30

      # ========================================================
      # Runtime check
      # ========================================================

      - name: 检查 Wine 运行时
        run: |

          set -e

          PREFIX="/tmp/wine-install-wow64"

          echo "=========================================="
          echo "检查 Wine 核心文件"
          echo "=========================================="

          test -f "$PREFIX/bin/wine"

          echo "✓ wine"

          test -f "$PREFIX/bin/wineserver"

          echo "✓ wineserver"

          if [ -f "$PREFIX/bin/wine64" ]; then
            echo "✓ wine64"
          fi

          if [ -d "$PREFIX/share/wine" ]; then
            echo "✓ share/wine"
          else
            echo "⚠️ share/wine 不存在"
          fi

          echo
          echo "DLL 数量："

          find "$PREFIX" \
            -type f \
            \( \
              -name "*.dll" \
              -o -name "*.dll.so" \
            \) \
            | wc -l

          echo
          echo "SO 数量："

          find "$PREFIX" \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.so.*" \
            \) \
            | wc -l

      # ========================================================
      # Package
      # ========================================================

      - name: 准备 Wine 打包
        run: |

          set -e

          PACKAGE_NAME="${BUILD_NAME}"

          mkdir -p "wine-package/$PACKAGE_NAME"

          cp -a \
            /tmp/wine-install-wow64/. \
            "wine-package/$PACKAGE_NAME/"

      # ========================================================
      # Tar
      # ========================================================

      - name: 创建 Wine 压缩包
        run: |

          set -e

          PACKAGE_NAME="${BUILD_NAME}"

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -I 'xz -T0 -9e' \
            -cf "$PACKAGE_NAME.tar.xz" \
            -C wine-package \
            "$PACKAGE_NAME"

          ls -lh "$PACKAGE_NAME.tar.xz"

      # ========================================================
      # Checksum
      # ========================================================

      - name: Generate checksums
        run: |

          sha256sum *.tar.xz > checksums.txt

          cat checksums.txt

      # ========================================================
      # Artifact
      # ========================================================

      - name: Upload Wine WoW64 artifacts
        uses: actions/upload-artifact@v4

        with:

          name: Wine-${{ replace(github.event.inputs.wine_branch || 'staging', '/', '-') }}-${{ replace(github.event.inputs.wine_version || 'latest', '/', '-') }}-WoW64

          path: |
            ${{ github.workspace }}/*.tar.xz
            ${{ github.workspace }}/checksums.txt

          retention-days: 30

      # ========================================================
      # Release
      # ========================================================

      - name: 发布 Wine 到 GitHub Release
        uses: softprops/action-gh-release@v1

        if: >
          github.event_name == 'workflow_dispatch'
          &&
          github.event.inputs.build_type == 'wine-wow64'

        with:

          tag_name: wine-${{ replace(github.event.inputs.wine_branch || 'staging', '/', '-') }}-${{ replace(github.event.inputs.wine_version || 'latest', '/', '-') }}-wow64

          name: Wine ${{ github.event.inputs.wine_branch || 'staging' }} ${{ github.event.inputs.wine_version || 'latest' }} (WOW64 with Vulkan & GStreamer for Termux)

          body: |

            # Wine WOW64 - Termux

            ## 版本信息

            - Wine 分支: `${{ github.event.inputs.wine_branch || 'staging' }}`
            - Wine 版本: `${{ github.event.inputs.wine_version || 'latest' }}`
            - 架构: True WOW64
            - 平台: Termux / Android
            - Vulkan: Enabled
            - OpenGL: Enabled
            - GStreamer: Enabled
            - DXGI patch: `${{ github.event.inputs.apply_dxgi_patch || 'true' }}`
            - 中文环境: Enabled

            ## 编译优化

            - GCC O2
            - Function sections
            - Data sections
            - Linker garbage collection
            - As-needed linking
            - Strip unused symbols
            - 移除静态库
            - 移除 libtool 文件
            - 移除 debug 文件
            - 移除开发头文件
            - 移除 man/doc

            ## 运行时资源

            Wine runtime 所需的 `share/wine` 等目录保持不变。

          files: |
            ${{ github.workspace }}/${{ env.BUILD_NAME }}.tar.xz
            ${{ github.workspace }}/checksums.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
