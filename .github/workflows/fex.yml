name: Build FEX for Termux glibc

# ============================================================
# 专属 FEX 构建流程（面向 termux-pacman / glibc-runner 环境）
#
# 产物：
#   libarm64ecfex.dll   x86_64 模拟（HODLL64）
#   libwow64fex.dll     i386   模拟（HODLL）
# 安装位置：<wine 根>/lib/wine/aarch64-windows/
#
# 仓库选择：
#   use_official_fex = true  → FEX-Emu/FEX  + main    （官方）
#   use_official_fex = false → AndreRH/FEX  + arm64ec （Hangover fork）
#   手动填 fex_repo / fex_ref 可覆盖上面的默认组合。
#
# 关于路径：FEX 内置默认路径是
#   /usr/lib/wine/aarch64-windows/fex-emu/HostThunks
#   /usr/share/fex-emu/GuestThunks
# Termux(非 root) 下这两条不存在，本流程会一并产出 fex-env.sh，
# 用 FEX 官方支持的 FEX_THUNKHOSTLIBS / FEX_THUNKGUESTLIBS /
# FEX_ROOTFS / FEX_THUNKCONFIG / FEX_PORTABLE 覆盖成 glibc 前缀内的真实位置。
# ============================================================

on:
  push:
    paths:
      - '.github/workflows/fex.yml'
      - '.github/workflows/fex.yaml'

  workflow_dispatch:
    inputs:
      use_official_fex:
        description: '（实验性，不建议用于 Wine）官方 FEX-Emu/FEX；关闭则用 Hangover 的 AndreRH/FEX（Wine 必需：arm64ec ABI + HostThunks）'
        required: false
        default: true
        type: boolean

      fex_repo:
        description: 'FEX 仓库（留空则由上面的开关决定）'
        required: false
        default: ''
        type: string

      fex_ref:
        description: 'FEX 版本：分支 / tag / commit（留空则由上面的开关决定）'
        required: false
        default: ''
        type: string

      llvm_mingw_distro:
        description: 'llvm-mingw 发行方（bylaws 的 ARM64EC 支持完整）'
        required: false
        default: 'bylaws'
        type: choice
        options:
          - bylaws
          - mstorsjo

      llvm_mingw_version:
        description: 'llvm-mingw 版本，latest 表示取最新 release'
        required: false
        default: '20250920'
        type: string

      build_arm64ecfex:
        description: '构建 libarm64ecfex.dll（x86_64 模拟，Hangover 必需）'
        required: false
        default: true
        type: boolean

      build_wow64fex:
        description: '构建 libwow64fex.dll（i386 模拟，可选）'
        required: false
        default: true
        type: boolean
      include_wowbox64:
        description: '一并打包 box64 的 wowbox64.dll（box64 WOW64 CPU DLL）'
        required: false
        default: true
        type: boolean
      box64_repo:
        description: 'box64 开发版仓库（默认 as14725836/termux-glibc-box64）'
        required: false
        default: 'as14725836/termux-glibc-box64'
        type: string
      box64_release_tag:
        description: 'box64 开发版 Release tag（留空 = 自动取最新 box64-dev-*）'
        required: false
        default: ''
        type: string

      version_label:
        description: '可选：手动指定版本号（留空则自动探测，例如填 FEX-2605）'
        required: false
        default: ''
        type: string

      jobs:
        description: '并行编译线程'
        required: false
        default: '8'
        type: string

      publish_release:
        description: '构建成功后发布 GitHub Release'
        required: false
        default: true
        type: boolean

env:
  TERMUX_GLIBC_PREFIX: /data/data/com.termux/files/usr/glibc
  TERMUX_PREFIX: /data/data/com.termux/files/usr
  TERMUX_TMP: /data/data/com.termux/files/usr/tmp

  DEBIAN_FRONTEND: noninteractive

permissions:
  contents: write

jobs:
  build-fex:
    runs-on: ubuntu-latest

    container:
      image: debian:12
      options: --user root

    timeout-minutes: 240

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ============================================================
      # 1. 基础工具
      # ============================================================
      - name: 安装基础工具
        shell: bash
        run: |
          set -eux

          apt-get update

          apt-get install -y --no-install-recommends \
            ca-certificates \
            wget \
            curl \
            git \
            xz-utils \
            zip \
            unzip \
            file \
            python3 \
            python3-pip \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            nasm

          cmake --version
          ninja --version || true

      # ============================================================
      # 2. PE 交叉工具链（llvm-mingw）
      # ============================================================
      - name: 安装 PE 交叉工具链 (llvm-mingw)
        shell: bash
        env:
          DISTRO: ${{ inputs.llvm_mingw_distro || 'bylaws' }}
          VER: ${{ inputs.llvm_mingw_version || 'latest' }}
        run: |
          set -eux

          if [ "${DISTRO}" = "bylaws" ]; then
            REPO="bylaws/llvm-mingw"
          else
            REPO="mstorsjo/llvm-mingw"
          fi

          TAG="${VER}"

          if [ "${TAG}" = "latest" ] || [ -z "${TAG}" ]; then
            TAG="$(curl -sSL "https://api.github.com/repos/${REPO}/releases/latest" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")"
          fi

          DIR_NAME="llvm-mingw-${TAG}-ucrt-ubuntu-22.04-x86_64"
          URL="https://github.com/${REPO}/releases/download/${TAG}/${DIR_NAME}.tar.xz"

          echo "llvm-mingw: ${REPO} @ ${TAG}"
          echo "URL: ${URL}"

          mkdir -p /opt
          cd /opt

          if [ ! -d "/opt/${DIR_NAME}" ]; then
            wget -q --show-progress "${URL}"
            tar -xJf "${DIR_NAME}.tar.xz"
            rm -f "${DIR_NAME}.tar.xz"
          fi

          echo "/opt/${DIR_NAME}/bin" >> "$GITHUB_PATH"
          echo "LLVMMINGW_DIR=/opt/${DIR_NAME}" >> "$GITHUB_ENV"
          echo "LLVMMINGW_NAME=${DIR_NAME}" >> "$GITHUB_ENV"

          export PATH="/opt/${DIR_NAME}/bin:${PATH}"

          echo "=== 工具链自检 ==="

          for T in \
            arm64ec-w64-mingw32-clang \
            arm64ec-w64-mingw32-clang++ \
            arm64ec-w64-mingw32-dlltool \
            aarch64-w64-mingw32-clang \
            aarch64-w64-mingw32-clang++ \
            aarch64-w64-mingw32-dlltool
          do
            printf '%-38s ' "${T}"
            command -v "${T}" || echo MISSING
          done

      # ============================================================
      # 3. 获取 FEX 源码（开关决定仓库/ref，手动填可覆盖）
      # ============================================================
      - name: 获取 FEX 源码
        shell: bash
        env:
          INPUT_REPO: ${{ inputs.fex_repo || '' }}
          INPUT_REF: ${{ inputs.fex_ref || '' }}
          USE_OFFICIAL: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.use_official_fex }}
        run: |
          set -eux

          # ---- 开关解析 ----
          if [ -n "${INPUT_REPO}" ]; then
            FEX_REPO="${INPUT_REPO}"
          elif [ "${USE_OFFICIAL}" = "true" ]; then
            FEX_REPO="FEX-Emu/FEX"
          else
            FEX_REPO="AndreRH/FEX"
          fi

          if [ -n "${INPUT_REF}" ]; then
            FEX_REF="${INPUT_REF}"
          elif [ "${FEX_REPO}" = "FEX-Emu/FEX" ]; then
            FEX_REF="main"
          else
            FEX_REF="arm64ec"
          fi

          echo "FEX repo : ${FEX_REPO}"
          echo "FEX ref  : ${FEX_REF}"

          echo "FEX_REPO=${FEX_REPO}" >> "$GITHUB_ENV"

          echo "FEX_REF=${FEX_REF}" >> "$GITHUB_ENV"

          rm -rf /opt/fex-src
          mkdir -p /opt/fex-src
          cd /opt/fex-src

          git init -q
          git remote add origin "https://github.com/${FEX_REPO}.git"
          git config advice.detachedHead false

          # ---- 防呆 ①：先确认 fex_ref 在远端存在 ----
          if ! git ls-remote --exit-code origin "${FEX_REF}" "refs/tags/${FEX_REF}" >/dev/null 2>&1; then
            echo "FATAL: 远端 ${FEX_REPO} 里找不到 ref/tag: ${FEX_REF}"
            echo "       可选示例：分支 main / arm64ec / tag FEX-2605 / 具体 commit sha"
            echo "       （可用如下命令自查：git ls-remote --tags https://github.com/${FEX_REPO}.git | tail -20）"
            exit 1
          fi

          # 注意：不要把 --tags 和 ref 放在同一条 fetch 里，
          # 否则 FETCH_HEAD 会被 tag 覆盖，git checkout FETCH_HEAD 会切到别的 commit
          if ! git fetch origin "${FEX_REF}"; then
            echo "完整 fetch ${FEX_REF} 失败，退回 depth=250"

            if ! git fetch --depth=250 origin "${FEX_REF}"; then
              echo "退回 depth=1"

              git fetch --depth=1 origin "${FEX_REF}"
            fi
          fi

          git checkout -q FETCH_HEAD

          # tags 单独补（对工作区无影响，仅供 git describe 用）
          git fetch --tags origin >/dev/null 2>&1 || true
          # ---- 应用 Hangover 的必要 delta：结构感知 + 幂等 + 严格校验 ----
          # 不用 patch 文件：patch 的上下文/文件头格式会随上游漂移（此前 --- 注释行被 git apply 误判为文件头）
          echo "=== 应用 Hangover delta（官方 FEX 源必需：IMAGE_LOAD_CONFIG_DIRECTORY32 布局）==="
          python3 - <<'PYX'
          import io, sys
          NP = 'Source/Windows/include/winnt.h'
          s = io.open(NP, encoding="utf-8", errors="replace").read()
          L = s.split(chr(10))
          try:
              a = next(i for i, l in enumerate(L) if "__IMAGE_LOAD_CONFIG_DIRECTORY32 {" in l)
              b = next(i for i in range(a, len(L)) if L[i].startswith("} _IMAGE_LOAD_CONFIG_DIRECTORY32"))
          except StopIteration:
              print("::error::winnt.h 里找不到 __IMAGE_LOAD_CONFIG_DIRECTORY32 结构体"); sys.exit(1)
          ch = False
          for k in range(a, b):
              if L[k].strip() == "IMAGE_LOAD_CONFIG_CODE_INTEGRITY CodeIntegrity;":
                  L[k] = L[k].replace("IMAGE_LOAD_CONFIG_CODE_INTEGRITY", "__IMAGE_LOAD_CONFIG_CODE_INTEGRITY")
                  print("  winnt.h:%d  字段改用 __IMAGE_LOAD_CONFIG_CODE_INTEGRITY" % (k + 1)); ch = True
          if ch:
              io.open(NP, "w", encoding="utf-8", newline="").write(chr(10).join(L))
              print("  winnt.h 已写入")
          else:
              print("  winnt.h 已是目标布局（跳过）")
          ok = ch or any("__IMAGE_LOAD_CONFIG_CODE_INTEGRITY CodeIntegrity;" in l for l in L[a:b])
          ok = ok and any("typedef struct ___IMAGE_LOAD_CONFIG_CODE_INTEGRITY" in l for l in L)
          if not ok:
              print("::error::winnt.h 布局修正未生效"); sys.exit(1)
          print("  校验通过: IMAGE_LOAD_CONFIG_DIRECTORY32 使用 __IMAGE_LOAD_CONFIG_CODE_INTEGRITY")
          PYX
          # 可选：Hangover 的两处调试输出（纯日志，缺失不影响兼容性，尽力而为）
          python3 - <<'PYX' || true
          import io
          JT = [('Source/Windows/ARM64EC/Module.cpp', "libarm64ecfex"), ('Source/Windows/WOW64/Module.cpp', "libwow64fex")]
          for p, nm in JT:
              s = io.open(p, encoding="utf-8", errors="replace").read()
              if "starting FEX based " + nm + ".dll" in s:
                  print("  %s 已有调试输出（跳过）" % p); continue
              L = s.split(chr(10))
              try:
                  k = next(i for i, l in enumerate(L) if "FEXCore::Profiler::Init(" in l)
              except StopIteration:
                  print("  WARN: %s 找不到 Profiler::Init 锚点，跳过" % p); continue
              tag = "  __wine_dbg_output(" + chr(34) + "starting FEX based " + nm + ".dll" + chr(92) + "n" + chr(34) + ");"
              L[k:k] = [tag, ""]
              io.open(p, "w", encoding="utf-8", newline="").write(chr(10).join(L))
              print("  %s 已加调试输出" % p)
          PYX

          # ---- 防呆 ②：确认 checkout 真的落在 FEX 源码上 ----
          for MUST in CMakeLists.txt Source; do
            if [ ! -e "${MUST}" ]; then
              echo "FATAL: checkout 结果里缺少 ${MUST} —— 说明落到的不是预期的 FEX 源码"
              echo "       当前 HEAD = $(git rev-parse HEAD)  ($(git log -1 --format=%s 2>/dev/null | cut -c1-60))"
              exit 1
            fi
          done
          echo "HEAD = $(git rev-parse --short HEAD)  ($(git log -1 --format=%s | cut -c1-60))"

          echo "=== FEX 源码信息 ==="

          git log -1 --format='commit %H%nsubject %s%nauthor  %an%ndate    %ad' || true

          # 子模块：vixl / fmt / xxhash / zydis / range-v3 / Catch2 等
          git submodule update --init --recursive --depth=1 \
            || git submodule update --init --recursive

          git submodule status | head -25 || true

          FEX_COMMIT="$(git rev-parse --short HEAD)"
          FEX_COMMIT_FULL="$(git rev-parse HEAD)"

          # ---- 旧版本源码兼容补丁 ----
          for H in \
            External/fmt/include/fmt/base.h \
            External/fmt/include/fmt/format.h \
            External/fmt/include/fmt/core.h
          do
            if [ -f "${H}" ] && ! grep -q '#include <cstdlib>' "${H}"; then
              echo "旧版本兼容补丁: 给 ${H} 补 #include <cstdlib>"
              sed -i '1i #include <cstdlib>' "${H}"
            fi
          done

          # ---- 自动定位 mingw 工具链文件 ----
          TOOLCHAIN_FILE="$(find /opt/fex-src -path '*/Data/CMake/toolchain_mingw.cmake' -print -quit 2>/dev/null || true)"
          if [ -z "${TOOLCHAIN_FILE}" ]; then
            TOOLCHAIN_FILE="$(find /opt/fex-src -name 'toolchain_mingw.cmake' -print -quit 2>/dev/null || true)"
          fi

          if [ -z "${TOOLCHAIN_FILE}" ]; then
            echo "FATAL: 这个版本（${FEX_REF}）里找不到 toolchain_mingw.cmake"
            echo "该版本里和 toolchain/mingw 相关的文件："
            find /opt/fex-src \( -iname '*toolchain*' -o -iname '*mingw*.cmake' \) 2>/dev/null | head -20 || true
            echo "提示：老版本可能尚未支持 ARM64EC PE 交叉构建；建议改用较新的 tag 或 main 分支"
            exit 1
          fi

          TOOLCHAIN_REL="${TOOLCHAIN_FILE#/opt/fex-src/}"
          echo "TOOLCHAIN_REL=${TOOLCHAIN_REL}"
          echo "TOOLCHAIN_REL=${TOOLCHAIN_REL}" >> "$GITHUB_ENV"

          # ------------------------------------------------------------
          # 版本号（进入包名 / Release tag / artifact 名）
          # ------------------------------------------------------------
          FEX_TAG=""
          FEX_VERSION_SOURCE=""

          if [ -n "${{ inputs.version_label || '' }}" ]; then
            FEX_TAG="${{ inputs.version_label }}"
            FEX_VERSION_SOURCE="手动输入 version_label"
          fi

          if [ -z "${FEX_TAG}" ]; then
            D="$(git describe --tags --match 'FEX-*' --abbrev=7 2>/dev/null || true)"
            if [ -n "${D}" ]; then
              FEX_TAG="${D}"
              FEX_VERSION_SOURCE="git describe --match FEX-*（上游 FEX 版本）"
            fi
          fi

          if [ -z "${FEX_TAG}" ]; then
            TAG_SHA="$(git ls-remote --tags --refs origin "refs/tags/${FEX_REF}" 2>/dev/null \
              | awk '{print $1}' | head -1 || true)"

            if [ -n "${TAG_SHA}" ] && [ "${TAG_SHA}" = "${FEX_COMMIT_FULL}" ]; then
              FEX_TAG="${FEX_REF}"
              FEX_VERSION_SOURCE="fex_ref 本身是 tag 且与 commit 一致"
            fi
          fi

          if [ -z "${FEX_TAG}" ]; then
            D="$(git describe --tags --match 'hangover-*' --abbrev=7 2>/dev/null || true)"
            if [ -n "${D}" ]; then
              FEX_TAG="${D}"
              FEX_VERSION_SOURCE="git describe --match hangover-*（Hangover 版本）"
            fi
          fi

          if [ -z "${FEX_TAG}" ]; then
            D="$(git describe --tags --always --abbrev=7 2>/dev/null || true)"
            if [ -n "${D}" ]; then
              FEX_TAG="${D}"
              FEX_VERSION_SOURCE="git describe --tags（任意 tag）"
            fi
          fi

          if [ -n "${FEX_TAG}" ]; then
            FEX_DESC="${FEX_TAG}"
          else
            FEX_DESC="$(date -u +%Y%m%d)-g${FEX_COMMIT}"
            FEX_VERSION_SOURCE="兜底：日期+commit（未找到可用 tag）"
          fi

          echo "=== 可用 tag（FEX-* 最后 5 个）==="
          git tag | grep -E '^FEX-' | sort -V | tail -5 || true

          echo "版本来源: ${FEX_VERSION_SOURCE}"
          echo "版本串  : ${FEX_DESC}"

          FEX_DESC_SAFE="$(printf '%s' "${FEX_DESC}" | tr ' ' '-' | tr '/' '-' | tr -cd 'A-Za-z0-9._-')"
          [ -n "${FEX_DESC_SAFE}" ] || FEX_DESC_SAFE="unknown"

          echo "FEX_VERSION_SOURCE=${FEX_VERSION_SOURCE}" >> "$GITHUB_ENV"

          echo "FEX_COMMIT=${FEX_COMMIT}" >> "$GITHUB_ENV"
          echo "FEX_DESC=${FEX_DESC}" >> "$GITHUB_ENV"
          echo "FEX_DESC_SAFE=${FEX_DESC_SAFE}" >> "$GITHUB_ENV"

          echo "FEX_COMMIT=${FEX_COMMIT}"
          echo "FEX_DESC=${FEX_DESC}"

          ls -la

      # ============================================================
      # 4. 构建 libarm64ecfex.dll（x86_64 模拟）
      # ============================================================
      - name: 构建 libarm64ecfex.dll (x86_64 模拟)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_arm64ecfex }}
        shell: bash
        run: |
          set -eux

          export PATH="${LLVMMINGW_DIR}/bin:${PATH}"

          JOBS="${{ inputs.jobs || '8' }}"

          # ---- 兼容老版本 FEX：它硬编码 -lclang_rt.builtins-arm64ec ----
          BUILTINS_DIR=""
          for CAND in \
            "$(find "${LLVMMINGW_DIR}" -type d -path '*lib/clang*' -name windows -print -quit 2>/dev/null || true)" \
            "$(dirname "$(find "${LLVMMINGW_DIR}" -name 'libclang_rt.builtins-aarch64.a' -print -quit 2>/dev/null || true)")"
          do
            if [ -n "${CAND}" ] && [ -d "${CAND}" ]; then BUILTINS_DIR="${CAND}"; break; fi
          done

          echo "builtins 目录 = ${BUILTINS_DIR:-<未找到>}"

          if [ -n "${BUILTINS_DIR}" ]; then
            ls "${BUILTINS_DIR}" | grep -i builtins | head -10 || true

            if [ ! -e "${BUILTINS_DIR}/libclang_rt.builtins-arm64ec.a" ] \
               && [ -e "${BUILTINS_DIR}/libclang_rt.builtins-aarch64.a" ]; then
              cp -f "${BUILTINS_DIR}/libclang_rt.builtins-aarch64.a" \
                    "${BUILTINS_DIR}/libclang_rt.builtins-arm64ec.a"
              echo "已创建 libclang_rt.builtins-arm64ec.a（复制自 aarch64 版）"
            else
              ls "${BUILTINS_DIR}" | grep -i 'builtins-arm64ec' || echo "(无需创建：已有或源缺失)"
            fi
          fi

          cd /opt/fex-src

          rm -rf build_ec
          mkdir -p build_ec
          cd build_ec

          cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE=../${TOOLCHAIN_REL} \
            -DENABLE_LTO=False \
            -DMINGW_TRIPLE=arm64ec-w64-mingw32 \
            -DBUILD_TESTS=OFF \
            -DBUILD_TESTING=OFF \
            ..

          make -j"${JOBS}" arm64ecfex

          test -f Bin/libarm64ecfex.dll

          ls -lh Bin/libarm64ecfex.dll
          file Bin/libarm64ecfex.dll

      # ============================================================
      # 5. 构建 libwow64fex.dll（i386 模拟）
      # ============================================================
      - name: 构建 libwow64fex.dll (i386 模拟)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_wow64fex }}
        shell: bash
        run: |
          set -eux

          export PATH="${LLVMMINGW_DIR}/bin:${PATH}"

          JOBS="${{ inputs.jobs || '8' }}"

          cd /opt/fex-src

          rm -rf build_pe
          mkdir -p build_pe
          cd build_pe

          cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE=../${TOOLCHAIN_REL} \
            -DENABLE_LTO=False \
            -DMINGW_TRIPLE=aarch64-w64-mingw32 \
            -DBUILD_TESTS=OFF \
            -DBUILD_TESTING=OFF \
            ..

          make -j"${JOBS}" wow64fex

          test -f Bin/libwow64fex.dll

          ls -lh Bin/libwow64fex.dll
          file Bin/libwow64fex.dll

      # ============================================================
      # 5.5 取 box64 的 WOW64 DLL（wowbox64.dll / box64ec.dll）
      # ============================================================
      - name: 获取 box64 WOW64 DLL (wowbox64.dll)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_wowbox64 }}
        shell: bash
        env:
          BOX64_REPO: ${{ inputs.box64_repo || 'as14725836/termux-glibc-box64' }}
          BOX64_TAG: ${{ inputs.box64_release_tag || '' }}
        run: |
          set -eu
          OUT=/opt/box64-wow64
          rm -rf "${OUT}"; mkdir -p "${OUT}"
          API="https://api.github.com/repos/${BOX64_REPO}"
          TAG="${BOX64_TAG}"
          if [ -z "${TAG}" ]; then
            curl -sSL --max-time 60 "${API}/releases?per_page=30" -o /tmp/box64-rel.json
            TAG=$(python3 -c 'import json;d=json.load(open("/tmp/box64-rel.json"));t=sorted(str(x.get("tag_name","")) for x in d if str(x.get("tag_name","")).startswith("box64-dev-"));print(t[-1] if t else "")')
          fi
          if [ -z "${TAG}" ]; then
            echo "⚠ 未找到 box64-dev-* Release，跳过 wowbox64.dll"
            exit 0
          fi
          echo "box64 开发版 tag = ${TAG}"
          curl -sSL --max-time 60 "${API}/releases/tags/${TAG}" -o /tmp/box64-tagx.json
          ASSET=$(python3 -c 'import json;d=json.load(open("/tmp/box64-tagx.json"));a=[str(x["name"]) for x in d.get("assets",[]) if str(x["name"]).endswith(".tar.gz")];print(a[0] if a else "")')
          test -n "${ASSET}" || { echo "FATAL: ${TAG} 没有 .tar.gz 资产"; exit 1; }
          echo "asset = ${ASSET}"
          curl -sSL --max-time 600 -o /tmp/box64dev.tar.gz "https://github.com/${BOX64_REPO}/releases/download/${TAG}/${ASSET}"
          rm -rf /tmp/box64dev; mkdir -p /tmp/box64dev
          tar xzf /tmp/box64dev.tar.gz -C /tmp/box64dev
          SRC=$(find /tmp/box64dev -name wowbox64.dll | head -1)
          if [ -n "${SRC}" ]; then
            install -m0644 "${SRC}" "${OUT}/wowbox64.dll"
            echo "  ✔ wowbox64.dll"
          fi
          test -f "${OUT}/wowbox64.dll" || { echo "FATAL: 未取到 wowbox64.dll"; exit 1; }
          echo "${TAG}" > "${OUT}/BOX64_TAG"
          file "${OUT}"/*.dll
          ls -lh "${OUT}"

      # ============================================================
      # 6. 打包（DLL + Termux 路径配置 + 说明）
      # ============================================================
      - name: 打包 FEX (Termux glibc)
        shell: bash
        run: |
          set -eux

          PKG="/tmp/fex-pkg"
          rm -rf "${PKG}"
          mkdir -p "${PKG}/fex"

          if [ -f /opt/fex-src/build_ec/Bin/libarm64ecfex.dll ]; then
            install -m0644 /opt/fex-src/build_ec/Bin/libarm64ecfex.dll "${PKG}/fex/libarm64ecfex.dll"
          fi

          if [ -f /opt/fex-src/build_pe/Bin/libwow64fex.dll ]; then
            install -m0644 /opt/fex-src/build_pe/Bin/libwow64fex.dll "${PKG}/fex/libwow64fex.dll"
          fi

          test -n "$(ls -A "${PKG}/fex")" || { echo "FATAL: 没有任何 FEX DLL 产物"; exit 1; }
          # ---------- box64 的 wowbox64.dll（与 FEX dll 放同一目录）----------
          if [ -f /opt/box64-wow64/wowbox64.dll ]; then
            install -m0644 /opt/box64-wow64/wowbox64.dll "${PKG}/fex/wowbox64.dll"
            echo "已并入 wowbox64.dll"
          else
            echo "wowbox64.dll: (无)"
          fi
          if [ -f /opt/box64-wow64/BOX64_TAG ]; then
            cp -a /opt/box64-wow64/BOX64_TAG "${PKG}/fex/BOX64_TAG"
          fi

          # ---------- Termux glibc 路径配置（自定位，不写死绝对路径）----------
          cat > "${PKG}/fex/fex-env.sh" <<'EOS'
          #!/bin/bash
          # FEX 在 Termux glibc 环境下的路径配置
          # 用法: source "<wine根>/share/fex-emu/fex-env.sh"
          #
          # FEX DLL 内置默认路径是 /usr/lib/wine/... 与 /usr/share/fex-emu/，
          # 在 Termux(非 root) 里既不存在也不可写，必须用环境变量覆盖：
          #   FEX_THUNKHOSTLIBS / FEX_THUNKGUESTLIBS / FEX_ROOTFS / FEX_THUNKCONFIG
          _fex_share="$(cd "$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")" && pwd)"
          _fex_root="$(cd "${_fex_share}/../.." && pwd)"

          export FEX_THUNKHOSTLIBS="${_fex_root}/lib/wine/aarch64-windows/fex-emu/HostThunks"
          export FEX_THUNKGUESTLIBS="${_fex_share}/GuestThunks"
          export FEX_ROOTFS="${_fex_share}/RootFS"
          export FEX_THUNKCONFIG="${_fex_share}"
          # 让 FEX 用相对自身位置的路径（不再依赖 /usr、/etc）
          export FEX_PORTABLE=1
          # Wine 侧选择模拟器 DLL（Hangover 约定）
          export HODLL64=libarm64ecfex.dll
          export HODLL=libwow64fex.dll

          echo "[fex-env] wine 根目录        = ${_fex_root}"
          echo "[fex-env] FEX_THUNKHOSTLIBS  = ${FEX_THUNKHOSTLIBS}"
          echo "[fex-env] FEX_THUNKGUESTLIBS = ${FEX_THUNKGUESTLIBS}"
          EOS

          chmod 0755 "${PKG}/fex/fex-env.sh"

          cat > "${PKG}/fex/INSTALL.md" <<'EOS'
          # FEX (Termux glibc) 安装方法

          1) 把两个 DLL 放进 wine 的 aarch64-windows 目录：

             ```sh
             WINE_ROOT=/path/to/wine          # 例如 $PREFIX/glibc/wine
             cp libarm64ecfex.dll libwow64fex.dll "$WINE_ROOT/lib/wine/aarch64-windows/"
             ```

          2) 放进 FEX 路径配置脚本：

             ```sh
             mkdir -p "$WINE_ROOT/share/fex-emu"
             cp fex-env.sh "$WINE_ROOT/share/fex-emu/"
             mkdir -p "$WINE_ROOT/share/fex-emu/GuestThunks" \
                      "$WINE_ROOT/share/fex-emu/RootFS" \
                      "$WINE_ROOT/lib/wine/aarch64-windows/fex-emu/HostThunks"
             ```

          3) 启动 wine 前先 source（把 FEX 路径指向 Termux glibc 内的真实位置）：

             ```sh
             source "$WINE_ROOT/share/fex-emu/fex-env.sh"
             "$WINE_ROOT/bin/wine" your_app.exe
             ```

          说明：
          - libarm64ecfex.dll = x86_64 模拟（HODLL64），libwow64fex.dll = i386 模拟（HODLL）
          - wine 侧名字必须一致：workflow 已把 xtajit64.dll→libarm64ecfex.dll、
            xtajit.dll→libwow64fex.dll 的引用改好
          - 若使用了 HostThunks/GuestThunks，需要额外构建 FEX 的 thunk 层
            （cmake -DBUILD_THUNKS=ON），否则目录为空、只是没有 host 库 thunk
          EOS

          cat > "${PKG}/fex/BUILD_INFO.txt" <<EOS
          FEX for Termux glibc
          ====================
          fex_repo    : ${FEX_REPO}
          fex_ref     : ${FEX_REF}
          fex_commit  : ${FEX_COMMIT}
          fex_describe: ${FEX_DESC}
          version_src : ${FEX_VERSION_SOURCE}
          llvm-mingw  : ${LLVMMINGW_NAME}
          build date  : $(date -u +%Y-%m-%dT%H:%M:%SZ)
          runner      : $(uname -m)

          DLLs:
          $( (cd "${PKG}/fex" && ls -lh *.dll) || true )
          box64 wowbox64.dll (同一目录):
          $( (cd "${PKG}/fex" && ls -lh wowbox64.dll) 2>/dev/null || echo "(未包含)" )
          box64 release: $(cat "${PKG}/fex/BOX64_TAG" 2>/dev/null || echo "(未包含)")

          Note: 路径已通过 fex-env.sh 指向 Termux glibc 前缀，
                不依赖容器/发行版的 /usr 布局。
          EOS

          cd "${PKG}"

          case "${FEX_DESC_SAFE}" in
            FEX-*|fex-*) PKG_PREFIX="" ;;
            *)           PKG_PREFIX="fex-" ;;
          esac

          PKG_NAME="${PKG_PREFIX}${FEX_DESC_SAFE}-arm64ec-wow64"

          tar cJf "${PKG_NAME}.tar.xz" fex

          sha256sum "${PKG_NAME}.tar.xz" > checksums.txt

          ls -lh

          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_ENV"
          echo "PKG_DIR=${PKG}" >> "$GITHUB_ENV"

          cat checksums.txt

      # ============================================================
      # 7. 校验产物
      # ============================================================
      - name: 校验产物
        shell: bash
        run: |
          set -eux

          cd "${PKG_DIR}"

          echo "=== 归档内容 ==="

          tar tJf "${PKG_NAME}.tar.xz"

          echo "=== 解包复检 ==="

          rm -rf /tmp/fex-verify
          mkdir -p /tmp/fex-verify
          tar xJf "${PKG_NAME}.tar.xz" -C /tmp/fex-verify

          find /tmp/fex-verify -type f | sort

          echo "=== PE 类型 ==="

          file /tmp/fex-verify/fex/*.dll

          echo "=== 关键文件存在性 ==="

          test -f /tmp/fex-verify/fex/fex-env.sh
          echo "=== box64 WOW64 DLL 检查（与 FEX dll 同目录）==="
          if [ -f /tmp/fex-verify/fex/wowbox64.dll ]; then
            file /tmp/fex-verify/fex/wowbox64.dll
          else
            echo "(未包含 wowbox64.dll)"
          fi

          test -f /tmp/fex-verify/fex/INSTALL.md

          test -f /tmp/fex-verify/fex/libarm64ecfex.dll || \
            echo "(未构建 libarm64ecfex.dll)"

          test -f /tmp/fex-verify/fex/libwow64fex.dll || \
            echo "(未构建 libwow64fex.dll)"

          echo "=== fex-env.sh 语法检查 ==="

          bash -n /tmp/fex-verify/fex/fex-env.sh && echo OK

      # ============================================================
      # 8. 上传 artifact
      # ============================================================
      - name: 校验 FEX DLL ABI（Machine=ARM64EC / 导出含 BTCpu*）
        shell: bash
        run: |
          set -u
          echo "FEX repo : ${FEX_REPO:-未知}"
          OBJDUMP="$(command -v llvm-objdump || echo /opt/${LLVMMINGW_NAME}/bin/llvm-objdump)"
          FOUND=0
          FAIL=0
          while IFS= read -r D; do
            FOUND=$((FOUND+1))
            N="$(basename "${D}")"
            MACH="$("${OBJDUMP}" -p "${D}" 2>/dev/null | awk -F: '/Machine/{print $2}' | head -1 | xargs || true)"
            EXP="$("${OBJDUMP}" -p "${D}" 2>/dev/null | grep -c 'BTCpu' || true)"
            echo "  ${N}: Machine=${MACH:-未知} BTCpu*导出=${EXP}"
            case "${MACH}" in
              *ARM64EC*|*x86-64*|*Aarch64*|*ARM64*) : ;;
              *) echo "  ::error::${N} Machine=${MACH:-未知}（非 ARM64EC/x86-64/Aarch64，疑似 32 位 PE）——Wine 的 wow64.dll 无法加载"; FAIL=1 ;;
            esac
            if [ "${EXP}" = "0" ]; then echo "  ::warning::${N} 无 BTCpu* 导出（Wine 需要这些入口）"; fi
          done < <(find "${GITHUB_WORKSPACE}" -name 'libarm64ecfex.dll' -o -name 'libwow64fex.dll' 2>/dev/null)
          if [ "${FOUND}" = "0" ]; then echo "::error::未找到任何 FEX DLL 产物，无法校验"; exit 1; fi
          if [ "${FAIL}" != "0" ]; then
            echo "!! ABI 不符。官方 FEX-Emu 主线产物预期就不符 —— Wine 必须用 Hangover(AndreRH/FEX @ arm64ec) 分支"
            exit 1
          fi
          echo "ABI 校验通过：全部为 ARM64EC"

      - name: 校验 FEX DLL ABI（Machine=ARM64EC / 导出含 BTCpu*）
        shell: bash
        run: |
          set -u
          echo "FEX repo : ${FEX_REPO:-未知}"
          OBJDUMP="$(command -v llvm-objdump || echo /opt/${LLVMMINGW_NAME}/bin/llvm-objdump)"
          FOUND=0
          FAIL=0
          while IFS= read -r D; do
            FOUND=$((FOUND+1))
            N="$(basename "${D}")"
            MACH="$("${OBJDUMP}" -p "${D}" 2>/dev/null | awk -F: '/Machine/{print $2}' | head -1 | xargs || true)"
            EXP="$("${OBJDUMP}" -p "${D}" 2>/dev/null | grep -c 'BTCpu' || true)"
            echo "  ${N}: Machine=${MACH:-未知} BTCpu*导出=${EXP}"
            case "${MACH}" in
              *ARM64EC*|*x86-64*|*Aarch64*|*ARM64*) : ;;
              *) echo "  ::error::${N} Machine=${MACH:-未知}（非 ARM64EC/x86-64/Aarch64，疑似 32 位 PE）——Wine 的 wow64.dll 无法加载"; FAIL=1 ;;
            esac
            if [ "${EXP}" = "0" ]; then echo "  ::warning::${N} 无 BTCpu* 导出（Wine 需要这些入口）"; fi
          done < <(find "${GITHUB_WORKSPACE}" -name 'libarm64ecfex.dll' -o -name 'libwow64fex.dll' 2>/dev/null)
          if [ "${FOUND}" = "0" ]; then echo "::error::未找到任何 FEX DLL 产物，无法校验"; exit 1; fi
          if [ "${FAIL}" != "0" ]; then
            echo "!! ABI 不符。官方 FEX-Emu 主线产物预期就不符 —— Wine 必须用 Hangover(AndreRH/FEX @ arm64ec) 分支"
            exit 1
          fi
          echo "ABI 校验通过：全部为 ARM64EC"

      - name: Upload FEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: |
            /tmp/fex-pkg/*.tar.xz
            /tmp/fex-pkg/checksums.txt
          retention-days: 30

      # ============================================================
      # 9. 发布 Release
      # ============================================================
      - name: Publish FEX Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PKG_NAME }}
          name: FEX ${{ env.FEX_DESC }} (Termux glibc, arm64ec + wow64)
          draft: false
          prerelease: false
          overwrite_files: true
          generate_release_notes: false
          files: |
            /tmp/fex-pkg/${{ env.PKG_NAME }}.tar.xz
            /tmp/fex-pkg/checksums.txt
