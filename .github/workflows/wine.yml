name: Wine ARM64 WOW64 构建（llvm-mingw + FEX + Debian 12）

on:
  schedule:
    # 每月 5 日、20 日构建
    - cron: '0 2 5,20 * *'

  workflow_dispatch:
    inputs:
      wine_branch:
        description: 'Wine 分支'
        required: true
        default: 'vanilla'
        type: choice
        options:
          - vanilla
          - proton9-arm64ec
          - staging
          - staging-tkg
          - staging-tkg-fsync

      fex_ref:
        description: 'FEX 分支 / Tag / Commit'
        required: true
        default: 'main'
        type: string

      wine_version:
        description: 'Wine 版本；latest 使用仓库默认分支'
        required: true
        default: 'latest'
        type: string

      preloader:
        description: '启用 Wine preloader'
        required: true
        default: 'on'
        type: choice
        options:
          - on
          - off

      android_compat:
        description: '启用 Termux/Android 兼容补丁'
        required: true
        default: 'on'
        type: choice
        options:
          - on
          - off

      build_profile:
        description: 'Wine 构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  DEBIAN_FRONTEND: noninteractive

  LLVM_MINGW_DIR: /opt/llvm-mingw
  FEX_DIR: /opt/FEX

  TERMUX_GLIBC_PREFIX: /data/data/com.termux/files/usr/glibc
  TERMUX_TMP: /data/data/com.termux/files/usr/tmp

  WINE_INSTALL: /tmp/wine-install-wow64
  WINE_NATIVE: /opt/wine64-native

  CCACHE_DIR: /opt/ccache

  # 手动运行使用 inputs；定时任务使用默认值
  FEX_REF: ${{ inputs.fex_ref || 'main' }}
  WINE_BRANCH: ${{ inputs.wine_branch || 'vanilla' }}
  WINE_VERSION: ${{ inputs.wine_version || 'latest' }}
  PRELOADER: ${{ inputs.preloader || 'on' }}
  ANDROID_COMPAT: ${{ inputs.android_compat || 'on' }}
  BUILD_PROFILE: ${{ inputs.build_profile || 'release' }}

jobs:
  build:
    name: Wine ARM64 WOW64
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    container:
      image: debian:12

    steps:

      # ============================================================
      # 1. 基础环境
      # ============================================================

      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          dpkg --add-architecture arm64

          apt-get update

          apt-get install -y \
            ca-certificates \
            apt-transport-https \
            gnupg \
            wget \
            curl \
            git \
            git-lfs \
            subversion \
            mercurial \
            unzip \
            xz-utils \
            bzip2 \
            tar \
            gzip \
            patch \
            sed \
            grep \
            gawk \
            perl \
            python3 \
            python3-pip \
            python3-setuptools \
            pkg-config \
            ninja-build \
            meson \
            cmake \
            ccache \
            flex \
            bison \
            gettext \
            gettext-base \
            autoconf \
            automake \
            libtool \
            texinfo \
            make \
            gcc \
            g++ \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            binutils-aarch64-linux-gnu \
            file \
            patchelf \
            xz-utils

          # --------------------------------------------------------
          # ARM64 Wine / multimedia / graphics dependencies
          # --------------------------------------------------------

          apt-get install -y \
            libc6-dev:arm64 \
            libgcc-s1:arm64 \
            libstdc++6:arm64 \
            libstdc++-12-dev:arm64 \
            libz-dev:arm64 \
            libbz2-dev:arm64 \
            liblzma-dev:arm64 \
            libfreetype6-dev:arm64 \
            libfontconfig1-dev:arm64 \
            libpng-dev:arm64 \
            libjpeg-dev:arm64 \
            libtiff-dev:arm64 \
            libxml2-dev:arm64 \
            libxslt1-dev:arm64 \
            libgnutls28-dev:arm64 \
            libssl-dev:arm64 \
            libdbus-1-dev:arm64 \
            libudev-dev:arm64 \
            libunwind-dev:arm64 \
            libunwind8:arm64 \
            libexpat1-dev:arm64 \
            libglib2.0-dev:arm64 \
            libgphoto2-dev:arm64 \
            libgsm1-dev:arm64 \
            libmpg123-dev:arm64 \
            libopenal-dev:arm64 \
            libpulse-dev:arm64 \
            libsane-dev:arm64 \
            libv4l-dev:arm64 \
            libx11-dev:arm64 \
            libx11-xcb-dev:arm64 \
            libxau-dev:arm64 \
            libxcb1-dev:arm64 \
            libxcb-dri2-0-dev:arm64 \
            libxcb-dri3-dev:arm64 \
            libxcb-glx0-dev:arm64 \
            libxcb-present-dev:arm64 \
            libxcb-randr0-dev:arm64 \
            libxcb-render0-dev:arm64 \
            libxcb-shape0-dev:arm64 \
            libxcb-shm0-dev:arm64 \
            libxcb-sync-dev:arm64 \
            libxcb-xfixes0-dev:arm64 \
            libxcb-xinerama0-dev:arm64 \
            libxcb-xkb-dev:arm64 \
            libxcb1-dev:arm64 \
            libxcursor-dev:arm64 \
            libxext-dev:arm64 \
            libxfixes-dev:arm64 \
            libxi-dev:arm64 \
            libxinerama-dev:arm64 \
            libxkbcommon-dev:arm64 \
            libxrandr-dev:arm64 \
            libxrender-dev:arm64 \
            libxxf86vm-dev:arm64 \
            libegl-dev:arm64 \
            libgl-dev:arm64 \
            libgles-dev:arm64 \
            libvulkan-dev:arm64 \
            libwayland-dev:arm64 \
            libxcomposite-dev:arm64 \
            libxcursor-dev:arm64 \
            libxi-dev:arm64 \
            libxres-dev:arm64 \
            libxcomposite-dev:arm64 \
            libxdamage-dev:arm64 \
            libxxf86vm-dev:arm64 \
            libxfixes-dev:arm64 \
            libsdl2-dev:arm64 \
            libasound2-dev:arm64 \
            libavcodec-dev:arm64 \
            libavformat-dev:arm64 \
            libavutil-dev:arm64 \
            libswresample-dev:arm64 \
            libswscale-dev:arm64

          # --------------------------------------------------------
          # GStreamer
          # --------------------------------------------------------

          apt-get install -y \
            libgstreamer1.0-dev:arm64 \
            libgstreamer-plugins-base1.0-dev:arm64 \
            libgstreamer-plugins-bad1.0-dev:arm64 \
            gstreamer1.0-plugins-base:arm64 \
            gstreamer1.0-plugins-good:arm64 \
            gstreamer1.0-plugins-bad:arm64 \
            gstreamer1.0-plugins-ugly:arm64 \
            gstreamer1.0-libav:arm64 \
            gstreamer1.0-tools:arm64

          apt-get clean
          rm -rf /var/lib/apt/lists/*

      # ============================================================
      # 2. LLVM-MinGW
      # ============================================================

      - name: Install LLVM-MinGW
        shell: bash
        run: |
          set -eux

          cd /opt

          LLVM_MINGW_VERSION="20251202"
          LLVM_MINGW_ARCHIVE="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"

          wget -q \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_ARCHIVE}"

          tar -xf "$LLVM_MINGW_ARCHIVE"

          LLVM_DIR="$(find /opt -maxdepth 1 -type d \
            -name "llvm-mingw-${LLVM_MINGW_VERSION}-*" \
            | head -n 1)"

          test -n "$LLVM_DIR"

          ln -sfn "$LLVM_DIR" "$LLVM_MINGW_DIR"

          rm -f "$LLVM_MINGW_ARCHIVE"

          echo "$LLVM_MINGW_DIR/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 3. 检查 LLVM-MinGW
      # ============================================================

      - name: Verify LLVM-MinGW
        shell: bash
        run: |
          set -eux

          export PATH="$LLVM_MINGW_DIR/bin:$PATH"

          for tool in \
            aarch64-w64-mingw32-clang \
            aarch64-w64-mingw32-clang++ \
            arm64ec-w64-mingw32-clang \
            arm64ec-w64-mingw32-clang++
          do
            echo
            echo "======================================"
            echo "Checking: $tool"
            echo "======================================"

            command -v "$tool"
            "$tool" --version | head -n 3
          done

      # ============================================================
      # 4. ccache
      # ============================================================

      - name: Configure ccache
        shell: bash
        run: |
          set -eux

          mkdir -p "$CCACHE_DIR"

          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 5. 获取 Wine
      # ============================================================

      - name: Clone Wine source
        shell: bash
        run: |
          set -eux

          cd /opt

          case "$WINE_BRANCH" in

            vanilla)
              git clone --depth=1 \
                https://github.com/Pipetto-crypto/wine.git \
                wine-source
              ;;

            proton9-arm64ec)
              git clone --depth=1 \
                --branch proton-9.0-arm64ec \
                https://github.com/Pipetto-crypto/wine.git \
                wine-source
              ;;

            staging)
              git clone --depth=1 \
                https://github.com/afeimod/wine-arm.git \
                wine-source
              ;;

            staging-tkg|staging-tkg-fsync)
              git clone --depth=1 \
                https://github.com/Kron4ek/wine-tkg.git \
                wine-source
              ;;

            *)
              echo "Unknown WINE_BRANCH=$WINE_BRANCH"
              exit 1
              ;;
          esac

          cd /opt/wine-source

          if [ "$WINE_VERSION" != "latest" ]; then
            git fetch --tags --depth=1 || true

            if git checkout "$WINE_VERSION"; then
              :
            elif git checkout "wine-$WINE_VERSION"; then
              :
            else
              echo "Unable to checkout Wine version: $WINE_VERSION"
              exit 1
            fi
          fi

          echo
          echo "Wine commit:"
          git rev-parse HEAD

          echo
          echo "Wine version:"
          git describe --tags --always || true

      # ============================================================
      # 6. Wine source 信息
      # ============================================================

      - name: Inspect Wine ARM64 configuration
        shell: bash
        run: |
          set -eux

          cd /opt/wine-source

          echo "=== enable-archs ==="

          grep -R \
            "enable-archs" \
            configure.ac \
            configure \
            2>/dev/null \
            | head -n 30 || true

          echo
          echo "=== FEX references ==="

          grep -R \
            -E "libwow64fex|libarm64ecfex|aarch64-unix|aarch64-windows" \
            dlls \
            programs \
            Makefile.in \
            configure.ac \
            2>/dev/null \
            | head -n 100 || true

      # ============================================================
      # 7. FEX
      # ============================================================

      - name: Clone FEX
        shell: bash
        run: |
          set -eux

          rm -rf "$FEX_DIR"

          git clone \
            https://github.com/FEX-Emu/FEX.git \
            "$FEX_DIR"

          cd "$FEX_DIR"

          git fetch --tags --depth=1 || true

          if git rev-parse "$FEX_REF^{commit}" >/dev/null 2>&1; then
            git checkout "$FEX_REF"
          else
            echo "FEX ref not found: $FEX_REF"
            exit 1
          fi

          echo
          echo "FEX commit:"
          git rev-parse HEAD

      # ============================================================
      # 8. FEX ARM64EC
      # ============================================================

      - name: Build FEX ARM64EC
        shell: bash
        run: |
          set -eux

          export PATH="$LLVM_MINGW_DIR/bin:$PATH"

          cd "$FEX_DIR"

          rm -rf build-arm64ec install-arm64ec

          mkdir build-arm64ec
          cd build-arm64ec

          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/FEX/install-arm64ec \
            -DCMAKE_INSTALL_LIBDIR=usr/lib \
            -DMINGW_TRIPLE=arm64ec-w64-mingw32 \
            -DBUILD_TESTING=False \
            -DENABLE_LTO=False \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
            ../

          ninja -j"$(nproc)"
          ninja install

      # ============================================================
      # 9. FEX WOW64
      # ============================================================

      - name: Build FEX WOW64
        shell: bash
        run: |
          set -eux

          export PATH="$LLVM_MINGW_DIR/bin:$PATH"

          cd "$FEX_DIR"

          rm -rf build-wow64 install-wow64

          mkdir build-wow64
          cd build-wow64

          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/FEX/install-wow64 \
            -DCMAKE_INSTALL_LIBDIR=usr/lib \
            -DMINGW_TRIPLE=aarch64-w64-mingw32 \
            -DBUILD_TESTING=False \
            -DENABLE_LTO=False \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
            ../

          ninja -j"$(nproc)"
          ninja install

      # ============================================================
      # 10. FEX UnixLib
      #
      # 这是原 workflow 最重要的缺失项之一
      # ============================================================

      - name: Build FEX UnixLib for AArch64
        shell: bash
        run: |
          set -eux

          cd "$FEX_DIR"

          rm -rf build-unixlib install-unixlib

          mkdir build-unixlib
          cd build-unixlib

          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/FEX/install-unixlib \
            -DCMAKE_INSTALL_LIBDIR=usr/lib/wine/aarch64-unix \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DBUILD_TESTING=False \
            -DENABLE_LTO=False \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
            ../Source/Windows/UnixLib

          ninja -j"$(nproc)"
          ninja install

      # ============================================================
      # 11. 检查 FEX 编译结果
      # ============================================================

      - name: Verify FEX build output
        shell: bash
        run: |
          set -eux

          echo "=== ARM64EC ==="

          find \
            /opt/FEX/install-arm64ec \
            -type f \
            | sort

          echo
          echo "=== WOW64 ==="

          find \
            /opt/FEX/install-wow64 \
            -type f \
            | sort

          echo
          echo "=== UnixLib ==="

          find \
            /opt/FEX/install-unixlib \
            -type f \
            | sort

          ARM64EC_DLL="/opt/FEX/install-arm64ec/usr/lib/wine/aarch64-windows/libarm64ecfex.dll"
          WOW64_DLL="/opt/FEX/install-wow64/usr/lib/wine/aarch64-windows/libwow64fex.dll"

          test -s "$ARM64EC_DLL"
          test -s "$WOW64_DLL"

          echo
          echo "ARM64EC FEX:"
          file "$ARM64EC_DLL"

          echo
          echo "WOW64 FEX:"
          file "$WOW64_DLL"

          echo
          echo "UnixLib ELF:"
          find \
            /opt/FEX/install-unixlib/usr/lib/wine/aarch64-unix \
            -maxdepth 1 \
            -type f \
            -print \
            -exec file {} \;

      # ============================================================
      # 12. Android / Termux 兼容补丁
      # ============================================================

      - name: Apply Android / Termux compatibility patches
        if: env.ANDROID_COMPAT == 'on'
        shell: bash
        run: |
          set -eux

          cd /opt/wine-source

          echo "Applying Termux runtime paths..."

          # --------------------------------------------------------
          # /tmp
          # --------------------------------------------------------

          find . \
            -type f \
            \( \
              -name '*.c' \
              -o -name '*.h' \
              -o -name '*.in' \
              -o -name '*.spec' \
            \) \
            -print0 \
          | xargs -0 grep -Il '/tmp/' \
          | while read -r f; do
              sed -i \
                "s#/tmp/#${TERMUX_TMP%/}/#g" \
                "$f"
            done || true

          # --------------------------------------------------------
          # machine-id
          # --------------------------------------------------------

          if grep -R \
            -q '/etc/machine-id' \
            dlls server programs 2>/dev/null; then

            grep -RIl \
              '/etc/machine-id' \
              dlls server programs 2>/dev/null \
            | while read -r f; do
                sed -i \
                  "s#/etc/machine-id#${TERMUX_GLIBC_PREFIX}/etc/machine-id#g" \
                  "$f"
              done
          fi

          # --------------------------------------------------------
          # 特定 Wine memory protection workaround
          # --------------------------------------------------------

          grep -RIl \
            'PAGE_READWRITE' \
            dlls/ntdll \
            dlls/kernelbase \
            2>/dev/null \
          | while read -r f; do
              sed -i \
                's/PAGE_READWRITE/PAGE_EXECUTE_READWRITE/g' \
                "$f"
            done || true

          # --------------------------------------------------------
          # Android 地址空间限制
          # --------------------------------------------------------

          find dlls server \
            -type f \
            \( -name '*.c' -o -name '*.h' \) \
            -print0 2>/dev/null \
          | xargs -0 sed -i \
              's/0x7fffffff0000/0x7fffff0000/g' \
              2>/dev/null || true

          echo "Android compatibility patches applied."

      # ============================================================
      # 13. GStreamer / mfplat 修复
      # ============================================================

      - name: Apply multimedia compatibility patches
        shell: bash
        run: |
          set -eux

          cd /opt/wine-source

          # GstMapInfo 兼容性修复
          find dlls \
            -type f \
            \( -name '*.c' -o -name '*.h' \) \
            -print0 2>/dev/null \
          | xargs -0 sed -i \
              's/GstMapInfoInfo/GstMapInfo/g' \
              2>/dev/null || true

          # 已知 Wine/GStreamer 兼容问题
          grep -RIl \
            'PAGE_READWRITE' \
            dlls/mfplat \
            dlls/winegstreamer \
            2>/dev/null \
          | while read -r f; do
              sed -i \
                's/PAGE_READWRITE/PAGE_EXECUTE_READWRITE/g' \
                "$f"
            done || true

          echo "Multimedia compatibility patches applied."

      # ============================================================
      # 14. Proton/Wine 特定补丁
      # ============================================================

      - name: Apply Wine branch patches
        shell: bash
        run: |
          set -eux

          cd /opt/wine-source

          # 某些自定义 Wine 树带有 disable_gl.py
          if [ -f disable_gl.py ]; then
            python3 disable_gl.py || true
          fi

          # proton-9-arm64ec 兼容配置
          if [ "$WINE_BRANCH" = "proton9-arm64ec" ]; then

            echo "Applying Proton ARM64EC compatibility options..."

            # 仅在源码存在时进行修改
            if [ -f configure.ac ]; then
              sed -i \
                '/gstreamer-gl-1.0/d' \
                configure.ac || true
            fi
          fi

      # ============================================================
      # 15. 生成 configure
      # ============================================================

      - name: Generate Wine configure
        shell: bash
        run: |
          set -eux

          cd /opt/wine-source

          if [ -x ./autogen.sh ]; then
            ./autogen.sh
          elif [ -x ./configure ]; then
            echo "configure already exists."
          else
            autoreconf -fi
          fi

          test -x ./configure

      # ============================================================
      # 16. 构建 Native Wine tools
      # ============================================================

      - name: Build native Wine tools
        shell: bash
        run: |
          set -eux

          cd /opt/wine-source

          rm -rf /opt/wine64-build
          mkdir -p /opt/wine64-build

          cd /opt/wine64-build

          /opt/wine-source/configure \
            --prefix="$WINE_NATIVE" \
            --enable-win64 \
            --disable-tests \
            --without-wayland

          make -j"$(nproc)"

          make install

      # ============================================================
      # 17. 配置 ARM64 WOW64
      # ============================================================

      - name: Configure ARM64 WOW64 Wine
        shell: bash
        run: |
          set -eux

          export PATH="$LLVM_MINGW_DIR/bin:$PATH"

          cd /opt/wine-source

          rm -rf /opt/wine-wow64-build
          mkdir -p /opt/wine-wow64-build

          cd /opt/wine-wow64-build

          EXTRA=""

          # --------------------------------------------------------
          # Termux X11
          # --------------------------------------------------------

          EXTRA="$EXTRA --without-wayland"

          # --------------------------------------------------------
          # Preloader
          # --------------------------------------------------------

          if [ "$PRELOADER" = "off" ]; then
            EXTRA="$EXTRA --disable-preloader"
          fi

          # --------------------------------------------------------
          # Proton ARM64EC
          # --------------------------------------------------------

          if [ "$WINE_BRANCH" = "proton9-arm64ec" ]; then
            EXTRA="$EXTRA --without-capi"
            EXTRA="$EXTRA --without-cups"
            EXTRA="$EXTRA --without-dbus"
            EXTRA="$EXTRA --without-gettext"
            EXTRA="$EXTRA --without-gphoto"
            EXTRA="$EXTRA --without-gssapi"
            EXTRA="$EXTRA --without-inotify"
            EXTRA="$EXTRA --without-krb5"
            EXTRA="$EXTRA --without-ldap"
            EXTRA="$EXTRA --without-oss"
            EXTRA="$EXTRA --without-pcap"
            EXTRA="$EXTRA --without-pcsclite"
            EXTRA="$EXTRA --without-sane"
            EXTRA="$EXTRA --without-sdl"
            EXTRA="$EXTRA --without-udev"
            EXTRA="$EXTRA --without-usb"
          fi

          export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1
          export PKG_CONFIG_ALLOW_SYSTEM_LIBS=1

          export PKG_CONFIG_PATH="/usr/lib/aarch64-linux-gnu/pkgconfig"
          export PKG_CONFIG_LIBDIR="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="/"

          export CC="ccache aarch64-linux-gnu-gcc"

          export CFLAGS="-O2"
          export CXXFLAGS="-O2"

          export LDFLAGS="-Wl,--dynamic-linker=${TERMUX_GLIBC_PREFIX}/lib/ld-linux-aarch64.so.1"

          /opt/wine-source/configure \
            --prefix="$WINE_INSTALL" \
            --with-mingw=clang \
            --enable-archs=arm64ec,aarch64,i386 \
            --enable-tools \
            --disable-tests \
            --with-vulkan \
            --with-gstreamer \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --host_alias=aarch64-linux-gnu \
            --build_alias=x86_64-linux-gnu \
            --with-wine-tools="$WINE_NATIVE" \
            $EXTRA \
            CC="$CC"

      # ============================================================
      # 18. 构建 ARM64 WOW64
      # ============================================================

      - name: Build ARM64 WOW64 Wine
        shell: bash
        run: |
          set -eux

          export PATH="$LLVM_MINGW_DIR/bin:$PATH"

          cd /opt/wine-wow64-build

          if [ "$BUILD_PROFILE" = "debug" ]; then
            export CFLAGS="-O0 -g"
            export CXXFLAGS="-O0 -g"
          else
            export CFLAGS="-O2"
            export CXXFLAGS="-O2"
          fi

          make -j"$(nproc)"

      # ============================================================
      # 19. 安装 Wine
      # ============================================================

      - name: Install Wine
        shell: bash
        run: |
          set -eux

          cd /opt/wine-wow64-build

          rm -rf "$WINE_INSTALL"

          make install

          test -d "$WINE_INSTALL"

      # ============================================================
      # 20. 安装 FEX 到 Wine
      # ============================================================

      - name: Install FEX into Wine
        shell: bash
        run: |
          set -eux

          FEX_WIN="$WINE_INSTALL/lib/wine/aarch64-windows"
          FEX_UNIX="$WINE_INSTALL/lib/wine/aarch64-unix"

          mkdir -p "$FEX_WIN"
          mkdir -p "$FEX_UNIX"

          # --------------------------------------------------------
          # FEX WOW64
          # --------------------------------------------------------

          install -Dm644 \
            /opt/FEX/install-wow64/usr/lib/wine/aarch64-windows/libwow64fex.dll \
            "$FEX_WIN/libwow64fex.dll"

          # --------------------------------------------------------
          # FEX ARM64EC
          # --------------------------------------------------------

          install -Dm644 \
            /opt/FEX/install-arm64ec/usr/lib/wine/aarch64-windows/libarm64ecfex.dll \
            "$FEX_WIN/libarm64ecfex.dll"

          # --------------------------------------------------------
          # FEX UnixLib
          # --------------------------------------------------------

          cp -a \
            /opt/FEX/install-unixlib/usr/lib/wine/aarch64-unix/. \
            "$FEX_UNIX/"

          echo
          echo "Installed FEX Windows DLLs:"
          ls -lah "$FEX_WIN"

          echo
          echo "Installed FEX UnixLib:"
          find "$FEX_UNIX" -maxdepth 1 -type f -ls

      # ============================================================
      # 21. 自动检查 Wine + FEX
      # ============================================================

      - name: Verify Wine ARM64 WOW64 package
        shell: bash
        run: |
          set -eux

          TARGET="$WINE_INSTALL"

          echo
          echo "======================================"
          echo "Checking Wine binaries"
          echo "======================================"

          for f in \
            wine \
            wineserver \
            wineboot \
            winecfg \
            regedit
          do
            if [ ! -e "$TARGET/bin/$f" ]; then
              echo "ERROR: missing $TARGET/bin/$f"
              exit 1
            fi

            echo "OK: $TARGET/bin/$f"
            file "$TARGET/bin/$f" || true
          done

          echo
          echo "======================================"
          echo "Checking Wine directories"
          echo "======================================"

          for d in \
            "$TARGET/lib/wine/aarch64-windows" \
            "$TARGET/lib/wine/aarch64-unix" \
            "$TARGET/lib/wine/i386-windows" \
            "$TARGET/lib/wine/x86_64-windows"
          do
            if [ ! -d "$d" ]; then
              echo "ERROR: missing directory:"
              echo "  $d"
              exit 1
            fi

            echo "OK: $d"
          done

          echo
          echo "======================================"
          echo "Checking FEX Windows DLLs"
          echo "======================================"

          FEX_WIN="$TARGET/lib/wine/aarch64-windows"

          test -s "$FEX_WIN/libwow64fex.dll"
          test -s "$FEX_WIN/libarm64ecfex.dll"

          echo
          echo "libwow64fex.dll:"
          file "$FEX_WIN/libwow64fex.dll"

          echo
          echo "libarm64ecfex.dll:"
          file "$FEX_WIN/libarm64ecfex.dll"

          echo
          echo "======================================"
          echo "Checking FEX UnixLib"
          echo "======================================"

          FEX_UNIX="$TARGET/lib/wine/aarch64-unix"

          test -d "$FEX_UNIX"

          UNIXLIB_COUNT="$(
            find "$FEX_UNIX" \
              -maxdepth 1 \
              -type f \
              \( -name '*.so' -o -name '*.so.*' \) \
              | wc -l
          )"

          if [ "$UNIXLIB_COUNT" -eq 0 ]; then
            echo "ERROR: no FEX UnixLib found"
            exit 1
          fi

          find "$FEX_UNIX" \
            -maxdepth 1 \
            -type f \
            -exec file {} \;

          echo
          echo "======================================"
          echo "Checking PE / ELF architecture"
          echo "======================================"

          file \
            "$FEX_WIN/libwow64fex.dll" \
            "$FEX_WIN/libarm64ecfex.dll"

          find "$FEX_UNIX" \
            -maxdepth 1 \
            -type f \
            -name '*.so*' \
            -exec readelf -h {} \; \
            | grep -E \
                'Class:|Data:|Machine:' \
            || true

          echo
          echo "======================================"
          echo "Checking Wine FEX references"
          echo "======================================"

          find "$TARGET/lib/wine" \
            -type f \
            \( \
              -iname '*fex*.dll' \
              -o -iname '*fex*.so*' \
            \) \
            -print

          echo
          echo "======================================"
          echo "Wine ARM64 WOW64 verification: PASS"
          echo "======================================"

      # ============================================================
      # 22. 创建 machine-id / runtime 目录说明
      # ============================================================

      - name: Create package runtime information
        shell: bash
        run: |
          set -eux

          mkdir -p "$WINE_INSTALL/etc"

          cat > "$WINE_INSTALL/BUILD-INFO.txt" <<EOF
          Wine ARM64 WOW64

          Wine branch:
          $WINE_BRANCH

          Wine version:
          $WINE_VERSION

          Wine commit:
          $(cd /opt/wine-source && git rev-parse HEAD)

          FEX ref:
          $FEX_REF

          FEX commit:
          $(cd /opt/FEX && git rev-parse HEAD)

          Build profile:
          $BUILD_PROFILE

          Preloader:
          $PRELOADER

          Android compatibility:
          $ANDROID_COMPAT

          Architecture:
          arm64ec,aarch64,i386

          Termux glibc prefix:
          $TERMUX_GLIBC_PREFIX
          EOF

          cat "$WINE_INSTALL/BUILD-INFO.txt"

      # ============================================================
      # 23. 打包前最终检查
      # ============================================================

      - name: Final package sanity check
        shell: bash
        run: |
          set -eux

          TARGET="$WINE_INSTALL"

          test -x "$TARGET/bin/wine"
          test -x "$TARGET/bin/wineserver"

          test -s \
            "$TARGET/lib/wine/aarch64-windows/libwow64fex.dll"

          test -s \
            "$TARGET/lib/wine/aarch64-windows/libarm64ecfex.dll"

          test -d \
            "$TARGET/lib/wine/aarch64-unix"

          test -f \
            "$TARGET/BUILD-INFO.txt"

          echo
          echo "Package sanity check: PASS"

      # ============================================================
      # 24. 生成包名
      # ============================================================

      - name: Prepare package
        shell: bash
        run: |
          set -eux

          DATE="$(date -u +%Y%m%d)"

          SHORT_WINE="$(cd /opt/wine-source && git rev-parse --short HEAD)"
          SHORT_FEX="$(cd /opt/FEX && git rev-parse --short HEAD)"

          PACKAGE_NAME="wine-arm64-wow64-${DATE}-${SHORT_WINE}-${SHORT_FEX}"

          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

          rm -rf wine-package
          mkdir -p "wine-package/$PACKAGE_NAME"

          cp -a "$WINE_INSTALL"/. \
            "wine-package/$PACKAGE_NAME/"

          echo
          echo "Package:"
          du -sh "wine-package/$PACKAGE_NAME"

      # ============================================================
      # 25. 创建 tar.xz
      # ============================================================

      - name: Create tarball
        shell: bash
        run: |
          set -eux

          tar \
            -cJf \
            "${PACKAGE_NAME}.tar.xz" \
            -C wine-package \
            "$PACKAGE_NAME"

          test -s "${PACKAGE_NAME}.tar.xz"

          echo
          echo "Tarball:"
          ls -lh "${PACKAGE_NAME}.tar.xz"

      # ============================================================
      # 26. Upload Artifact
      # ============================================================

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.tar.xz
          compression-level: 0
          retention-days: 30

      # ============================================================
      # 27. GitHub Release
      # ============================================================

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PACKAGE_NAME }}
          name: ${{ env.PACKAGE_NAME }}
          files: |
            ${{ env.PACKAGE_NAME }}.tar.xz
          body: |
            # Wine ARM64 WOW64

            ## Build

            - Wine branch: `${{ env.WINE_BRANCH }}`
            - Wine version: `${{ env.WINE_VERSION }}`
            - FEX ref: `${{ env.FEX_REF }}`
            - Build profile: `${{ env.BUILD_PROFILE }}`
            - Preloader: `${{ env.PRELOADER }}`
            - Android compatibility: `${{ env.ANDROID_COMPAT }}`

            ## Architectures

            - ARM64EC
            - AArch64 WOW64
            - i386 Windows
            - x86_64 Windows

            ## FEX

            Included:

            - `libwow64fex.dll`
            - `libarm64ecfex.dll`
            - FEX AArch64 UnixLib

            ## Termux

            Built for Termux glibc runtime.

            Expected runtime loader:

            `/data/data/com.termux/files/usr/glibc/lib/ld-linux-aarch64.so.1`

            Build started:

            `${{ github.run_started_at }}`

      # ============================================================
      # 28. 清理
      # ============================================================

      - name: Build summary
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo "             BUILD COMPLETE"
          echo "=============================================="
          echo
          echo "Package:"
          echo "  ${PACKAGE_NAME}.tar.xz"
          echo
          echo "Wine:"
          echo "  $WINE_BRANCH"
          echo
          echo "FEX:"
          echo "  $FEX_REF"
          echo
          echo "Output:"
          ls -lh "${PACKAGE_NAME}.tar.xz"
          echo
          echo "=============================================="
