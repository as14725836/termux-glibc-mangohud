name: Build Wine ARM64 WOW64 - Termux glibc

on:
  workflow_dispatch:
    inputs:
      wine_branch:
        description: 'Wine 构建类型'
        required: false
        default: 'proton'
        type: choice
        options:
          - proton
          - staging
          - winearm64ec
          - pipetto-proton9-arm64ec

      wine_version:
        description: 'Wine 版本，例如 10.20；latest 表示使用源码默认版本'
        required: false
        default: 'latest'
        type: string

      proton_branch:
        description: 'Proton Wine branch'
        required: false
        default: 'proton_11.0'
        type: string

      proton_commit:
        description: 'Proton commit，可留空'
        required: false
        default: ''
        type: string

      staging_version:
        description: 'Wine-Staging 版本，可留空自动匹配 Wine upstream'
        required: false
        default: ''
        type: string

      enable_wayland:
        description: '启用 Wayland'
        required: false
        default: false
        type: boolean

      enable_dbus:
        description: '启用 DBus'
        required: false
        default: false
        type: boolean

      enable_udev:
        description: '启用 udev'
        required: false
        default: false
        type: boolean

      wine_archs:
        description: 'PE 架构组合：默认 arm64ec,aarch64,i386（ARM64X 混合，跑 x86_64 靠 FEX）；排查问题时可用 aarch64,i386 出纯 ARM64 版做对比'
        required: false
        default: 'arm64ec,aarch64,i386'
        type: string

      jobs:
        description: '并行编译线程'
        required: false
        default: '8'
        type: string

env:
  LLVMMINGW_DATE: 20251202
  LLVMMINGW_NAME: llvm-mingw-20251202-ucrt-ubuntu-22.04-x86_64

  WINE_SOURCE_DIR: /opt/wine-src
  WINE64_DIR: /opt/wine64
  WINE_NATIVE_DIR: /opt/wine64-native

  TERMUX_GLIBC_PREFIX: /data/data/com.termux/files/usr/glibc
  TERMUX_PREFIX: /data/data/com.termux/files/usr
  TERMUX_TMP: /data/data/com.termux/files/usr/tmp

  DEBIAN_FRONTEND: noninteractive

  # 防止 configure 使用 GitHub Actions / runner 上残留的宿主路径
  PKG_CONFIG_ALLOW_CROSS: 1

permissions:
  contents: write

jobs:
  build-wine-wow64:
    runs-on: ubuntu-latest

    container:
      image: debian:12
      options: --user root

    timeout-minutes: 240

    steps:
      # ============================================================
      # 0. 基础环境
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: 安装基础工具
        shell: bash
        run: |
          set -eux

          apt-get update

          apt-get install -y --no-install-recommends \
            ca-certificates \
            wget \
            curl \
            git \
            gnupg \
            xz-utils \
            bzip2 \
            unzip \
            file \
            sudo \
            python3 \
            python3-distutils \
            python3-setuptools \
            build-essential

      # ============================================================
      # 1. Debian Multiarch
      # ============================================================
      - name: 配置 Debian Multiarch
        shell: bash
        run: |
          set -eux

          echo "=== 清理 GitHub runner 不需要的大型目录 ==="

          rm -rf /usr/share/dotnet || true
          rm -rf /opt/ghc || true
          rm -rf /usr/local/share/boost || true

          echo "=== 配置 Debian 12 amd64 + arm64 ==="

          cat > /etc/apt/sources.list <<'EOF'
          deb [arch=amd64] http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb [arch=amd64] http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          deb [arch=amd64] http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware

          deb [arch=arm64] http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb [arch=arm64] http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          deb [arch=arm64] http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

          rm -f /etc/apt/sources.list.d/debian.sources || true

          dpkg --add-architecture arm64

          apt-get update

          echo "=== 测试 ARM64 package ==="

          apt-get install -y --no-install-recommends hello:arm64

          file /usr/bin/hello || true

      # ============================================================
      # 2. Build dependencies
      # ============================================================
      - name: 安装 Wine 编译依赖
        shell: bash
        run: |
          set -eux

          apt-get update

          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext \
            flex \
            bison \
            make \
            cmake \
            ninja-build \
            meson \
            gcc \
            g++ \
            clang \
            llvm \
            lld \
            binutils \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            nasm \
            mingw-w64 \
            python3 \
            python3-setuptools \
            libglib2.0-dev \
            libfreetype6-dev \
            libltdl-dev \
            libxcb1-dev \
            libx11-dev \
            libvulkan-dev \
            librsvg2-bin \
            libglib2.0-dev:arm64 \
            libunwind-dev:arm64 \
            libdbus-1-dev:arm64 \
            libudev-dev:arm64 \
            libvulkan-dev:arm64 \
            libgl-dev:arm64 \
            libdrm-dev:arm64 \
            libepoxy-dev:arm64 \
            libxcb1-dev:arm64 \
            libx11-dev:arm64 \
            libxext-dev:arm64 \
            libxcursor-dev:arm64 \
            libxi-dev:arm64 \
            libxrandr-dev:arm64 \
            libxrender-dev:arm64 \
            libxfixes-dev:arm64 \
            libxcomposite-dev:arm64 \
            libxinerama-dev:arm64 \
            libxxf86vm-dev:arm64 \
            libwayland-dev:arm64 \
            libxkbcommon-dev:arm64 \
            libmpg123-dev:arm64 \
            libopenal-dev:arm64 \
            libfontconfig1-dev:arm64 \
            libfreetype6-dev:arm64 \
            libsdl2-dev:arm64 \
            libasound2-dev:arm64 \
            libpulse-dev:arm64 \
            libgstreamer1.0-dev:arm64 \
            libgstreamer-plugins-base1.0-dev:arm64 \
            libgnutls28-dev:arm64 \
            libgcrypt20-dev:arm64 \
            dpkg-dev \
            fakeroot \
            debhelper \
            dh-make \
            screen \
            nano \
            less

      # ============================================================
      # 3. locales
      # ============================================================
      - name: 配置 Locale
        shell: bash
        run: |
          set -eux

          apt-get install -y locales

          sed -i \
            's/^# *ko_KR.UTF-8 UTF-8/ko_KR.UTF-8 UTF-8/' \
            /etc/locale.gen

          sed -i \
            's/^# *zh_CN.UTF-8 UTF-8/zh_CN.UTF-8 UTF-8/' \
            /etc/locale.gen

          locale-gen

          echo "LANG=ko_KR.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=ko_KR.UTF-8" >> "$GITHUB_ENV"
          echo "LANGUAGE=ko_KR:ko" >> "$GITHUB_ENV"

      # ============================================================
      # 4. llvm-mingw
      # ============================================================
      - name: 安装 llvm-mingw
        shell: bash
        run: |
          set -eux

          mkdir -p /opt

          cd /opt

          wget \
            -q \
            --show-progress \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVMMINGW_DATE}/${LLVMMINGW_NAME}.tar.xz"

          tar -xJf "${LLVMMINGW_NAME}.tar.xz"

          rm -f "${LLVMMINGW_NAME}.tar.xz"

          echo "/opt/${LLVMMINGW_NAME}/bin" >> "$GITHUB_PATH"

          echo "=== llvm-mingw ==="

          /opt/${LLVMMINGW_NAME}/bin/clang --version || true
          /opt/${LLVMMINGW_NAME}/bin/arm64ec-w64-mingw32-clang --version || true

      # ============================================================
      # 5. Toolchain verification
      # ============================================================
      - name: 验证交叉工具链
        shell: bash
        run: |
          set -eux

          export PATH="/opt/${LLVMMINGW_NAME}/bin:$PATH"

          command -v clang
          command -v clang++
          command -v arm64ec-w64-mingw32-clang || true
          command -v arm64ec-w64-mingw32-clang++ || true
          command -v aarch64-linux-gnu-gcc
          command -v aarch64-linux-gnu-ld

          echo "=== ARM64 compiler ==="

          clang \
            --target=aarch64-linux-gnu \
            --version

          echo "=== ARM64EC compiler ==="

          arm64ec-w64-mingw32-clang --version || true

      # ============================================================
      # 5.5 构建 FEX 模拟器 DLL（Hangover 方案）
      #
      # 目标：把真正能跑的 x86_64 / i386 模拟器编成 Wine 的 CPU DLL
      #   libarm64ecfex.dll  <- x86_64 模拟（Hangover 里对应 HODLL64）
      #   libwow64fex.dll    <- i386   模拟（Hangover 里对应 HODLL）
      # 两者都安装到 wine 的 lib/wine/aarch64-windows/（Hangover 官方位置）
      #
      # 官方配方（AndreRH/hangover docs/COMPILE.md）：
      #   cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo \
      #         -DCMAKE_TOOLCHAIN_FILE=../Data/CMake/toolchain_mingw.cmake \
      #         -DENABLE_LTO=False -DMINGW_TRIPLE=<triple> -DBUILD_TESTS=False ..
      #   make -jN arm64ecfex   /   make -jN wow64fex
      # PE 交叉工具链用 bylaws 的 llvm-mingw（ARM64EC 支持完整）
      # ============================================================
      - name: 构建 FEX 模拟器 DLL (arm64ecfex + wow64fex)
        shell: bash
        run: |
          set -eux

          # ---------- 1) bylaws llvm-mingw（FEX 的 PE 交叉工具链）----------
          FEX_LLVMMINGW_TAG="20250920"
          FEX_LLVMMINGW_NAME="llvm-mingw-${FEX_LLVMMINGW_TAG}-ucrt-ubuntu-22.04-x86_64"
          FEX_LLVMMINGW_DIR="/opt/${FEX_LLVMMINGW_NAME}"

          if [ ! -d "${FEX_LLVMMINGW_DIR}" ]; then
            cd /opt
            wget -q --show-progress \
              "https://github.com/bylaws/llvm-mingw/releases/download/${FEX_LLVMMINGW_TAG}/${FEX_LLVMMINGW_NAME}.tar.xz"
            tar -xJf "${FEX_LLVMMINGW_NAME}.tar.xz"
            rm -f "${FEX_LLVMMINGW_NAME}.tar.xz"
          fi

          export PATH="${FEX_LLVMMINGW_DIR}/bin:${PATH}"

          echo "=== FEX 交叉工具链检查 ==="

          for T in \
            arm64ec-w64-mingw32-clang \
            arm64ec-w64-mingw32-clang++ \
            arm64ec-w64-mingw32-dlltool \
            aarch64-w64-mingw32-clang \
            aarch64-w64-mingw32-clang++ \
            aarch64-w64-mingw32-dlltool
          do
            printf '%-38s ' "${T}"
            command -v "${T}" || echo MISSING
          done

          # ---------- 2) FEX 源码（Hangover 使用的 arm64ec 分支）----------
          rm -rf /opt/fex-src

          git clone \
            --depth=1 \
            --branch arm64ec \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/AndreRH/FEX.git \
            /opt/fex-src

          cd /opt/fex-src

          git log -1 --oneline || true

          JOBS="${{ inputs.jobs || 8 }}"

          # ---------- 3) x86_64 模拟：libarm64ecfex.dll ----------
          rm -rf build_ec

          mkdir -p build_ec

          cd build_ec

          cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE=../Data/CMake/toolchain_mingw.cmake \
            -DENABLE_LTO=False \
            -DMINGW_TRIPLE=arm64ec-w64-mingw32 \
            -DBUILD_TESTS=OFF \
            -DBUILD_TESTING=OFF \
            ..

          make -j"${JOBS}" arm64ecfex

          test -f Bin/libarm64ecfex.dll

          ls -lh Bin/libarm64ecfex.dll

          cd ..

          # ---------- 4) i386 模拟：libwow64fex.dll ----------
          rm -rf build_pe

          mkdir -p build_pe

          cd build_pe

          cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE=../Data/CMake/toolchain_mingw.cmake \
            -DENABLE_LTO=False \
            -DMINGW_TRIPLE=aarch64-w64-mingw32 \
            -DBUILD_TESTS=OFF \
            -DBUILD_TESTING=OFF \
            ..

          make -j"${JOBS}" wow64fex

          test -f Bin/libwow64fex.dll

          ls -lh Bin/libwow64fex.dll

          echo "=== FEX 产物汇总 ==="

          ls -lh \
            /opt/fex-src/build_ec/Bin/libarm64ecfex.dll \
            /opt/fex-src/build_pe/Bin/libwow64fex.dll

      # ============================================================
      # 6. 获取 Wine / Proton / Staging 源码
      # ============================================================
      - name: 获取 Wine 源码
        shell: bash
        env:
          INPUT_WINE_BRANCH: ${{ inputs.wine_branch }}
          INPUT_WINE_VERSION: ${{ inputs.wine_version }}
          INPUT_PROTON_BRANCH: ${{ inputs.proton_branch }}
          INPUT_PROTON_COMMIT: ${{ inputs.proton_commit }}
          INPUT_STAGING_VERSION: ${{ inputs.staging_version }}
        run: |
          set -eux

          rm -rf "${WINE_SOURCE_DIR}"

          mkdir -p "${WINE_SOURCE_DIR}"

          cd "${WINE_SOURCE_DIR}"

          BUILD_TYPE="${INPUT_WINE_BRANCH:-proton}"
          WINE_VERSION="${INPUT_WINE_VERSION:-latest}"

          echo "============================================"
          echo "Build type       : ${BUILD_TYPE}"
          echo "Wine version     : ${WINE_VERSION}"
          echo "Proton branch    : ${INPUT_PROTON_BRANCH}"
          echo "Proton commit    : ${INPUT_PROTON_COMMIT}"
          echo "Staging version  : ${INPUT_STAGING_VERSION}"
          echo "============================================"

          case "${BUILD_TYPE}" in
            proton)
              echo "=== Proton Wine ==="

              PROTON_BRANCH="${INPUT_PROTON_BRANCH:-proton_11.0}"

              git clone \
                --branch "${PROTON_BRANCH}" \
                --single-branch \
                https://github.com/WinNative-Emu/proton-wine.git \
                source

              cd source

              git config advice.detachedHead false

              if [ -n "${INPUT_PROTON_COMMIT}" ]; then
                echo "Checking out Proton commit ${INPUT_PROTON_COMMIT}"

                git fetch \
                  --depth=1 \
                  origin \
                  "${INPUT_PROTON_COMMIT}"

                git checkout "${INPUT_PROTON_COMMIT}"
              fi
              ;;

            staging)
              echo "=== Wine Staging ==="

              mkdir -p staging-source

              cd staging-source

              git clone \
                --depth=1 \
                https://github.com/wine-staging/wine-staging.git \
                staging

              cd staging

              STAGING_HEAD="$(git rev-parse HEAD)"

              echo "Wine-Staging HEAD: ${STAGING_HEAD}"

              if [ -n "${INPUT_STAGING_VERSION}" ]; then
                git fetch \
                  --tags \
                  --depth=1 \
                  origin \
                  "v${INPUT_STAGING_VERSION}"

                git checkout \
                  "v${INPUT_STAGING_VERSION}"
              fi

              if [ -f staging/upstream-commit ]; then
                UPSTREAM_COMMIT="$(cat staging/upstream-commit | tr -d '[:space:]')"

                echo "Required Wine upstream commit:"
                echo "${UPSTREAM_COMMIT}"

                cd ..

                git clone \
                  https://github.com/wine-mirror/wine.git \
                  source

                cd source

                git fetch \
                  --depth=1 \
                  origin \
                  "${UPSTREAM_COMMIT}"

                git checkout "${UPSTREAM_COMMIT}"

                git config advice.detachedHead false

                echo "=== Apply Wine-Staging patchset ==="

                python3 \
                  ../staging-source/staging/staging/patchinstall.py \
                  DESTDIR="$PWD" \
                  --all \
                  --no-autoconf
              else
                echo "ERROR: staging/upstream-commit not found"
                exit 1
              fi
              ;;

            pipetto-proton9-arm64ec)
              echo "=== Pipetto wine (proton-9.0-arm64ec, Wine 9.0 内核 + arm64ec) ==="

              git clone \
                --branch proton-9.0-arm64ec \
                --single-branch \
                https://github.com/Pipetto-crypto/wine.git \
                source

              cd source

              git config advice.detachedHead false

              echo "Pipetto wine HEAD: $(git rev-parse --short HEAD)"
              ;;

            winearm64ec)
              echo "=== Wine ARM64EC / wine-tkg ==="

              git clone \
                -b wow641010 \
                https://github.com/hostei33/wine-tkg.git \
                source

              cd source

              git config advice.detachedHead false

              if [ "${WINE_VERSION}" != "latest" ]; then
                git fetch --tags

                git checkout \
                  "wine-${WINE_VERSION}"
              fi
              ;;

            *)
              echo "ERROR: Unknown wine_branch=${BUILD_TYPE}"
              exit 1
              ;;
          esac

          cd "${WINE_SOURCE_DIR}/source"

          echo "=== Wine source information ==="

          git remote -v || true
          git status --short || true

          COMMIT_HASH="$(git rev-parse --short HEAD)"

          if [ -f VERSION ]; then
            WINE_VERSION_ACTUAL="$(cat VERSION)"
          else
            WINE_VERSION_ACTUAL="$(git describe --tags --always --dirty 2>/dev/null || echo unknown)"
          fi

          # 【修复】VERSION 文件里是 "Wine version 11.0" 这种带空格/大写的字符串，
          # 直接拼进 BUILD_NAME 会生成带空格的 tag，GitHub 拒绝：
          #   tag_name is not a valid tag / tag_name is not well-formed
          # 所以做一个"可用于 tag/文件名"的净化版本：
          #   去掉 "Wine version " 前缀 → 空格转 - → 只留 [A-Za-z0-9._-]
          # 兼容 "Wine version 11.0" / "Wine 9.0" / "9.0" 几种写法
          VER_SAFE="$(printf '%s' "${WINE_VERSION_ACTUAL}" \
            | sed -E 's/^[Ww]ine[ -]?version[ -]?//' \
            | sed -E 's/^[Ww]ine[ -]?//' \
            | sed -E 's/^v//' \
            | tr ' ' '-' \
            | tr -cd 'A-Za-z0-9._-')"
          [ -n "${VER_SAFE}" ] || VER_SAFE="unknown"

          echo "WINE_VERSION_ACTUAL = ${WINE_VERSION_ACTUAL}"
          echo "VER_SAFE            = ${VER_SAFE}"

          BUILD_NAME="wine-${VER_SAFE}-${COMMIT_HASH}-${BUILD_TYPE}-arm64-wow64"

          echo "BUILD_NAME=${BUILD_NAME}" >> "$GITHUB_ENV"
          echo "WINE_VERSION_ACTUAL=${WINE_VERSION_ACTUAL}" >> "$GITHUB_ENV"
          echo "WINE_COMMIT=${COMMIT_HASH}" >> "$GITHUB_ENV"

          echo "BUILD_NAME=${BUILD_NAME}"
          echo "WINE_VERSION_ACTUAL=${WINE_VERSION_ACTUAL}"
          echo "WINE_COMMIT=${COMMIT_HASH}"

      # ============================================================
      # 7. Wine source preparation
      # ============================================================
      - name: Wine source preparation
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source"

          chmod +x autogen.sh || true

          if [ ! -f configure ]; then
            ./autogen.sh
          fi

          if [ -x dlls/winevulkan/make_vulkan ]; then
            dlls/winevulkan/make_vulkan || true
          fi

          if [ -x tools/make_requests ]; then
            tools/make_requests || true
          fi

          if [ -x tools/make_specfiles ]; then
            tools/make_specfiles || true
          fi

      # ============================================================
      # 8. Termux compatibility patches
      #
      # 注意：外部 gstreamer01.patch 与当前 Proton 分支上下文不匹配，
      # 已移除。其余为本地 sed 修改，不依赖外部补丁文件。
      # ============================================================
      - name: Termux compatibility patches
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source"

          echo "============================================"
          echo "Applying Termux patches"
          echo "============================================"

          # --------------------------------------------------------
          # Termux tmp
          # --------------------------------------------------------
          TERMUX_TMP="${TERMUX_TMP}"

          # 【修复】socket 目录 /tmp/.wine-<uid> 也必须改到 Termux tmp：
          #   server/request.c:675          asprintf(&base_dir, "/tmp/.wine-%u", getuid())
          #   dlls/ntdll/unix/server.c:1323 asprintf(&dir, "/tmp/.wine-%u/server-%llx-%llx", ...)
          # 这两个文件原来不在清单里，导致运行时直接失败：
          #   wineserver: mkdir /tmp/.wine-10521: Permission denied
          # 注意：旧的 s|"/tmp"|...|g 模式对 "/tmp/.wine-%u" 匹配不上（/tmp 后面不是引号），
          #       靠的是下面 s|/tmp/|...|g 这一条，两条都要保留。
          # 另外 全树扫过：dlls/wineps.drv/ps.c 里的 "/tmpmtrx" 是 PostScript 变量名，
          # libs/gsm/** 是无关文档注释，都不能碰，所以这里只做定点替换。
          for FILE in \
            server/file.c \
            server/server.c \
            server/request.c \
            loader/loader.c \
            dlls/ntdll/loader.c \
            dlls/ntdll/unix/server.c \
            dlls/ntdll/unix/virtual.c
          do
            if [ -f "$FILE" ]; then
              echo "Patching tmp path: $FILE"

              sed -i \
                "s|\"/tmp\"|\"${TERMUX_TMP}\"|g" \
                "$FILE"

              sed -i \
                "s|/tmp/|${TERMUX_TMP}/|g" \
                "$FILE"
            fi
          done

          # 硬校验：socket 目录必须已指向 Termux tmp，否则立刻失败（别浪费 30 分钟编译）
          # 注意：替换后的字符串是 ".../usr/tmp/.wine-%u"，它同样包含子串 "/tmp/.wine-"，
          #       所以这里必须用「引号开头」精确匹配原始字面量 "/tmp/.wine-，避免误判。
          if grep -rn '"/tmp/\.wine-' server/request.c dlls/ntdll/unix/server.c 2>/dev/null; then
            echo "FATAL: /tmp/.wine- 仍然存在，socket 目录没有改到 Termux tmp"
            exit 1
          fi

          # 反向确认：必须能看到 Termux tmp 版
          grep -n 'usr/tmp/\.wine-' server/request.c dlls/ntdll/unix/server.c 2>/dev/null || \
            { echo "FATAL: 没找到 Termux tmp 版 socket 路径"; exit 1; }

          echo "=== socket 目录现在的写法 ==="

          grep -n 'wine-' server/request.c | head -3 || true
          grep -n 'wine-' dlls/ntdll/unix/server.c | head -3 || true

          # --------------------------------------------------------
          # FEX DLL names
          # --------------------------------------------------------
          if [ -f loader/wine.inf.in ]; then
            sed -i \
              's/"xtajit64\.dll"/"libarm64ecfex.dll"/g' \
              loader/wine.inf.in

            sed -i \
              's/"xtajit\.dll"/"libwow64fex.dll"/g' \
              loader/wine.inf.in
          fi

          if [ -f dlls/ntdll/loader.c ]; then
            sed -i \
              's/xtajit64\.dll/libarm64ecfex.dll/g' \
              dlls/ntdll/loader.c

            sed -i \
              's/xtajit\.dll/libwow64fex.dll/g' \
              dlls/ntdll/loader.c
          fi

          # --------------------------------------------------------
          # 统一 FEX DLL 名称
          # --------------------------------------------------------
          find . \
            -type f \
            \( -name "*.c" -o -name "*.h" \) \
            -print0 |
          xargs -0 -r sed -i \
            's/xtajit64\.dll/libarm64ecfex.dll/g'

          find . \
            -type f \
            \( -name "*.c" -o -name "*.h" \) \
            -print0 |
          xargs -0 -r sed -i \
            's/xtajit\.dll/libwow64fex.dll/g'

          # --------------------------------------------------------
          # ARM64EC ntdll arch name
          # --------------------------------------------------------
          find dlls/ntdll \
            -type f \
            \( -name "*.c" -o -name "*.h" \) \
            -print0 |
          xargs -0 -r sed -i \
            's|x86_64-windows|aarch64-windows|g'

          # --------------------------------------------------------
          # wdscore workaround
          # --------------------------------------------------------
          FILE_WDSCORE="dlls/wdscore/wdscore.spec"

          if [ -f "${FILE_WDSCORE}" ]; then
            echo "Checking wdscore.spec"

            grep -n -C 2 'CDynamicArray' \
              "${FILE_WDSCORE}" || true

            if grep -q '@ stub' "${FILE_WDSCORE}"; then
              sed -i '/CDynamicArray/d' \
                "${FILE_WDSCORE}"

              echo "wdscore workaround applied"
            fi
          fi

          # --------------------------------------------------------
          # virtual.c workaround
          # --------------------------------------------------------
          FILE_VIRTUAL="dlls/ntdll/unix/virtual.c"

          if [ -f "${FILE_VIRTUAL}" ]; then
            echo "Patching virtual.c"

            sed -i \
              's/HandleToULong( pbi.UniqueProcessId )/HandleToULong( (void *)(ULONG_PTR)pbi.UniqueProcessId )/g' \
              "${FILE_VIRTUAL}"

            # userfaultfd: Termux 上绕过
            # 整行替换，避免残留语法
            if grep -q 'uffd_fd = syscall( __NR_userfaultfd' "${FILE_VIRTUAL}"; then
              sed -i \
                's/^\(.*\)uffd_fd = syscall( __NR_userfaultfd.*$/\1uffd_fd = -1; \/* Termux bypass *\//' \
                "${FILE_VIRTUAL}"
            fi
          fi

          echo "============================================"
          echo "Termux patches completed"
          echo "============================================"

      # ============================================================
      # 8.05 【诊断 + 兜底】winegstreamer task pool
      #
      # 症状（arm wine 跑游戏实测）：
      #   err:quartz:autoplug Failed to create filter ... hr 0x8007000e
      #   fixme:ole:CoCreateInstanceEx no instance created ... hr 0x8007000e
      #
      # 源码链路（本树已核对）：
      #   quartz_parser.c:1873  parser_create()
      #     -> main.c:176       WINE_UNIX_CALL(unix_wg_parser_create) 失败 -> 返回 0
      #       -> wg_parser.c    unix 侧只有两个 E_OUTOFMEMORY 出口：
      #                         calloc()  /  wg_task_pool_new()
      #         -> wg_task_pool.c  WgTaskPool 是 GstTaskPool 的 GObject 子类
      #                            G_DEFINE_TYPE(WgTaskPool, wg_task_pool, GST_TYPE_TASK_POOL)
      #
      # 宿主 GStreamer/GLib 版本与构建时头文件不一致时，GType 注册可能失败，
      # g_object_new() 返回 NULL -> parser 创建失败 -> MF/quartz 解码全灭。
      #
      # 这里做两件事：
      #   1) 兜底：wg_task_pool_new() 失败时退回 GStreamer 自带 gst_task_pool_new()
      #   2) 打点：把 wg_task_pool 的 GType 与宿主 gst/glib 版本打到 stderr
      # ============================================================
      - name: winegstreamer task pool 兜底 + 诊断打点
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source"

          FILE_PARSER="dlls/winegstreamer/wg_parser.c"
          FILE_UNIXLIB="dlls/winegstreamer/unixlib.c"

          test -f "${FILE_PARSER}" || { echo "缺少 ${FILE_PARSER}"; exit 1; }

          apt-get install -y --no-install-recommends perl >/dev/null 2>&1 || true

          # ---- (1) 入口打点：确认 unix 函数体是否真的被进入 + GType 是否为 0 ----
          perl -0pi -e 's/(static NTSTATUS wg_parser_create\(void \*args\)\n\{\n)/$1    { extern GType wg_task_pool_get_type(void); static int dbg_printed; if (!dbg_printed) { dbg_printed = 1; fprintf(stderr, "winegstreamer: unix wg_parser_create entered, wg_task_pool GType=%lu\\n", (unsigned long)wg_task_pool_get_type()); } }\n/' "${FILE_PARSER}"

          # ---- (2) 兜底：task pool 创建失败时退回默认 pool ----
          perl -0pi -e 's/if \(!\(parser->task_pool = wg_task_pool_new\(\)\)\)\n    \{\n        free\(parser\);\n        return E_OUTOFMEMORY;\n    \}/if (!(parser->task_pool = wg_task_pool_new()))\n    {\n        fprintf(stderr, "winegstreamer: wg_task_pool_new() failed, falling back to the default GstTaskPool\\n");\n        if (!(parser->task_pool = gst_task_pool_new()))\n        {\n            free(parser);\n            return E_OUTOFMEMORY;\n        }\n    }/' "${FILE_PARSER}"

          # ---- (3) 宿主 gst/glib 版本打点 ----
          if [ -f "${FILE_UNIXLIB}" ]; then
            perl -0pi -e 's/(GST_INFO\("GStreamer library version %s; wine built with %d\.%d\.%d\.",\n\s*gst_version_string\(\), GST_VERSION_MAJOR, GST_VERSION_MINOR, GST_VERSION_MICRO\);)/$1\n    fprintf(stderr, "winegstreamer: unix init: host gst %s, host glib %u.%u.%u, built with gst %d.%d.%d\\n", gst_version_string(), glib_major_version, glib_minor_version, glib_micro_version, GST_VERSION_MAJOR, GST_VERSION_MINOR, GST_VERSION_MICRO);/' "${FILE_UNIXLIB}"
          fi

          echo "=== 注入结果检查 ==="
          grep -q 'falling back to the default GstTaskPool' "${FILE_PARSER}" \
            && echo "OK: task pool 兜底已注入" \
            || echo "WARN: 未能注入兜底（锚点不一致，不影响本次构建）"
          grep -q 'unix wg_parser_create entered' "${FILE_PARSER}" \
            && echo "OK: 入口打点已注入" \
            || echo "WARN: 未注入入口打点"
          if [ -f "${FILE_UNIXLIB}" ]; then
            grep -q 'unix init: host gst' "${FILE_UNIXLIB}" \
              && echo "OK: 版本打点已注入" \
              || echo "WARN: 未注入版本打点"
          fi

          grep -n 'wg_task_pool_new\|gst_task_pool_new\|GType=%lu' "${FILE_PARSER}" | head -20

      # ============================================================
      # 8.1 【关键修复】esync 头文件缺失
      #
      # 上游 WinNative-Emu/proton-wine@proton_11.0 的 tree 不一致：
      #   dlls/ntdll/unix/server.c:1716 调用了 esync_init( shm_fd )
      #   但该文件只 #include 了 "fsync.h"，漏了 "esync.h"
      # 报错（本次 run #245 的真实失败原因）：
      #   ../dlls/ntdll/unix/server.c:1716:17: error: call to undeclared function
      #   'esync_init'; ISO C99 and later do not support implicit function
      #   declarations [-Wimplicit-function-declaration]
      #   note: did you mean 'fsync_init'?  (fsync.h:21 declared here)
      #   make: *** [dlls/ntdll/unix/server.o] 오류 1
      #
      # 原因：隐式函数声明在 GCC 下只是 warning（上游用 gcc 所以没暴露），
      #       但 clang 16+ 默认当 error；本 workflow 用 clang 就直接编译失败。
      # 注意：sync.c / server/inproc_sync.c / server/main.c 都已正确 include，
      #       全树只有 server.c 这一处遗漏，所以这是 1 行修复。
      # ============================================================
      - name: 修复 esync 头文件缺失 (server.c)
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source"

          FILE_SERVER_ESYNC="dlls/ntdll/unix/server.c"

          # 这个修复只针对 proton / arm64ec 型 tree：
          #   * 文件不存在  -> 直接跳过
          #   * 没调用 esync_init（上游 Wine 9.0 之类）-> 跳过，避免插了不存在的头文件
          if [ ! -f "${FILE_SERVER_ESYNC}" ]; then
            echo "跳过 esync 修复：不存在 ${FILE_SERVER_ESYNC}"
          elif [ ! -f dlls/ntdll/unix/esync.h ] && ! grep -q 'esync_init' "${FILE_SERVER_ESYNC}"; then
            echo "跳过 esync 修复：该 tree 没有 esync（无 esync.h 且未调用 esync_init）"
          elif grep -q '#include "esync.h"' "${FILE_SERVER_ESYNC}"; then
            echo "已经包含 esync.h，无需修复"
          else
            # 插到 fsync.h 前面（与上游 esync 补丁的写法一致）
            sed -i \
              's|^#include "fsync.h"$|#include "esync.h"\n#include "fsync.h"|' \
              "${FILE_SERVER_ESYNC}"
          fi

          echo "=== server.c 相关 include ==="

          grep -n \
            '#include "esync.h"\|#include "fsync.h"' \
            "${FILE_SERVER_ESYNC}"

          # 硬校验：仅当确实存在 esync.h（即需要这个修复）时才强制要求
          if [ -f dlls/ntdll/unix/esync.h ]; then
            grep -q '#include "esync.h"' "${FILE_SERVER_ESYNC}"
            echo "esync.h include 修复完成（已校验）"
          else
            echo "该 tree 无 esync，跳过校验"
          fi

      # ============================================================
      # 9. Generate configure
      # ============================================================
      - name: Regenerate Wine configure
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source"

          ./autogen.sh

          test -f configure

          ls -lh configure

      # ============================================================
      # 10. Native Wine64 tools
      # ============================================================
      - name: Build native Wine64 tools and NLS
        shell: bash
        run: |
          set -eux

          rm -rf "${WINE64_DIR}"

          mkdir -p "${WINE64_DIR}"

          cd "${WINE64_DIR}"

          mkdir -p native

          cd native

          export PATH="/opt/${LLVMMINGW_NAME}/bin:${PATH}"

          export CC="gcc"
          export CXX="g++"

          "${WINE_SOURCE_DIR}/source/configure" \
            --enable-win64 \
            --disable-tests \
            --without-x \
            --without-vulkan \
            --without-wayland \
            --without-pulse \
            --without-alsa \
            --without-dbus \
            --without-udev \
            --without-cups \
            --without-gphoto \
            --without-gssapi \
            --without-krb5 \
            --without-pcap \
            --without-pcsclite \
            --without-sane \
            --without-usb \
            --without-v4l2 \
            --without-ffmpeg

          make \
            __tooldeps__ \
            -j"${{ inputs.jobs || 8 }}"

          echo "=== Build NLS ==="

          make -C nls \
            -j"${{ inputs.jobs || 8 }}"

          echo "=== Backup NLS ==="

          rm -rf /opt/nls-backup

          mkdir -p /opt/nls-backup

          cp -aL \
            nls/. \
            /opt/nls-backup/

          test -f \
            /opt/nls-backup/locale.nls

          echo "NLS backup OK"

          find /opt/nls-backup \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
          sort

      # ============================================================
      # 11. Native Wine tool validation
      # ============================================================
      - name: 验证 native Wine tools
        shell: bash
        run: |
          set -eux

          NATIVE="${WINE64_DIR}/native"

          echo "=== Native Wine ==="

          find "${NATIVE}" \
            -maxdepth 3 \
            -type f \
            \( \
              -name wine \
              -o \
              -name wine64 \
              -o \
              -name wineserver \
              -o \
              -name wineboot \
              -o \
              -name winecfg \
            \) \
            -print || true

          echo "=== NLS ==="

          test -f "${NATIVE}/nls/locale.nls"

          file "${NATIVE}/nls/locale.nls"

          mkdir -p "${WINE_NATIVE_DIR}"

          cp -aL \
            "${NATIVE}/." \
            "${WINE_NATIVE_DIR}/"

          test -f \
            "${WINE_NATIVE_DIR}/nls/locale.nls"

      # ============================================================
      # 12. ARM64 WOW64 configure
      # ============================================================
      - name: Configure ARM64 WOW64
        shell: bash
        env:
          ENABLE_WAYLAND: ${{ inputs.enable_wayland }}
          ENABLE_DBUS: ${{ inputs.enable_dbus }}
          ENABLE_UDEV: ${{ inputs.enable_udev }}
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source"

          rm -rf build-arm64

          mkdir -p build-arm64

          cd build-arm64

          export PATH="/opt/${LLVMMINGW_NAME}/bin:${PATH}"

          # Host compiler
          export CC="clang --target=aarch64-linux-gnu"
          export CXX="clang++ --target=aarch64-linux-gnu"

          # Windows cross compiler
          export CROSSCC="arm64ec-w64-mingw32-clang"
          export CROSSCXX="arm64ec-w64-mingw32-clang++"

          # ARM64 Debian sysroot
          export SYSROOT="/usr"

          export PKG_CONFIG_PATH="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"

          # Compiler flags
          export CFLAGS="-O2 -pipe"
          export CXXFLAGS="-O2 -pipe"

          export CROSSCFLAGS="-O2 -pipe"
          export CROSSCXXFLAGS="-O2 -pipe"

          # 注意：不要在全局 LDFLAGS 里强制 Termux loader。
          # 只在最终打包后用 patchelf 修改 ELF interpreter。
          export LDFLAGS="-L/usr/lib/aarch64-linux-gnu -Wl,-O1 -Wl,--as-needed -Wl,--sort-common"

          CONFIGURE_FLAGS=()

          CONFIGURE_FLAGS+=(
            --enable-win64
            --host=aarch64-linux-gnu
            --with-mingw=clang
            --enable-archs=${{ inputs.wine_archs || 'arm64ec,aarch64,i386' }}
            --with-wine-tools="${WINE_NATIVE_DIR}"
            --prefix=/tmp/wine-install-wow64
            --disable-win16
            --with-vulkan
            --enable-nls
            --with-pulse
            --with-gstreamer
            --with-pthread
            --without-ffmpeg
            --disable-opencl
            --disable-tests
            --disable-winemenubuilder
            --without-cups
            --without-gphoto
            --without-gssapi
            --without-krb5
            --with-alsa
            --without-oss
            --without-pcap
            --without-pcsclite
            --without-sane
            --without-usb
            --without-v4l2
            --with-xshm
            --with-vkd3d
          )

          if [ "${ENABLE_WAYLAND}" = "true" ]; then
            CONFIGURE_FLAGS+=(--with-wayland)
          else
            CONFIGURE_FLAGS+=(--without-wayland)
          fi

          if [ "${ENABLE_DBUS}" = "true" ]; then
            CONFIGURE_FLAGS+=(--with-dbus)
          else
            CONFIGURE_FLAGS+=(--without-dbus)
          fi

          if [ "${ENABLE_UDEV}" = "true" ]; then
            CONFIGURE_FLAGS+=(--with-udev)
          else
            CONFIGURE_FLAGS+=(--without-udev)
          fi

          echo "============================================"
          echo "Wine configure"
          echo "============================================"

          printf '%s\n' "${CONFIGURE_FLAGS[@]}"

          ../configure \
            "${CONFIGURE_FLAGS[@]}"

          echo "============================================"
          echo "Configure completed"
          echo "============================================"

          test -f config.status

      # ============================================================
      # 13. Configure summary
      # ============================================================
      - name: 输出 Wine configure summary
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source/build-arm64"

          echo "============================================"
          echo "Wine configuration"
          echo "============================================"

          if [ -f config.log ]; then
            grep -E \
              'checking for the host system type|checking for the target system type|checking whether to build 64-bit Wine|checking for Vulkan|checking for GStreamer|checking for PulseAudio|checking for Wayland|checking for DBus' \
              config.log || true
          fi

      # ============================================================
      # 14. Build
      # ============================================================
      - name: 编译 ARM64 WOW64
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WINE_SOURCE_DIR}/source/build-arm64"

          JOBS="${{ inputs.jobs || 8 }}"

          echo "Building with ${JOBS} jobs"

          # ---------------------------------------------------------------
          # 打印真正生效的编译器 / 目标，并把日志落盘。
          # 这段是"以后不用再猜"的关键：Actions 网页日志要登录才能看，
          # 落成 artifact 后失败时能直接下载 build.log。
          # ---------------------------------------------------------------
          echo "=== config.status 里实际生效的编译器 / 目标 ==="
          grep -aE '"(CC|CXX|HOST_ARCH|PE_ARCHS|(arm64ec|aarch64|i386|x86_64)_(CC|TARGET))"' \
            config.status | head -40 || true

          make \
            -j"${JOBS}" \
            --output-sync=target \
            2>&1 | tee build.log

      # ============================================================
      # 14.5 失败时上传构建日志（Actions 网页日志需要登录，artifact 可直接下载）
      # ============================================================
      - name: 上传构建日志 (失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-run${{ github.run_number }}
          path: |
            /opt/wine-src/source/build-arm64/build.log
            /opt/wine-src/source/build-arm64/config.log
            /opt/wine-src/source/build-arm64/config.status
          retention-days: 7

      # ============================================================
      # 15. Install
      # ============================================================
      - name: 安装 Wine
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source/build-arm64"

          rm -rf /tmp/wine-install-wow64

          mkdir -p /tmp/wine-install-wow64

          make install

          test -d /tmp/wine-install-wow64

          echo "=== Installed files ==="

          find /tmp/wine-install-wow64 \
            -maxdepth 3 \
            -type f |
          sort |
          head -300 || true

      # ============================================================
      # 16. Install tree fix
      # ============================================================
      - name: 修复 Termux Wine 安装树
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"
          BUILD="${WINE_SOURCE_DIR}/source/build-arm64"

          mkdir -p \
            "${TARGET}/bin" \
            "${TARGET}/lib/wine" \
            "${TARGET}/share/wine/nls" \
            "${TARGET}/share/wine/fonts"

          # NLS
          rm -rf \
            "${TARGET}/share/wine/nls"

          mkdir -p \
            "${TARGET}/share/wine/nls"

          cp -aL \
            "${WINE_NATIVE_DIR}/nls/." \
            "${TARGET}/share/wine/nls/"

          test -f \
            "${TARGET}/share/wine/nls/locale.nls"

          # Fonts
          if [ -d "${WINE_SOURCE_DIR}/source/fonts" ]; then
            find "${WINE_SOURCE_DIR}/source/fonts" \
              -maxdepth 1 \
              -type f \
              \( \
                -name "*.ttf" \
                -o \
                -name "*.ttc" \
                -o \
                -name "*.fon" \
              \) \
              -exec cp -L {} "${TARGET}/share/wine/fonts/" \;
          fi

          # Wine Unix libraries
          mkdir -p \
            "${TARGET}/lib/wine/aarch64-unix"

          if [ -f "${TARGET}/lib/wine/aarch64-unix/ntdll.so" ]; then
            echo "Native installed ntdll.so found"
          fi

          find "${BUILD}/dlls" \
            -type f \
            -name "*.so" \
            -exec cp -L {} \
              "${TARGET}/lib/wine/aarch64-unix/" \; \
            || true

          find "${BUILD}/programs" \
            -type f \
            -name "*.so" \
            -exec cp -L {} \
              "${TARGET}/lib/wine/aarch64-unix/" \; \
            || true

          find "${BUILD}" \
            -type f \
            -path "*/ntdll.so" \
            -exec cp -L {} \
              "${TARGET}/lib/wine/aarch64-unix/ntdll.so" \; \
            || true

          # Wine executables
          for PROG in \
            wine \
            wineserver \
            wineboot \
            winecfg \
            regedit \
            regsvr32 \
            winepath \
            wineconsole \
            winedbg
          do
            FOUND="$(find "${BUILD}" \
              -type f \
              -name "${PROG}" \
              -perm -111 \
              | head -n 1 || true)"

            if [ -n "${FOUND}" ]; then
              echo "Installing ${PROG}"

              cp -L \
                "${FOUND}" \
                "${TARGET}/bin/${PROG}"
            else
              echo "Not found: ${PROG}"
            fi
          done

          # ntdll loader compatibility
          if [ -f "${TARGET}/lib/wine/aarch64-unix/ntdll.so" ]; then
            ln -sfn \
              "../lib/wine/aarch64-unix/ntdll.so" \
              "${TARGET}/bin/ntdll.so"
          fi

          find "${TARGET}/bin" \
            -type f \
            -exec chmod +x {} \;

          echo "=== Installation tree ==="

          find "${TARGET}/bin" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
          sort

      # ============================================================
      # 17. Duplicate library detection
      # ============================================================
      - name: 检查重复 Unix DLL libraries
        shell: bash
        run: |
          set -eux

          BUILD="${WINE_SOURCE_DIR}/source/build-arm64"

          DUPLICATES="$(
            find "${BUILD}/dlls" \
              -type f \
              -name "*.so" \
              -printf '%f\n' |
            sort |
            uniq -d
          )"

          if [ -n "${DUPLICATES}" ]; then
            echo "WARNING: duplicate library basenames:"
            echo "${DUPLICATES}"
          else
            echo "No duplicate .so basename found"
          fi

      # ============================================================
      # 18. ELF verification
      # ============================================================
      - name: ELF / ARM64 验证
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          echo "============================================"
          echo "Wine ELF verification"
          echo "============================================"

          for FILE in \
            "${TARGET}/bin/wine" \
            "${TARGET}/bin/wineserver" \
            "${TARGET}/bin/wineboot"
          do
            if [ -f "${FILE}" ]; then
              echo
              echo "===== ${FILE} ====="

              file "${FILE}"

              # Wine 9.0 里 bin/wineboot 是 POSIX shell 脚本（不是 ELF），
              # 直接 readelf 会报 "Not an ELF file" 并让步骤失败 —— 这里先判断类型
              if ! file -b "${FILE}" | grep -q 'ELF'; then
                echo "  (非 ELF 文件，跳过 readelf: $(file -b "${FILE}"))"
                continue
              fi

              readelf -h "${FILE}" |
                grep -E \
                  'Class:|Machine:|Type:'

              echo "--- interpreter ---"

              readelf -l "${FILE}" |
                grep -E 'interpreter|Requesting program interpreter' \
                || true

              echo "--- rpath/runpath ---"

              readelf -d "${FILE}" |
                grep -E 'RPATH|RUNPATH' \
                || true
            fi
          done

      # ============================================================
      # 18.5 安装 FEX 模拟器 DLL + Termux 路径配置
      #
      # 把 FEX 编出来的两个模拟器 DLL 放进 wine 的
      #   lib/wine/aarch64-windows/         <- Hangover 官方位置
      #     libarm64ecfex.dll   x86_64 模拟
      #     libwow64fex.dll     i386   模拟
      #
      # 同时处理 FEX 内置的默认路径：
      #   /usr/lib/wine/aarch64-windows/fex-emu/HostThunks
      #   /usr/share/fex-emu/GuestThunks
      # 这两条在 Termux(非 root) 下不存在，改用 FEX 官方支持的环境变量
      #   FEX_THUNKHOSTLIBS / FEX_THUNKGUESTLIBS / FEX_ROOTFS / FEX_THUNKCONFIG
      # 覆盖成 Termux glibc 前缀内的真实位置（脚本自定位，不写死绝对路径）。
      # ============================================================
      - name: 安装 FEX 模拟器 DLL (aarch64-windows)
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"
          DEST="${TARGET}/lib/wine/aarch64-windows"

          mkdir -p "${DEST}"

          install -m0644 /opt/fex-src/build_ec/Bin/libarm64ecfex.dll "${DEST}/libarm64ecfex.dll"
          install -m0644 /opt/fex-src/build_pe/Bin/libwow64fex.dll   "${DEST}/libwow64fex.dll"

          echo "=== 安装结果（期望 libarm64ecfex=PE x86-64 / libwow64fex=PE Aarch64）==="

          ls -lh "${DEST}/libarm64ecfex.dll" "${DEST}/libwow64fex.dll"

          file "${DEST}/libarm64ecfex.dll" "${DEST}/libwow64fex.dll"

          echo "=== wine.inf / loader 里的模拟器引用 ==="

          grep -a -i 'libarm64ecfex\|libwow64fex' "${TARGET}/share/wine/wine.inf" | head -6 || \
            echo "(wine.inf 里没找到 FEX 名称，检查 Termux compatibility patches 步骤)"

          # ---------- FEX 的 thunk / rootfs 目录 ----------
          mkdir -p "${DEST}/fex-emu/HostThunks"
          mkdir -p "${TARGET}/share/fex-emu/GuestThunks"
          mkdir -p "${TARGET}/share/fex-emu/RootFS"

          # ---------- 自定位的 FEX 环境脚本 ----------
          cat > "${TARGET}/share/fex-emu/fex-env.sh" <<'EOS'
          #!/bin/bash
          # FEX 在 Termux glibc 环境下的路径配置
          # 用法: source "<wine根>/share/fex-emu/fex-env.sh"
          # 说明: FEX DLL 内置默认路径是 /usr/lib/wine/... 与 /usr/share/fex-emu/，
          #       在 Termux(非 root) 里那些路径不存在也不可写，必须用环境变量覆盖。
          _fex_share="$(cd "$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")" && pwd)"
          _fex_root="$(cd "${_fex_share}/../.." && pwd)"

          export FEX_THUNKHOSTLIBS="${_fex_root}/lib/wine/aarch64-windows/fex-emu/HostThunks"
          export FEX_THUNKGUESTLIBS="${_fex_share}/GuestThunks"
          export FEX_ROOTFS="${_fex_share}/RootFS"
          export FEX_THUNKCONFIG="${_fex_share}"
          # FEX 用相对自身位置的路径（不再依赖 /usr、/etc）
          export FEX_PORTABLE=1
          # Wine 侧选择模拟器 DLL（Hangover 约定）
          export HODLL64=libarm64ecfex.dll
          export HODLL=libwow64fex.dll

          echo "[fex-env] wine 根目录          = ${_fex_root}"
          echo "[fex-env] FEX_THUNKHOSTLIBS    = ${FEX_THUNKHOSTLIBS}"
          echo "[fex-env] FEX_THUNKGUESTLIBS   = ${FEX_THUNKGUESTLIBS}"
          EOS

          chmod 0755 "${TARGET}/share/fex-emu/fex-env.sh"

          # 把 FEX 构建时生成的 thunk 数据（如果有）一并带上
          if [ -d /opt/fex-src/build_ec/Bin/Thunks ]; then
            cp -a /opt/fex-src/build_ec/Bin/Thunks/. "${DEST}/fex-emu/HostThunks/" || true
          fi

          if [ -d /opt/fex-src/build_ec/Bin/GuestThunks ]; then
            cp -a /opt/fex-src/build_ec/Bin/GuestThunks/. "${TARGET}/share/fex-emu/GuestThunks/" || true
          fi

          echo "=== FEX 安装完成 ==="

          find "${TARGET}" -maxdepth 5 -iname '*fex*' | sort

      # ============================================================
      # 19. Termux runtime path fix (patchelf)
      # ============================================================
      - name: 写入 Termux runtime path
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          apt-get install -y --no-install-recommends patchelf

          TERMUX_LOADER="${TERMUX_GLIBC_PREFIX}/lib/ld-linux-aarch64.so.1"

          # ---------- bin/ ----------
          find "${TARGET}/bin" \
            -type f \
            -exec file {} \; |
          grep -E 'ELF 64-bit LSB.*ARM aarch64' |
          cut -d: -f1 |
          while read -r ELF; do
            echo "patchelf: ${ELF}"
            patchelf \
              --set-interpreter "${TERMUX_LOADER}" \
              --set-rpath "${TERMUX_GLIBC_PREFIX}/lib" \
              "${ELF}" || true
          done

          # ---------- lib/wine/（含非 .so 的可执行文件）----------
          # 【修复】原来只处理 -name "*.so"，漏掉了
          #   lib/wine/aarch64-unix/wine        <- 真正的 loader 二进制
          #   lib/wine/*-unix/wineserver 等
          # 它们仍指向宿主 /lib/ld-linux-aarch64.so.1，在 Termux 上会 ENOENT。
          # 现在：统一设置 Termux RPATH；若该 ELF 自带 PT_INTERP 再顺带改 interpreter。
          while IFS= read -r -d '' ELF; do
            case "$(file -b "$ELF")" in
              *"ELF 64-bit LSB"*"ARM aarch64"*) ;;
              *) continue ;;
            esac
            if readelf -lW "$ELF" 2>/dev/null | grep -q 'program interpreter'; then
              echo "patchelf(exe): ${ELF}"
              patchelf --set-interpreter "${TERMUX_LOADER}" \
                       --set-rpath "${TERMUX_GLIBC_PREFIX}/lib" "${ELF}" || true
            else
              echo "patchelf(so): ${ELF}"
              patchelf --set-rpath "${TERMUX_GLIBC_PREFIX}/lib" "${ELF}" || true
            fi
          done < <(find "${TARGET}/lib/wine" -type f -print0)

          # ---------- 自检（不完整就直接失败，别让它跑到 Release）----------
          echo "=========== runtime path 自检 ==========="
          FAIL=0
          for ELF in "${TARGET}/bin/wine" "${TARGET}/bin/wineserver" "${TARGET}"/lib/wine/*-unix/wine; do
            [ -f "${ELF}" ] || continue
            I="$(readelf -lW "${ELF}" 2>/dev/null | sed -n 's/.*program interpreter: \(.*\)\]/\1/p' | head -1)"
            R="$(readelf -dW "${ELF}" 2>/dev/null | sed -n 's/.*RUNPATH.*\[\(.*\)\]/\1/p' | head -1)"
            echo "  ${ELF}"
            echo "      interp = ${I:-<none>}"
            echo "      rpath  = ${R:-<none>}"
            if [ -n "${I}" ] && [ "${I}" != "${TERMUX_LOADER}" ]; then
              echo "      !! interpreter 不是 Termux loader"
              FAIL=1
            fi
            case "${R}" in
              *"${TERMUX_GLIBC_PREFIX}/lib"*) ;;
              *) echo "      !! rpath 缺少 ${TERMUX_GLIBC_PREFIX}/lib"; FAIL=1 ;;
            esac
          done

          N_BAD=0
          while IFS= read -r -d '' ELF; do
            case "$(file -b "$ELF")" in
              *"ELF 64-bit LSB"*"ARM aarch64"*) ;;
              *) continue ;;
            esac
            if ! readelf -dW "$ELF" 2>/dev/null | grep -q "${TERMUX_GLIBC_PREFIX}/lib"; then
              echo "  !! 缺 Termux rpath: ${ELF}"
              N_BAD=$((N_BAD + 1))
            fi
          done < <(find "${TARGET}/lib/wine" -type f -print0)
          echo "  lib/wine 下缺 Termux rpath 的 ARM64 ELF 数量: ${N_BAD}"

          if [ "${FAIL}" != "0" ]; then
            echo "FATAL: 关键二进制 runtime path 修复不完整"
            exit 1
          fi

          # ---------- 残留 /tmp 路径检查（编译期不会报错、只有运行时才炸）----------
          # 例: wineserver: mkdir /tmp/.wine-10521: Permission denied
          echo "=========== /tmp 残留检查 ==========="
          TMP_LEFT=0
          # 用 PCRE 负向后顾：只有「前面不是 usr」的 /tmp/.wine- 才算残留，
          # 这样替换后的 ".../usr/tmp/.wine-" 不会被误判。
          for BIN in "${TARGET}/bin/wine" "${TARGET}/bin/wineserver" "${TARGET}"/lib/wine/*-unix/*.so; do
            [ -f "${BIN}" ] || continue
            if grep -qaP '(?<!usr)/tmp/\.wine-' "${BIN}"; then
              echo "  !! $(basename "${BIN}") 里仍有 /tmp/.wine-（socket 目录没改到 Termux tmp）"
              TMP_LEFT=1
            fi
          done

          if [ "${TMP_LEFT}" != "0" ]; then
            echo "FATAL: 二进制里仍有 /tmp/.wine-，设备上运行会 mkdir Permission denied"
            exit 1
          fi

          echo "  未发现 /tmp/.wine- 残留"

          echo "runtime path 修复完成"

      # ============================================================
      # 20. ARM64 ntdll verification
      # ============================================================
      - name: 验证 ntdll
        shell: bash
        run: |
          set -eux

          NTDLL="/tmp/wine-install-wow64/lib/wine/aarch64-unix/ntdll.so"

          if [ ! -f "${NTDLL}" ]; then
            echo "ERROR: ntdll.so not found"
            exit 1
          fi

          file "${NTDLL}"

          readelf -h "${NTDLL}" |
            grep -E \
              'Class:|Machine:|Type:'

      # ============================================================
      # 21. NLS verification
      # ============================================================
      - name: 验证 NLS
        shell: bash
        run: |
          set -eux

          NLS="/tmp/wine-install-wow64/share/wine/nls"

          test -d "${NLS}"
          test -f "${NLS}/locale.nls"

          echo "locale.nls:"
          file "${NLS}/locale.nls"

          echo "NLS files:"
          find "${NLS}" \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' |
          sort

      # ============================================================
      # 22. GStreamer verification
      # ============================================================
      - name: 验证 GStreamer
        shell: bash
        run: |
          set -eux

          echo "=== GStreamer libraries in build tree ==="

          find "${WINE_SOURCE_DIR}/source/build-arm64" \
            -type f \
            \( \
              -name "*gstreamer*.so" \
              -o \
              -name "*winegstreamer*.so" \
            \) \
            -print |
          head -100 || true

          echo "=== Debian ARM64 GStreamer ==="

          dpkg-query \
            -W \
            -f='${Package} ${Version}\n' \
            '*gstreamer*' \
            2>/dev/null |
          head -100 || true

      # ============================================================
      # 22.1 【自检】解码 / 音频链依赖
      #
      # - winegstreamer.so 必须链上宿主 gstreamer（否则 MF/quartz 全灭，
      #   典型现象 hr=0x8007000e）
      # - winepulse.drv 的 DriverProc 转发到 winealsa.drv，所以 --with-pulse
      #   时必须同时 --with-alsa，否则运行时：
      #   err:module:find_forwarded_export module not found for forward
      #   'winealsa.drv.DriverProc' used by winepulse.drv
      # ============================================================
      - name: 验证解码链依赖 (gstreamer + alsa)
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          echo "=== unix 侧解码/音频库的运行时依赖 ==="
          for so in \
            "${TARGET}/lib/wine/aarch64-unix/winegstreamer.so" \
            "${TARGET}/lib/wine/aarch64-unix/winedmo.so" \
            "${TARGET}/lib/wine/aarch64-unix/winepulse.so"
          do
            [ -f "${so}" ] || continue
            echo "--- $(basename "${so}")"
            readelf -dW "${so}" | grep -E 'NEEDED|RUNPATH' || true
          done

          echo "=== 断言：winegstreamer.so 必须链上宿主 libgstreamer ==="
          readelf -dW "${TARGET}/lib/wine/aarch64-unix/winegstreamer.so" \
            | grep -q 'libgstreamer-1.0.so.0'
          echo "OK: winegstreamer.so -> libgstreamer-1.0"
          readelf -dW "${TARGET}/lib/wine/aarch64-unix/winegstreamer.so" \
            | grep -q 'libgstgl-1.0.so.0'
          echo "OK: winegstreamer.so -> libgstgl-1.0"

          echo "=== 断言：winepulse.drv 存在时 winealsa.drv 必须也存在 ==="
          if [ -f "${TARGET}/lib/wine/aarch64-windows/winepulse.drv" ]; then
            test -f "${TARGET}/lib/wine/aarch64-windows/winealsa.drv" || {
              echo "FAIL: winepulse.drv 的 DriverProc 转发到 winealsa.drv，但后者缺失（需要 --with-alsa）"
              exit 1
            }
            test -f "${TARGET}/lib/wine/aarch64-unix/winealsa.so" || {
              echo "FAIL: 缺少 aarch64-unix/winealsa.so"
              exit 1
            }
            echo "OK: winealsa.drv + winealsa.so 齐备（winepulse 转发可解析）"
          fi

          echo "=== PE <-> unix 关键模块配对抽查 ==="
          for m in winegstreamer winedmo winealsa winepulse winex11 win32u winevulkan
          do
            printf '  %-16s' "$m"
            for d in aarch64-unix; do
              if [ -f "${TARGET}/lib/wine/$d/$m.so" ]; then printf 'unix:OK '; else printf 'unix:MISS '; fi
            done
            for d in aarch64-windows i386-windows; do
              if [ -f "${TARGET}/lib/wine/$d/$m.dll" ] || [ -f "${TARGET}/lib/wine/$d/$m.drv" ]; then
                printf '%s:OK ' "$d"
              else
                printf '%s:MISS ' "$d"
              fi
            done
            echo
          done

      # ============================================================
      # 22.2 【自检】加密链路（gnutls / schannel / bcrypt）
      #
      # 症状（wineboot 日志实测，出现 80 次）：
      #   err:bcrypt:key_asymmetric_create no encryption support
      # 原因：configure 阶段没找到 libgnutls（漏装 libgnutls28-dev:arm64）
      #   configure: WARNING: libgnutls 64-bit development files not found,
      #              no schannel support.
      # 影响：schannel(TLS/WinHTTP) 不可用 + bcrypt 无加密后端
      #       -> 联网游戏/启动器、DRM、证书校验会失败
      # ============================================================
      - name: 验证加密链依赖 (gnutls / schannel)
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          echo "=== bcrypt.so（无 gnutls 就会打 key_asymmetric_create 错误）==="
          BCRYPT="${TARGET}/lib/wine/aarch64-unix/bcrypt.so"
          test -f "${BCRYPT}"
          readelf -dW "${BCRYPT}" | grep -E 'NEEDED|RUNPATH' || true
          readelf -dW "${BCRYPT}" | grep -q 'libgnutls.so' || {
            echo "FAIL: bcrypt.so 未链上 libgnutls —— schannel/bcrypt 不可用（需要 libgnutls28-dev:arm64）"
            exit 1
          }
          echo "OK: bcrypt.so -> libgnutls（schannel/bcrypt 可用）"

          echo "=== secur32.so（报告用，不做硬断言）==="
          SEC="${TARGET}/lib/wine/aarch64-unix/secur32.so"
          if [ -f "${SEC}" ]; then
            readelf -dW "${SEC}" | grep -E 'NEEDED' || true
            if readelf -dW "${SEC}" | grep -q 'libgnutls.so'; then
              echo "OK: secur32.so -> libgnutls"
            else
              echo "WARN: secur32.so 未链 libgnutls"
            fi
          else
            echo "（没有 secur32.so，跳过）"
          fi

      # ============================================================
      # 23. Vulkan verification
      # ============================================================
      - name: 验证 Vulkan
        shell: bash
        run: |
          set -eux

          echo "=== Vulkan development package ==="

          dpkg-query \
            -W \
            -f='${Package} ${Version}\n' \
            'libvulkan-dev:arm64' \
            || true

          echo "=== Wine Vulkan ==="

          find "${WINE_SOURCE_DIR}/source/build-arm64" \
            -type f \
            -iname '*vulkan*.so' \
            -print |
          head -100 || true

      # ============================================================
      # 24. Wine executable smoke test
      # ============================================================
      - name: Wine executable smoke test
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          echo "=== wine --version ==="

          if [ -x "${TARGET}/bin/wine" ]; then
            file "${TARGET}/bin/wine"
            echo "ARM64 Wine binary generated successfully"
          else
            echo "ERROR: wine executable missing"
            exit 1
          fi

      # ============================================================
      # 25. Final package verification
      # ============================================================
      - name: 最终目录检查
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          echo "============================================"
          echo "FINAL WINE TREE"
          echo "============================================"

          find "${TARGET}" \
            -maxdepth 4 \
            -type f |
          sort |
          head -500 || true

          echo
          echo "Directory sizes:"

          du -sh \
            "${TARGET}"/* \
            2>/dev/null || true

      # ============================================================
      # 26. Package
      # ============================================================
      - name: 准备 Wine package
        shell: bash
        run: |
          set -eux

          rm -rf wine-package

          mkdir -p wine-package/wine

          cp -a \
            /tmp/wine-install-wow64/. \
            wine-package/wine/

          test -d wine-package/wine/bin

          test -f \
            wine-package/wine/share/wine/nls/locale.nls

      # ============================================================
      # 27. Package manifest
      # ============================================================
      - name: 生成构建信息
        shell: bash
        run: |
          set -eux

          cat > wine-package/BUILD_INFO.txt <<EOF
          Wine ARM64 WOW64 / ARM64EC
          ============================

          Build type:
          ${{ inputs.wine_branch || 'proton' }}

          Wine version:
          ${WINE_VERSION_ACTUAL}

          Wine commit:
          ${WINE_COMMIT}

          Proton branch:
          ${{ inputs.proton_branch }}

          Proton commit:
          ${{ inputs.proton_commit }}

          Staging version:
          ${{ inputs.staging_version }}

          LLVM-MinGW:
          ${LLVMMINGW_NAME}

          Host:
          Debian 12 amd64 GitHub Actions

          Target:
          ARM64 Linux / Termux glibc

          Windows architectures:
          arm64ec
          aarch64
          i386

          Termux glibc:
          ${TERMUX_GLIBC_PREFIX}

          Termux tmp:
          ${TERMUX_TMP}

          Wayland:
          ${{ inputs.enable_wayland }}

          DBus:
          ${{ inputs.enable_dbus }}

          UDEV:
          ${{ inputs.enable_udev }}

          Build time:
          $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF

          cat wine-package/BUILD_INFO.txt

          # ---------- 运行时依赖清单（给设备侧核对“缺哪个库”）----------
          {
            echo "Wine ARM64 WOW64 / Termux glibc - runtime dependency manifest"
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "说明：下面每个 aarch64-unix/*.so 的 NEEDED 都必须由宿主（Termux glibc 前缀）提供；"
            echo "      ntdll.so 由 Wine 自身提供，可忽略。"
            echo
            for so in wine-package/wine/lib/wine/aarch64-unix/*.so; do
              [ -f "$so" ] || continue
              echo "### $(basename "$so")"
              readelf -dW "$so" 2>/dev/null \
                | sed -n 's/.*Shared library: \[\(.*\)\]/  \1/p' \
                | sort -u
              echo
            done
            echo "=== winegstreamer.so 需要的宿主 GStreamer 库（必须全部存在）==="
            readelf -dW wine-package/wine/lib/wine/aarch64-unix/winegstreamer.so 2>/dev/null \
              | sed -n 's/.*\[\(libgst.*\)\]/  \1/p' \
              | sort -u
            echo
          } > wine-package/RUNTIME_DEPS.txt

          cat wine-package/RUNTIME_DEPS.txt

      # ============================================================
      # 28. tar.xz
      # ============================================================
      - name: 创建 tar.xz
        shell: bash
        run: |
          set -eux

          tar \
            -cJf \
            "${BUILD_NAME}.tar.xz" \
            -C wine-package \
            wine \
            BUILD_INFO.txt

          ls -lh \
            "${BUILD_NAME}.tar.xz"

      # ============================================================
      # 29. SHA256
      # ============================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -eux

          sha256sum \
            "${BUILD_NAME}.tar.xz" \
            > checksums.txt

          cat checksums.txt

      # ============================================================
      # 30. Artifact
      # ============================================================
      - name: Upload Wine artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wine-${{ inputs.wine_branch || 'proton' }}-${{ inputs.wine_version || 'latest' }}-ARM64-WOW64
          path: |
            *.tar.xz
            checksums.txt
            wine-package/BUILD_INFO.txt
            wine-package/RUNTIME_DEPS.txt
          retention-days: 30

      # ============================================================
      # 31. GitHub Release
      # ============================================================
      - name: Publish Wine GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_NAME }}
          name: ${{ env.BUILD_NAME }}

          body: |
            # Wine ARM64 WOW64 / ARM64EC

            ## Build

            - Build type: `${{ inputs.wine_branch || 'proton' }}`
            - Wine version: `${{ inputs.wine_version || 'latest' }}`
            - Wine commit: `${{ env.WINE_COMMIT }}`
            - Host: Debian 12 amd64
            - Target: ARM64 Linux / Termux glibc

            ## Windows architectures

            - ARM64EC
            - AArch64
            - i386 / WOW64

            ## Proton

            - Branch: `${{ inputs.proton_branch }}`
            - Commit: `${{ inputs.proton_commit }}`

            ## Wine-Staging

            - Version: `${{ inputs.staging_version }}`

            ## Runtime

            - Termux glibc loader:
              `/data/data/com.termux/files/usr/glibc/lib/ld-linux-aarch64.so.1`

            - Termux tmp:
              `/data/data/com.termux/files/usr/tmp`

            ## Optional components

            - Wayland: `${{ inputs.enable_wayland }}`
            - DBus: `${{ inputs.enable_dbus }}`
            - UDEV: `${{ inputs.enable_udev }}`
            - GStreamer: enabled
            - PulseAudio: enabled (ALSA backend: enabled)
            - Vulkan: enabled
            - vkd3d: enabled

            ## Build information

            The package contains `BUILD_INFO.txt` and SHA256 checksum.

          files: |
            ${{ github.workspace }}/${{ env.BUILD_NAME }}.tar.xz
            ${{ github.workspace }}/checksums.txt
            ${{ github.workspace }}/wine-package/BUILD_INFO.txt
            ${{ github.workspace }}/wine-package/RUNTIME_DEPS.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
