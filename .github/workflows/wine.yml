name: Wine ARM64 WOW64 构建

on:
  schedule:
    - cron: '0 2 5,20 * *'

  workflow_dispatch:
    inputs:
      wine_branch:
        description: 'Wine 分支'
        required: true
        default: 'vanilla'
        type: choice
        options:
          - vanilla
          - proton9-arm64ec
          - staging
          - staging-tkg
          - staging-tkg-fsync

      fex_ref:
        description: 'FEX branch / tag / commit'
        required: true
        default: 'main'
        type: string

      wine_version:
        description: 'Wine 版本'
        required: true
        default: 'latest'
        type: string

      preloader:
        description: '启用 Wine preloader'
        required: true
        default: 'on'
        type: choice
        options:
          - on
          - off

      android_compat:
        description: '启用 Termux / Android 兼容补丁'
        required: true
        default: 'on'
        type: choice
        options:
          - on
          - off

      build_profile:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  DEBIAN_FRONTEND: noninteractive

  LLVM_MINGW_DIR: /opt/llvm-mingw
  FEX_DIR: /opt/FEX

  WINE_SOURCE: /opt/wine-source
  WINE_NATIVE: /opt/wine64-native
  WINE_BUILD: /opt/wine-wow64-build
  WINE_INSTALL: /tmp/wine-install-wow64

  TERMUX_GLIBC_PREFIX: /data/data/com.termux/files/usr/glibc
  TERMUX_TMP: /data/data/com.termux/files/usr/tmp

  CCACHE_DIR: /opt/ccache

  FEX_REF: ${{ inputs.fex_ref || 'main' }}
  WINE_BRANCH: ${{ inputs.wine_branch || 'vanilla' }}
  WINE_VERSION: ${{ inputs.wine_version || 'latest' }}
  PRELOADER: ${{ inputs.preloader || 'on' }}
  ANDROID_COMPAT: ${{ inputs.android_compat || 'on' }}
  BUILD_PROFILE: ${{ inputs.build_profile || 'release' }}

jobs:
  build:
    name: Wine ARM64 WOW64
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    container:
      image: debian:12

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Dependencies
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          dpkg --add-architecture arm64

          apt-get update

          apt-get install -y \
            ca-certificates \
            apt-transport-https \
            gnupg \
            wget \
            curl \
            git \
            git-lfs \
            unzip \
            xz-utils \
            bzip2 \
            gzip \
            tar \
            patch \
            sed \
            grep \
            gawk \
            perl \
            python3 \
            python3-pip \
            python3-setuptools \
            pkg-config \
            ninja-build \
            cmake \
            meson \
            ccache \
            flex \
            bison \
            gettext \
            gettext-base \
            autoconf \
            automake \
            libtool \
            texinfo \
            make \
            gcc \
            g++ \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            binutils-aarch64-linux-gnu \
            file \
            patchelf

          apt-get install -y \
            libc6-dev:arm64 \
            libgcc-s1:arm64 \
            libstdc++6:arm64 \
            libstdc++-12-dev:arm64 \
            zlib1g-dev:arm64 \
            libbz2-dev:arm64 \
            liblzma-dev:arm64 \
            libfreetype6-dev:arm64 \
            libfontconfig1-dev:arm64 \
            libpng-dev:arm64 \
            libjpeg-dev:arm64 \
            libtiff-dev:arm64 \
            libxml2-dev:arm64 \
            libxslt1-dev:arm64 \
            libgnutls28-dev:arm64 \
            libssl-dev:arm64 \
            libdbus-1-dev:arm64 \
            libudev-dev:arm64 \
            libunwind-dev:arm64 \
            libunwind8:arm64 \
            libexpat1-dev:arm64 \
            libglib2.0-dev:arm64 \
            libgphoto2-dev:arm64 \
            libgsm1-dev:arm64 \
            libmpg123-dev:arm64 \
            libopenal-dev:arm64 \
            libpulse-dev:arm64 \
            libsane-dev:arm64 \
            libv4l-dev:arm64

          apt-get install -y \
            libx11-dev:arm64 \
            libx11-xcb-dev:arm64 \
            libxau-dev:arm64 \
            libxcb1-dev:arm64 \
            libxcb-dri2-0-dev:arm64 \
            libxcb-dri3-dev:arm64 \
            libxcb-glx0-dev:arm64 \
            libxcb-present-dev:arm64 \
            libxcb-randr0-dev:arm64 \
            libxcb-render0-dev:arm64 \
            libxcb-shape0-dev:arm64 \
            libxcb-shm0-dev:arm64 \
            libxcb-sync-dev:arm64 \
            libxcb-xfixes0-dev:arm64 \
            libxcb-xinerama0-dev:arm64 \
            libxcb-xkb-dev:arm64 \
            libxcursor-dev:arm64 \
            libxext-dev:arm64 \
            libxfixes-dev:arm64 \
            libxi-dev:arm64 \
            libxinerama-dev:arm64 \
            libxkbcommon-dev:arm64 \
            libxrandr-dev:arm64 \
            libxrender-dev:arm64 \
            libxxf86vm-dev:arm64 \
            libxcomposite-dev:arm64 \
            libxdamage-dev:arm64 \
            libxres-dev:arm64 \
            libegl-dev:arm64 \
            libgl-dev:arm64 \
            libgles-dev:arm64 \
            libvulkan-dev:arm64 \
            libwayland-dev:arm64 \
            libsdl2-dev:arm64

          apt-get install -y \
            libasound2-dev:arm64 \
            libpulse-dev:arm64 \
            libopenal-dev:arm64

          apt-get install -y \
            libavcodec-dev:arm64 \
            libavformat-dev:arm64 \
            libavutil-dev:arm64 \
            libswresample-dev:arm64 \
            libswscale-dev:arm64

          apt-get install -y \
            libgstreamer1.0-dev:arm64 \
            libgstreamer-plugins-base1.0-dev:arm64 \
            libgstreamer-plugins-bad1.0-dev:arm64 \
            gstreamer1.0-plugins-base:arm64 \
            gstreamer1.0-plugins-good:arm64 \
            gstreamer1.0-plugins-bad:arm64 \
            gstreamer1.0-plugins-ugly:arm64 \
            gstreamer1.0-libav:arm64 \
            gstreamer1.0-tools:arm64

          apt-get clean
          rm -rf /var/lib/apt/lists/*

      # ==========================================================
      # 3. LLVM-MinGW
      # ==========================================================

      - name: Install LLVM-MinGW
        shell: bash
        run: |
          set -eux

          cd /opt

          LLVM_MINGW_VERSION="20251202"
          LLVM_MINGW_ARCHIVE="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"

          wget -q \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_ARCHIVE}"

          tar -xf "$LLVM_MINGW_ARCHIVE"

          LLVM_DIR="$(
            find /opt \
              -maxdepth 1 \
              -type d \
              -name "llvm-mingw-${LLVM_MINGW_VERSION}-*" \
              -print \
              | head -n 1
          )"

          test -n "$LLVM_DIR"

          ln -sfn "$LLVM_DIR" "$LLVM_MINGW_DIR"

          rm -f "$LLVM_MINGW_ARCHIVE"

          echo "$LLVM_MINGW_DIR/bin" >> "$GITHUB_PATH"

      # ==========================================================
      # 4. Verify LLVM-MinGW
      # ==========================================================

      - name: Verify LLVM-MinGW
        shell: bash
        run: |
          set -eux

          export PATH="$LLVM_MINGW_DIR/bin:$PATH"

          "$LLVM_MINGW_DIR/bin/clang" --version

          command -v aarch64-w64-mingw32-clang
          command -v aarch64-w64-mingw32-clang++

          command -v arm64ec-w64-mingw32-clang
          command -v arm64ec-w64-mingw32-clang++

          aarch64-w64-mingw32-clang --version | head -n 3
          arm64ec-w64-mingw32-clang --version | head -n 3

      # ==========================================================
      # 5. Verify AArch64 compiler
      # ==========================================================

      - name: Verify AArch64 compiler
        shell: bash
        run: |
          set -eux

          clang --version
          clang++ --version

          aarch64-linux-gnu-gcc --version | head -n 2
          aarch64-linux-gnu-g++ --version | head -n 2

          cat > /tmp/test-aarch64.c <<'EOF'
          int main(void)
          {
              return 0;
          }
          EOF

          clang \
            --target=aarch64-linux-gnu \
            --gcc-toolchain=/usr \
            -c \
            /tmp/test-aarch64.c \
            -o /tmp/test-aarch64.o

          file /tmp/test-aarch64.o

      # ==========================================================
      # 6. ccache
      # ==========================================================

      - name: Configure ccache
        shell: bash
        run: |
          set -eux

          mkdir -p "$CCACHE_DIR"

          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          ccache --show-config

      # ==========================================================
      # 7. Wine source
      # ==========================================================

      - name: Clone Wine
        shell: bash
        run: |
          set -eux

          rm -rf "$WINE_SOURCE"

          cd /opt

          case "$WINE_BRANCH" in

            vanilla)
              git clone \
                https://github.com/Pipetto-crypto/wine.git \
                "$WINE_SOURCE"
              ;;

            proton9-arm64ec)
              git clone \
                --branch proton-9.0-arm64ec \
                https://github.com/Pipetto-crypto/wine.git \
                "$WINE_SOURCE"
              ;;

            staging)
              git clone \
                https://github.com/afeimod/wine-arm.git \
                "$WINE_SOURCE"
              ;;

            staging-tkg|staging-tkg-fsync)
              git clone \
                https://github.com/Kron4ek/wine-tkg.git \
                "$WINE_SOURCE"
              ;;

            *)
              echo "Unknown Wine branch: $WINE_BRANCH"
              exit 1
              ;;
          esac

          cd "$WINE_SOURCE"

          git fetch --tags || true

          if [ "$WINE_VERSION" != "latest" ]; then

            if git rev-parse "$WINE_VERSION^{commit}" >/dev/null 2>&1; then
              git checkout "$WINE_VERSION"

            elif git rev-parse "wine-$WINE_VERSION^{commit}" >/dev/null 2>&1; then
              git checkout "wine-$WINE_VERSION"

            else
              echo "Wine version not found: $WINE_VERSION"
              exit 1
            fi

          fi

          echo "Wine commit:"
          git rev-parse HEAD

      # ==========================================================
      # 8. FEX source
      # ==========================================================

      - name: Clone FEX
        shell: bash
        run: |
          set -eux

          rm -rf "$FEX_DIR"

          cd /opt

          git clone \
            --recurse-submodules \
            https://github.com/FEX-Emu/FEX.git \
            "$FEX_DIR"

          cd "$FEX_DIR"

          git fetch --tags

          if git rev-parse "$FEX_REF^{commit}" >/dev/null 2>&1; then
            git checkout "$FEX_REF"
          else
            echo "FEX ref not found: $FEX_REF"
            exit 1
          fi

          git submodule sync --recursive
          git submodule update --init --recursive

          echo
          echo "FEX:"
          git rev-parse HEAD

          echo
          echo "FEX submodules:"
          git submodule status --recursive

          echo
          echo "Checking required FEX dependencies..."

          test -f External/rpmalloc/CMakeLists.txt
          test -f External/unordered_dense/CMakeLists.txt
          test -f External/xxhash/cmake_unofficial/CMakeLists.txt
          test -f External/fmt/CMakeLists.txt
          test -f External/range-v3/CMakeLists.txt
          test -f Source/Common/cpp-optparse/CMakeLists.txt

          echo "FEX submodules: OK"

      # ==========================================================
      # 9. Inspect FEX
      # ==========================================================

      - name: Inspect FEX
        shell: bash
        run: |
          set -eux

          cd "$FEX_DIR"

          git describe --tags --always || true
          git rev-parse HEAD

          echo
          echo "FEX pointer checks:"

          grep -R \
            -n \
            -E \
            'CMAKE_SIZEOF_VOID_P|SIZEOF_VOID_P|pointer size' \
            CMakeLists.txt \
            cmake \
            Source \
            2>/dev/null \
            | head -n 100 \
            || true

      # ==========================================================
      # 10. ARM64EC compiler test
      # ==========================================================

      - name: Test ARM64EC compiler
        shell: bash
        run: |
          set -eux

          export PATH="$LLVM_MINGW_DIR/bin:$PATH"

          ARM64EC_CC="$LLVM_MINGW_DIR/bin/arm64ec-w64-mingw32-clang"
          ARM64EC_CXX="$LLVM_MINGW_DIR/bin/arm64ec-w64-mingw32-clang++"

          test -x "$ARM64EC_CC"
          test -x "$ARM64EC_CXX"

          "$ARM64EC_CC" --version
          "$ARM64EC_CXX" --version

          echo
          echo "ARM64EC predefined macros:"

          echo |
            "$ARM64EC_CC" \
              -dM \
              -E \
              -x c \
              - \
            | grep -E \
                '__SIZEOF_POINTER__|__aarch64__|__arm64ec__|_ARM64_|_WIN64' \
            | sort

          cat > /tmp/fex-arm64ec-test.c <<'EOF'
          #include <stdint.h>

          #if __SIZEOF_POINTER__ != 8
          #error "ARM64EC requires 64-bit pointers"
          #endif

          int main(void)
          {
              return sizeof(void *) == 8 ? 0 : 1;
          }
          EOF

          "$ARM64EC_CC" \
            /tmp/fex-arm64ec-test.c \
            -o /tmp/fex-arm64ec-test.exe

          file /tmp/fex-arm64ec-test.exe

      # ==========================================================
      # 11. FEX ARM64EC
      # ==========================================================

      - name: Build FEX ARM64EC
        shell: bash
        run: |
          set -eux

          export PATH="$LLVM_MINGW_DIR/bin:$PATH"

          unset CC
          unset CXX
          unset CMAKE_C_COMPILER_LAUNCHER
          unset CMAKE_CXX_COMPILER_LAUNCHER

          ARM64EC_CC="$LLVM_MINGW_DIR/bin/arm64ec-w64-mingw32-clang"
          ARM64EC_CXX="$LLVM_MINGW_DIR/bin/arm64ec-w64-mingw32-clang++"

          cd "$FEX_DIR"

          rm -rf \
            build-arm64ec \
            install-arm64ec

          mkdir -p build-arm64ec

          cd build-arm64ec

          cmake -GNinja \
            -DCMAKE_C_COMPILER="$ARM64EC_CC" \
            -DCMAKE_CXX_COMPILER="$ARM64EC_CXX" \
            -DCMAKE_ASM_COMPILER="$ARM64EC_CC" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/FEX/install-arm64ec \
            -DCMAKE_INSTALL_LIBDIR=usr/lib \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=ARM64 \
            -DMINGW_TRIPLE=arm64ec-w64-mingw32 \
            -DBUILD_TESTING=False \
            -DENABLE_LTO=False \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
            ../

          grep -E \
            'CMAKE_C_COMPILER:FILEPATH|CMAKE_CXX_COMPILER:FILEPATH|CMAKE_ASM_COMPILER:FILEPATH|CMAKE_SYSTEM_NAME|CMAKE_SYSTEM_PROCESSOR|MINGW_TRIPLE|CMAKE_SIZEOF_VOID_P' \
            CMakeCache.txt \
            || true

          ninja -j"$(nproc)"
          ninja install

      # ==========================================================
      # 12. FEX WOW64
      # ==========================================================

      - name: Build FEX WOW64
        shell: bash
        run: |
          set -eux

          export PATH="$LLVM_MINGW_DIR/bin:$PATH"

          unset CC
          unset CXX
          unset CMAKE_C_COMPILER_LAUNCHER
          unset CMAKE_CXX_COMPILER_LAUNCHER

          WOW64_CC="$LLVM_MINGW_DIR/bin/aarch64-w64-mingw32-clang"
          WOW64_CXX="$LLVM_MINGW_DIR/bin/aarch64-w64-mingw32-clang++"

          test -x "$WOW64_CC"
          test -x "$WOW64_CXX"

          cd "$FEX_DIR"

          rm -rf \
            build-wow64 \
            install-wow64

          mkdir -p build-wow64

          cd build-wow64

          cmake -GNinja \
            -DCMAKE_C_COMPILER="$WOW64_CC" \
            -DCMAKE_CXX_COMPILER="$WOW64_CXX" \
            -DCMAKE_ASM_COMPILER="$WOW64_CC" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/FEX/install-wow64 \
            -DCMAKE_INSTALL_LIBDIR=usr/lib \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=ARM64 \
            -DMINGW_TRIPLE=aarch64-w64-mingw32 \
            -DBUILD_TESTING=False \
            -DENABLE_LTO=False \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
            ../

          grep -E \
            'CMAKE_C_COMPILER:FILEPATH|CMAKE_CXX_COMPILER:FILEPATH|CMAKE_ASM_COMPILER:FILEPATH|CMAKE_SYSTEM_NAME|CMAKE_SYSTEM_PROCESSOR|MINGW_TRIPLE|CMAKE_SIZEOF_VOID_P' \
            CMakeCache.txt \
            || true

          ninja -j"$(nproc)"
          ninja install

      # ==========================================================
      # 13. FEX UnixLib
      # ==========================================================

      - name: Build FEX UnixLib
        shell: bash
        run: |
          set -eux

          cd "$FEX_DIR"

          rm -rf \
            build-unixlib \
            install-unixlib

          mkdir -p build-unixlib

          cd build-unixlib

          cmake -GNinja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu \
            -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu \
            -DCMAKE_C_COMPILER_EXTERNAL_TOOLCHAIN=/usr \
            -DCMAKE_CXX_COMPILER_EXTERNAL_TOOLCHAIN=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/FEX/install-unixlib \
            -DCMAKE_INSTALL_LIBDIR=usr/lib/wine/aarch64-unix \
            -DBUILD_TESTING=False \
            -DENABLE_LTO=False \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
            ../Source/Windows/UnixLib

          ninja -j"$(nproc)"
          ninja install

      # ==========================================================
      # 14. Verify FEX
      # ==========================================================

      - name: Verify FEX
        shell: bash
        run: |
          set -eux

          ARM64EC_DLL="/opt/FEX/install-arm64ec/usr/lib/wine/aarch64-windows/libarm64ecfex.dll"
          WOW64_DLL="/opt/FEX/install-wow64/usr/lib/wine/aarch64-windows/libwow64fex.dll"
          FEX_UNIX="/opt/FEX/install-unixlib/usr/lib/wine/aarch64-unix"

          test -s "$ARM64EC_DLL"
          test -s "$WOW64_DLL"
          test -d "$FEX_UNIX"

          file "$ARM64EC_DLL"
          file "$WOW64_DLL"

          UNIXLIB_COUNT="$(
            find "$FEX_UNIX" \
              -maxdepth 1 \
              -type f \
              \( -name '*.so' -o -name '*.so.*' \) \
              -print \
              | wc -l
          )"

          echo "UnixLib count: $UNIXLIB_COUNT"

          test "$UNIXLIB_COUNT" -gt 0

      # ==========================================================
      # 15. Android compatibility
      # ==========================================================

      - name: Apply Android compatibility patches
        if: env.ANDROID_COMPAT == 'on' || env.ANDROID_COMPAT == 'true'
        shell: bash
        run: |
          set -eux

          cd "$WINE_SOURCE"

          # /tmp -> Termux writable tmp
          find . \
            -type f \
            \( \
              -name '*.c' \
              -o -name '*.h' \
              -o -name '*.in' \
              -o -name '*.spec' \
            \) \
            -print0 \
            | xargs -0 grep -Il '/tmp/' \
            | while read -r f; do
                sed -i \
                  "s#/tmp/#${TERMUX_TMP%/}/#g" \
                  "$f"
              done \
            || true

          # machine-id
          grep -RIl \
            '/etc/machine-id' \
            dlls \
            server \
            programs \
            2>/dev/null \
            | while read -r f; do
                sed -i \
                  "s#/etc/machine-id#${TERMUX_GLIBC_PREFIX}/etc/machine-id#g" \
                  "$f"
              done \
            || true

          # GStreamer typo
          grep -RIl \
            'GstMapInfoInfo' \
            dlls \
            2>/dev/null \
            | while read -r f; do
                sed -i \
                  's/GstMapInfoInfo/GstMapInfo/g' \
                  "$f"
              done \
            || true

          # Memory protection
          grep -RIl \
            'PAGE_READWRITE' \
            dlls/ntdll \
            dlls/kernelbase \
            2>/dev/null \
            | while read -r f; do
                sed -i \
                  's/PAGE_READWRITE/PAGE_EXECUTE_READWRITE/g' \
                  "$f"
              done \
            || true

          # Android low address space
          grep -RIl \
            '0x7fffffff0000' \
            dlls \
            server \
            2>/dev/null \
            | while read -r f; do
                sed -i \
                  's/0x7fffffff0000/0x7fffff0000/g' \
                  "$f"
              done \
            || true

      # ==========================================================
      # 16. Generate Wine configure
      # ==========================================================

      - name: Generate Wine configure
        shell: bash
        run: |
          set -eux

          cd "$WINE_SOURCE"

          if [ -x ./autogen.sh ]; then
            ./autogen.sh
          elif [ ! -x ./configure ]; then
            autoreconf -fi
          fi

          test -x ./configure

      # ==========================================================
      # 17. Native Wine tools
      # ==========================================================

      - name: Build native Wine tools
        shell: bash
        run: |
          set -eux

          rm -rf /opt/wine64-build
          mkdir -p /opt/wine64-build

          cd /opt/wine64-build

          "$WINE_SOURCE/configure" \
            --prefix="$WINE_NATIVE" \
            --enable-win64 \
            --disable-tests \
            --without-wayland

          make -j"$(nproc)"
          make install

          test -d "$WINE_NATIVE"

      # ==========================================================
      # 18. Configure Wine ARM64 WOW64
      # ==========================================================

      - name: Configure Wine ARM64 WOW64
        shell: bash
        run: |
          set -eux

          export PATH="$LLVM_MINGW_DIR/bin:$PATH"

          rm -rf "$WINE_BUILD"
          mkdir -p "$WINE_BUILD"

          cd "$WINE_BUILD"

          EXTRA_ARGS=(
            --without-wayland
          )

          if [ "$PRELOADER" = "off" ] || [ "$PRELOADER" = "false" ]; then
            EXTRA_ARGS+=(
              --disable-preloader
            )
          fi

          export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1
          export PKG_CONFIG_ALLOW_SYSTEM_LIBS=1

          export PKG_CONFIG_PATH="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="/"

          if [ "$BUILD_PROFILE" = "debug" ]; then
            export CFLAGS="-O0 -g"
            export CXXFLAGS="-O0 -g"
          else
            export CFLAGS="-O2"
            export CXXFLAGS="-O2"
          fi

          "$WINE_SOURCE/configure" \
            --prefix="$WINE_INSTALL" \
            --with-mingw=clang \
            --enable-archs=arm64ec,aarch64,i386 \
            --enable-tools \
            --disable-tests \
            --with-vulkan \
            --with-gstreamer \
            --without-wayland \
            --host=aarch64-linux-gnu \
            --build=x86_64-linux-gnu \
            --host_alias=aarch64-linux-gnu \
            --build_alias=x86_64-linux-gnu \
            --with-wine-tools="$WINE_NATIVE" \
            "${EXTRA_ARGS[@]}" \
            CC="ccache aarch64-linux-gnu-gcc"

      # ==========================================================
      # 19. Build Wine
      # ==========================================================

      - name: Build Wine ARM64 WOW64
        shell: bash
        run: |
          set -eux

          export PATH="$LLVM_MINGW_DIR/bin:$PATH"

          cd "$WINE_BUILD"

          make -j"$(nproc)"

      # ==========================================================
      # 20. Install Wine
      # ==========================================================

      - name: Install Wine
        shell: bash
        run: |
          set -eux

          cd "$WINE_BUILD"

          rm -rf "$WINE_INSTALL"

          make install

          test -d "$WINE_INSTALL"

      # ==========================================================
      # 21. Install FEX into Wine
      # ==========================================================

      - name: Install FEX into Wine
        shell: bash
        run: |
          set -eux

          FEX_WIN="$WINE_INSTALL/lib/wine/aarch64-windows"
          FEX_UNIX="$WINE_INSTALL/lib/wine/aarch64-unix"

          mkdir -p "$FEX_WIN"
          mkdir -p "$FEX_UNIX"

          install -Dm644 \
            /opt/FEX/install-wow64/usr/lib/wine/aarch64-windows/libwow64fex.dll \
            "$FEX_WIN/libwow64fex.dll"

          install -Dm644 \
            /opt/FEX/install-arm64ec/usr/lib/wine/aarch64-windows/libarm64ecfex.dll \
            "$FEX_WIN/libarm64ecfex.dll"

          cp -a \
            /opt/FEX/install-unixlib/usr/lib/wine/aarch64-unix/. \
            "$FEX_UNIX/"

          ls -lah "$FEX_WIN"
          find "$FEX_UNIX" \
            -maxdepth 1 \
            -type f \
            -print

      # ==========================================================
      # 22. Verify Wine
      # ==========================================================

      - name: Verify Wine package
        shell: bash
        run: |
          set -eux

          TARGET="$WINE_INSTALL"

          for f in \
            wine \
            wineserver \
            wineboot \
            winecfg \
            regedit
          do
            test -e "$TARGET/bin/$f"
            echo "OK: $TARGET/bin/$f"
            file "$TARGET/bin/$f" || true
          done

          for d in \
            "$TARGET/lib/wine/aarch64-windows" \
            "$TARGET/lib/wine/aarch64-unix" \
            "$TARGET/lib/wine/i386-windows" \
            "$TARGET/lib/wine/x86_64-windows"
          do
            test -d "$d"
            echo "OK: $d"
          done

          FEX_WIN="$TARGET/lib/wine/aarch64-windows"

          test -s "$FEX_WIN/libwow64fex.dll"
          test -s "$FEX_WIN/libarm64ecfex.dll"

          file \
            "$FEX_WIN/libwow64fex.dll" \
            "$FEX_WIN/libarm64ecfex.dll"

          FEX_UNIX="$TARGET/lib/wine/aarch64-unix"

          test -d "$FEX_UNIX"

          UNIXLIB_COUNT="$(
            find "$FEX_UNIX" \
              -maxdepth 1 \
              -type f \
              \( -name '*.so' -o -name '*.so.*' \) \
              -print \
              | wc -l
          )"

          echo "UnixLib count: $UNIXLIB_COUNT"

          test "$UNIXLIB_COUNT" -gt 0

      # ==========================================================
      # 23. Build information
      # ==========================================================

      - name: Generate build information
        shell: bash
        run: |
          set -eux

          cat > "$WINE_INSTALL/BUILD-INFO.txt" <<EOF
          Wine ARM64 WOW64
          =================

          Wine branch:
          $WINE_BRANCH

          Wine requested version:
          $WINE_VERSION

          Wine commit:
          $(cd "$WINE_SOURCE" && git rev-parse HEAD)

          Wine describe:
          $(cd "$WINE_SOURCE" && git describe --tags --always || true)

          FEX requested ref:
          $FEX_REF

          FEX commit:
          $(cd "$FEX_DIR" && git rev-parse HEAD)

          FEX describe:
          $(cd "$FEX_DIR" && git describe --tags --always || true)

          Build profile:
          $BUILD_PROFILE

          Preloader:
          $PRELOADER

          Android compatibility:
          $ANDROID_COMPAT

          Architectures:
          arm64ec,aarch64,i386

          LLVM-MinGW:
          $("$LLVM_MINGW_DIR/bin/clang" --version | head -n 1)

          Termux glibc:
          $TERMUX_GLIBC_PREFIX

          ELF interpreter:
          $TERMUX_GLIBC_PREFIX/lib/ld-linux-aarch64.so.1
          EOF

          cat "$WINE_INSTALL/BUILD-INFO.txt"

      # ==========================================================
      # 24. Final sanity check
      # ==========================================================

      - name: Final sanity check
        shell: bash
        run: |
          set -eux

          test -x "$WINE_INSTALL/bin/wine"
          test -x "$WINE_INSTALL/bin/wineserver"

          test -s \
            "$WINE_INSTALL/lib/wine/aarch64-windows/libwow64fex.dll"

          test -s \
            "$WINE_INSTALL/lib/wine/aarch64-windows/libarm64ecfex.dll"

          test -d \
            "$WINE_INSTALL/lib/wine/aarch64-unix"

          test -f \
            "$WINE_INSTALL/BUILD-INFO.txt"

          echo
          echo "FINAL SANITY CHECK: PASS"

      # ==========================================================
      # 25. Prepare package
      # ==========================================================

      - name: Prepare package
        shell: bash
        run: |
          set -eux

          DATE="$(date -u +%Y%m%d)"

          WINE_COMMIT="$(
            cd "$WINE_SOURCE"
            git rev-parse --short HEAD
          )"

          FEX_COMMIT="$(
            cd "$FEX_DIR"
            git rev-parse --short HEAD
          )"

          PACKAGE_NAME="wine-arm64-wow64-${DATE}-${WINE_COMMIT}-${FEX_COMMIT}"

          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

          rm -rf wine-package

          mkdir -p \
            "wine-package/$PACKAGE_NAME"

          cp -a \
            "$WINE_INSTALL"/. \
            "wine-package/$PACKAGE_NAME/"

          du -sh \
            "wine-package/$PACKAGE_NAME"

      # ==========================================================
      # 26. Tarball
      # ==========================================================

      - name: Create tarball
        shell: bash
        run: |
          set -eux

          tar \
            -cJf \
            "${PACKAGE_NAME}.tar.xz" \
            -C wine-package \
            "$PACKAGE_NAME"

          test -s \
            "${PACKAGE_NAME}.tar.xz"

          ls -lh \
            "${PACKAGE_NAME}.tar.xz"

      # ==========================================================
      # 27. Artifact
      # ==========================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.tar.xz
          compression-level: 0
          retention-days: 30

      # ==========================================================
      # 28. GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PACKAGE_NAME }}
          name: ${{ env.PACKAGE_NAME }}
          files: |
            ${{ env.PACKAGE_NAME }}.tar.xz
          body: |
            # Wine ARM64 WOW64

            ## Wine

            Branch:
            `${{ env.WINE_BRANCH }}`

            Version:
            `${{ env.WINE_VERSION }}`

            ## FEX

            Ref:
            `${{ env.FEX_REF }}`

            Included:

            - libwow64fex.dll
            - libarm64ecfex.dll
            - FEX AArch64 UnixLib

            ## Build

            Profile:
            `${{ env.BUILD_PROFILE }}`

            Preloader:
            `${{ env.PRELOADER }}`

            Android compatibility:
            `${{ env.ANDROID_COMPAT }}`

            ## Runtime

            Target:
            Termux glibc AArch64

            ELF interpreter:

            `/data/data/com.termux/files/usr/glibc/lib/ld-linux-aarch64.so.1`

      # ==========================================================
      # 29. Summary
      # ==========================================================

      - name: Build summary
        shell: bash
        run: |
          set -eux

          echo
          echo "================================================"
          echo "       WINE ARM64 WOW64 BUILD COMPLETE"
          echo "================================================"
          echo
          echo "Package:"
          echo "  ${PACKAGE_NAME}.tar.xz"
          echo
          echo "Wine:"
          echo "  ${WINE_BRANCH}"
          echo
          echo "FEX:"
          echo "  ${FEX_REF}"
          echo
          echo "Android compatibility:"
          echo "  ${ANDROID_COMPAT}"
          echo
          echo "Preloader:"
          echo "  ${PRELOADER}"
          echo
          ls -lh "${PACKAGE_NAME}.tar.xz"
          echo
          echo "================================================"
