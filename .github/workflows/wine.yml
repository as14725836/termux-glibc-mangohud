name: Build Wine ARM64 WOW64 - Termux glibc

on:
  workflow_dispatch:
    inputs:
      wine_branch:
        description: 'Wine 构建类型'
        required: false
        default: 'proton'
        type: choice
        options:
          - proton
          - staging
          - winearm64ec
          - pipetto-proton9-arm64ec
          - proton-10.34-GE
          - proton-gamenative
          - valve-wine
          - valve-proton

      wine_version:
        description: 'Wine 版本，例如 10.20；latest 表示使用源码默认版本'
        required: false
        default: 'latest'
        type: string

      proton_branch:
        description: 'Proton Wine branch'
        required: false
        default: 'proton_11.0'
        type: string

      proton_commit:
        description: 'Proton commit，可留空'
        required: false
        default: ''
        type: string
      gamenative_branch:
        description: 'GameNative proton-wine 分支（wine_branch=proton-gamenative 时生效）'
        required: false
        default: 'proton_11.0-2'
        type: string

      valve_repo:
        description: 'Valve Wine 源码仓库（wine_branch=valve-wine 时生效，可换 fork）'
        required: false
        default: 'https://github.com/ValveSoftware/wine.git'
        type: string

      valve_branch:
        description: 'Valve 源码分支：valve-wine 用 ValveSoftware/wine 的分支（如 proton_10.0）；valve-proton 用 ValveSoftware/Proton 的分支（如 proton_9.0 / proton_10.0）'
        required: false
        default: 'experimental_10.0'
        type: string

      staging_version:
        description: 'Wine-Staging 版本，可留空自动匹配 Wine upstream'
        required: false
        default: ''
        type: string

      enable_39bit_va:
        description: '39-bit VA 适配（ARM64 设备地址空间仅 39 位时必需：降低地址上限 + 收窄高地址区）'
        required: false
        default: true
        type: boolean
      enable_noexec_fallback:
        description: 'noexec 分区兜底（游戏放 /sdcard 时允许只读可执行映射回退 read()；wine>=11 上游已支持）'
        required: false
        default: true
        type: boolean
      enable_wayland:
        description: '启用 Wayland'
        required: false
        default: false
        type: boolean

      enable_dbus:
        description: '启用 DBus'
        required: false
        default: false
        type: boolean

      enable_udev:
        description: '启用 udev'
        required: false
        default: false
        type: boolean

      wine_archs:
        description: 'PE 架构组合：默认 arm64ec,aarch64,i386（ARM64X 混合，跑 x86_64 靠 FEX）；排查问题时可用 aarch64,i386 出纯 ARM64 版做对比'
        required: false
        default: 'arm64ec,aarch64,i386'
        type: string

      llvm_mingw_name:
        description: 'llvm-mingw 资产全名（默认按版本+ubuntu-22.04 生成）。老版本（如 20240917）是 ubuntu-20.04 命名，需要显式给：llvm-mingw-20240917-ucrt-ubuntu-20.04-x86_64'
        required: false
        default: ''
        type: string

      llvm_mingw_repo:
        description: 'llvm-mingw 仓库。arm64ec 构建建议用 bylaws/llvm-mingw（ARM64EC 支持完整）；默认 mstorsjo/llvm-mingw'
        required: false
        default: 'mstorsjo/llvm-mingw'
        type: string

      llvm_mingw_date:
        description: 'llvm-mingw 版本号（默认 20251202）。Proton9 之类的 arm64ec 构建可用 20250920（bylaws），因为新版 lld 会以 "EC version of _load_config_used is missing" 让 wine 的 arm64ec 探测失败'
        required: false
        default: '20251202'
        type: string

      jobs:
        description: '并行编译线程'
        required: false
        default: '8'
        type: string

env:
  LLVMMINGW_REPO: ${{ inputs.llvm_mingw_repo || 'mstorsjo/llvm-mingw' }}
  LLVMMINGW_DATE: ${{ inputs.llvm_mingw_date || '20251202' }}
  LLVMMINGW_NAME: ${{ inputs.llvm_mingw_name || format('llvm-mingw-{0}-ucrt-ubuntu-22.04-x86_64', inputs.llvm_mingw_date || '20251202') }}

  WINE_SOURCE_DIR: /opt/wine-src
  WINE64_DIR: /opt/wine64
  WINE_NATIVE_DIR: /opt/wine64-native

  TERMUX_GLIBC_PREFIX: /data/data/com.termux/files/usr/glibc
  TERMUX_PREFIX: /data/data/com.termux/files/usr
  TERMUX_TMP: /data/data/com.termux/files/usr/tmp

  DEBIAN_FRONTEND: noninteractive

  # 防止 configure 使用 GitHub Actions / runner 上残留的宿主路径
  PKG_CONFIG_ALLOW_CROSS: 1

permissions:
  contents: write

jobs:
  build-wine-wow64:
    runs-on: ubuntu-latest

    container:
      image: debian:12
      options: --user root

    timeout-minutes: 240

    steps:
      # ============================================================
      # 0. 基础环境
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: 安装基础工具
        shell: bash
        run: |
          set -eux

          apt-get update

          apt-get install -y --no-install-recommends \
            ca-certificates \
            wget \
            curl \
            git \
            gnupg \
            xz-utils \
            bzip2 \
            unzip \
            file \
            sudo \
            python3 \
            python3-distutils \
            python3-setuptools \
            build-essential

      # ============================================================
      # 1. Debian Multiarch
      # ============================================================
      - name: 配置 Debian Multiarch
        shell: bash
        run: |
          set -eux

          echo "=== 清理 GitHub runner 不需要的大型目录 ==="

          rm -rf /usr/share/dotnet || true
          rm -rf /opt/ghc || true
          rm -rf /usr/local/share/boost || true

          echo "=== 配置 Debian 12 amd64 + arm64 ==="

          cat > /etc/apt/sources.list <<'EOF'
          deb [arch=amd64] http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb [arch=amd64] http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          deb [arch=amd64] http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware

          deb [arch=arm64] http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb [arch=arm64] http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          deb [arch=arm64] http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

          rm -f /etc/apt/sources.list.d/debian.sources || true

          dpkg --add-architecture arm64

          apt-get update

          echo "=== 测试 ARM64 package ==="

          apt-get install -y --no-install-recommends hello:arm64

          file /usr/bin/hello || true

      # ============================================================
      # 2. Build dependencies
      # ============================================================
      - name: 安装 Wine 编译依赖
        shell: bash
        run: |
          set -eux

          apt-get update

          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext \
            flex \
            bison \
            make \
            cmake \
            ninja-build \
            meson \
            gcc \
            g++ \
            clang \
            llvm \
            lld \
            binutils \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            nasm \
            mingw-w64 \
            python3 \
            python3-setuptools \
            libglib2.0-dev \
            libfreetype6-dev \
            libltdl-dev \
            libxcb1-dev \
            libx11-dev \
            libvulkan-dev \
            librsvg2-bin \
            libglib2.0-dev:arm64 \
            libunwind-dev:arm64 \
            libdbus-1-dev:arm64 \
            libudev-dev:arm64 \
            libvulkan-dev:arm64 \
            libgl-dev:arm64 \
            libdrm-dev:arm64 \
            libepoxy-dev:arm64 \
            libxcb1-dev:arm64 \
            libx11-dev:arm64 \
            libxext-dev:arm64 \
            libxcursor-dev:arm64 \
            libxi-dev:arm64 \
            libxrandr-dev:arm64 \
            libxrender-dev:arm64 \
            libxfixes-dev:arm64 \
            libxcomposite-dev:arm64 \
            libxinerama-dev:arm64 \
            libxxf86vm-dev:arm64 \
            libwayland-dev:arm64 \
            libxkbcommon-dev:arm64 \
            libmpg123-dev:arm64 \
            libopenal-dev:arm64 \
            libfontconfig1-dev:arm64 \
            libfreetype6-dev:arm64 \
            libsdl2-dev:arm64 \
            libasound2-dev:arm64 \
            libpulse-dev:arm64 \
            libgstreamer1.0-dev:arm64 \
            libgstreamer-plugins-base1.0-dev:arm64 \
            libgnutls28-dev:arm64 \
            libgcrypt20-dev:arm64 \
            dpkg-dev \
            fakeroot \
            debhelper \
            dh-make \
            screen \
            nano \
            less

      # ============================================================
      # 3. locales
      # ============================================================
      - name: 配置 Locale
        shell: bash
        run: |
          set -eux

          apt-get install -y locales

          sed -i \
            's/^# *ko_KR.UTF-8 UTF-8/ko_KR.UTF-8 UTF-8/' \
            /etc/locale.gen

          sed -i \
            's/^# *zh_CN.UTF-8 UTF-8/zh_CN.UTF-8 UTF-8/' \
            /etc/locale.gen

          locale-gen

          echo "LANG=ko_KR.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=ko_KR.UTF-8" >> "$GITHUB_ENV"
          echo "LANGUAGE=ko_KR:ko" >> "$GITHUB_ENV"

      # ============================================================
      # 4. llvm-mingw
      # ============================================================
      - name: 安装 llvm-mingw
        shell: bash
        run: |
          set -eux

          mkdir -p /opt

          cd /opt

          wget \
            -q \
            --show-progress \
            "https://github.com/${LLVMMINGW_REPO}/releases/download/${LLVMMINGW_DATE}/${LLVMMINGW_NAME}.tar.xz"

          tar -xJf "${LLVMMINGW_NAME}.tar.xz"

          rm -f "${LLVMMINGW_NAME}.tar.xz"

          echo "/opt/${LLVMMINGW_NAME}/bin" >> "$GITHUB_PATH"

          echo "=== llvm-mingw ==="

          /opt/${LLVMMINGW_NAME}/bin/clang --version || true
          /opt/${LLVMMINGW_NAME}/bin/arm64ec-w64-mingw32-clang --version || true

      # ============================================================
      # 5. Toolchain verification
      # ============================================================
      - name: 验证交叉工具链
        shell: bash
        run: |
          set -eux

          export PATH="/opt/${LLVMMINGW_NAME}/bin:$PATH"

          command -v clang
          command -v clang++
          command -v arm64ec-w64-mingw32-clang || true
          command -v arm64ec-w64-mingw32-clang++ || true
          command -v aarch64-linux-gnu-gcc
          command -v aarch64-linux-gnu-ld

          echo "=== ARM64 compiler ==="

          clang \
            --target=aarch64-linux-gnu \
            --version

          echo "=== ARM64EC compiler ==="

          arm64ec-w64-mingw32-clang --version || true

      # ============================================================
      # 5.5 构建 FEX 模拟器 DLL（Hangover 方案）
      # ============================================================
      - name: 构建 FEX 模拟器 DLL (arm64ecfex + wow64fex)
        shell: bash
        run: |
          set -eux

          # ---------- 1) bylaws llvm-mingw（FEX 的 PE 交叉工具链）----------
          FEX_LLVMMINGW_TAG="20250920"
          FEX_LLVMMINGW_NAME="llvm-mingw-${FEX_LLVMMINGW_TAG}-ucrt-ubuntu-22.04-x86_64"
          FEX_LLVMMINGW_DIR="/opt/${FEX_LLVMMINGW_NAME}"

          if [ ! -d "${FEX_LLVMMINGW_DIR}" ]; then
            cd /opt
            wget -q --show-progress \
              "https://github.com/bylaws/llvm-mingw/releases/download/${FEX_LLVMMINGW_TAG}/${FEX_LLVMMINGW_NAME}.tar.xz"
            tar -xJf "${FEX_LLVMMINGW_NAME}.tar.xz"
            rm -f "${FEX_LLVMMINGW_NAME}.tar.xz"
          fi

          export PATH="${FEX_LLVMMINGW_DIR}/bin:${PATH}"

          echo "=== FEX 交叉工具链检查 ==="

          for T in \
            arm64ec-w64-mingw32-clang \
            arm64ec-w64-mingw32-clang++ \
            arm64ec-w64-mingw32-dlltool \
            aarch64-w64-mingw32-clang \
            aarch64-w64-mingw32-clang++ \
            aarch64-w64-mingw32-dlltool
          do
            printf '%-38s ' "${T}"
            command -v "${T}" || echo MISSING
          done

          # ---------- 2) FEX 源码（Hangover 使用的 arm64ec 分支）----------
          rm -rf /opt/fex-src

          git clone \
            --depth=1 \
            --branch arm64ec \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/AndreRH/FEX.git \
            /opt/fex-src

          cd /opt/fex-src

          git log -1 --oneline || true

          # ---- [Termux patch] FEX stats 文件改到 /data/data/com.termux/files/usr/tmp（不再用 /dev/shm）----
          python3 "${GITHUB_WORKSPACE}/patches/fex/termux-shm-dir.py" /opt/fex-src

          # ---- [termux-align] wine <-> libwow64fex WOW64 bridge interface alignment ----
          if [ -f "${GITHUB_WORKSPACE}/patches/fex/wow64-bridge-bytes.py" ]; then
            python3 "${GITHUB_WORKSPACE}/patches/fex/wow64-bridge-bytes.py" /opt/fex-src \
              && echo "OK: wow64 bridge interface alignment patch applied" \
              || echo "WARN: wow64 bridge alignment patch not applied (FEX layout changed?)"
          fi

          JOBS="${{ inputs.jobs || 8 }}"

          # ---------- 3) x86_64 模拟：libarm64ecfex.dll ----------
          rm -rf build_ec

          mkdir -p build_ec

          cd build_ec

          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=../Data/CMake/toolchain_mingw.cmake \
            -DENABLE_LTO=False \
            -DENABLE_ASSERTIONS=False \
            -DTUNE_ARCH=generic \
            -DTUNE_CPU=none \
            -DMINGW_TRIPLE=arm64ec-w64-mingw32 \
            -DBUILD_TESTS=OFF \
            -DBUILD_TESTING=OFF \
            ..

          make -j"${JOBS}" arm64ecfex

          test -f Bin/libarm64ecfex.dll

          ls -lh Bin/libarm64ecfex.dll

          # ---- 体积：完整移除 COFF 符号表（Wine 只按导出表加载 DLL） ----
          SZ_B=$(stat -c%s Bin/libarm64ecfex.dll)
          llvm-strip --strip-all Bin/libarm64ecfex.dll || echo "⚠ llvm-strip 失败，保留未剥离版本"
          echo "strip(COFF 符号表): ${SZ_B} -> $(stat -c%s Bin/libarm64ecfex.dll) bytes"
          echo -n "       .debug_* 段数 = "
          llvm-objdump --section-headers Bin/libarm64ecfex.dll 2>/dev/null | grep -c '\.debug_' || true
          ls -lh Bin/libarm64ecfex.dll

          cd ..

          # ---------- 4) i386 模拟：libwow64fex.dll ----------
          rm -rf build_pe

          mkdir -p build_pe

          cd build_pe

          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=../Data/CMake/toolchain_mingw.cmake \
            -DENABLE_LTO=False \
            -DENABLE_ASSERTIONS=False \
            -DTUNE_ARCH=generic \
            -DTUNE_CPU=none \
            -DMINGW_TRIPLE=aarch64-w64-mingw32 \
            -DBUILD_TESTS=OFF \
            -DBUILD_TESTING=OFF \
            ..

          make -j"${JOBS}" wow64fex

          test -f Bin/libwow64fex.dll

          ls -lh Bin/libwow64fex.dll

          # ---- 体积：完整移除 COFF 符号表（Wine 只按导出表加载 DLL） ----
          SZ_B=$(stat -c%s Bin/libwow64fex.dll)
          llvm-strip --strip-all Bin/libwow64fex.dll || echo "⚠ llvm-strip 失败，保留未剥离版本"
          echo "strip(COFF 符号表): ${SZ_B} -> $(stat -c%s Bin/libwow64fex.dll) bytes"
          echo -n "       .debug_* 段数 = "
          llvm-objdump --section-headers Bin/libwow64fex.dll 2>/dev/null | grep -c '\.debug_' || true
          ls -lh Bin/libwow64fex.dll

          echo "=== FEX 产物汇总 ==="

          ls -lh \
            /opt/fex-src/build_ec/Bin/libarm64ecfex.dll \
            /opt/fex-src/build_pe/Bin/libwow64fex.dll

      # ============================================================
      # 6. 获取 Wine / Proton / Staging 源码
      # ============================================================
      - name: 获取 Wine 源码
        shell: bash
        env:
          INPUT_WINE_BRANCH: ${{ inputs.wine_branch }}
          INPUT_WINE_VERSION: ${{ inputs.wine_version }}
          INPUT_PROTON_BRANCH: ${{ inputs.proton_branch }}
          INPUT_GN_BRANCH: ${{ inputs.gamenative_branch }}
          INPUT_VALVE_REPO: ${{ inputs.valve_repo }}
          INPUT_VALVE_BRANCH: ${{ inputs.valve_branch }}
          INPUT_PROTON_COMMIT: ${{ inputs.proton_commit }}
          INPUT_STAGING_VERSION: ${{ inputs.staging_version }}
        run: |
          set -eux

          rm -rf "${WINE_SOURCE_DIR}"

          mkdir -p "${WINE_SOURCE_DIR}"

          cd "${WINE_SOURCE_DIR}"

          BUILD_TYPE="${INPUT_WINE_BRANCH:-proton}"
          WINE_VERSION="${INPUT_WINE_VERSION:-latest}"

          echo "============================================"
          echo "Build type       : ${BUILD_TYPE}"
          echo "Wine version     : ${WINE_VERSION}"
          echo "Proton branch    : ${INPUT_PROTON_BRANCH}"
          echo "Proton commit    : ${INPUT_PROTON_COMMIT}"
          echo "Staging version  : ${INPUT_STAGING_VERSION}"
          echo "============================================"

          case "${BUILD_TYPE}" in
            proton)
              echo "=== Proton Wine ==="

              PROTON_BRANCH="${INPUT_PROTON_BRANCH:-proton_11.0}"

              git clone \
                --branch "${PROTON_BRANCH}" \
                --single-branch \
                https://github.com/WinNative-Emu/proton-wine.git \
                source

              cd source

              git config advice.detachedHead false

              if [ -n "${INPUT_PROTON_COMMIT}" ]; then
                echo "Checking out Proton commit ${INPUT_PROTON_COMMIT}"

                git fetch \
                  --depth=1 \
                  origin \
                  "${INPUT_PROTON_COMMIT}"

                git checkout "${INPUT_PROTON_COMMIT}"
              fi
              ;;

            staging)
              echo "=== Wine Staging ==="

              mkdir -p staging-source

              cd staging-source

              git clone \
                --depth=1 \
                https://github.com/wine-staging/wine-staging.git \
                staging

              cd staging

              STAGING_HEAD="$(git rev-parse HEAD)"

              echo "Wine-Staging HEAD: ${STAGING_HEAD}"

              if [ -n "${INPUT_STAGING_VERSION}" ]; then
                git fetch \
                  --tags \
                  --depth=1 \
                  origin \
                  "v${INPUT_STAGING_VERSION}"

                git checkout \
                  "v${INPUT_STAGING_VERSION}"
              fi

              if [ -f staging/upstream-commit ]; then
                UPSTREAM_COMMIT="$(cat staging/upstream-commit | tr -d '[:space:]')"

                echo "Required Wine upstream commit:"
                echo "${UPSTREAM_COMMIT}"

                cd ..

                git clone \
                  https://github.com/wine-mirror/wine.git \
                  source

                cd source

                git fetch \
                  --depth=1 \
                  origin \
                  "${UPSTREAM_COMMIT}"

                git checkout "${UPSTREAM_COMMIT}"

                git config advice.detachedHead false

                echo "=== Apply Wine-Staging patchset ==="

                python3 \
                  ../staging/staging/patchinstall.py \
                  DESTDIR="$PWD" \
                  --all \
                  --no-autoconf

                cd "$WINE_SOURCE_DIR"
                ln -sfn staging-source/source source
                echo "staging 源码布局对齐: $(ls -ld "$WINE_SOURCE_DIR/source") -> $(readlink -f "$WINE_SOURCE_DIR/source")"
              else
                echo "ERROR: staging/upstream-commit not found"
                exit 1
              fi
              ;;

            pipetto-proton9-arm64ec)
              echo "=== Pipetto wine (proton-9.0-arm64ec, Wine 9.0 内核 + arm64ec) ==="

              git clone \
                --branch proton-9.0-arm64ec \
                --single-branch \
                https://github.com/Pipetto-crypto/wine.git \
                source

              cd source

              git config advice.detachedHead false

              echo "Pipetto wine HEAD: $(git rev-parse --short HEAD)"
              ;;

            proton-10.34-GE)
              echo "=== The412Banner proton-wine (proton_10.34-GE, GameNative 血脉) ==="

              GE_REPO="https://github.com/The412Banner/proton-wine.git"
              GE_BRANCH="proton_10.34-GE"

              git clone \
                --branch "${GE_BRANCH}" \
                --single-branch \
                "${GE_REPO}" \
                source

              cd source

              git config advice.detachedHead false

              if [ -n "${INPUT_PROTON_COMMIT}" ]; then
                echo "Checking out commit ${INPUT_PROTON_COMMIT}"

                git fetch \
                  --depth=1 \
                  origin \
                  "${INPUT_PROTON_COMMIT}" || true

                git checkout "${INPUT_PROTON_COMMIT}"
              fi

              echo "proton-wine(${GE_BRANCH}) HEAD: $(git rev-parse --short HEAD)"
              ;;
            valve-wine)
              echo "=== ValveSoftware/wine (Valve 官方 wine 树) ==="

              VALVE_REPO="${INPUT_VALVE_REPO:-https://github.com/ValveSoftware/wine.git}"
              VALVE_BRANCH="${INPUT_VALVE_BRANCH:-experimental_10.0}"

              echo "Valve repo   : ${VALVE_REPO}"
              echo "Valve branch : ${VALVE_BRANCH}"

              git clone \
                --branch "${VALVE_BRANCH}" \
                --single-branch \
                "${VALVE_REPO}" \
                source

              cd source

              git config advice.detachedHead false

              if [ -n "${INPUT_PROTON_COMMIT}" ]; then
                echo "Checking out commit ${INPUT_PROTON_COMMIT}"

                git fetch \
                  --depth=1 \
                  origin \
                  "${INPUT_PROTON_COMMIT}" || true

                git checkout "${INPUT_PROTON_COMMIT}"
              fi

              echo "Valve wine(${VALVE_BRANCH}) HEAD: $(git rev-parse --short HEAD)"
              echo "WINE_SRC_REPO=${VALVE_REPO}" >> "$GITHUB_ENV"
              echo "WINE_SRC_BRANCH=${VALVE_BRANCH}" >> "$GITHUB_ENV"
              ;;
            valve-proton)
              echo "=== ValveSoftware/Proton（Proton 仓库：wine 源码在其 wine/ 子模块）==="

              VALVE_REPO="${INPUT_VALVE_REPO:-}"
              case "${VALVE_REPO}" in
                *Proton*) : ;;
                *) VALVE_REPO="https://github.com/ValveSoftware/Proton.git" ;;
              esac
              VALVE_BRANCH="${INPUT_VALVE_BRANCH:-proton_9.0}"

              echo "Proton repo   : ${VALVE_REPO}"
              echo "Proton branch : ${VALVE_BRANCH}"

              git clone \
                --branch "${VALVE_BRANCH}" \
                --single-branch \
                --depth=1 \
                "${VALVE_REPO}" \
                proton-repo

              ( cd proton-repo && git submodule update --init --depth 1 wine )

              PROTON_ROOT="$(pwd)/proton-repo"

              if [ ! -f "${PROTON_ROOT}/wine/configure.ac" ] && [ ! -f "${PROTON_ROOT}/wine/configure" ]; then
                echo "❌ Proton 仓库里没有取到 wine/ 子模块，proton-repo 内容："
                ls -la "${PROTON_ROOT}" | head -30 || true
                exit 1
              fi

              rm -rf source
              mv "${PROTON_ROOT}/wine" source

              if [ -d "${PROTON_ROOT}/.git/modules/wine" ]; then
                printf 'gitdir: %s\n' "${PROTON_ROOT}/.git/modules/wine" > source/.git
                git -C source config core.worktree "$(pwd)/source" || true
              fi

              if ! git -C source rev-parse --short HEAD >/dev/null 2>&1; then
                echo "⚠️ source/ 不是有效 git 仓库，重新 init（后续 git apply 仍可用）"
                rm -f source/.git
                ( cd source && git init -q && git add -A >/dev/null 2>&1 && \
                  git -c user.email=ci@local -c user.name=ci commit -qm "wine from Proton ${VALVE_BRANCH}" ) || true
              fi

              cd source

              git config advice.detachedHead false || true

              if [ -n "${INPUT_PROTON_COMMIT}" ]; then
                echo "Checking out commit ${INPUT_PROTON_COMMIT}"
                git fetch --depth=1 origin "${INPUT_PROTON_COMMIT}" || true
                git checkout "${INPUT_PROTON_COMMIT}" || true
              fi

              echo "Proton wine(${VALVE_BRANCH}) HEAD: $(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
              echo "WINE_SRC_REPO=${VALVE_REPO}" >> "$GITHUB_ENV"
              echo "WINE_SRC_BRANCH=${VALVE_BRANCH}" >> "$GITHUB_ENV"
              ;;
            proton-gamenative)
              echo "=== GameNative/proton-wine ==="
              GN_REPO="https://github.com/GameNative/proton-wine.git"
              GN_BRANCH="${INPUT_GN_BRANCH:-proton_11.0-2}"
              git clone \
                --branch "${GN_BRANCH}" \
                --single-branch \
                "${GN_REPO}" \
                source
              cd source

              git config advice.detachedHead false
              if [ -n "${INPUT_PROTON_COMMIT}" ]; then
                echo "Checking out commit ${INPUT_PROTON_COMMIT}"
                git fetch \
                  --depth=1 \
                  origin \
                  "${INPUT_PROTON_COMMIT}" || true

                git checkout "${INPUT_PROTON_COMMIT}"
              fi
              echo "GameNative proton-wine(${GN_BRANCH}) HEAD: $(git rev-parse --short HEAD)"
              ;;

            winearm64ec)
              echo "=== Wine ARM64EC / wine-tkg ==="

              git clone \
                -b wow641010 \
                https://github.com/hostei33/wine-tkg.git \
                source

              cd source

              git config advice.detachedHead false

              if [ "${WINE_VERSION}" != "latest" ]; then
                git fetch --tags

                git checkout \
                  "wine-${WINE_VERSION}"
              fi
              ;;

            *)
              echo "ERROR: Unknown wine_branch=${BUILD_TYPE}"
              exit 1
              ;;
          esac

          cd "${WINE_SOURCE_DIR}/source"

          echo "=== Wine source information ==="

          git remote -v || true
          git status --short || true

          COMMIT_HASH="$(git rev-parse --short HEAD)"

          if [ -f VERSION ]; then
            WINE_VERSION_ACTUAL="$(cat VERSION)"
          else
            WINE_VERSION_ACTUAL="$(git describe --tags --always --dirty 2>/dev/null || echo unknown)"
          fi

          # 【修复】VERSION 文件里是 "Wine version 11.0" 这种带空格/大写的字符串，
          # 直接拼进 BUILD_NAME 会生成带空格的 tag，GitHub 拒绝：
          #   tag_name is not a valid tag / tag_name is not well-formed
          # 所以做一个"可用于 tag/文件名"的净化版本：
          #   去掉 "Wine version " 前缀 → 空格转 - → 只留 [A-Za-z0-9._-]
          VER_SAFE="$(printf '%s' "${WINE_VERSION_ACTUAL}" \
            | sed -E 's/^[Ww]ine[ -]?version[ -]?//' \
            | sed -E 's/^[Ww]ine[ -]?//' \
            | sed -E 's/^v//' \
            | tr ' ' '-' \
            | tr -cd 'A-Za-z0-9._-')"
          [ -n "${VER_SAFE}" ] || VER_SAFE="unknown"

          echo "WINE_VERSION_ACTUAL = ${WINE_VERSION_ACTUAL}"
          echo "VER_SAFE            = ${VER_SAFE}"

          BUILD_NAME="wine-${VER_SAFE}-${COMMIT_HASH}-${BUILD_TYPE}-arm64ce-wow64"

          # 统一写入 GITHUB_ENV，后续所有步骤（BUILD_INFO / tar / artifact / release）都从这里取
          {
            echo "BUILD_NAME=${BUILD_NAME}"
            echo "WINE_VERSION_ACTUAL=${WINE_VERSION_ACTUAL}"
            echo "WINE_COMMIT=${COMMIT_HASH}"
            echo "VER_SAFE=${VER_SAFE}"
            echo "BUILD_TYPE=${BUILD_TYPE}"
          } >> "$GITHUB_ENV"

          echo "BUILD_NAME=${BUILD_NAME}"
          echo "WINE_VERSION_ACTUAL=${WINE_VERSION_ACTUAL}"
          echo "WINE_COMMIT=${COMMIT_HASH}"
          echo "VER_SAFE=${VER_SAFE}"
          echo "BUILD_TYPE=${BUILD_TYPE}"

      # ============================================================
      # 6.1 初始化子模块 + 剪除缺失组件的 WINE_CONFIG_MAKEFILE
      # ============================================================
      - name: 初始化子模块 + 剪除缺失的 WINE_CONFIG_MAKEFILE
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source"

          if [ -f .gitmodules ]; then
            echo "=== .gitmodules ==="
            cat .gitmodules || true
            echo "=== 初始化子模块 ==="
            git submodule sync --recursive || true
            if git submodule update --init --recursive; then
              echo "OK: 子模块已初始化"
            else
              echo "WARN: 子模块初始化失败（下面用剪除兜底）"
            fi
          else
            echo "无 .gitmodules，跳过子模块初始化"
          fi

          for d in dlls/winedirectaudio.drv; do
            if [ -f "${d}/Makefile.in" ]; then
              echo "OK: ${d}/Makefile.in 存在（子模块已就位）"
              continue
            fi
            echo "MISS: ${d}/Makefile.in 缺失 -> 注释掉对应 WINE_CONFIG_MAKEFILE"
            n="$(grep -n "WINE_CONFIG_MAKEFILE(${d})" configure.ac | sed -n '1p' | cut -d: -f1 || true)"
            if [ -n "${n}" ]; then
              sed -i "${n}s|^|# [CI] 组件缺失，已跳过: |" configure.ac
              echo "  已注释 configure.ac 第 ${n} 行"
            else
              echo "  未找到 WINE_CONFIG_MAKEFILE(${d})"
            fi
            sed -i 's|^enable_winedirectaudio_drv=${enable_winedirectaudio_drv:-yes}|enable_winedirectaudio_drv=${enable_winedirectaudio_drv:-no}|' configure.ac || true
          done


          echo "=== 子模块目录抽查 ==="
          for d in dlls/winedirectaudio.drv; do
            if [ -d "${d}" ]; then
              echo "  ${d}: $(ls -A "${d}" | tr '\n' ' ')"
            else
              echo "  ${d}: 目录不存在"
            fi
          done

      # ============================================================
      # 6.2 修复 wineboot.c：aarch64 分支缺 initialize_xstate_features
      # ============================================================
      - name: 修复 wineboot.c (aarch64 缺 initialize_xstate_features)
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source"

          F="programs/wineboot/wineboot.c"
          if [ ! -f "${F}" ]; then
            echo "无 ${F}，跳过"
            exit 0
          fi

          if ! grep -q 'initialize_xstate_features' "${F}"; then
            echo "该树未使用 initialize_xstate_features，跳过"
            exit 0
          fi

          if awk '/#elif defined\(__aarch64__\)/{f=1} /^#else/{f=0} f && /static void initialize_xstate_features/{found=1} END{exit(found?0:1)}' "${F}"; then
            echo "aarch64 分支内已有 initialize_xstate_features，跳过"
            exit 0
          fi

          if ! grep -q -E '^[[:space:]]*#elif defined\(__aarch64__\)' "${F}"; then
            echo "该树 wineboot.c 无 #elif defined(__aarch64__) 锚点，跳过（无需修复）"
            grep -n -E 'initialize_xstate_features|__aarch64__|^#else' "${F}" | head -8 || true
            exit 0
          fi
          echo "=== 修改前：aarch64 分支 ==="
          awk '/#elif defined\(__aarch64__\)/{f=1} /^#else/{f=0} f{print}' "${F}" | sed -n '1,14p' || true

          before_md5="$(md5sum "${F}" | cut -d' ' -f1)"

          perl -0pi -e 's/(#elif defined\(__aarch64__\)\n)/$1static void initialize_xstate_features( struct _KUSER_SHARED_DATA *data )\n{\n    (void)data;\n}\n\n/' "${F}"

          after_md5="$(md5sum "${F}" | cut -d' ' -f1)"
          if [ "${before_md5}" = "${after_md5}" ]; then
            echo "WARN: 锚点未命中、文件未改动 → 跳过（不视为失败）"
            exit 0
          fi

          echo "=== 修改后：aarch64 分支 ==="
          awk '/#elif defined\(__aarch64__\)/{f=1} /^#else/{f=0} f{print}' "${F}" | sed -n '1,18p' || true

          if awk '/#elif defined\(__aarch64__\)/{f=1} /^#else/{f=0} f && /static void initialize_xstate_features/{found=1} END{exit(found?0:1)}' "${F}"; then
            echo "OK: aarch64 分支内已补上 initialize_xstate_features 空实现"
          else
            echo "FAIL: aarch64 分支内未发现定义"
            exit 1
          fi

          echo "=== 行号核对（elif aarch64 / 空实现 / #else）==="
          grep -n -E '#elif defined\(__aarch64__\)|^#else|static void initialize_xstate_features' "${F}" | tail -6 || true

      # ============================================================
      # 7. Wine source preparation
      # ============================================================
      - name: Wine source preparation
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source"

          chmod +x autogen.sh || true

          if [ ! -f configure ]; then
            ./autogen.sh
          fi

          if [ -x dlls/winevulkan/make_vulkan ]; then
            dlls/winevulkan/make_vulkan || true
          fi

          if [ -x tools/make_requests ]; then
            tools/make_requests || true
          fi

          if [ -x tools/make_specfiles ]; then
            tools/make_specfiles || true
          fi

      # ============================================================
      - name: 应用 adapted-11.18 补丁 (quartz colour / qasf asf / termux-dns)
        shell: bash
        run: |
          cd "${WINE_SOURCE_DIR}/source" || { echo 'no wine source dir'; exit 0; }
          for _up in 0060-quartz-implement-colour-filter.patch \
                     0061-qasf-deliver-compressed-asf-streams.patch \
                     termux-dns-fix.patch; do
            _u="${GITHUB_WORKSPACE:-$PWD}/patches/adapted-11.18/$_up"
            [ -f "$_u" ] || _u="/tmp/wine-termux/$_up"
            if [ ! -f "$_u" ]; then
              mkdir -p /tmp/wine-termux
              curl -fsSL -o "$_u" "https://raw.githubusercontent.com/as14725836/wine-termux/main/$_up" \
                || wget -q -O "$_u" "https://raw.githubusercontent.com/as14725836/wine-termux/main/$_up" \
                || { echo "WARN: adapted 补丁下载失败，跳过 $_up"; continue; }
            fi
            _out="$(patch -p1 --batch --dry-run --forward --no-backup-if-mismatch < "$_u" 2>&1)" || true
            if echo "$_out" | grep -qE 'FAILED|hunk ignored|can.t find file'; then
              echo "SKIP: $_up 与当前源码不兼容（hunk 打不上）→ 跳过"
              echo "$_out" | grep -E 'FAILED|hunk ignored' | head -3 || true
            elif patch -p1 --batch --forward --no-backup-if-mismatch < "$_u" >/dev/null 2>&1; then
              echo "OK  : $_up 已应用"
            else
              echo "SKIP: $_up 应用失败 → 跳过"
            fi
          done
          echo "adapted-11.18 self-check: colour.c=$(ls dlls/quartz/colour.c 2>/dev/null || echo MISSING) dns=$(grep -c init_dns_config dlls/ntdll/unix/loader.c 2>/dev/null || echo 0)"
          if find . -name '*.rej' | head -1 | grep -q .; then echo 'WARN: 存在 .rej 文件:'; find . -name '*.rej' | head -5; fi

      # ============================================================
      # 7.5 mfplat 补丁（wine_do_not_create_dxgi_device_manager2，仅 staging）
      # ============================================================
      - name: Apply mfplat DXGI / MPEG4 handler patch (staging only)
        if: ${{ inputs.wine_branch == 'staging' }}
        shell: bash
        run: |
          # 只对 staging 源码分支应用 wine_do_not_create_dxgi_device_manager2 补丁
          BR="${{ inputs.wine_branch || 'proton' }}"
          if [ "$BR" != "staging" ]; then
            echo "staging-only patch: current wine_branch='$BR' -> skip"
            exit 0
          fi

          cd "${WINE_SOURCE_DIR}/source" || { echo 'no wine source dir'; exit 0; }

          _UP="wine_do_not_create_dxgi_device_manager2.patch"
          _u="${GITHUB_WORKSPACE:-$PWD}/patches/staging/$_UP"
          [ -f "$_u" ] || _u="/tmp/wine-termux/$_UP"
          if [ ! -f "$_u" ]; then
            mkdir -p /tmp/wine-termux
            curl -fsSL -o "$_u" "https://raw.githubusercontent.com/as14725836/wine-termux/main/$_UP" \
              || wget -q -O "$_u" "https://raw.githubusercontent.com/as14725836/wine-termux/main/$_UP" \
              || { echo "WARN: $_UP 下载失败，跳过"; exit 0; }
          fi

          if grep -q 'WINE_DO_NOT_CREATE_DXGI_DEVICE_MANAGER' dlls/mfplat/main.c 2>/dev/null; then
            echo "OK(already): dlls/mfplat/main.c 已含 WINE_DO_NOT_CREATE_DXGI_DEVICE_MANAGER"
            exit 0
          fi

          _out="$(patch -p1 --batch --dry-run --forward --no-backup-if-mismatch < "$_u" 2>&1)" || true
          if echo "$_out" | grep -qE 'FAILED|hunk ignored|can.t find file'; then
            echo "SKIP: $_UP 与当前源码不兼容"
            echo "$_out" | grep -E 'FAILED|hunk ignored' | head -5 || true
          elif patch -p1 --batch --forward --no-backup-if-mismatch < "$_u" >/dev/null 2>&1; then
            echo "OK  : $_UP 已应用"
          else
            echo "SKIP: $_UP 应用失败"
          fi

          echo "mfplat self-check: dxgi_env=$(grep -c 'WINE_DO_NOT_CREATE_DXGI_DEVICE_MANAGER' dlls/mfplat/main.c 2>/dev/null || echo 0) default_handler=$(grep -c 'resolver_create_default_handler' dlls/mfplat/main.c 2>/dev/null || echo 0) mfinternal_inc=$(grep -c 'wine/mfinternal.h' dlls/mfplat/main.c 2>/dev/null || echo 0) idl_guid=$(grep -c 'CLSID_MPEG4ByteStreamHandlerPlugin' include/wine/mfinternal.idl 2>/dev/null || echo 0)"
          if find . -name '*.rej' | head -1 | grep -q .; then echo 'WARN: 存在 .rej 文件:'; find . -name '*.rej' | head -5; fi

      # ============================================================
      # 7.6 wow64 完善补丁（HODLL/HODLL64、Wow64SuspendLocalThread、32位地址检查、XState）
      # ============================================================
      - name: wow64 completion patches (HODLL / SuspendLocalThread / relax / XState)
        shell: bash
        run: |
          cd "${WINE_SOURCE_DIR}/source" || { echo 'no wine source dir'; exit 0; }

          _u="/tmp/wine-termux/wow64-completion.py"
          mkdir -p /tmp/wine-termux
          curl -fsSL --retry 2 -o "$_u" "https://raw.githubusercontent.com/as14725836/termux-glibc-mangohud/main/patches/wow64/wow64-completion.py" \
            || wget -q -O "$_u" "https://raw.githubusercontent.com/as14725836/termux-glibc-mangohud/main/patches/wow64/wow64-completion.py" \
            || true
          if [ ! -s "$_u" ]; then
            _u="${GITHUB_WORKSPACE:-$PWD}/patches/wow64/wow64-completion.py"
            [ -f "$_u" ] || { echo "WARN: wow64-completion.py 不可用，跳过"; exit 0; }
          fi

          python3 "$_u" "$(pwd)" || echo "WARN: wow64 完善补丁部分失败（不阻断构建）"

          echo "wow64 self-check: hodll=$(grep -c 'HODLL' dlls/wow64/syscall.c 2>/dev/null || echo 0) suspend=$(grep -c 'Wow64SuspendLocalThread' dlls/wow64/syscall.c 2>/dev/null || echo 0) relax_left=$(grep -c '> highest_user_address + 1' dlls/wow64/virtual.c 2>/dev/null || echo 0) xstate=$(grep -c 'initialize_xstate_features' programs/wineboot/wineboot.c 2>/dev/null || echo 0)"

        
      # ============================================================
      # 8. Termux compatibility patches
      # ============================================================
      - name: Termux compatibility patches
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source"

          echo "============================================"
          echo "Applying Termux patches"
          echo "============================================"

          TERMUX_TMP="${TERMUX_TMP}"

          for FILE in \
            server/file.c \
            server/server.c \
            server/request.c \
            loader/loader.c \
            dlls/ntdll/loader.c \
            dlls/ntdll/unix/server.c \
            dlls/ntdll/unix/virtual.c
          do
            if [ -f "$FILE" ]; then
              echo "Patching tmp path: $FILE"

              sed -i \
                "s|\"/tmp\"|\"${TERMUX_TMP}\"|g" \
                "$FILE"

              sed -i \
                "s|/tmp/|${TERMUX_TMP}/|g" \
                "$FILE"
            fi
          done

          if grep -rn '"/tmp/\.wine-' server/request.c dlls/ntdll/unix/server.c 2>/dev/null; then
            echo "FATAL: /tmp/.wine- 仍然存在，socket 目录没有改到 Termux tmp"
            exit 1
          fi

          grep -n 'usr/tmp/\.wine-' server/request.c dlls/ntdll/unix/server.c 2>/dev/null || \
            { echo "FATAL: 没找到 Termux tmp 版 socket 路径"; exit 1; }

          echo "=== socket 目录现在的写法 ==="

          grep -n 'wine-' server/request.c | head -3 || true
          grep -n 'wine-' dlls/ntdll/unix/server.c | head -3 || true

          if [ -f loader/wine.inf.in ]; then
            sed -i \
              's/"xtajit64\.dll"/"libarm64ecfex.dll"/g' \
              loader/wine.inf.in

            sed -i \
              's/"xtajit\.dll"/"libwow64fex.dll"/g' \
              loader/wine.inf.in
          fi

          if [ -f dlls/ntdll/loader.c ]; then
            sed -i \
              's/xtajit64\.dll/libarm64ecfex.dll/g' \
              dlls/ntdll/loader.c

            sed -i \
              's/xtajit\.dll/libwow64fex.dll/g' \
              dlls/ntdll/loader.c
          fi

          find . -path ./.git -prune -o \
            -type f \
            \( -name "*.c" -o -name "*.h" \) \
            -print0 |
          { xargs -0 -r sed -i \
            's/xtajit64\.dll/libarm64ecfex.dll/g'; } || true

          find . -path ./.git -prune -o \
            -type f \
            \( -name "*.c" -o -name "*.h" \) \
            -print0 |
          { xargs -0 -r sed -i \
            's/xtajit\.dll/libwow64fex.dll/g'; } || true

          find dlls/ntdll \
            -type f \
            \( -name "*.c" -o -name "*.h" \) \
            -print0 |
          xargs -0 -r sed -i \
            's|x86_64-windows|aarch64-windows|g'

          FILE_WDSCORE="dlls/wdscore/wdscore.spec"

          if [ -f "${FILE_WDSCORE}" ]; then
            echo "Checking wdscore.spec"

            grep -n -C 2 'CDynamicArray' \
              "${FILE_WDSCORE}" || true

            if grep -q '@ stub' "${FILE_WDSCORE}"; then
              sed -i '/CDynamicArray/d' \
                "${FILE_WDSCORE}"

              echo "wdscore workaround applied"
            fi
          fi

          FILE_VIRTUAL="dlls/ntdll/unix/virtual.c"

          if [ -f "${FILE_VIRTUAL}" ]; then
            echo "Patching virtual.c"

            sed -i \
              's/HandleToULong( pbi.UniqueProcessId )/HandleToULong( (void *)(ULONG_PTR)pbi.UniqueProcessId )/g' \
              "${FILE_VIRTUAL}"

            if grep -q 'uffd_fd = syscall( __NR_userfaultfd' "${FILE_VIRTUAL}"; then
              sed -i \
                's/^\(.*\)uffd_fd = syscall( __NR_userfaultfd.*$/\1uffd_fd = -1; \/* Termux bypass *\//' \
                "${FILE_VIRTUAL}"
            fi
          fi

          echo "============================================"
          echo "Termux patches completed"
          echo "============================================"

      # ============================================================
      - name: ARM64 39-bit VA + noexec 兼容适配
        run: |
          echo "============================================"
          echo "ARM64 39-bit VA / noexec compatibility"
          echo "============================================"
          ENABLE_39BIT="${{ inputs.enable_39bit_va || 'true' }}"
          ENABLE_NOEXEC="${{ inputs.enable_noexec_fallback || 'true' }}"
          echo "  enable_39bit_va        = ${ENABLE_39BIT}"
          echo "  enable_noexec_fallback = ${ENABLE_NOEXEC}"

          for CAND in "${WINE_SOURCE_DIR}/source" "${WINE_SOURCE_DIR}" /opt/wine-src/source; do
            if [ -f "${CAND}/dlls/ntdll/unix/virtual.c" ]; then
              cd "${CAND}"
              break
            fi
          done
          if [ ! -f dlls/ntdll/unix/virtual.c ]; then
            echo "FATAL: 找不到 wine 源码树 (dlls/ntdll/unix/virtual.c)"
            echo "  PWD=$(pwd)  WINE_SOURCE_DIR=${WINE_SOURCE_DIR:-<unset>}"
            ls -la "${WINE_SOURCE_DIR}" 2>/dev/null | head -20
            exit 1
          fi
          echo "  wine source: $(pwd)"

          if [ "${ENABLE_39BIT}" = "true" ]; then
            for F in dlls/ntdll/unix/virtual.c loader/preloader.c; do
              if [ -f "$F" ]; then
                perl -pi -e 's/0x7ffff0000000/0x7f00000000/g' "$F"
                perl -pi -e 's/0x7ff000000000/0x7f00000000/g' "$F"
                perl -pi -e 's/0x7ff600000000/0x7ffe000000/g' "$F"
                perl -pi -e 's/0x7ffffe000000/0x7ffe000000/g' "$F"
                perl -pi -e 's/0x7fffffff0000/0x7fffff0000/g' "$F"
                echo "  39-bit: rewrote $F"
              fi
            done
            VMA=$(grep -c '0x7fffff0000' dlls/ntdll/unix/virtual.c || true)
            HIA=$(grep -c '0x7ffe000000' dlls/ntdll/unix/virtual.c || true)
            PLA=$(grep -c '0x7ffe000000' loader/preloader.c || true)
            PRE_OLD=$(grep -c '0x7ffffe000000' loader/preloader.c || true)
            if [ "${PLA}" = "0" ] && [ "${PRE_OLD}" = "0" ]; then
              echo "  39-bit: preloader.c 无高区常量（该版本已将其移走）→ 视为无需适配"
              PLA=1
            fi
            echo "  39-bit check: virtual_limit=${VMA} virtual_hiarea=${HIA} preloader=${PLA}"
            if [ "${VMA}" = "0" ] || [ "${HIA}" = "0" ] || [ "${PLA}" = "0" ]; then
              echo "FATAL: 39-bit VA 适配未生效 (${VMA}/${HIA}/${PLA})"
              exit 1
            fi
            LEFT=$( { grep -rln '0x7ffffe000000\|0x7fffffff0000' --include='*.c' --include='*.h' . 2>/dev/null || true; } | head -10 )
            if [ -n "${LEFT}" ]; then
              echo "  39-bit: 以下文件仍含旧值（核对是否为无关版本）："
              echo "${LEFT}" | sed 's/^/    /'
            else
              echo "  39-bit: 全树无旧值残留"
            fi
          echo "39-bit: top-down => $(grep -n 'top-down area' dlls/ntdll/unix/virtual.c | head -1 || true)"
          perl -ne 'while (/reserve_area\(\s*\(void\s*\*\)(0x[0-9a-fA-F]+)\s*,\s*\(void\s*\*\)(0x[0-9a-fA-F]+)\s*\)/g) { $bad = 1 if hex($1) > hex($2); } END { exit($bad ? 1 : 0) }' dlls/ntdll/unix/virtual.c loader/preloader.c || { echo 'FATAL: 39-bit rewrite produced inverted reserve_area range'; exit 1; }
          echo "39-bit sanity: reserve_area ranges OK"
          else
            echo "  skip 39-bit VA (enable_39bit_va=false)"
          fi

          if [ "${ENABLE_NOEXEC}" = "true" ]; then
            if python3 - <<'PYEOF'
          import io
          p = 'dlls/ntdll/unix/virtual.c'
          src = io.open(p, encoding='utf-8', errors='surrogateescape').read()
          ev = [ (i + 1, l.strip()) for i, l in enumerate(src.split('\n'))
                 if 'falling back to read' in l or 'fall back to read()' in l ]
          if ev or 'failed to set PROT_EXEC on file map, noexec filesystem?' not in src:
              print('  noexec fallback: 该树已内置 noexec read() 兜底，跳过注入')
              for ln, txt in ev:
                  print('    virtual.c:%d  %s' % (ln, txt[:110]))
              print('    判定依据: EACCES/EPERM -> break -> anon_mmap_fixed + pread（现有代码即可回退）')
              raise SystemExit(2)
          anchor = src.find('case EPERM:')
          idx = src.find('return STATUS_ACCESS_DENIED;', anchor)
          if anchor < 0 or idx < 0:
              print('  noexec fallback: 该树结构不同（无 EPERM/STATUS_ACCESS_DENIED 锚点），跳过注入')
              raise SystemExit(2)
          ins = ('                if ((prot & PROT_EXEC) && !(vprot & VPROT_WRITE))\n'
                 '                {\n'
                 '                    /* noexec compat: read-only exec map falls back to read() */\n'
                 '                    WARN( "noexec exec map relaxed, falling back to read\\n" );\n'
                 '                    break;\n'
                 '                }\n')
          io.open(p, 'w', encoding='utf-8', errors='surrogateescape').write(src[:idx] + ins + src[idx:])
          print('  noexec fallback: 已注入（旧实现）')
          raise SystemExit(0)
          PYEOF
            then
              if ! grep -q 'noexec exec map relaxed' dlls/ntdll/unix/virtual.c; then
                echo "FATAL: noexec 兜底注入后校验失败"
                exit 1
              fi
            else
              RC=$?
              if [ "$RC" = "2" ]; then
                echo "  noexec fallback: 无需改动（上游已支持）"
              else
                echo "FATAL: noexec 注入脚本出错 rc=$RC"
                exit 1
              fi
            fi
          else
            echo "  skip noexec fallback (enable_noexec_fallback=false)"
          fi

      - name: winegstreamer task pool 兜底 + 诊断打点
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source"

          FILE_PARSER="dlls/winegstreamer/wg_parser.c"
          FILE_UNIXLIB="dlls/winegstreamer/unixlib.c"

          test -f "${FILE_PARSER}" || { echo "缺少 ${FILE_PARSER}"; exit 1; }

          apt-get install -y --no-install-recommends perl >/dev/null 2>&1 || true

          perl -0pi -e 's/(static NTSTATUS wg_parser_create\(void \*args\)\n\{\n)/$1    { extern GType wg_task_pool_get_type(void) __attribute__((weak)); static int dbg_printed; if (!dbg_printed) { dbg_printed = 1; fprintf(stderr, "winegstreamer: unix wg_parser_create entered, wg_task_pool GType=%lu\\n", (unsigned long)(wg_task_pool_get_type ? wg_task_pool_get_type() : 0)); } }\n/' "${FILE_PARSER}"

          perl -0pi -e 's/if \(!\(parser->task_pool = wg_task_pool_new\(\)\)\)\n    \{\n        free\(parser\);\n        return E_OUTOFMEMORY;\n    \}/if (!(parser->task_pool = wg_task_pool_new()))\n    {\n        fprintf(stderr, "winegstreamer: wg_task_pool_new() failed, falling back to the default GstTaskPool\\n");\n        if (!(parser->task_pool = gst_task_pool_new()))\n        {\n            free(parser);\n            return E_OUTOFMEMORY;\n        }\n    }/' "${FILE_PARSER}"

          if [ -f "${FILE_UNIXLIB}" ]; then
            perl -0pi -e 's/(GST_INFO\("GStreamer library version %s; wine built with %d\.%d\.%d\.",\n\s*gst_version_string\(\), GST_VERSION_MAJOR, GST_VERSION_MINOR, GST_VERSION_MICRO\);)/$1\n    fprintf(stderr, "winegstreamer: unix init: host gst %s, host glib %u.%u.%u, built with gst %d.%d.%d\\n", gst_version_string(), glib_major_version, glib_minor_version, glib_micro_version, GST_VERSION_MAJOR, GST_VERSION_MINOR, GST_VERSION_MICRO);/' "${FILE_UNIXLIB}"
          fi

          FILE_MAIN="dlls/winegstreamer/main.c"
          if [ -f "${FILE_MAIN}" ]; then
            perl -0pi -e 's/if \(WINE_UNIX_CALL\(unix_wg_init_gstreamer, &params\)\)\n        return FALSE;/{ NTSTATUS _wg_rc = WINE_UNIX_CALL(unix_wg_init_gstreamer, &params); if (_wg_rc) { ERR("unix_wg_init_gstreamer FAILED rc=0x%08x\\n", (unsigned int)_wg_rc); return FALSE; } }/' "${FILE_MAIN}"
            perl -0pi -e 's/if \(WINE_UNIX_CALL\(unix_wg_parser_create, &params\)\)\n        return 0;/{ NTSTATUS _wg_rc = WINE_UNIX_CALL(unix_wg_parser_create, &params); if (_wg_rc) { ERR("unix_wg_parser_create FAILED rc=0x%08x\\n", (unsigned int)_wg_rc); return 0; } }/' "${FILE_MAIN}"
            echo "=== PE 侧打点注入检查 ==="
            grep -c 'unix_wg_init_gstreamer FAILED' "${FILE_MAIN}" || true
            grep -c 'unix_wg_parser_create FAILED' "${FILE_MAIN}" || true
            grep -n 'unix_wg_parser_create FAILED' "${FILE_MAIN}" | head -3 || true
          else
            echo "WARN: 没有 ${FILE_MAIN}，跳过 PE 侧打点"
          fi

          echo "=== 注入结果检查 ==="
          grep -q 'falling back to the default GstTaskPool' "${FILE_PARSER}" \
            && echo "OK: task pool 兜底已注入" \
            || echo "WARN: 未能注入兜底（锚点不一致，不影响本次构建）"
          grep -q 'unix wg_parser_create entered' "${FILE_PARSER}" \
            && echo "OK: 入口打点已注入" \
            || echo "WARN: 未注入入口打点"
          if [ -f "${FILE_UNIXLIB}" ]; then
            grep -q 'unix init: host gst' "${FILE_UNIXLIB}" \
              && echo "OK: 版本打点已注入" \
              || echo "WARN: 未注入版本打点"
          fi

          grep -n 'wg_task_pool_new\|gst_task_pool_new\|GType=%lu' "${FILE_PARSER}" | head -20 || echo "(无 task pool 诊断命中，属正常)"

      # ============================================================
      - name: 去掉 winegstreamer 的 GstGL 依赖 (对齐 AndreRH)
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source"

          echo "=== 修改前 ==="
          grep -n 'GSTREAMER,\[' configure.ac || true
          grep -n 'gst/gl/gl.h' dlls/winegstreamer/*.c || true

          sed -i 's/gstreamer-tag-1\.0 gstreamer-gl-1\.0/gstreamer-tag-1.0/' configure.ac

          SHIM='typedef struct _GstGLDisplay GstGLDisplay;\ntypedef struct _GstGLContext GstGLContext;\n#define gst_gl_display_new() (NULL)\n#define gst_gl_display_create_context(d, c, o, e) (0)\n#define gst_gl_display_add_context(d, c) ((void)0)\n#define GST_GL_DISPLAY_CONTEXT_TYPE "gst.gl.GLDisplay"\n#define gst_context_set_gl_display(c, d) ((void)0)'
          for f in dlls/winegstreamer/unixlib.c dlls/winegstreamer/wg_parser.c; do
            if grep -q '#include <gst/gl/gl.h>' "${f}"; then
              sed -i "s|#include <gst/gl/gl.h>|${SHIM}|" "${f}"
              echo "OK: ${f} gst-gl 垫片已注入"
            else
              echo "WARN: ${f} 未见 gst/gl 头（可能上游已改）"
            fi
          done

          sed -i '/setenv("GST_GL_WINDOW"/d' dlls/winegstreamer/unixlib.c || true

          echo "=== 修改后自检 ==="
          if grep -rn '#include <gst/gl/gl.h>' dlls/winegstreamer/; then
            echo "FAIL: 仍有 gst-gl 头文件引用"
            exit 1
          fi
          echo "OK: 已无 gst/gl/gl.h 引用"

          echo "--- 源码里出现的所有 gst_gl_* 函数，必须全部被垫片覆盖 ---"
          BAD=0
          for id in $(grep -oh 'gst_gl_[a-z_]*' dlls/winegstreamer/*.c | sort -u); do
            case "${id}" in
              gst_gl_display_new|gst_gl_display_create_context|gst_gl_display_add_context)
                echo "  OK   ${id} (垫片)" ;;
              *)
                echo "  MISS ${id} 未被垫片覆盖"
                BAD=1 ;;
            esac
          done
          [ "${BAD}" = "0" ] || { echo "FAIL: 存在未覆盖的 gst-gl 符号"; exit 1; }

          echo "--- 类型名检查 ---"
          for t in $(grep -oh 'GstGL[A-Za-z]*' dlls/winegstreamer/*.c | sort -u); do
            case "${t}" in
              GstGLDisplay|GstGLContext) echo "  OK   ${t} (垫片 typedef)" ;;
              *) echo "  MISS ${t} 未定义"; BAD=1 ;;
            esac
          done
          [ "${BAD}" = "0" ] || { echo "FAIL: 存在未定义的 GstGL 类型"; exit 1; }

          echo "--- 垫片注入后的样子 ---"
          grep -n -A7 'typedef struct _GstGLDisplay' dlls/winegstreamer/unixlib.c || echo "  (诊断：未见 _GstGLDisplay 定义；该树可能本就无需垫片)"
          grep -n 'GSTREAMER,\[' configure.ac || true
          grep -c 'gstreamer-gl-1.0' configure.ac || echo "OK: configure.ac 已无 gstreamer-gl-1.0"

      # ============================================================
      # 8.1 【关键修复】esync 头文件缺失
      # ============================================================
      - name: 修复 esync 头文件缺失 (server.c)
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source"

          FILE_SERVER_ESYNC="dlls/ntdll/unix/server.c"

          if [ ! -f "${FILE_SERVER_ESYNC}" ]; then
            echo "跳过 esync 修复：不存在 ${FILE_SERVER_ESYNC}"
          elif [ ! -f dlls/ntdll/unix/esync.h ] && ! grep -q 'esync_init' "${FILE_SERVER_ESYNC}"; then
            echo "跳过 esync 修复：该 tree 没有 esync（无 esync.h 且未调用 esync_init）"
          elif grep -q '#include "esync.h"' "${FILE_SERVER_ESYNC}"; then
            echo "已经包含 esync.h，无需修复"
          else
            sed -i \
              's|^#include "fsync.h"$|#include "esync.h"\n#include "fsync.h"|' \
              "${FILE_SERVER_ESYNC}"
          fi

          echo "=== server.c 相关 include ==="

          grep -n \
            '#include "esync.h"\|#include "fsync.h"' \
            "${FILE_SERVER_ESYNC}" || echo "(该 tree 无 esync.h/fsync.h include —— 无需修复)"

          if [ -f dlls/ntdll/unix/esync.h ]; then
            grep -q '#include "esync.h"' "${FILE_SERVER_ESYNC}"
            echo "esync.h include 修复完成（已校验）"
          else
            echo "该 tree 无 esync，跳过校验"
          fi

      # ============================================================
      # 9. Generate configure
      # ============================================================
      - name: Regenerate Wine configure
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source"

          if [ -x ./autogen.sh ]; then
            ./autogen.sh
          elif [ -f configure ] && [ -f configure.ac ]; then
            if [ configure -nt configure.ac ]; then
              echo "OK: configure 已存在且比 configure.ac 新 -> 直接沿用（不重新生成）"
            else
              echo "WARN: configure 比 configure.ac 旧 -> 尝试 autogen.sh/autoreconf"
              if command -v autoreconf >/dev/null 2>&1; then
                autoreconf -fi || { echo "WARN: autoreconf 失败 -> 继续沿用现有 configure"; true; }
              elif command -v autoconf >/dev/null 2>&1; then
                autoconf -o configure configure.ac || { echo "WARN: autoconf 失败 -> 沿用现有 configure"; true; }
              fi
            fi
          else
            echo "WARN: 树内既无 autogen.sh 也无 configure -> 无法生成 configure"
            ls -la | head -25 || true
          fi

          if [ -f configure ]; then
            ls -lh configure
          else
            echo "WARN: 无 configure 文件（继续后续步骤）"
          fi

      # ============================================================
      # 10. Native Wine64 tools
      # ============================================================
      - name: Build native Wine64 tools and NLS
        shell: bash
        run: |
          set -eux

          rm -rf "${WINE64_DIR}"

          mkdir -p "${WINE64_DIR}"

          cd "${WINE64_DIR}"

          mkdir -p native

          cd native

          export PATH="/opt/${LLVMMINGW_NAME}/bin:${PATH}"

          export CC="gcc"
          export CXX="g++"

          "${WINE_SOURCE_DIR}/source/configure" \
            --enable-win64 \
            --disable-tests \
            --without-x \
            --without-vulkan \
            --without-wayland \
            --without-pulse \
            --without-alsa \
            --without-dbus \
            --without-udev \
            --without-cups \
            --without-gphoto \
            --without-gssapi \
            --without-krb5 \
            --without-pcap \
            --without-pcsclite \
            --without-sane \
            --without-usb \
            --without-v4l2 \
            --without-ffmpeg

          make \
            __tooldeps__ \
            -j"${{ inputs.jobs || 8 }}"

          echo "=== Build NLS ==="

          make -C nls \
            -j"${{ inputs.jobs || 8 }}"

          echo "=== Backup NLS ==="

          rm -rf /opt/nls-backup

          mkdir -p /opt/nls-backup

          cp -aL \
            nls/. \
            /opt/nls-backup/

          test -f \
            /opt/nls-backup/locale.nls

          echo "NLS backup OK"

          find /opt/nls-backup \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
          sort

      # ============================================================
      # 11. Native Wine tool validation
      # ============================================================
      - name: 验证 native Wine tools
        shell: bash
        run: |
          set -eux

          NATIVE="${WINE64_DIR}/native"

          echo "=== Native Wine ==="

          find "${NATIVE}" \
            -maxdepth 3 \
            -type f \
            \( \
              -name wine \
              -o \
              -name wine64 \
              -o \
              -name wineserver \
              -o \
              -name wineboot \
              -o \
              -name winecfg \
            \) \
            -print || true

          echo "=== NLS ==="

          test -f "${NATIVE}/nls/locale.nls"

          file "${NATIVE}/nls/locale.nls"

          mkdir -p "${WINE_NATIVE_DIR}"

          cp -aL \
            "${NATIVE}/." \
            "${WINE_NATIVE_DIR}/"

          test -f \
            "${WINE_NATIVE_DIR}/nls/locale.nls"

      # ============================================================
      # 12. ARM64 WOW64 configure
      # ============================================================
      - name: 修复 winegstreamer unixlib.c 的宿主架构分支 (aarch64)
        run: |
          set -eux

          F="${WINE_SOURCE_DIR}/source/dlls/winegstreamer/unixlib.c"

          if [ ! -f "${F}" ]; then
            echo "无 ${F}，跳过"
            exit 0
          fi

          echo "=== 修改前 ==="
          grep -n -E 'registry\.(x86_64|i386|aarch64)\.bin|Bad arch' "${F}" || true

          if grep -q 'registry.aarch64.bin' "${F}"; then
            echo "已含 registry.aarch64.bin，跳过"
            exit 0
          fi

          if ! grep -q -E '^\s*#error Bad arch' "${F}"; then
            echo "该树 unixlib.c 无 '#error Bad arch' 分支，跳过"
            exit 0
          fi

          perl -0pi -e 's{(#elif defined\(__i386__\)\n\s*const char \*arch = "/registry\.i386\.bin";\n)}{$1#elif defined(__aarch64__)\n        const char *arch = "/registry.aarch64.bin";\n}' "${F}"

          echo "=== 修改后 ==="
          grep -n -E 'registry\.(x86_64|i386|aarch64)\.bin|Bad arch' "${F}" || true

          if ! grep -q 'registry.aarch64.bin' "${F}"; then
            echo "❌ 注入失败"
            exit 1
          fi

          echo "✓ unixlib.c aarch64 分支已就绪"

          M="${WINE_SOURCE_DIR}/source/dlls/winegstreamer/media-converter/media-converter.h"

          if [ -f "${M}" ]; then
            echo "=== media-converter.h 修改前 ==="
            grep -n -E '#if(def)? defined\(__x86_64__\)|__aarch64__|murmur3_128_state ' "${M}" | head -10 || true

            if grep -q 'defined(__x86_64__) || defined(__aarch64__)' "${M}"; then
              echo "media-converter.h 已含 aarch64 处理，跳过"
            elif grep -q '#ifdef __x86_64__' "${M}"; then
              perl -0pi -e 's{#ifdef __x86_64__\n(#define murmur3_128_state)}{#if defined(__x86_64__) || defined(__aarch64__)\n$1}' "${M}"
              echo "=== media-converter.h 修改后 ==="
              grep -n -E 'defined\(__x86_64__\).*__aarch64__|murmur3_128_state ' "${M}" | head -10 || true
            else
              echo "media-converter.h 无 '#ifdef __x86_64__' 锚点，跳过"
            fi

            if grep -q 'murmur3_128_state' "${M}"; then
              if grep -q '#if defined(__x86_64__) || defined(__aarch64__)' "${M}"; then
                echo "✓ media-converter.h aarch64 处理已就绪"
              else
                echo "❌ media-converter.h 仍不含 aarch64 处理"
                exit 1
              fi
            fi
          else
            echo "无 ${M}，跳过（该树不含 media-converter）"
          fi

          D42="${WINE_SOURCE_DIR}/source/dlls/d3dx11_42/Makefile.in"

          if [ -f "${D42}" ]; then
            if grep -q 'd3dx11_43' "${D42}"; then
              echo "=== d3dx11_42/Makefile.in 修改前 ==="
              grep -n -E '^IMPORTS|^IMPORTLIB' "${D42}" || true
              sed -i 's/^\(IMPORTS *= *.*\)d3dx11_43/\1d3dx11/' "${D42}"
              echo "=== 修改后 ==="
              grep -n -E '^IMPORTS|^IMPORTLIB' "${D42}" || true
            else
              echo "d3dx11_42/Makefile.in 不含 d3dx11_43，跳过"
            fi
          else
            echo "无 ${D42}，跳过"
          fi

          CA="${WINE_SOURCE_DIR}/source/configure.ac"

          if printf '%s' "${{ inputs.wine_archs || 'arm64ec,aarch64,i386' }}" | grep -q 'arm64ec'; then
            echo "[termux-arm64-guard] 已启用 arm64ec：跳过 xstate/TEB 兜底 与 amd_ags/crtdll 禁用"
          else
          for _dll in amd_ags_x64 crtdll; do
            if [ -f "${CA}" ] && grep -q "^WINE_CONFIG_MAKEFILE(dlls/${_dll})" "${CA}"; then
              sed -i "s|^WINE_CONFIG_MAKEFILE(dlls/${_dll})$|# [termux-arm64] disabled (arm64ec incompatible): WINE_CONFIG_MAKEFILE(dlls/${_dll})|" "${CA}"
              echo "已禁用 dlls/${_dll}"
            else
              echo "configure.ac 无 dlls/${_dll} 条目或已处理，跳过"
            fi
          done
          grep -n 'termux-arm64] disabled' "${CA}" || true

          if printf '%s' "${{ inputs.wine_archs || 'arm64ec,aarch64,i386' }}" | grep -q 'arm64ec'; then
            echo "[termux-arm64-guard] 已启用 arm64ec：跳过 xstate/TEB 兜底 与 amd_ags/crtdll 禁用"
          else
          SA="${WINE_SOURCE_DIR}/source/dlls/ntdll/unix/signal_arm64.c"

          if [ -f "${SA}" ] && ! grep -q 'termux-arm64 xstate/TEB fallbacks' "${SA}"; then
            cat >> "${SA}" <<'TERMUX_ARM64_EOF'

          /* termux-arm64 xstate/TEB fallbacks ------------------------------- */
          #ifdef __aarch64__
          BOOL xstate_compaction_enabled = FALSE;
          UINT64 xstate_supported_features_mask = 0;
          UINT64 xstate_features_size = 0;

          void set_thread_teb( TEB *teb )
          {
              (void)teb;
          }
          #endif
          /* ---------------------------------------------------------------- */
          TERMUX_ARM64_EOF
            echo "已给 signal_arm64.c 追加 xstate / set_thread_teb 兜底定义"
            tail -14 "${SA}" || true
          else
            echo "signal_arm64.c 已处理或不存在，跳过"
          fi
          fi


          if [ -f "${CA}" ] && command -v autoconf >/dev/null 2>&1; then
            if ( cd "${WINE_SOURCE_DIR}/source" && autoconf -o configure configure.ac ); then
              echo "configure 已按修改后的 configure.ac 重新生成"
            else
              echo "⚠️ autoconf 重新生成 configure 失败（继续）"
            fi
          fi
          fi


      - name: Configure ARM64 WOW64
        shell: bash
        env:
          ENABLE_WAYLAND: ${{ inputs.enable_wayland }}
          ENABLE_DBUS: ${{ inputs.enable_dbus }}
          ENABLE_UDEV: ${{ inputs.enable_udev }}
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source"

          rm -rf build-arm64

          mkdir -p build-arm64

          cd build-arm64

          export PATH="/opt/${LLVMMINGW_NAME}/bin:${PATH}"

          export CC="clang --target=aarch64-linux-gnu"
          export CXX="clang++ --target=aarch64-linux-gnu"

          export CROSSCC="arm64ec-w64-mingw32-clang"
          export CROSSCXX="arm64ec-w64-mingw32-clang++"

          export SYSROOT="/usr"

          export PKG_CONFIG_PATH="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"

          export CFLAGS="-O2 -pipe"
          export CXXFLAGS="-O2 -pipe"

          export CROSSCFLAGS="-O2 -pipe"
          export CROSSCXXFLAGS="-O2 -pipe"

          export LDFLAGS="-L/usr/lib/aarch64-linux-gnu -Wl,-O1 -Wl,--as-needed -Wl,--sort-common"

          WINE_ARCHS="${{ inputs.wine_archs || 'arm64ec,aarch64,i386' }}"

          export ac_cv_arm64ec_crosscc=yes
          export ac_cv_arm64ec_cflags__target_arm64ec_windows__fuse_ld_lld__Wl__subsystem_console__Wl__WX=yes
          export ac_cv_arm64ec_cflags__target_arm64ec_windows__fuse_ld_lld__Wl__subsystem_console__Wl__WX___no_default_config=yes

          if printf '%s' "${WINE_ARCHS}" | grep -q 'arm64ec'; then
            echo "arm64ec: 已注入 autoconf 缓存变量，跳过编译探测（保留 ${WINE_ARCHS}）"
            echo "  arm64ec 交叉编译器: $(command -v arm64ec-w64-mingw32-clang 2>/dev/null || echo 未找到)"
          fi


          CONFIGURE_FLAGS=()

          CONFIGURE_FLAGS+=(
            --enable-win64
            --host=aarch64-linux-gnu
            --with-mingw=clang
            --enable-archs=${WINE_ARCHS}
            --with-wine-tools="${WINE_NATIVE_DIR}"
            --prefix=/tmp/wine-install-wow64
            --disable-win16
            --with-vulkan
            --enable-nls
            --with-pulse
            --with-gstreamer
            --with-pthread
            --without-ffmpeg
            --disable-opencl
            --disable-tests
            --disable-winemenubuilder
            --without-cups
            --without-gphoto
            --without-gssapi
            --without-krb5
            --with-alsa
            --without-oss
            --without-pcap
            --without-pcsclite
            --without-sane
            --without-usb
            --without-v4l2
            --with-xshm
            --with-vkd3d
          )

          if [ "${ENABLE_WAYLAND}" = "true" ]; then
            CONFIGURE_FLAGS+=(--with-wayland)
          else
            CONFIGURE_FLAGS+=(--without-wayland)
          fi

          if [ "${ENABLE_DBUS}" = "true" ]; then
            CONFIGURE_FLAGS+=(--with-dbus)
          else
            CONFIGURE_FLAGS+=(--without-dbus)
          fi

          if [ "${ENABLE_UDEV}" = "true" ]; then
            CONFIGURE_FLAGS+=(--with-udev)
          else
            CONFIGURE_FLAGS+=(--without-udev)
          fi

          echo "============================================"
          echo "Wine configure"
          echo "============================================"

          printf '%s\n' "${CONFIGURE_FLAGS[@]}"

          ../configure \
            "${CONFIGURE_FLAGS[@]}"

          echo "============================================"
          echo "Configure completed"
          echo "============================================"

          test -f config.status

      # ============================================================
      # 13. Configure summary
      # ============================================================
      - name: 输出 Wine configure summary
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source/build-arm64"

          echo "============================================"
          echo "Wine configuration"
          echo "============================================"

          if [ -f config.log ]; then
            grep -E \
              'checking for the host system type|checking for the target system type|checking whether to build 64-bit Wine|checking for Vulkan|checking for GStreamer|checking for PulseAudio|checking for Wayland|checking for DBus' \
              config.log || true
          fi

      # ============================================================
      # 14. Build
      # ============================================================
      - name: 编译 ARM64 WOW64
        shell: bash
        run: |
          set -euxo pipefail

          cd "${WINE_SOURCE_DIR}/source/build-arm64"

          JOBS="${{ inputs.jobs || 8 }}"

          echo "Building with ${JOBS} jobs"

          echo "=== config.status 里实际生效的编译器 / 目标 ==="
          grep -aE '"(CC|CXX|HOST_ARCH|PE_ARCHS|(arm64ec|aarch64|i386|x86_64)_(CC|TARGET))"' \
            config.status | head -40 || true

          make \
            -j"${JOBS}" \
            --output-sync=target \
            2>&1 | tee build.log

      # ============================================================
      # 14.5 失败时上传构建日志
      # ============================================================
      - name: 上传构建日志 (失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-run${{ github.run_number }}
          path: |
            /opt/wine-src/source/build-arm64/build.log
            /opt/wine-src/source/build-arm64/config.log
            /opt/wine-src/source/build-arm64/config.status
          retention-days: 7

      # ============================================================
      # 15. Install
      # ============================================================
      - name: 安装 Wine
        shell: bash
        run: |
          set -eux

          cd "${WINE_SOURCE_DIR}/source/build-arm64"

          rm -rf /tmp/wine-install-wow64

          mkdir -p /tmp/wine-install-wow64

          make install

          test -d /tmp/wine-install-wow64

          echo "=== Installed files ==="

          find /tmp/wine-install-wow64 \
            -maxdepth 3 \
            -type f |
          sort |
          head -300 || true

      # ============================================================
      # 16. Install tree fix
      # ============================================================
      - name: 修复 Termux Wine 安装树
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"
          BUILD="${WINE_SOURCE_DIR}/source/build-arm64"

          mkdir -p \
            "${TARGET}/bin" \
            "${TARGET}/lib/wine" \
            "${TARGET}/share/wine/nls" \
            "${TARGET}/share/wine/fonts"

          rm -rf \
            "${TARGET}/share/wine/nls"

          mkdir -p \
            "${TARGET}/share/wine/nls"

          cp -aL \
            "${WINE_NATIVE_DIR}/nls/." \
            "${TARGET}/share/wine/nls/"

          test -f \
            "${TARGET}/share/wine/nls/locale.nls"

          if [ -d "${WINE_SOURCE_DIR}/source/fonts" ]; then
            find "${WINE_SOURCE_DIR}/source/fonts" \
              -maxdepth 1 \
              -type f \
              \( \
                -name "*.ttf" \
                -o \
                -name "*.ttc" \
                -o \
                -name "*.fon" \
              \) \
              -exec cp -L {} "${TARGET}/share/wine/fonts/" \;
          fi

          mkdir -p \
            "${TARGET}/lib/wine/aarch64-unix"

          if [ -f "${TARGET}/lib/wine/aarch64-unix/ntdll.so" ]; then
            echo "Native installed ntdll.so found"
          fi

          find "${BUILD}/dlls" \
            -type f \
            -name "*.so" \
            -exec cp -L {} \
              "${TARGET}/lib/wine/aarch64-unix/" \; \
            || true

          find "${BUILD}/programs" \
            -type f \
            -name "*.so" \
            -exec cp -L {} \
              "${TARGET}/lib/wine/aarch64-unix/" \; \
            || true

          find "${BUILD}" \
            -type f \
            -path "*/ntdll.so" \
            -exec cp -L {} \
              "${TARGET}/lib/wine/aarch64-unix/ntdll.so" \; \
            || true

          for PROG in \
            wine \
            wineserver \
            wineboot \
            winecfg \
            regedit \
            regsvr32 \
            winepath \
            wineconsole \
            winedbg
          do
            FOUND="$(find "${BUILD}" \
              -type f \
              -name "${PROG}" \
              -perm -111 \
              | head -n 1 || true)"

            if [ -n "${FOUND}" ]; then
              echo "Installing ${PROG}"

              cp -L \
                "${FOUND}" \
                "${TARGET}/bin/${PROG}"
            else
              echo "Not found: ${PROG}"
            fi
          done

          if [ -f "${TARGET}/lib/wine/aarch64-unix/ntdll.so" ]; then
            ln -sfn \
              "../lib/wine/aarch64-unix/ntdll.so" \
              "${TARGET}/bin/ntdll.so"
          fi

          find "${TARGET}/bin" \
            -type f \
            -exec chmod +x {} \;

          echo "=== Installation tree ==="

          find "${TARGET}/bin" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
          sort

      # ============================================================
      # 17. Duplicate library detection
      # ============================================================
      - name: 检查重复 Unix DLL libraries
        shell: bash
        run: |
          set -eux

          BUILD="${WINE_SOURCE_DIR}/source/build-arm64"

          DUPLICATES="$(
            find "${BUILD}/dlls" \
              -type f \
              -name "*.so" \
              -printf '%f\n' |
            sort |
            uniq -d
          )"

          if [ -n "${DUPLICATES}" ]; then
            echo "WARNING: duplicate library basenames:"
            echo "${DUPLICATES}"
          else
            echo "No duplicate .so basename found"
          fi

      # ============================================================
      # 18. ELF verification
      # ============================================================
      - name: ELF / ARM64 验证
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          echo "============================================"
          echo "Wine ELF verification"
          echo "============================================"

          for FILE in \
            "${TARGET}/bin/wine" \
            "${TARGET}/bin/wineserver" \
            "${TARGET}/bin/wineboot"
          do
            if [ -f "${FILE}" ]; then
              echo
              echo "===== ${FILE} ====="

              file "${FILE}"

              if ! file -b "${FILE}" | grep -q 'ELF'; then
                echo "  (非 ELF 文件，跳过 readelf: $(file -b "${FILE}"))"
                continue
              fi

              readelf -h "${FILE}" |
                grep -E \
                  'Class:|Machine:|Type:'

              echo "--- interpreter ---"

              readelf -l "${FILE}" |
                grep -E 'interpreter|Requesting program interpreter' \
                || true

              echo "--- rpath/runpath ---"

              readelf -d "${FILE}" |
                grep -E 'RPATH|RUNPATH' \
                || true
            fi
          done

      # ============================================================
      # 18.5 安装 FEX 模拟器 DLL + Termux 路径配置
      # ============================================================
      - name: 安装 FEX 模拟器 DLL (aarch64-windows)
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"
          DEST="${TARGET}/lib/wine/aarch64-windows"

          mkdir -p "${DEST}"

          install -m0644 /opt/fex-src/build_ec/Bin/libarm64ecfex.dll "${DEST}/libarm64ecfex.dll"
          install -m0644 /opt/fex-src/build_pe/Bin/libwow64fex.dll   "${DEST}/libwow64fex.dll"

          echo "=== 安装结果（期望 libarm64ecfex=PE x86-64 / libwow64fex=PE Aarch64）==="

          ls -lh "${DEST}/libarm64ecfex.dll" "${DEST}/libwow64fex.dll"

          file "${DEST}/libarm64ecfex.dll" "${DEST}/libwow64fex.dll"

          echo "=== wine.inf / loader 里的模拟器引用 ==="

          grep -a -i 'libarm64ecfex\|libwow64fex' "${TARGET}/share/wine/wine.inf" | head -6 || \
            echo "(wine.inf 里没找到 FEX 名称，检查 Termux compatibility patches 步骤)"

          mkdir -p "${DEST}/fex-emu/HostThunks"
          mkdir -p "${TARGET}/share/fex-emu/GuestThunks"
          mkdir -p "${TARGET}/share/fex-emu/RootFS"

          cat > "${TARGET}/share/fex-emu/fex-env.sh" <<'EOS'
          #!/bin/bash
          # FEX 在 Termux glibc 环境下的路径配置
          # 用法: source "<wine根>/share/fex-emu/fex-env.sh"
          _fex_share="$(cd "$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")" && pwd)"
          _fex_root="$(cd "${_fex_share}/../.." && pwd)"

          export FEX_THUNKHOSTLIBS="${_fex_root}/lib/wine/aarch64-windows/fex-emu/HostThunks"
          export FEX_THUNKGUESTLIBS="${_fex_share}/GuestThunks"
          export FEX_ROOTFS="${_fex_share}/RootFS"
          export FEX_THUNKCONFIG="${_fex_share}"
          export FEX_PORTABLE=1
          export HODLL64=libarm64ecfex.dll
          export HODLL=libwow64fex.dll

          echo "[fex-env] wine 根目录          = ${_fex_root}"
          echo "[fex-env] FEX_THUNKHOSTLIBS    = ${FEX_THUNKHOSTLIBS}"
          echo "[fex-env] FEX_THUNKGUESTLIBS   = ${FEX_THUNKGUESTLIBS}"
          EOS

          chmod 0755 "${TARGET}/share/fex-emu/fex-env.sh"

          FEXX="${TARGET}/lib/wine/aarch64-windows"
          mkdir -p "${FEXX}"
          for D in libarm64ecfex.dll libwow64fex.dll wowbox64.dll; do
            if [ -f "${FEXX}/${D}" ]; then
              echo "  [wow64] 已就位: lib/wine/aarch64-windows/${D}"
            elif [ -f "/opt/fex-src/build_ec/Bin/${D}" ]; then
              cp -f "/opt/fex-src/build_ec/Bin/${D}" "${FEXX}/${D}"
              echo "  [wow64] 从构建目录补齐: ${D}"
            else
              echo "  [wow64] 未找到 ${D}（若走 Hangover 路线，x86_64/i386 模拟会缺件）"
            fi
          done

          echo "=== FEX DLL ABI 校验 ==="
          OBJDUMP="$(command -v llvm-objdump || echo /opt/${LLVMMINGW_NAME}/bin/llvm-objdump)"
          for D in "${FEXX}"/*.dll; do
            [ -f "${D}" ] || continue
            N="$(basename "${D}")"
            MACH="$("${OBJDUMP}" -p "${D}" 2>/dev/null | awk -F: '/Machine/{print $2}' | head -1 | xargs || true)"
            EXP="$("${OBJDUMP}" -p "${D}" 2>/dev/null | grep -c 'BTCpu' || true)"
            echo "  ${N}: Machine=${MACH:-未知} BTCpu*导出=${EXP}"
            case "${MACH}" in
              *ARM64EC*) : ;;
              *AArch64*) echo "    WARN: ${N} 是纯 ARM64（非 ARM64EC），Wine 的 wow64.dll 可能无法加载" ;;
              *) echo "    WARN: ${N} 的 Machine 不是 ARM64EC（${MACH:-未知}）" ;;
            esac
            if [ "${EXP}" = "0" ]; then
              echo "    WARN: ${N} 未见 BTCpu* 导出（Wine wow64.dll 需要的入口）"
            fi
          done

          if [ -d /opt/fex-src/build_ec/Bin/Thunks ]; then
            cp -a /opt/fex-src/build_ec/Bin/Thunks/. "${DEST}/fex-emu/HostThunks/" || true
          fi

          if [ -d /opt/fex-src/build_ec/Bin/GuestThunks ]; then
            cp -a /opt/fex-src/build_ec/Bin/GuestThunks/. "${TARGET}/share/fex-emu/GuestThunks/" || true
          fi

          echo "=== FEX 安装完成 ==="

          find "${TARGET}" -maxdepth 5 -iname '*fex*' | sort

      # ============================================================
      # 19. Termux runtime path fix (patchelf)
      # ============================================================
      - name: 写入 Termux runtime path
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          apt-get install -y --no-install-recommends patchelf

          TERMUX_LOADER="${TERMUX_GLIBC_PREFIX}/lib/ld-linux-aarch64.so.1"

          find "${TARGET}/bin" \
            -type f \
            -exec file {} \; |
          grep -E 'ELF 64-bit LSB.*ARM aarch64' |
          cut -d: -f1 |
          while read -r ELF; do
            echo "patchelf: ${ELF}"
            patchelf \
              --set-interpreter "${TERMUX_LOADER}" \
              --set-rpath "${TERMUX_GLIBC_PREFIX}/lib" \
              "${ELF}" || true
          done

          while IFS= read -r -d '' ELF; do
            case "$(file -b "$ELF")" in
              *"ELF 64-bit LSB"*"ARM aarch64"*) ;;
              *) continue ;;
            esac
            if readelf -lW "$ELF" 2>/dev/null | grep -q 'program interpreter'; then
              echo "patchelf(exe): ${ELF}"
              patchelf --set-interpreter "${TERMUX_LOADER}" \
                       --set-rpath "${TERMUX_GLIBC_PREFIX}/lib" "${ELF}" || true
            else
              echo "patchelf(so): ${ELF}"
              patchelf --set-rpath "${TERMUX_GLIBC_PREFIX}/lib" "${ELF}" || true
            fi
          done < <(find "${TARGET}/lib/wine" -type f -print0)

          echo "=========== runtime path 自检 ==========="
          FAIL=0
          for ELF in "${TARGET}/bin/wine" "${TARGET}/bin/wineserver" "${TARGET}"/lib/wine/*-unix/wine; do
            [ -f "${ELF}" ] || continue
            I="$(readelf -lW "${ELF}" 2>/dev/null | sed -n 's/.*program interpreter: \(.*\)\]/\1/p' | head -1)"
            R="$(readelf -dW "${ELF}" 2>/dev/null | sed -n 's/.*RUNPATH.*\[\(.*\)\]/\1/p' | head -1)"
            echo "  ${ELF}"
            echo "      interp = ${I:-<none>}"
            echo "      rpath  = ${R:-<none>}"
            if [ -n "${I}" ] && [ "${I}" != "${TERMUX_LOADER}" ]; then
              echo "      !! interpreter 不是 Termux loader"
              FAIL=1
            fi
            case "${R}" in
              *"${TERMUX_GLIBC_PREFIX}/lib"*) ;;
              *) echo "      !! rpath 缺少 ${TERMUX_GLIBC_PREFIX}/lib"; FAIL=1 ;;
            esac
          done

          N_BAD=0
          while IFS= read -r -d '' ELF; do
            case "$(file -b "$ELF")" in
              *"ELF 64-bit LSB"*"ARM aarch64"*) ;;
              *) continue ;;
            esac
            if ! readelf -dW "$ELF" 2>/dev/null | grep -q "${TERMUX_GLIBC_PREFIX}/lib"; then
              echo "  !! 缺 Termux rpath: ${ELF}"
              N_BAD=$((N_BAD + 1))
            fi
          done < <(find "${TARGET}/lib/wine" -type f -print0)
          echo "  lib/wine 下缺 Termux rpath 的 ARM64 ELF 数量: ${N_BAD}"

          if [ "${FAIL}" != "0" ]; then
            echo "FATAL: 关键二进制 runtime path 修复不完整"
            exit 1
          fi

          echo "=========== /tmp 残留检查 ==========="
          TMP_LEFT=0
          for BIN in "${TARGET}/bin/wine" "${TARGET}/bin/wineserver" "${TARGET}"/lib/wine/*-unix/*.so; do
            [ -f "${BIN}" ] || continue
            if grep -qaP '(?<!usr)/tmp/\.wine-' "${BIN}"; then
              echo "  !! $(basename "${BIN}") 里仍有 /tmp/.wine-（socket 目录没改到 Termux tmp）"
              TMP_LEFT=1
            fi
          done

          if [ "${TMP_LEFT}" != "0" ]; then
            echo "FATAL: 二进制里仍有 /tmp/.wine-，设备上运行会 mkdir Permission denied"
            exit 1
          fi

          echo "  未发现 /tmp/.wine- 残留"

          echo "runtime path 修复完成"

      # ============================================================
      # 20. ARM64 ntdll verification
      # ============================================================
      - name: 验证 ntdll
        shell: bash
        run: |
          set -eux

          NTDLL="/tmp/wine-install-wow64/lib/wine/aarch64-unix/ntdll.so"

          if [ ! -f "${NTDLL}" ]; then
            echo "ERROR: ntdll.so not found"
            exit 1
          fi

          file "${NTDLL}"

          readelf -h "${NTDLL}" |
            grep -E \
              'Class:|Machine:|Type:' || echo "(未匹配到 Class/Machine/Type 行，跳过打印)"

      # ============================================================
      # 21. NLS verification
      # ============================================================
      - name: 验证 NLS
        shell: bash
        run: |
          set -eux

          NLS="/tmp/wine-install-wow64/share/wine/nls"

          test -d "${NLS}"
          test -f "${NLS}/locale.nls"

          echo "locale.nls:"
          file "${NLS}/locale.nls"

          echo "NLS files:"
          find "${NLS}" \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' |
          sort

      # ============================================================
      # 22. GStreamer verification
      # ============================================================
      - name: 验证 GStreamer
        shell: bash
        run: |
          set -eux

          echo "=== GStreamer libraries in build tree ==="

          find "${WINE_SOURCE_DIR}/source/build-arm64" \
            -type f \
            \( \
              -name "*gstreamer*.so" \
              -o \
              -name "*winegstreamer*.so" \
            \) \
            -print |
          head -100 || true

          echo "=== Debian ARM64 GStreamer ==="

          dpkg-query \
            -W \
            -f='${Package} ${Version}\n' \
            '*gstreamer*' \
            2>/dev/null |
          head -100 || true

      # ============================================================
      # 22.1 验证解码 / 音频链依赖
      # ============================================================
      - name: 验证解码链依赖 (gstreamer + alsa)
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          echo "=== unix 侧解码/音频库的运行时依赖 ==="
          for so in \
            "${TARGET}/lib/wine/aarch64-unix/winegstreamer.so" \
            "${TARGET}/lib/wine/aarch64-unix/winedmo.so" \
            "${TARGET}/lib/wine/aarch64-unix/winepulse.so"
          do
            [ -f "${so}" ] || continue
            echo "--- $(basename "${so}")"
            readelf -dW "${so}" | grep -E 'NEEDED|RUNPATH' || true
          done

          echo "=== 断言：winegstreamer.so 必须链上宿主 libgstreamer ==="
          readelf -dW "${TARGET}/lib/wine/aarch64-unix/winegstreamer.so" \
            | grep -q 'libgstreamer-1.0.so.0'
          echo "OK: winegstreamer.so -> libgstreamer-1.0"
          echo "=== 断言：winegstreamer.so 不应再依赖 libgstgl（对齐 AndreRH 的依赖面）==="
          if readelf -dW "${TARGET}/lib/wine/aarch64-unix/winegstreamer.so" | grep -q 'libgstgl'; then
            echo "WARN: winegstreamer.so 仍然依赖 libgstgl（设备缺它时 dlopen 会失败）"
          else
            echo "OK: winegstreamer.so 已无 libgstgl 依赖"
          fi

          echo "=== 断言：winepulse.drv 存在时 winealsa.drv 必须也存在 ==="
          if [ -f "${TARGET}/lib/wine/aarch64-windows/winepulse.drv" ]; then
            test -f "${TARGET}/lib/wine/aarch64-windows/winealsa.drv" || {
              echo "FAIL: winepulse.drv 的 DriverProc 转发到 winealsa.drv，但后者缺失（需要 --with-alsa）"
              exit 1
            }
            test -f "${TARGET}/lib/wine/aarch64-unix/winealsa.so" || {
              echo "FAIL: 缺少 aarch64-unix/winealsa.so"
              exit 1
            }
            echo "OK: winealsa.drv + winealsa.so 齐备（winepulse 转发可解析）"
          fi

          echo "=== PE <-> unix 关键模块配对抽查 ==="
          for m in winegstreamer winedmo winealsa winepulse winex11 win32u winevulkan
          do
            printf '  %-16s' "$m"
            for d in aarch64-unix; do
              if [ -f "${TARGET}/lib/wine/$d/$m.so" ]; then printf 'unix:OK '; else printf 'unix:MISS '; fi
            done
            for d in aarch64-windows i386-windows; do
              if [ -f "${TARGET}/lib/wine/$d/$m.dll" ] || [ -f "${TARGET}/lib/wine/$d/$m.drv" ]; then
                printf '%s:OK ' "$d"
              else
                printf '%s:MISS ' "$d"
              fi
            done
            echo
          done

      # ============================================================
      # 22.2 验证加密链依赖 (gnutls / schannel)
      # ============================================================
      - name: 验证加密链依赖 (gnutls / schannel)
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          echo "=== bcrypt.so（无 gnutls 就会打 key_asymmetric_create 错误）==="
          BCRYPT="${TARGET}/lib/wine/aarch64-unix/bcrypt.so"
          if [ ! -f "${BCRYPT}" ]; then
            echo "WARN: bcrypt.so 不存在（该树 configure 未启用 gnutls/TLS 后端）-> 跳过加密链验证"
            echo "      影响：schannel/TLS 走 gnutls 的能力缺失，但不阻塞构建产物"
            exit 0
          fi
          readelf -dW "${BCRYPT}" | grep -E 'NEEDED|RUNPATH' || true
          echo "--- bcrypt.so 内嵌的动态库 soname ---"
          DLOPEN_SONAMES=$(strings -a "${BCRYPT}" | grep -E '^lib(gnutls|gmp|gcrypt)\.so' | sort -u || true)
          echo "${DLOPEN_SONAMES}" | sed 's/^/  /'
          case "${DLOPEN_SONAMES}" in
            *libgnutls.so*)
              echo "OK: bcrypt.so 内嵌 libgnutls（运行时 dlopen；设备端 glibc 前缀需有该库）" ;;
            *)
              echo "WARN: bcrypt.so 未内嵌 libgnutls soname —— gnutls 后端没启用（TLS/schannel 受限，但不阻塞构建）" ;;
          esac

          echo "=== secur32.so（报告用，不做硬断言）==="
          SEC="${TARGET}/lib/wine/aarch64-unix/secur32.so"
          if [ -f "${SEC}" ]; then
            readelf -dW "${SEC}" | grep -E 'NEEDED' || true
            strings -a "${SEC}" > /tmp/_secur32_strings.txt || true
            if grep -qE '^libgnutls\.so' /tmp/_secur32_strings.txt; then
              echo "OK: secur32.so 内嵌 libgnutls soname（运行时 dlopen）"
            else
              echo "WARN: secur32.so 未内嵌 libgnutls soname"
            fi
          else
            echo "（没有 secur32.so，跳过）"
          fi

      # ============================================================
      # 23. Vulkan verification
      # ============================================================
      - name: 验证 Vulkan
        shell: bash
        run: |
          set -eux

          echo "=== Vulkan development package ==="

          dpkg-query \
            -W \
            -f='${Package} ${Version}\n' \
            'libvulkan-dev:arm64' \
            || true

          echo "=== Wine Vulkan ==="

          find "${WINE_SOURCE_DIR}/source/build-arm64" \
            -type f \
            -iname '*vulkan*.so' \
            -print |
          head -100 || true

      # ============================================================
      # 24. Wine executable smoke test
      # ============================================================
      - name: Wine executable smoke test
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          echo "=== wine --version ==="

          if [ -x "${TARGET}/bin/wine" ]; then
            file "${TARGET}/bin/wine"
            echo "ARM64 Wine binary generated successfully"
          else
            echo "ERROR: wine executable missing"
            exit 1
          fi

      # ============================================================
      # 25. Final package verification
      # ============================================================
      - name: 最终目录检查
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          echo "============================================"
          echo "FINAL WINE TREE"
          echo "============================================"

          find "${TARGET}" \
            -maxdepth 4 \
            -type f |
          sort |
          head -500 || true

          echo
          echo "Directory sizes:"

          du -sh \
            "${TARGET}"/* \
            2>/dev/null || true

      # ============================================================
      # 25.5 精简安装树体积（strip 符号表）
      # ============================================================
      - name: 精简安装树（strip ELF / PE 符号表）
        shell: bash
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          # llvm-strip 来自 FEX 工具链：架构无关，ELF aarch64 与 PE/COFF（含 ARM64X）都能处理。
          export PATH="/opt/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64/bin:${PATH}"

          command -v llvm-strip

          SZ_BEFORE=$(du -sb "${TARGET}" | cut -f1)

          ELF_N=0
          PE_N=0

          while IFS= read -r -d '' f; do
            case "$(file -b "$f" 2>/dev/null || true)" in
              ELF*)
                llvm-strip --strip-unneeded "$f" >/dev/null 2>&1 && ELF_N=$((ELF_N+1)) || true
                ;;
              PE32*)
                llvm-strip --strip-all "$f" >/dev/null 2>&1 && PE_N=$((PE_N+1)) || true
                ;;
            esac
          done < <(find "${TARGET}" -type f -print0)

          SZ_AFTER=$(du -sb "${TARGET}" | cut -f1)

          echo "strip 完成：ELF=${ELF_N} 个，PE=${PE_N} 个"
          echo "安装树：${SZ_BEFORE} -> ${SZ_AFTER} bytes（减少 $(( (SZ_BEFORE - SZ_AFTER) / 1024 / 1024 )) MiB）"

          # ---- 健全性检查：动态符号/解释器必须保留，PE 导出表不能被破坏 ----
          llvm-readelf -S "${TARGET}/bin/wine" | grep -q '.dynsym' && echo "OK: bin/wine .dynsym 仍存在"
          llvm-readelf -l "${TARGET}/bin/wine" | grep -q 'INTERP' && echo "OK: bin/wine INTERP 仍存在"

          for D in ntdll kernelbase; do
            DLL="${TARGET}/lib/wine/aarch64-windows/${D}.dll"
            if [ -f "${DLL}" ]; then
              N=$(llvm-readobj --coff-exports "${DLL}" 2>/dev/null | grep -c 'Name:' || true)
              echo "  ${D}.dll 导出数: ${N}"
              [ "${N:-0}" -gt 100 ] || { echo "FATAL: ${D}.dll 导出表异常"; exit 1; }
            fi
          done

          ls -lh "${TARGET}/bin/wine"

      # ============================================================
      # 26. Package
      # ============================================================
      - name: 准备 Wine package
        shell: bash
        run: |
          set -eux

          rm -rf wine-package

          mkdir -p wine-package/wine

          cp -a \
            /tmp/wine-install-wow64/. \
            wine-package/wine/

          test -d wine-package/wine/bin

          test -f \
            wine-package/wine/share/wine/nls/locale.nls

      # ============================================================
      # 27. Package manifest（版本一律取第 6 步写进 GITHUB_ENV 的权威变量）
      # ============================================================
      - name: 生成构建信息
        shell: bash
        run: |
          set -eux

          cat > wine-package/BUILD_INFO.txt <<EOF
          Wine ARM64 WOW64 / ARM64EC
          ============================

          Build name:
          ${BUILD_NAME}

          Build type:
          ${BUILD_TYPE}

          Wine version:
          ${WINE_VERSION_ACTUAL}

          Wine version (safe):
          ${VER_SAFE}

          Wine commit:
          ${WINE_COMMIT}

          Proton branch:
          ${{ inputs.proton_branch }}

          Proton commit:
          ${{ inputs.proton_commit }}

          Valve repo:
          ${{ inputs.valve_repo }}

          Valve branch:
          ${{ inputs.valve_branch }}

          Staging version (input):
          ${{ inputs.staging_version }}

          LLVM-MinGW:
          ${LLVMMINGW_NAME}

          Host:
          Debian 12 amd64 GitHub Actions

          Target:
          ARM64 Linux / Termux glibc

          Windows architectures:
          ${{ inputs.wine_archs }}

          Termux glibc:
          ${TERMUX_GLIBC_PREFIX}

          Termux tmp:
          ${TERMUX_TMP}

          Wayland:
          ${{ inputs.enable_wayland }}

          DBus:
          ${{ inputs.enable_dbus }}

          UDEV:
          ${{ inputs.enable_udev }}

          Build time:
          $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF

          cat wine-package/BUILD_INFO.txt

          # ---------- 运行时依赖清单 ----------
          {
            echo "Wine ARM64 WOW64 / Termux glibc - runtime dependency manifest"
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "说明：下面每个 aarch64-unix/*.so 的 NEEDED 都必须由宿主（Termux glibc 前缀）提供；"
            echo "      ntdll.so 由 Wine 自身提供，可忽略。"
            echo
            for so in wine-package/wine/lib/wine/aarch64-unix/*.so; do
              [ -f "$so" ] || continue
              echo "### $(basename "$so")"
              readelf -dW "$so" 2>/dev/null \
                | sed -n 's/.*Shared library: \[\(.*\)\]/  \1/p' \
                | sort -u
              echo
            done
            echo "=== winegstreamer.so 需要的宿主 GStreamer 库（必须全部存在）==="
            readelf -dW wine-package/wine/lib/wine/aarch64-unix/winegstreamer.so 2>/dev/null \
              | sed -n 's/.*\[\(libgst.*\)\]/  \1/p' \
              | sort -u
            echo
          } > wine-package/RUNTIME_DEPS.txt

          cat wine-package/RUNTIME_DEPS.txt

      # ============================================================
      # 28. tar.xz（打包前断言版本一致性）
      # ============================================================
      - name: 创建 tar.xz
        shell: bash
        run: |
          set -eux

          # 一致性断言：BUILD_NAME 必须含 VER_SAFE
          case "${BUILD_NAME}" in
            *"${VER_SAFE}"*) echo "OK: BUILD_NAME 含 VER_SAFE (${VER_SAFE})" ;;
            *) echo "FATAL: BUILD_NAME=${BUILD_NAME} 不含 VER_SAFE=${VER_SAFE}"; exit 1 ;;
          esac

          tar \
            -cJf \
            "${BUILD_NAME}.tar.xz" \
            -C wine-package \
            wine \
            BUILD_INFO.txt \
            RUNTIME_DEPS.txt

          test -f "${BUILD_NAME}.tar.xz"

          ls -lh \
            "${BUILD_NAME}.tar.xz"

      # ============================================================
      # 28.5 版本一致性自检（编译版本 == 包名 == Release 名）
      # ============================================================
      - name: 校验版本一致性
        shell: bash
        run: |
          set -eux

          echo "=== 权威版本变量 ==="
          echo "  WINE_VERSION_ACTUAL = ${WINE_VERSION_ACTUAL}"
          echo "  VER_SAFE            = ${VER_SAFE}"
          echo "  WINE_COMMIT         = ${WINE_COMMIT}"
          echo "  BUILD_NAME          = ${BUILD_NAME}"
          echo "  BUILD_TYPE          = ${BUILD_TYPE}"

          fail=0

          case "${BUILD_NAME}" in
            *"${VER_SAFE}"*)    echo "OK: BUILD_NAME 含 VER_SAFE" ;;
            *) echo "FAIL: BUILD_NAME 不含 VER_SAFE"; fail=1 ;;
          esac
          case "${BUILD_NAME}" in
            *"${WINE_COMMIT}"*) echo "OK: BUILD_NAME 含 WINE_COMMIT" ;;
            *) echo "FAIL: BUILD_NAME 不含 WINE_COMMIT"; fail=1 ;;
          esac

          test -f "${BUILD_NAME}.tar.xz" \
            && echo "OK: tar 包名 = ${BUILD_NAME}.tar.xz" \
            || { echo "FAIL: 找不到 ${BUILD_NAME}.tar.xz"; fail=1; }

          if grep -qF "${WINE_VERSION_ACTUAL}" wine-package/BUILD_INFO.txt; then
            echo "OK: BUILD_INFO.txt 版本与 WINE_VERSION_ACTUAL 一致"
          else
            echo "FAIL: BUILD_INFO.txt 版本与 WINE_VERSION_ACTUAL 不一致"
            fail=1
          fi

          if grep -qF "${BUILD_NAME}" wine-package/BUILD_INFO.txt; then
            echo "OK: BUILD_INFO.txt 的 Build name 与 BUILD_NAME 一致"
          else
            echo "FAIL: BUILD_INFO.txt 的 Build name 与 BUILD_NAME 不一致"
            fail=1
          fi

          [ "${fail}" = "0" ] || { echo "FATAL: 版本一致性校验失败"; exit 1; }

          echo "=== 版本一致性全部通过 ==="

      # ============================================================
      # 29. SHA256
      # ============================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -eux

          sha256sum \
            "${BUILD_NAME}.tar.xz" \
            > checksums.txt

          cat checksums.txt

      # ============================================================
      # 30. Artifact（名称统一为 BUILD_NAME）
      # ============================================================
      - name: Upload Wine artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: |
            *.tar.xz
            checksums.txt
            wine-package/BUILD_INFO.txt
            wine-package/RUNTIME_DEPS.txt
          retention-days: 30

      # ============================================================
      # 31. GitHub Release（tag / name / files / body 全部走权威变量）
      # ============================================================
      - name: Publish Wine GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_NAME }}
          name: ${{ env.BUILD_NAME }}

          body: |
            # Wine ARM64 WOW64 / ARM64EC

            ## Build

            - Build name: `${{ env.BUILD_NAME }}`
            - Build type: `${{ env.BUILD_TYPE }}`
            - Wine version: `${{ env.WINE_VERSION_ACTUAL }}`
            - Wine version (safe): `${{ env.VER_SAFE }}`
            - Wine commit: `${{ env.WINE_COMMIT }}`
            - Host: Debian 12 amd64
            - Target: ARM64 Linux / Termux glibc

            ## Windows architectures

            - ARM64EC
            - AArch64
            - i386 / WOW64

            ## Proton

            - Branch: `${{ inputs.proton_branch }}`
            - Commit: `${{ inputs.proton_commit }}`

            ## Wine-Staging

            - Version (input): `${{ inputs.staging_version }}`

            ## Runtime

            - Termux glibc loader:
              `/data/data/com.termux/files/usr/glibc/lib/ld-linux-aarch64.so.1`

            - Termux tmp:
              `/data/data/com.termux/files/usr/tmp`

            ## Optional components

            - Wayland: `${{ inputs.enable_wayland }}`
            - DBus: `${{ inputs.enable_dbus }}`
            - UDEV: `${{ inputs.enable_udev }}`
            - GStreamer: enabled
            - PulseAudio: enabled (ALSA backend: enabled)
            - Vulkan: enabled
            - vkd3d: enabled

            ## Build information

            The package contains `BUILD_INFO.txt` and SHA256 checksum.

          files: |
            ${{ github.workspace }}/${{ env.BUILD_NAME }}.tar.xz
            ${{ github.workspace }}/checksums.txt
            ${{ github.workspace }}/wine-package/BUILD_INFO.txt
            ${{ github.workspace }}/wine-package/RUNTIME_DEPS.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
