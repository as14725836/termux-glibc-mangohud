name: Wine ARM64 WOW64 - Termux glibc + CGCT + LLVM-MinGW

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      wine_source:
        description: "Wine source"
        required: true
        type: choice
        default: staging
        options:
          - vanilla
          - staging
          - staging-tkg
          - staging-tkg-fsync

      wine_ref:
        description: "Wine branch/tag/commit"
        required: true
        default: "master"
        type: string

      strip_mode:
        description: "Strip mode"
        required: true
        type: choice
        default: debug
        options:
          - debug
          - all
          - none

      with_gstreamer:
        description: "Enable GStreamer"
        required: true
        type: choice
        default: "off"
        options:
          - "on"
          - "off"

  schedule:
    - cron: "0 2 5,20 * *"

jobs:
  build:
    name: Wine ARM64 WOW64 Termux glibc

    # ==========================================================
    # CGCT is an AArch64 native toolchain.
    # It CANNOT run on x86_64.
    # The runner must be ARM64.
    # ==========================================================
    runs-on: ubuntu-24.04-arm

    container:
      image: arm64v8/ubuntu:24.04
      options: --user root

    timeout-minutes: 240

    env:
      # ==========================================================
      # LLVM-MinGW
      #
      # ARM64 runner must use ARM64-hosted LLVM-MinGW.
      # ==========================================================
      LLVMMINGW_DATE: "20251202"
      LLVMMINGW_NAME: "llvm-mingw-20251202-ucrt-ubuntu-22.04-aarch64"
      LLVM_MINGW_ROOT: /opt/llvm-mingw

      # ==========================================================
      # Wine
      # ==========================================================
      WINE_SOURCE_DIR: /opt/wine-src
      WINE64_DIR: /opt/wine64

      # ==========================================================
      # Runtime paths
      #
      # These paths are used on the actual Termux device.
      # NEVER replace them with CI paths.
      # ==========================================================
      RUNTIME_TERMUX_PREFIX: /data/data/com.termux/files/usr
      RUNTIME_GLIBC_PREFIX: /data/data/com.termux/files/usr/glibc
      RUNTIME_WINE_PREFIX: /data/data/com.termux/files/usr/glibc/opt/wine
      RUNTIME_TMPDIR: /data/data/com.termux/files/usr/tmp/runtime

      # ==========================================================
      # CI staging
      # ==========================================================
      CI_TERMUX_ROOT: ${{ github.workspace }}/termux-glibc-staging
      CI_TERMUX_PREFIX: ${{ github.workspace }}/termux-glibc-staging/data/data/com.termux/files/usr
      CI_GLIBC_PREFIX: ${{ github.workspace }}/termux-glibc-staging/data/data/com.termux/files/usr/glibc
      CI_TERMUX_TMPDIR: ${{ github.workspace }}/.termux-tmp
      CGCT_DIR: ${{ github.workspace }}/cgct

      # ==========================================================
      # Official repositories
      # ==========================================================
      TERMUX_PACKAGES_REPO: https://github.com/termux/termux-packages.git
      GLIBC_PACKAGES_REPO: https://github.com/termux-pacman/glibc-packages.git

      # ==========================================================
      # Build
      # ==========================================================
      TERMUX_ARCH: aarch64
      STRIP_MODE: ${{ inputs.strip_mode || 'debug' }}
      WITH_GSTREAMER: ${{ inputs.with_gstreamer || 'off' }}
      WINE_INSTALL_PREFIX: /tmp/wine-install-wow64

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Base packages
      # ==========================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update

          apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            bc \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            ccache \
            clang \
            cmake \
            curl \
            file \
            flex \
            g++ \
            gcc \
            gettext \
            git \
            gnupg \
            jq \
            lzip \
            make \
            meson \
            ninja-build \
            patch \
            pkg-config \
            python3 \
            python3-pip \
            python3-setuptools \
            rsync \
            tar \
            unzip \
            wget \
            xz-utils \
            zstd \
            libarchive-tools \
            patchelf \
            libfontconfig-dev \
            libfreetype-dev \
            libgl-dev \
            libgmp-dev \
            libgnutls28-dev \
            libjpeg-dev \
            liblcms2-dev \
            liblz4-dev \
            libmpg123-dev \
            libncurses-dev \
            libopenal-dev \
            libosmesa6-dev \
            libpcap-dev \
            libpulse-dev \
            libsane-dev \
            libsdl2-dev \
            libssl-dev \
            libudev-dev \
            libunwind-dev \
            libusb-1.0-0-dev \
            libva-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxau-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxml2-dev \
            libxrandr-dev \
            libxrender-dev \
            libxxf86vm-dev \
            libxcomposite-dev \
            libzstd-dev

          if [ "$WITH_GSTREAMER" = "on" ]; then
            apt-get install -y --no-install-recommends \
              libgstreamer1.0-dev \
              libgstreamer-plugins-base1.0-dev \
              libgstreamer-plugins-bad1.0-dev
          fi

          mkdir -p "$CI_TERMUX_TMPDIR"
          chmod 1777 "$CI_TERMUX_TMPDIR"

      # ==========================================================
      # 3. Checkout official Termux build system
      # ==========================================================
      - name: Checkout Termux packages
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$GITHUB_WORKSPACE/termux-packages"

          git clone \
            --depth=1 \
            "$TERMUX_PACKAGES_REPO" \
            "$GITHUB_WORKSPACE/termux-packages"

          test -f "$GITHUB_WORKSPACE/termux-packages/scripts/setup-cgct.sh"

      # ==========================================================
      # 4. Checkout official glibc packages
      # ==========================================================
      - name: Checkout glibc packages
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$GITHUB_WORKSPACE/glibc-packages"

          git clone \
            --depth=1 \
            "$GLIBC_PACKAGES_REPO" \
            "$GITHUB_WORKSPACE/glibc-packages"

          test -f "$GITHUB_WORKSPACE/glibc-packages/repo.json"
          test -f "$GITHUB_WORKSPACE/glibc-packages/gpkg/glibc/build.sh"

      # ==========================================================
      # 5. Prepare glibc build-package.sh
      # ==========================================================
      - name: Prepare glibc build system
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/glibc-packages"

          bash ./get-build-package.sh

          test -f build-package.sh
          test -d scripts
          test -d gpkg

      # ==========================================================
      # 6. Setup official CGCT
      #
      # This installs the AArch64-native GCC toolchain.
      # It only works on an AArch64 host.
      # ==========================================================
      - name: Setup official CGCT
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/termux-packages"

          export TERMUX_PKG_TMPDIR="$CI_TERMUX_TMPDIR"
          export CGCT_DIR="$GITHUB_WORKSPACE/cgct"

          rm -rf "$CGCT_DIR"

          bash scripts/setup-cgct.sh

          test -d "$CGCT_DIR"
          test -x "$CGCT_DIR/bin/setup-cgct"

          echo "========== CGCT =========="
          find "$CGCT_DIR" -maxdepth 3 -type f | sort | head -300

      # ==========================================================
      # 7. Verify CGCT target
      # ==========================================================
      - name: Verify CGCT AArch64
        shell: bash
        run: |
          set -euxo pipefail

          CGCT_AARCH64="$CGCT_DIR/aarch64"

          test -d "$CGCT_AARCH64"
          test -d "$CGCT_AARCH64/bin"

          echo "========== CGCT AArch64 =========="
          find "$CGCT_AARCH64/bin" \
            -maxdepth 1 \
            -type f \
            -perm -111 \
            | sort

      # ==========================================================
      # 8. Detect CGCT compiler
      # ==========================================================
      - name: Detect CGCT compiler
        shell: bash
        run: |
          set -euxo pipefail

          BIN="$CGCT_DIR/aarch64/bin"

          CC="$BIN/aarch64-linux-gnu-gcc"
          CXX="$BIN/aarch64-linux-gnu-g++"

          if [ ! -x "$CC" ]; then
            CC="$(find "$BIN" -maxdepth 1 -type f -name '*-gcc' -perm -111 | head -1)"
          fi

          if [ ! -x "$CXX" ]; then
            CXX="$(find "$BIN" -maxdepth 1 -type f -name '*-g++' -perm -111 | head -1)"
          fi

          test -x "$CC"
          test -x "$CXX"

          echo "TERMUX_GLIBC_CC=$CC"   >> "$GITHUB_ENV"
          echo "TERMUX_GLIBC_CXX=$CXX" >> "$GITHUB_ENV"

          echo "CC=$CC"
          echo "CXX=$CXX"

          "$CC" --version
          "$CXX" --version

          echo "Target:"
          "$CC" -dumpmachine

          echo "Sysroot:"
          "$CC" -print-sysroot

      # ==========================================================
      # 9. Obtain official temporary Termux glibc
      # ==========================================================
      - name: Install official temporary Termux glibc
        shell: bash
        run: |
          set -euxo pipefail

          ARCH="$TERMUX_ARCH"
          GPKG_URL="https://sync.termux-pacman.dev/gpkg/${ARCH}"
          TMP_GLIBC="$GITHUB_WORKSPACE/.temporary-glibc"

          rm -rf "$TMP_GLIBC"
          mkdir -p "$TMP_GLIBC"

          curl --fail --retry 5 --retry-delay 3 -L \
            "$GPKG_URL/gpkg.json" \
            -o "$TMP_GLIBC/gpkg.json"

          test -s "$TMP_GLIBC/gpkg.json"

          GLIBC_FILE="$(jq -r '."glibc"."FILENAME"' "$TMP_GLIBC/gpkg.json")"
          GLIBC_SHA256="$(jq -r '."glibc"."SHA256SUM"' "$TMP_GLIBC/gpkg.json")"

          test -n "$GLIBC_FILE"
          test "$GLIBC_FILE" != "null"
          test -n "$GLIBC_SHA256"
          test "$GLIBC_SHA256" != "null"

          echo "GLIBC_FILE=$GLIBC_FILE"
          echo "GLIBC_SHA256=$GLIBC_SHA256"

          curl --fail --retry 5 --retry-delay 3 -L \
            "$GPKG_URL/$GLIBC_FILE" \
            -o "$TMP_GLIBC/$GLIBC_FILE"

          echo "$GLIBC_SHA256 $TMP_GLIBC/$GLIBC_FILE" | sha256sum -c -

          tar -xJf "$TMP_GLIBC/$GLIBC_FILE" -C "$TMP_GLIBC" data

          test -d "$TMP_GLIBC/data/data/com.termux/files/usr/glibc"

      # ==========================================================
      # 10. Create isolated CI glibc staging
      # ==========================================================
      - name: Create Termux glibc staging
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$CI_TERMUX_ROOT"

          mkdir -p "$CI_TERMUX_PREFIX" "$CI_GLIBC_PREFIX"

          cp -a \
            "$GITHUB_WORKSPACE/.temporary-glibc/data/data/com.termux/files/usr/glibc/." \
            "$CI_GLIBC_PREFIX/"

          test -f "$CI_GLIBC_PREFIX/lib/ld-linux-aarch64.so.1"
          test -f "$CI_GLIBC_PREFIX/lib/libc.so.6"
          test -f "$CI_GLIBC_PREFIX/include/features.h"

      # ==========================================================
      # 11. Link CGCT libgcc into staging
      # ==========================================================
      - name: Prepare CGCT libgcc
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$CI_GLIBC_PREFIX/lib"

          find "$CGCT_DIR/aarch64/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libgcc*' \
            -exec cp -n {} "$CI_GLIBC_PREFIX/lib/" \;

          ls -l "$CI_GLIBC_PREFIX/lib"/libgcc* 2>/dev/null || true

      # ==========================================================
      # 12. glibc compiler smoke test
      #
      # Build a small ELF, then inspect it with readelf.
      #
      # DO NOT try to run it. The runtime loader is a Termux
      # path that does not exist on CI.
      # ==========================================================
      - name: Test Termux glibc compiler
        shell: bash
        run: |
          set -euxo pipefail

          TESTDIR="$GITHUB_WORKSPACE/glibc-test"
          rm -rf "$TESTDIR"
          mkdir -p "$TESTDIR"

          cat > "$TESTDIR/test.c" <<'EOF'
          #include <stdio.h>
          #include <gnu/libc-version.h>

          int main(void)
          {
              printf("glibc=%s\n", gnu_get_libc_version());
              return 0;
          }
          EOF

          "$TERMUX_GLIBC_CC" \
            -O2 \
            -I"$CI_GLIBC_PREFIX/include" \
            -L"$CI_GLIBC_PREFIX/lib" \
            -Wl,--dynamic-linker="$RUNTIME_GLIBC_PREFIX/lib/ld-linux-aarch64.so.1" \
            -Wl,-rpath="$RUNTIME_GLIBC_PREFIX/lib" \
            "$TESTDIR/test.c" \
            -o "$TESTDIR/test"

          file "$TESTDIR/test"
          readelf -l "$TESTDIR/test" | grep -F "$RUNTIME_GLIBC_PREFIX/lib/ld-linux-aarch64.so.1"
          readelf -d "$TESTDIR/test" | grep -E 'NEEDED|RPATH|RUNPATH'

      # ==========================================================
      # 13. LLVM-MinGW
      # ==========================================================
      - name: Download LLVM-MinGW
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$LLVM_MINGW_ROOT"
          mkdir -p "$LLVM_MINGW_ROOT"

          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVMMINGW_DATE}/${LLVMMINGW_NAME}.tar.xz"

          curl --fail --retry 5 --retry-delay 3 -L \
            "$URL" \
            -o /tmp/llvm-mingw.tar.xz

          tar -xJf /tmp/llvm-mingw.tar.xz \
            --strip-components=1 \
            -C "$LLVM_MINGW_ROOT"

          test -x "$LLVM_MINGW_ROOT/bin/clang"
          test -x "$LLVM_MINGW_ROOT/bin/clang++"

          echo "$LLVM_MINGW_ROOT/bin" >> "$GITHUB_PATH"

          "$LLVM_MINGW_ROOT/bin/clang" --version

      # ==========================================================
      # 14. Build FEX ARM64EC
      # ==========================================================
      - name: Build FEX ARM64EC
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /opt/FEX

          git clone \
            --recursive \
            --depth=1 \
            https://github.com/FEX-Emu/FEX.git \
            /opt/FEX

          cd /opt/FEX

          test -f Source/Windows/WOW64/CMakeLists.txt

          cmake \
            -S . \
            -B build-arm64ec \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/FEX/install-arm64ec \
            -DCMAKE_TOOLCHAIN_FILE=Data/CMake/toolchain_mingw.cmake \
            -DMINGW_TRIPLE=arm64ec-w64-mingw32

          cmake --build build-arm64ec --parallel "$(nproc)"
          cmake --install build-arm64ec

      # ==========================================================
      # 15. Build FEX AArch64
      # ==========================================================
      - name: Build FEX AArch64
        shell: bash
        run: |
          set -euxo pipefail

          cd /opt/FEX

          cmake \
            -S . \
            -B build-aarch64 \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/FEX/install-wow64 \
            -DCMAKE_TOOLCHAIN_FILE=Data/CMake/toolchain_mingw.cmake \
            -DMINGW_TRIPLE=aarch64-w64-mingw32

          cmake --build build-aarch64 --parallel "$(nproc)"
          cmake --install build-aarch64

      # ==========================================================
      # 16. Select Wine source
      # ==========================================================
      - name: Fetch Wine source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$WINE_SOURCE_DIR"

          case "${{ inputs.wine_source || 'staging' }}" in
            vanilla)
              git clone https://github.com/wine-mirror/wine.git "$WINE_SOURCE_DIR"
              ;;
            staging)
              git clone https://github.com/afeimod/wine-arm.git "$WINE_SOURCE_DIR"
              ;;
            staging-tkg|staging-tkg-fsync)
              git clone https://github.com/Kron4ek/wine-tkg.git "$WINE_SOURCE_DIR"
              ;;
            *)
              echo "Unknown Wine source"
              exit 1
              ;;
          esac

          cd "$WINE_SOURCE_DIR"

          if [ "${{ inputs.wine_ref || 'master' }}" != "latest" ]; then
            git checkout "${{ inputs.wine_ref || 'master' }}"
          fi

          git submodule update --init --recursive || true

          test -f configure.ac

      # ==========================================================
      # 17. Apply repository-local Wine patches
      # ==========================================================
      - name: Apply Wine patches
        shell: bash
        run: |
          set -euxo pipefail

          cd "$WINE_SOURCE_DIR"

          PATCH_ROOT="$GITHUB_WORKSPACE/patches"

          if [ ! -d "$PATCH_ROOT" ]; then
            echo "No patches/ directory."
            exit 0
          fi

          shopt -s nullglob
          PATCHES=( "$PATCH_ROOT"/*.patch )

          if [ "${#PATCHES[@]}" -eq 0 ]; then
            echo "No repository-local Wine patches."
            exit 0
          fi

          for patch in "${PATCHES[@]}"; do
            name="$(basename "$patch")"

            if [ "$name" = "dlls_ntdll_unix_env.c.patch" ]; then
              echo "Skipping intentionally excluded patch: $name"
              continue
            fi

            echo "Applying: $patch"

            if ! patch -p1 --forward < "$patch"; then
              echo "WARNING: patch failed: $patch"
            fi
          done

      # ==========================================================
      # 18. Termux runtime /tmp
      # ==========================================================
      - name: Apply Termux runtime temporary path
        shell: bash
        run: |
          set -euxo pipefail

          cd "$WINE_SOURCE_DIR"

          if [ -d "$GITHUB_WORKSPACE/patches" ]; then
            echo "Runtime /tmp handling is expected from the local patch set."
          fi

      # ==========================================================
      # 19. Regenerate Wine configure
      # ==========================================================
      - name: Regenerate Wine configure
        shell: bash
        run: |
          set -euxo pipefail

          cd "$WINE_SOURCE_DIR"

          if [ -x ./autogen.sh ]; then
            ./autogen.sh
          elif [ ! -x ./configure ]; then
            autoreconf -fi
          fi

          test -x configure

      # ==========================================================
      # 20. Build native Wine tools
      #
      # Native tools run on the CI aarch64 host.
      # They are NOT Termux runtime binaries.
      #
      # Install them to $WINE64_DIR so that --with-wine-tools
      # can point at it directly.
      # ==========================================================
      - name: Build native Wine tools
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$WINE64_DIR"
          mkdir -p "$WINE64_DIR/source"

          rsync -a "$WINE_SOURCE_DIR/" "$WINE64_DIR/source/"

          cd "$WINE64_DIR/source"

          rm -rf build-native
          mkdir build-native
          cd build-native

          ../configure \
            --enable-win64 \
            --disable-tests \
            --prefix="$WINE64_DIR"

          make -j"$(nproc)" __tooldeps__ nls
          make -j"$(nproc)" install

      # ==========================================================
      # 21. Verify native Wine tools
      # ==========================================================
      - name: Verify native Wine tools
        shell: bash
        run: |
          set -euxo pipefail

          test -d "$WINE64_DIR/nls"
          test -d "$WINE64_DIR/tools" || true

          find "$WINE64_DIR" -maxdepth 3 -type f -perm -111 | head -100

      # ==========================================================
      # 22. Configure ARM64 WOW64
      #
      # IMPORTANT:
      #  - Native AArch64 host, no --host / --build.
      #  - No --dynamic-linker / runtime -rpath here.
      #    Those are applied at packaging time with patchelf.
      # ==========================================================
      - name: Configure Wine ARM64 WOW64
        shell: bash
        run: |
          set -euxo pipefail

          cd "$WINE_SOURCE_DIR"

          rm -rf build-arm64
          mkdir build-arm64
          cd build-arm64

          export CC="$TERMUX_GLIBC_CC"
          export CXX="$TERMUX_GLIBC_CXX"

          GLIBC="$CI_GLIBC_PREFIX"

          export CPPFLAGS="-I${GLIBC}/include"
          export CFLAGS="-O2 -pipe -I${GLIBC}/include"
          export CXXFLAGS="-O2 -pipe -I${GLIBC}/include"
          export CROSSCFLAGS="$CFLAGS"
          export CROSSCXXFLAGS="$CXXFLAGS"

          # ------------------------------------------------------
          # pkg-config
          #
          # Do not use Debian ARM64 pkgconfig directories.
          # ------------------------------------------------------
          unset PKG_CONFIG_SYSROOT_DIR
          unset PKG_CONFIG_PATH
          unset PKG_CONFIG_LIBDIR

          export PKG_CONFIG_LIBDIR="${GLIBC}/lib/pkgconfig:${GLIBC}/share/pkgconfig"
          export PKG_CONFIG_PATH="$PKG_CONFIG_LIBDIR"

          # ------------------------------------------------------
          # Linker
          #
          # Only -L to the Termux glibc staging.
          # NO --dynamic-linker, NO runtime -rpath.
          # ------------------------------------------------------
          export LDFLAGS="-L${GLIBC}/lib"

          export WINE_NLS_DIR="$WINE64_DIR/nls"

          EXTRA_ARGS=()

          if [ "$WITH_GSTREAMER" = "on" ]; then
            EXTRA_ARGS+=( --with-gstreamer )
          else
            EXTRA_ARGS+=( --without-gstreamer )
          fi

          ../configure \
            --prefix="$WINE_INSTALL_PREFIX" \
            --with-mingw=clang \
            --enable-archs=arm64ec,aarch64,i386 \
            --enable-tools \
            --disable-tests \
            --with-vulkan \
            --with-wine-tools="$WINE64_DIR" \
            "${EXTRA_ARGS[@]}" \
            CC="$CC" \
            CXX="$CXX" \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            CXXFLAGS="$CXXFLAGS" \
            LDFLAGS="$LDFLAGS"

      # ==========================================================
      # 23. Build Wine
      # ==========================================================
      - name: Build Wine ARM64 WOW64
        shell: bash
        run: |
          set -euxo pipefail

          cd "$WINE_SOURCE_DIR/build-arm64"

          make -j"$(nproc)"

      # ==========================================================
      # 24. Install Wine
      # ==========================================================
      - name: Install Wine ARM64 WOW64
        shell: bash
        run: |
          set -euxo pipefail

          cd "$WINE_SOURCE_DIR/build-arm64"

          rm -rf "$WINE_INSTALL_PREFIX"

          make install

          test -x "$WINE_INSTALL_PREFIX/bin/wine"
          test -x "$WINE_INSTALL_PREFIX/bin/wineserver"

      # ==========================================================
      # 25. Complete Wine runtime
      # ==========================================================
      - name: Complete Wine runtime
        shell: bash
        run: |
          set -euxo pipefail

          INSTALL="$WINE_INSTALL_PREFIX"

          mkdir -p \
            "$INSTALL/nls" \
            "$INSTALL/etc" \
            "$INSTALL/share/wine" \
            "$INSTALL/lib/wine/aarch64-windows"

          # ------------------------------------------------------
          # NLS
          # ------------------------------------------------------
          if [ -d "$WINE64_DIR/nls" ]; then
            cp -a "$WINE64_DIR/nls/." "$INSTALL/nls/"
          fi

          # ------------------------------------------------------
          # wine.inf
          # ------------------------------------------------------
          find "$WINE_SOURCE_DIR/build-arm64" \
            -name wine.inf \
            -type f \
            -exec cp {} "$INSTALL/share/wine/" \; \
            || true

          # ------------------------------------------------------
          # machine-id
          # ------------------------------------------------------
          printf '%s\n' '00000000000000000000000000000000' \
            > "$INSTALL/etc/machine-id"

          # ------------------------------------------------------
          # FEX ARM64EC
          # ------------------------------------------------------
          for dir in \
            /opt/FEX/install-arm64ec/usr/lib/wine/aarch64-windows \
            /opt/FEX/install-arm64ec/lib/wine/aarch64-windows \
            /opt/FEX/install-arm64ec/lib/wine
          do
            if [ -d "$dir" ]; then
              find "$dir" \
                -maxdepth 1 \
                -type f \
                \( -name '*.dll' -o -name '*.exe' \) \
                -exec cp -f {} "$INSTALL/lib/wine/aarch64-windows/" \; \
                || true
            fi
          done

          # ------------------------------------------------------
          # FEX AArch64
          # ------------------------------------------------------
          for dir in \
            /opt/FEX/install-wow64/usr/lib/wine/aarch64-windows \
            /opt/FEX/install-wow64/lib/wine/aarch64-windows \
            /opt/FEX/install-wow64/lib/wine
          do
            if [ -d "$dir" ]; then
              find "$dir" \
                -maxdepth 1 \
                -type f \
                \( -name '*.dll' -o -name '*.exe' \) \
                -exec cp -n {} "$INSTALL/lib/wine/aarch64-windows/" \; \
                || true
            fi
          done

      # ==========================================================
      # 26. Check Wine installation
      # ==========================================================
      - name: Validate Wine installation
        shell: bash
        run: |
          set -euxo pipefail

          INSTALL="$WINE_INSTALL_PREFIX"

          test -d "$INSTALL/bin"
          test -d "$INSTALL/lib/wine"
          test -d "$INSTALL/lib/wine/aarch64-windows"
          test -x "$INSTALL/bin/wine"
          test -x "$INSTALL/bin/wineserver"

          echo "Wine installation:"
          du -sh "$INSTALL"

      # ==========================================================
      # 27. ELF validation (before patchelf)
      # ==========================================================
      - name: Validate Wine ELF interpreter (pre-patchelf)
        shell: bash
        run: |
          set -euxo pipefail

          INSTALL="$WINE_INSTALL_PREFIX"

          for f in \
            "$INSTALL/bin/wine" \
            "$INSTALL/bin/wineserver" \
            "$INSTALL/bin/wineboot" \
            "$INSTALL/bin/winecfg"
          do
            if [ ! -f "$f" ]; then
              continue
            fi

            echo "================================"
            echo "$f"
            echo "================================"

            file "$f"

            echo "INTERP:"
            readelf -l "$f" 2>/dev/null \
              | grep -E 'Requesting program interpreter|INTERP' \
              || true

            echo "DYNAMIC:"
            readelf -d "$f" 2>/dev/null \
              | grep -E 'NEEDED|RPATH|RUNPATH' \
              || true
          done

      # ==========================================================
      # 28. Patch Termux interpreter (packaging phase)
      #
      # All ELF binaries are rewritten so that:
      #   - interpreter -> Termux glibc loader
      #   - rpath       -> Termux glibc / Wine lib
      #
      # This is the ONLY place where runtime paths are injected.
      # ==========================================================
      - name: Patch Termux interpreter
        shell: bash
        run: |
          set -euxo pipefail

          INSTALL="$WINE_INSTALL_PREFIX"
          RUNTIME_LOADER="$RUNTIME_GLIBC_PREFIX/lib/ld-linux-aarch64.so.1"
          RUNTIME_LIB="$RUNTIME_GLIBC_PREFIX/lib"
          RUNTIME_WINE_LIB="$RUNTIME_WINE_PREFIX/lib"

          echo "Runtime loader: $RUNTIME_LOADER"
          echo "Runtime lib:    $RUNTIME_LIB"
          echo "Wine lib:       $RUNTIME_WINE_LIB"

          patched=0
          skipped=0

          while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'ELF'; then
              if patchelf \
                --set-interpreter "$RUNTIME_LOADER" \
                --set-rpath "$RUNTIME_LIB:$RUNTIME_WINE_LIB" \
                "$f" 2>/dev/null
              then
                patched=$((patched + 1))
              else
                skipped=$((skipped + 1))
              fi
            fi
          done < <(find "$INSTALL" -type f -print0)

          echo "patched=$patched skipped=$skipped"

      # ==========================================================
      # 29. Strip
      # ==========================================================
      - name: Strip Wine binaries
        shell: bash
        run: |
          set -euxo pipefail

          INSTALL="$WINE_INSTALL_PREFIX"

          case "$STRIP_MODE" in
            none)
              echo "STRIP_MODE=none"
              ;;

            debug)
              echo "STRIP_MODE=debug"
              find "$INSTALL" -type f -print0 \
                | xargs -0 -P "$(nproc)" -I{} sh -c '
                    if file "$1" | grep -q "ELF"; then
                      aarch64-linux-gnu-strip --strip-debug "$1" || true
                    fi                  ' _ {}
              ;;

            all)
              echo "STRIP_MODE=all"
              find "$INSTALL" -type f -print0 \
                | xargs -0 -P "$(nproc)" -I{} sh -c '
                    if file "$1" | grep -q "ELF"; then
                      aarch64-linux-gnu-strip --strip-all "$1" || true
                    fi
                  ' _ {}
              ;;

            *)
              echo "Unknown STRIP_MODE=$STRIP_MODE"
              exit 1
              ;;
          esac

      # ==========================================================
      # 30. Re-check loader after strip + patchelf
      # ==========================================================
      - name: Verify runtime loader
        shell: bash
        run: |
          set -euxo pipefail

          INSTALL="$WINE_INSTALL_PREFIX"

          for f in \
            "$INSTALL/bin/wine" \
            "$INSTALL/bin/wineserver" \
            "$INSTALL/bin/wineboot"
          do
            if [ ! -f "$f" ]; then
              continue
            fi

            readelf -l "$f" | grep -F \
              "$RUNTIME_GLIBC_PREFIX/lib/ld-linux-aarch64.so.1"
          done

      # ==========================================================
      # 31. Check CI/Debian sysroot contamination
      # ==========================================================
      - name: Check forbidden sysroot paths
        shell: bash
        run: |
          set -euxo pipefail

          INSTALL="$WINE_INSTALL_PREFIX"

          FORBIDDEN_REGEX='/usr/lib/aarch64-linux-gnu|/lib/aarch64-linux-gnu|/opt/termuxfs|termux-glibc-staging'

          HITS="$(
            find "$INSTALL" -type f -print0 \
              | xargs -0 -P "$(nproc)" grep -l -a -E "$FORBIDDEN_REGEX" 2>/dev/null \
              || true
          )"

          if [ -n "$HITS" ]; then
            echo "ERROR: CI/Debian sysroot path leaked into Wine:"
            echo "$HITS"
            exit 1
          fi

          echo "No forbidden CI sysroot paths found."

      # ==========================================================
      # 32. Check runtime path
      # ==========================================================
      - name: Check Termux runtime paths
        shell: bash
        run: |
          set -euxo pipefail

          INSTALL="$WINE_INSTALL_PREFIX"

          echo "Expected runtime glibc: $RUNTIME_GLIBC_PREFIX"
          echo "Expected runtime Wine:  $RUNTIME_WINE_PREFIX"
          echo "Expected runtime tmp:   $RUNTIME_TMPDIR"

          if grep -R -a "$CI_GLIBC_PREFIX" "$INSTALL" 2>/dev/null; then
            echo "ERROR: CI glibc path leaked into final Wine."
            exit 1
          fi

      # ==========================================================
      # 33. Validate FEX PE files
      # ==========================================================
      - name: Validate FEX PE files
        shell: bash
        run: |
          set -euxo pipefail

          INSTALL="$WINE_INSTALL_PREFIX"

          COUNT=0

          while IFS= read -r -d '' f; do
            COUNT=$((COUNT + 1))
            echo "----- FEX PE -----"
            echo "$f"
            file "$f"
          done < <(
            find "$INSTALL/lib/wine/aarch64-windows" \
              -type f \
              \( -name '*.dll' -o -name '*.exe' \) \
              -print0
          )

          echo "FEX PE count: $COUNT"

      # ==========================================================
      # 34. Check Wine Windows architectures
      # ==========================================================
      - name: Check Wine Windows architectures
        shell: bash
        run: |
          set -euxo pipefail

          INSTALL="$WINE_INSTALL_PREFIX"

          echo "Searching Wine architecture directories..."

          find "$INSTALL/lib/wine" -maxdepth 2 -type d | sort

      # ==========================================================
      # 35. Optional GStreamer runtime files
      # ==========================================================
      - name: Check GStreamer support
        shell: bash
        run: |
          set -euxo pipefail

          INSTALL="$WINE_INSTALL_PREFIX"

          echo "Wine GStreamer files:"

          find "$INSTALL" \
            -type f \
            \( -name '*gstreamer*' -o -name 'winegstreamer*' \) \
            | sort \
            | head -200

      # ==========================================================
      # 36. Generate runtime environment
      # ==========================================================
      - name: Generate Termux runtime environment
        shell: bash
        run: |
          set -euxo pipefail

          INSTALL="$WINE_INSTALL_PREFIX"

          mkdir -p "$INSTALL"

          cat > "$INSTALL/wine-termux-env.sh" <<'EOF'
#!/data/data/com.termux/files/usr/bin/bash

export TERMUX_PREFIX=/data/data/com.termux/files/usr
export GLIBC_PREFIX=/data/data/com.termux/files/usr/glibc
export WINE_PREFIX=/data/data/com.termux/files/usr/glibc/opt/wine

export TMPDIR=/data/data/com.termux/files/usr/tmp/runtime

export PATH="$GLIBC_PREFIX/bin:$WINE_PREFIX/bin:$TERMUX_PREFIX/bin:$PATH"

export LD_LIBRARY_PATH="$GLIBC_PREFIX/lib:$WINE_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

export XDG_RUNTIME_DIR="$TMPDIR"

export DISPLAY="${DISPLAY:-:0}"
export GDK_BACKEND="${GDK_BACKEND:-x11}"
export XDG_SESSION_TYPE="${XDG_SESSION_TYPE:-x11}"

export VK_ICD_FILENAMES="${VK_ICD_FILENAMES:-$GLIBC_PREFIX/share/vulkan/icd.d/freedreno_icd.aarch64.json}"

export MESA_LOADER_DRIVER_OVERRIDE="${MESA_LOADER_DRIVER_OVERRIDE:-zink}"
export GALLIUM_DRIVER="${GALLIUM_DRIVER:-zink}"
export MESA_GLTHREAD="${MESA_GLTHREAD:-true}"
EOF

          chmod +x "$INSTALL/wine-termux-env.sh"

      # ==========================================================
      # 37. Runtime launcher
      # ==========================================================
      - name: Generate Wine launcher
        shell: bash
        run: |
          set -euxo pipefail

          INSTALL="$WINE_INSTALL_PREFIX"

          cat > "$INSTALL/wine-termux" <<'EOF'
#!/data/data/com.termux/files/usr/bin/bash

set -e

PREFIX=/data/data/com.termux/files/usr
GLIBC_PREFIX="$PREFIX/glibc"
WINE_PREFIX="$GLIBC_PREFIX/opt/wine"
TMPDIR="$PREFIX/tmp/runtime"

export PATH="$GLIBC_PREFIX/bin:$WINE_PREFIX/bin:$PREFIX/bin:$PATH"
export LD_LIBRARY_PATH="$GLIBC_PREFIX/lib:$WINE_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

export TMPDIR
export XDG_RUNTIME_DIR="$TMPDIR"

export DISPLAY="${DISPLAY:-:0}"
export GDK_BACKEND="${GDK_BACKEND:-x11}"
export XDG_SESSION_TYPE="${XDG_SESSION_TYPE:-x11}"

exec "$WINE_PREFIX/bin/wine" "$@"
EOF

          chmod +x "$INSTALL/wine-termux"

      # ==========================================================
      # 38. Final file inventory
      # ==========================================================
      - name: Generate build manifest
        shell: bash
        run: |
          set -euxo pipefail

          INSTALL="$WINE_INSTALL_PREFIX"

          mkdir -p "$GITHUB_WORKSPACE/release"

          {
            echo "Wine ARM64 WOW64"
            echo

            echo "Wine source:"
            git -C "$WINE_SOURCE_DIR" describe --always --dirty
            echo

            echo "Wine commit:"
            git -C "$WINE_SOURCE_DIR" rev-parse HEAD
            echo

            echo "CGCT:"
            "$TERMUX_GLIBC_CC" --version | head -1
            echo

            echo "glibc loader:"
            echo "$RUNTIME_GLIBC_PREFIX/lib/ld-linux-aarch64.so.1"
            echo

            echo "Wine prefix:"
            echo "$RUNTIME_WINE_PREFIX"
            echo

            echo "Runtime tmp:"
            echo "$RUNTIME_TMPDIR"
            echo

            echo "Strip mode:"
            echo "$STRIP_MODE"
            echo

            echo "GStreamer:"
            echo "$WITH_GSTREAMER"
            echo

            echo "Architectures:"
            echo "arm64ec"
            echo "aarch64"
            echo "i386"
          } > "$GITHUB_WORKSPACE/release/build-info.txt"

          find "$INSTALL" -type f | sort \
            > "$GITHUB_WORKSPACE/release/file-list.txt"

      # ==========================================================
      # 39. Package
      # ==========================================================
      - name: Package Wine
        shell: bash
        run: |
          set -euxo pipefail

          INSTALL="$WINE_INSTALL_PREFIX"
          BUILD_NAME="wine-arm64-wow64-termux-glibc"

          tar \
            -C "$INSTALL" \
            -cJf \
            "$GITHUB_WORKSPACE/release/${BUILD_NAME}.tar.xz" \
            .

          sha256sum \
            "$GITHUB_WORKSPACE/release/${BUILD_NAME}.tar.xz" \
            > "$GITHUB_WORKSPACE/release/${BUILD_NAME}.sha256"

      # ==========================================================
      # 40. Show package
      # ==========================================================
      - name: Show package information
        shell: bash
        run: |
          set -euxo pipefail

          ls -lh "$GITHUB_WORKSPACE/release/"

          sha256sum "$GITHUB_WORKSPACE/release/"* || true

      # ==========================================================
      # 41. Upload artifact
      # ==========================================================
      - name: Upload Wine artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-arm64-wow64-termux-glibc
          path: |
            release/*.tar.xz
            release/*.sha256
            release/*.txt

      # ==========================================================
      # 42. GitHub Release
      # ==========================================================
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wine-arm64-wow64-${{ github.run_number }}
          name: Wine ARM64 WOW64 Termux glibc #${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/*.tar.xz
            release/*.sha256
            release/*.txt
