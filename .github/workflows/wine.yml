name: Wine ARM64 WOW64 构建（llvm-mingw + FEX，Debian 12）

on:
  schedule:
    - cron: '0 2 5,20 * *'

  workflow_dispatch:
    inputs:
      wine_branch:
        description: 'Wine 分支'
        required: false
        default: 'staging'
        type: choice
        options:
          - vanilla
          - proton9-arm64ec
          - staging
          - staging-tkg
          - staging-tkg-fsync

      fex_ref:
        description: 'FEX-Emu tag/branch/commit。建议生产构建锁定 tag/commit'
        required: false
        default: 'main'
        type: string

      preloader:
        description: '是否使用 wine-preloader'
        required: false
        default: 'on'
        type: choice
        options:
          - on
          - off

      android_execmem_patch:
        description: 'Android SELinux EXECUTE_READWRITE workaround'
        required: false
        default: 'off'
        type: choice
        options:
          - on
          - off

      address_space_patch:
        description: '缩减 Wine 地址空间上限'
        required: false
        default: 'off'
        type: choice
        options:
          - on
          - off

      wine_version:
        description: 'Wine 版本，例如 9.22；latest 表示默认分支'
        required: false
        default: 'latest'
        type: string

      build_type:
        description: '构建类型'
        required: false
        default: 'wow64'
        type: choice
        options:
          - wow64
          - proton

env:
  LLVMMINGW_DATE: 20251202
  LLVMMINGW_NAME: llvm-mingw-20251202-ucrt-ubuntu-22.04-x86_64

  WINE64_DIR: /opt/wine64
  WINE_SOURCE_DIR: /opt/wine-src
  FEX_SOURCE_DIR: /opt/FEX

  DEBIAN_FRONTEND: noninteractive

  FEX_REF: ${{ github.event.inputs.fex_ref || 'main' }}

permissions:
  contents: write

jobs:

  build-wine-wow64:

    runs-on: ubuntu-latest

    container:
      image: debian:12
      options: --user root

    timeout-minutes: 240

    steps:

      # ============================================================
      # 1. 基础工具
      # ============================================================

      - name: 安装基础工具
        run: |
          set -eux

          apt-get update

          apt-get install -y --no-install-recommends \
            ca-certificates \
            wget \
            curl \
            git \
            gnupg \
            sudo \
            xz-utils \
            g++ \
            file \
            jq \
            unzip \
            rsync

      - uses: actions/checkout@v4


      # ============================================================
      # 2. Debian multiarch
      # ============================================================

      - name: 配置 APT multiarch
        run: |
          set -eux

          rm -f /etc/apt/sources.list.d/debian.sources
          rm -f /etc/apt/sources.list.bak

          cat > /etc/apt/sources.list << 'EOF'
          deb [arch=amd64,arm64] http://deb.debian.org/debian bookworm main contrib non-free
          deb [arch=amd64,arm64] http://deb.debian.org/debian bookworm-updates main contrib non-free
          deb [arch=amd64,arm64] http://security.debian.org/debian-security bookworm-security main contrib non-free
          EOF

          dpkg --add-architecture arm64

          apt-get update

          apt-get install -y --no-install-recommends \
            hello:arm64

          file /usr/bin/hello || true
          dpkg --print-architecture
          dpkg --print-foreign-architectures


      # ============================================================
      # 3. 构建依赖
      # ============================================================

      - name: 安装构建依赖
        run: |
          set -eux

          apt-get install -y --no-install-recommends \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc-dev-arm64-cross \
            libstdc++6-arm64-cross \
            libstdc++-12-dev-arm64-cross \
            build-essential \
            libc-devtools \
            less \
            nano \
            python3 \
            python3-setuptools \
            python3-pip \
            clang \
            llvm \
            lld \
            screen \
            flex \
            bison \
            nasm \
            gettext \
            make \
            automake \
            autoconf \
            pkg-config \
            libtool \
            gtk-doc-tools \
            dpkg-dev \
            fakeroot \
            debhelper \
            dh-make \
            cmake \
            ninja-build \
            libfreetype6-dev \
            libglib2.0-dev \
            libltdl-dev \
            libxcb1-dev \
            libx11-dev \
            libxinerama-dev \
            libfontconfig-dev \
            libfontconfig1-dev \
            librsvg2-bin \
            libx11-dev:arm64 \
            libxinerama-dev:arm64 \
            libfreetype6-dev:arm64 \
            libfontconfig1-dev:arm64 \
            libfontconfig-dev:arm64 \
            libltdl-dev:arm64 \
            libxcb1-dev:arm64 \
            libglib2.0-dev:arm64 \
            libepoxy-dev:arm64 \
            libsdl2-dev:arm64 \
            libxcursor-dev:arm64 \
            libxi-dev:arm64 \
            libxshmfence-dev:arm64 \
            libxxf86vm-dev:arm64 \
            libxrandr-dev:arm64 \
            libxrender-dev:arm64 \
            libxfixes-dev:arm64 \
            libxcomposite-dev:arm64 \
            libdbus-1-dev:arm64 \
            libsane-dev:arm64 \
            libusb-1.0-0-dev:arm64 \
            libv4l-dev:arm64 \
            libpulse-dev:arm64 \
            libgstreamer1.0-dev:arm64 \
            libgstreamer-plugins-base1.0-dev:arm64 \
            libgstreamer-plugins-bad1.0-dev:arm64 \
            libudev-dev:arm64 \
            libunwind-dev:arm64 \
            libkrb5-dev:arm64 \
            libvulkan-dev:arm64 \
            libgl-dev:arm64 \
            libavcodec-dev:arm64 \
            libavformat-dev:arm64 \
            libavutil-dev:arm64 \
            libswresample-dev:arm64 \
            libswscale-dev:arm64 \
            libgnutls28-dev:arm64 \
            libcups2-dev:arm64 \
            libxkbcommon-dev:arm64 \
            libxkbregistry-dev:arm64 \
            libwayland-dev:arm64 \
            libidn2-0:arm64


      # ============================================================
      # 4. llvm-mingw
      # ============================================================

      - name: 下载 llvm-mingw
        run: |
          set -eux

          mkdir -p /opt
          cd /opt

          wget -q \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVMMINGW_DATE}/${LLVMMINGW_NAME}.tar.xz"

          tar -xJf "${LLVMMINGW_NAME}.tar.xz"

          rm -f "${LLVMMINGW_NAME}.tar.xz"

          echo "/opt/${LLVMMINGW_NAME}/bin" >> "$GITHUB_PATH"

          export PATH="/opt/${LLVMMINGW_NAME}/bin:$PATH"

          echo "=== llvm-mingw ==="

          command -v aarch64-w64-mingw32-clang
          command -v arm64ec-w64-mingw32-clang
          command -v x86_64-w64-mingw32-clang
          command -v i686-w64-mingw32-clang || true

          aarch64-w64-mingw32-clang --version
          arm64ec-w64-mingw32-clang --version


      # ============================================================
      # 5. 获取并锁定 FEX
      # ============================================================

      - name: 获取 FEX-Emu
        run: |
          set -eux

          rm -rf "$FEX_SOURCE_DIR"

          git clone \
            https://github.com/FEX-Emu/FEX.git \
            "$FEX_SOURCE_DIR"

          cd "$FEX_SOURCE_DIR"

          git fetch --tags --force

          git checkout "${FEX_REF}"

          git submodule update --init --recursive

          FEX_COMMIT="$(git rev-parse HEAD)"
          FEX_COMMIT_SHORT="$(git rev-parse --short=12 HEAD)"
          FEX_DESCRIBE="$(git describe --tags --always --dirty 2>/dev/null || true)"

          echo "FEX_COMMIT=$FEX_COMMIT" >> "$GITHUB_ENV"
          echo "FEX_COMMIT_SHORT=$FEX_COMMIT_SHORT" >> "$GITHUB_ENV"
          echo "FEX_DESCRIBE=$FEX_DESCRIBE" >> "$GITHUB_ENV"

          echo "================================"
          echo "FEX describe : $FEX_DESCRIBE"
          echo "FEX commit   : $FEX_COMMIT"
          echo "================================"

          if [ "${FEX_REF}" = "main" ]; then
            echo "::warning::FEX 使用 main。生产构建建议固定 tag/commit。"
          fi


      # ============================================================
      # 6. 构建 FEX ARM64EC + WOW64 + UnixLib
      # ============================================================

      - name: 构建 FEX 三组件
        run: |
          set -eux

          export PATH="/opt/${LLVMMINGW_NAME}/bin:$PATH"

          cd "$FEX_SOURCE_DIR"

          rm -rf \
            build-arm64ec \
            build-wow64 \
            build-unixlib \
            install

          mkdir -p \
            build-arm64ec \
            build-wow64 \
            build-unixlib \
            install

          # --------------------------------------------------------
          # FEX 通用参数
          # --------------------------------------------------------

          FEX_COMMON="
            -DCMAKE_BUILD_TYPE=Release
            -DENABLE_LTO=False
            -DBUILD_TESTING=False
            -DENABLE_JEMALLOC_GLIBC_ALLOC=False
            -DENABLE_ASSERTIONS=False
            -DTUNE_CPU=generic
            -DTUNE_ARCH=generic
            -DOVERRIDE_VERSION=${FEX_DESCRIBE}
            -DOVERRIDE_HASH=${FEX_COMMIT_SHORT}
            -DCMAKE_INSTALL_PREFIX=/usr
            -DCMAKE_INSTALL_LIBDIR=/
          "

          # --------------------------------------------------------
          # ARM64EC
          # --------------------------------------------------------

          echo "=========================================="
          echo "BUILD FEX ARM64EC"
          echo "=========================================="

          cd "$FEX_SOURCE_DIR/build-arm64ec"

          cmake -GNinja \
            ${FEX_COMMON} \
            -DCMAKE_TOOLCHAIN_FILE="$FEX_SOURCE_DIR/Data/CMake/toolchain_mingw.cmake" \
            -DMINGW_TRIPLE=arm64ec-w64-mingw32 \
            ..

          ninja -j"$(nproc)"
          DESTDIR="$FEX_SOURCE_DIR/install" ninja install


          # --------------------------------------------------------
          # WOW64
          # --------------------------------------------------------

          echo "=========================================="
          echo "BUILD FEX WOW64"
          echo "=========================================="

          cd "$FEX_SOURCE_DIR/build-wow64"

          cmake -GNinja \
            ${FEX_COMMON} \
            -DCMAKE_TOOLCHAIN_FILE="$FEX_SOURCE_DIR/Data/CMake/toolchain_mingw.cmake" \
            -DMINGW_TRIPLE=aarch64-w64-mingw32 \
            ..

          ninja -j"$(nproc)"
          DESTDIR="$FEX_SOURCE_DIR/install" ninja install


          # --------------------------------------------------------
          # UnixLib
          # --------------------------------------------------------

          echo "=========================================="
          echo "BUILD FEX UnixLib"
          echo "=========================================="

          cd "$FEX_SOURCE_DIR/build-unixlib"

          CC=clang \
          CXX=clang++ \
          cmake -GNinja \
            ${FEX_COMMON} \
            "$FEX_SOURCE_DIR/Source/Windows/UnixLib"

          ninja -j"$(nproc)"
          DESTDIR="$FEX_SOURCE_DIR/install" ninja install


          # --------------------------------------------------------
          # 输出结果
          # --------------------------------------------------------

          echo "=========================================="
          echo "FEX INSTALL TREE"
          echo "=========================================="

          find "$FEX_SOURCE_DIR/install" \
            -type f \
            -o -type l \
            | sort


      # ============================================================
      # 7. 验证 FEX 输出
      # ============================================================

      - name: 验证 FEX 输出
        run: |
          set -eux

          FEX_ROOT="$FEX_SOURCE_DIR/install"

          echo "=== FEX ARM64EC ==="
          find "$FEX_ROOT" \
            -iname 'libarm64ecfex.dll' \
            -print

          echo "=== FEX WOW64 ==="
          find "$FEX_ROOT" \
            -iname 'libwow64fex.dll' \
            -print

          echo "=== FEX UnixLib ==="
          find "$FEX_ROOT" \
            -path '*aarch64-unix*' \
            -type f \
            -print

          ARM64EC_DLL="$(find "$FEX_ROOT" -name libarm64ecfex.dll -type f | head -1)"
          WOW64_DLL="$(find "$FEX_ROOT" -name libwow64fex.dll -type f | head -1)"

          test -n "$ARM64EC_DLL"
          test -n "$WOW64_DLL"

          echo "ARM64EC DLL: $ARM64EC_DLL"
          echo "WOW64 DLL  : $WOW64_DLL"

          file "$ARM64EC_DLL"
          file "$WOW64_DLL"

          echo "=== FEX DLL PE header ==="

          objdump -f "$ARM64EC_DLL" || true
          objdump -f "$WOW64_DLL" || true


      # ============================================================
      # 8. 中文 locale
      # ============================================================

      - name: 设置中文语言环境
        run: |
          set -eux

          apt-get install -y --no-install-recommends locales

          sed -i \
            '/zh_CN.UTF-8/s/^# //g' \
            /etc/locale.gen

          locale-gen

          echo "LANG=zh_CN.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=zh_CN.UTF-8" >> "$GITHUB_ENV"


      # ============================================================
      # 9. 获取 Wine
      # ============================================================

      - name: 获取 Wine 源码
        run: |
          set -eux

          WINE_BRANCH="${{ github.event.inputs.wine_branch || 'staging' }}"
          WINE_VERSION="${{ github.event.inputs.wine_version || 'latest' }}"

          mkdir -p "$WINE_SOURCE_DIR"

          cd "$WINE_SOURCE_DIR"

          case "$WINE_BRANCH" in

            staging-tkg|staging-tkg-fsync)

              git clone \
                https://github.com/Kron4ek/wine-tkg.git \
                source

              cd source

              git config advice.detachedHead false

              if [ "$WINE_BRANCH" = "staging-tkg-fsync" ]; then
                git checkout fsync
              fi

              if [ "$WINE_VERSION" != "latest" ]; then
                git checkout "$WINE_VERSION" 2>/dev/null || \
                git checkout "wine-$WINE_VERSION" 2>/dev/null || \
                echo "::warning::无法切换到指定版本，使用当前分支"
              fi

              ;;


            staging)

              git clone \
                https://github.com/afeimod/wine-arm.git \
                source

              cd source

              git config advice.detachedHead false

              if [ "$WINE_VERSION" != "latest" ]; then
                git checkout "wine-$WINE_VERSION"
              fi

              PURE_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo "$WINE_VERSION")"
              PURE_VERSION="${PURE_VERSION#wine-}"

              STAGING_VERSION="v${PURE_VERSION}"

              wget -O \
                "wine-staging-${PURE_VERSION}.tar.gz" \
                "https://github.com/wine-staging/wine-staging/archive/refs/tags/${STAGING_VERSION}.tar.gz" \
                || \
              wget -O \
                "wine-staging-${PURE_VERSION}.tar.gz" \
                "https://github.com/wine-staging/wine-staging/archive/refs/tags/v${PURE_VERSION}.tar.gz"

              if [ -f "wine-staging-${PURE_VERSION}.tar.gz" ]; then

                tar -xzf \
                  "wine-staging-${PURE_VERSION}.tar.gz"

                STAGING_DIR="$(find . -maxdepth 1 -type d -name '*staging*' | head -1)"

                if [ -n "$STAGING_DIR" ] &&
                   [ -d "$STAGING_DIR/staging" ]; then

                  cd "$STAGING_DIR/staging"

                  chmod +x patchinstall.py

                  ./patchinstall.py \
                    --all \
                    --destdir=../../

                  cd ../..

                else
                  echo "::warning::没有找到 staging 补丁目录"
                fi

              else
                echo "::warning::无法下载 Wine Staging 补丁"
              fi
              ;;


            vanilla)

              git clone \
                https://github.com/Pipetto-crypto/wine.git \
                source

              cd source

              git config advice.detachedHead false

              if [ "$WINE_VERSION" != "latest" ]; then

                git checkout "$WINE_VERSION" 2>/dev/null || \
                git checkout "wine-$WINE_VERSION" 2>/dev/null || \
                {
                  echo "错误: 找不到 Wine 版本 $WINE_VERSION"
                  exit 1
                }

              fi
              ;;


            proton9-arm64ec)

              git clone \
                --branch proton-9.0-arm64ec \
                https://github.com/Pipetto-crypto/wine.git \
                source

              cd source

              git config advice.detachedHead false
              ;;


            *)

              echo "未知 Wine 分支: $WINE_BRANCH"
              exit 1
              ;;

          esac

          WINE_COMMIT="$(git rev-parse HEAD)"
          WINE_COMMIT_SHORT="$(git rev-parse --short=12 HEAD)"
          WINE_DESCRIBE="$(git describe --tags --always --dirty 2>/dev/null || true)"

          echo "WINE_COMMIT=$WINE_COMMIT" >> "$GITHUB_ENV"
          echo "WINE_COMMIT_SHORT=$WINE_COMMIT_SHORT" >> "$GITHUB_ENV"
          echo "WINE_DESCRIBE=$WINE_DESCRIBE" >> "$GITHUB_ENV"

          BUILD_NAME="wine-${WINE_DESCRIBE}-${WINE_COMMIT_SHORT}-${WINE_BRANCH}-arm64-wow64"

          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          echo "WINE_VERSION_ACTUAL=$WINE_DESCRIBE" >> "$GITHUB_ENV"

          echo "================================"
          echo "Wine describe : $WINE_DESCRIBE"
          echo "Wine commit   : $WINE_COMMIT"
          echo "Build name    : $BUILD_NAME"
          echo "================================"


      # ============================================================
      # 10. Termux 路径修复
      # ============================================================

      - name: 修复 Termux 路径
        run: |
          set -eux

          cd "$WINE_SOURCE_DIR/source"

          find . \
            -type f \
            \( -name '*.c' -o -name '*.h' -o -name '*.in' -o -name '*.spec' \) \
            -exec grep -l '/tmp/' {} \; \
            2>/dev/null \
            | xargs -r sed -i \
              's|/tmp/|/data/data/com.termux/files/usr/tmp/|g'

          find server \
            -type f \
            \( -name '*.c' -o -name '*.h' \) \
            -exec sed -i \
              's|"/tmp"|"/data/data/com.termux/files/usr/tmp"|g' \
              {} +

          echo "Termux /tmp 路径修复完成"


      # ============================================================
      # 11. GStreamer / FFmpeg
      # ============================================================

      - name: 修复 GStreamer / FFmpeg
        run: |
          set -eux

          cd "$WINE_SOURCE_DIR/source"

          BRANCH="${{ github.event.inputs.wine_branch || 'staging' }}"

          if [ "$BRANCH" = "staging" ] ||
             [ "$BRANCH" = "staging-tkg" ] ||
             [ "$BRANCH" = "staging-tkg-fsync" ]; then

            if wget -q \
              -O fix-build_ffmpeg.patch \
              https://raw.githubusercontent.com/Waim908/wine-termux/main/proton/10.0/fix-build_ffmpeg.patch; then

              patch -p1 -N -t \
                --no-backup-if-mismatch \
                < fix-build_ffmpeg.patch \
                || echo "::warning::FFmpeg 补丁未完全应用"

              rm -f fix-build_ffmpeg.patch

            else
              echo "::warning::无法下载 FFmpeg 补丁"
            fi
          fi

          if grep -q 'gstreamer-gl-1\.0' configure.ac 2>/dev/null; then

            if [ -f /usr/lib/aarch64-linux-gnu/pkgconfig/gstreamer-gl-1.0.pc ]; then
              echo "gstreamer-gl-1.0.pc 存在，保留 configure.ac"

            else

              cp configure.ac configure.ac.bak

              sed -i \
                's/gstreamer-gl-1\.0//g' \
                configure.ac

              if ! autoconf --force >/dev/null 2>&1; then
                echo "::warning::configure.ac 修改后 autoconf 检查失败，恢复"
                mv configure.ac.bak configure.ac
              else
                rm -f configure.ac.bak
              fi

            fi
          fi


      # ============================================================
      # 12. GstMapInfo
      # ============================================================

      - name: 修复 GstMapInfo
        run: |
          set -eux

          cd "$WINE_SOURCE_DIR/source"

          FILES="$(grep -rl \
            'GstBufferMapInfo' \
            dlls \
            2>/dev/null || true)"

          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs -r sed -i \
              's/GstBufferMapInfo/GstMapInfo/g'
          fi


      # ============================================================
      # 13. machine-id
      # ============================================================

      - name: 修复 machine-id
        run: |
          set -eux

          cd "$WINE_SOURCE_DIR/source"

          FILES="$(grep -rl \
            '/etc/machine-id' \
            --include='*.c' \
            --include='*.h' \
            . \
            2>/dev/null || true)"

          if [ -n "$FILES" ]; then

            echo "$FILES" | xargs -r sed -i \
              's|/etc/machine-id|/data/data/com.termux/files/usr/glibc/etc/machine-id|g'

          fi


      # ============================================================
      # 14. 可选 Android EXECMEM patch
      # ============================================================

      - name: Android EXECMEM workaround
        if: ${{ github.event.inputs.android_execmem_patch == 'on' }}
        run: |
          set -eux

          cd "$WINE_SOURCE_DIR/source"

          F="dlls/ntdll/loader.c"

          if [ -f "$F" ]; then

            if grep -q \
              '&size, PAGE_READWRITE, &protect_old\[i\]' \
              "$F"; then

              sed -i \
                's/&size, PAGE_READWRITE, &protect_old\[i\]/\&size, PAGE_EXECUTE_READWRITE, \&protect_old[i]/' \
                "$F"

              echo "EXECUTE_READWRITE workaround applied"

            else
              echo "::warning::没有匹配到目标代码"
            fi

          fi


      # ============================================================
      # 15. 可选地址空间 patch
      # ============================================================

      - name: Android 地址空间 workaround
        if: ${{ github.event.inputs.address_space_patch == 'on' }}
        run: |
          set -eux

          cd "$WINE_SOURCE_DIR/source"

          F="dlls/ntdll/unix/virtual.c"

          if [ ! -f "$F" ]; then
            echo "::warning::$F 不存在"
            exit 0
          fi

          if grep -q '0x7fffffff0000' "$F"; then

            sed -i \
              's/0x7fffffff0000/0x7fffff0000/g' \
              "$F"

          fi

          if grep -q \
            'reserve_area.*0x7ffffe000000' \
            "$F"; then

            sed -i \
              '/reserve_area.*0x7ffffe000000/d' \
              "$F"

          fi


      # ============================================================
      # 16. mfplat
      # ============================================================

      - name: 应用 mfplat 补丁
        run: |
          set -eux

          BUILD_TYPE="${{ github.event.inputs.build_type || 'wow64' }}"
          BRANCH="${{ github.event.inputs.wine_branch || 'staging' }}"

          if [ "$BUILD_TYPE" = "proton" ]; then
            echo "proton 构建跳过 mfplat"
            exit 0
          fi

          case "$BRANCH" in
            staging|staging-tkg|staging-tkg-fsync)
              ;;
            *)
              echo "$BRANCH 跳过 mfplat"
              exit 0
              ;;
          esac

          cd "$WINE_SOURCE_DIR/source"

          PURE_VERSION="${WINE_VERSION_ACTUAL#wine-}"
          VERSION_MAJOR="$(echo "$PURE_VERSION" | cut -d. -f1)"
          VERSION_MINOR="$(echo "$PURE_VERSION" | cut -d. -f2)"

          if [ "${VERSION_MAJOR:-0}" -gt 9 ] ||
             {
               [ "${VERSION_MAJOR:-0}" -eq 9 ] &&
               [ "${VERSION_MINOR:-0}" -ge 10 ];
             }; then

            if wget -q \
              -O wine_do_not_create_dxgi_manager2.patch \
              https://github.com/afeimod/linbox/raw/main/path/wine_do_not_create_dxgi_manager2.patch; then

              patch -p1 -N -t \
                --no-backup-if-mismatch \
                < wine_do_not_create_dxgi_manager2.patch \
                || echo "::warning::mfplat patch 未完全应用"

              rm -f wine_do_not_create_dxgi_manager2.patch
            fi

          else

            if wget -q \
              -O fix_wine9.2_mfplat.sh \
              https://github.com/afeimod/linbox/raw/main/path/fix_wine9.2_mfplat.sh; then

              chmod +x fix_wine9.2_mfplat.sh

              ./fix_wine9.2_mfplat.sh \
                || echo "::warning::旧 mfplat patch 执行失败"

              rm -f fix_wine9.2_mfplat.sh
            fi

          fi


      # ============================================================
      # 17. autogen
      # ============================================================

      - name: 生成 configure
        run: |
          set -eux

          cd "$WINE_SOURCE_DIR/source"

          if [ ! -f configure ]; then
            ./autogen.sh
          fi


      # ============================================================
      # 18. 构建 native Wine tools
      # ============================================================

      - name: 构建 native Wine tools
        run: |
          set -eux

          mkdir -p "$WINE64_DIR"

          cp -a \
            "$WINE_SOURCE_DIR/source" \
            "$WINE64_DIR/source"

          cd "$WINE64_DIR"

          mkdir -p amd64

          cd amd64

          ../source/configure \
            --enable-win64 \
            --prefix=/usr/local

          make __tooldeps__ -j"$(nproc)"

          make -C nls

          mkdir -p /opt/nls-backup

          cp -aL \
            nls/. \
            /opt/nls-backup/

          test -f /opt/nls-backup/locale.nls

          echo "NLS backup OK"


      # ============================================================
      # 19. native tools copy
      # ============================================================

      - name: 准备 Wine native tools
        run: |
          set -eux

          mkdir -p /opt/wine64-native

          cp -aL \
            "$WINE64_DIR/amd64/." \
            /opt/wine64-native/

          test -f \
            /opt/wine64-native/nls/locale.nls


      # ============================================================
      # 20. ARM64 WOW64 configure
      # ============================================================

      - name: 配置 ARM64 WOW64
        run: |
          set -eux

          cd "$WINE_SOURCE_DIR/source"

          rm -rf build-arm64

          mkdir build-arm64
          cd build-arm64

          export PATH="/opt/${LLVMMINGW_NAME}/bin:$PATH"

          unset PKG_CONFIG_PATH
          unset PKG_CONFIG_LIBDIR

          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/
          export PKG_CONFIG_ALLOW_CROSS=1

          echo "=== pkg-config ==="

          pkg-config --modversion gstreamer-1.0
          pkg-config --modversion gstreamer-video-1.0
          pkg-config --modversion gstreamer-app-1.0
          pkg-config --modversion freetype2
          pkg-config --modversion libpulse
          pkg-config --modversion libavcodec || true

          export CFLAGS="-O3 -pipe"
          export CXXFLAGS="-O3 -pipe"

          export CROSSCFLAGS="-O3 -pipe"
          export CROSSCXXFLAGS="-O3 -pipe"

          export LDFLAGS="
            -s
            -L/usr/lib/aarch64-linux-gnu
            -Wl,--dynamic-linker=/data/data/com.termux/files/usr/glibc/lib/ld-linux-aarch64.so.1
            -Wl,-rpath=/data/data/com.termux/files/usr/glibc/lib
          "

          export WINE_NLS_DIR=/opt/wine64-native/nls

          BRANCH="${{ github.event.inputs.wine_branch || 'staging' }}"

          EXTRA=""

          if [ "$BRANCH" = "proton9-arm64ec" ]; then

            EXTRA="
              --enable-wineandroid_drv=no
              --with-pulse
              --with-pthread
              --with-freetype
              --without-dbus
              --with-xshm
              --without-wayland
              --without-pcsclite
              --without-cups
              --without-v4l2
              --without-oss
              --without-udev
              --without-usb
              --without-sane
              --without-capi
              --without-opencl
              --without-pcap
              --without-gphoto
            "

            if pkg-config --exists libavcodec; then
              EXTRA="$EXTRA --with-ffmpeg"
            fi

          fi

          if [ "${{ github.event.inputs.preloader || 'on' }}" = "off" ]; then
            EXTRA="$EXTRA --disable-preloader"
          fi

          echo "=== configure ==="

          ../configure \
            --prefix=/tmp/wine-install-wow64 \
            --with-mingw=clang \
            --enable-archs=arm64ec,aarch64,i386,x86_64 \
            --enable-tools \
            --disable-tests \
            --with-vulkan \
            --with-gstreamer \
            --host=aarch64-linux-gnu \
            host_alias=aarch64-linux-gnu \
            build_alias=x86_64-linux-gnu \
            --with-wine-tools=/opt/wine64-native \
            $EXTRA \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++

          echo "=== Cross compiler detection ==="

          grep -E \
            '^(i386|x86_64|aarch64|arm64ec)_CC=' \
            config.log \
            || true

          for var in \
            i386_CC \
            x86_64_CC \
            aarch64_CC \
            arm64ec_CC; do

            VALUE="$(grep "^${var}=" config.log | tail -1 | cut -d= -f2- || true)"

            echo "$var = $VALUE"

            if [ -z "$VALUE" ] ||
               [ "$VALUE" = "false" ]; then

              echo "::error::$var 没有找到有效 cross compiler"
              exit 1

            fi

          done


      # ============================================================
      # 21. 编译 Wine
      # ============================================================

      - name: 编译 ARM64 WOW64
        run: |
          set -eux

          cd "$WINE_SOURCE_DIR/source/build-arm64"

          make -j"$(nproc)"


      # ============================================================
      # 22. 安装
      # ============================================================

      - name: 安装 ARM64 WOW64
        run: |
          set -eux

          cd "$WINE_SOURCE_DIR/source/build-arm64"

          make install

          test -d /tmp/wine-install-wow64/bin


      # ============================================================
      # 23. 补全 NLS / fonts / wine.inf
      # ============================================================

      - name: 补全 Wine runtime
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"
          BUILD="$WINE_SOURCE_DIR/source/build-arm64"
          SOURCE="$WINE_SOURCE_DIR/source"

          mkdir -p \
            "$TARGET/share/wine/nls" \
            "$TARGET/share/wine/fonts" \
            "$TARGET/lib/wine/aarch64-windows" \
            "$TARGET/lib/wine/aarch64-unix"

          # NLS
          cp -aL \
            /opt/nls-backup/. \
            "$TARGET/share/wine/nls/"

          # fonts
          if [ -d "$SOURCE/fonts" ]; then
            cp -a \
              "$SOURCE/fonts/"*.ttf \
              "$SOURCE/fonts/"*.fon \
              "$TARGET/share/wine/fonts/" \
              2>/dev/null || true
          fi

          # wine.inf
          WINE_INF=""

          WINE_INF="$(find "$BUILD" \
            -name wine.inf \
            -type f \
            2>/dev/null \
            | head -1)"

          if [ -z "$WINE_INF" ] &&
             [ -f "$SOURCE/dlls/wine.inf/wine.inf" ]; then
            WINE_INF="$SOURCE/dlls/wine.inf/wine.inf"
          fi

          if [ -n "$WINE_INF" ]; then
            cp -v \
              "$WINE_INF" \
              "$TARGET/share/wine/wine.inf"
          else
            echo "::warning::没有找到 wine.inf"
          fi


      # ============================================================
      # 24. 安装 FEX
      # ============================================================

      - name: 安装 FEX 到 Wine
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"
          FEX_ROOT="$FEX_SOURCE_DIR/install"

          mkdir -p \
            "$TARGET/lib/wine/aarch64-windows" \
            "$TARGET/lib/wine/aarch64-unix" \
            "$TARGET/share/fex-emu"

          # --------------------------------------------------------
          # Windows ARM64EC
          # --------------------------------------------------------

          ARM64EC_DLL="$(find "$FEX_ROOT" \
            -name libarm64ecfex.dll \
            -type f \
            | head -1)"

          # --------------------------------------------------------
          # Windows AArch64 WOW64
          # --------------------------------------------------------

          WOW64_DLL="$(find "$FEX_ROOT" \
            -name libwow64fex.dll \
            -type f \
            | head -1)"

          test -n "$ARM64EC_DLL"
          test -n "$WOW64_DLL"

          cp -av \
            "$ARM64EC_DLL" \
            "$TARGET/lib/wine/aarch64-windows/"

          cp -av \
            "$WOW64_DLL" \
            "$TARGET/lib/wine/aarch64-windows/"


          # --------------------------------------------------------
          # UnixLib
          # --------------------------------------------------------

          UNIXLIB_DIR="$(find "$FEX_ROOT" \
            -type d \
            -path '*/aarch64-unix' \
            | head -1)"

          if [ -z "$UNIXLIB_DIR" ]; then
            echo "::error::没有找到 FEX aarch64-unix UnixLib"
            find "$FEX_ROOT" -maxdepth 6 -type f | sort
            exit 1
          fi

          cp -av \
            "$UNIXLIB_DIR/." \
            "$TARGET/lib/wine/aarch64-unix/"


          # --------------------------------------------------------
          # Config.json
          # --------------------------------------------------------

          FEX_CONFIG="$(find "$FEX_ROOT" \
            -name Config.json \
            -type f \
            | head -1 || true)"

          if [ -n "$FEX_CONFIG" ]; then
            cp -av \
              "$FEX_CONFIG" \
              "$TARGET/share/fex-emu/Config.json"
          else
            echo "::warning::FEX Config.json 不存在"
          fi


      # ============================================================
      # 25. 验证 FEX runtime
      # ============================================================

      - name: 验证 FEX runtime
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          test -f \
            "$TARGET/lib/wine/aarch64-windows/libwow64fex.dll"

          test -f \
            "$TARGET/lib/wine/aarch64-windows/libarm64ecfex.dll"

          test -d \
            "$TARGET/lib/wine/aarch64-unix"

          echo "=== Windows FEX ==="

          file \
            "$TARGET/lib/wine/aarch64-windows/"*.dll

          echo "=== UnixLib ==="

          find \
            "$TARGET/lib/wine/aarch64-unix" \
            -maxdepth 1 \
            -type f \
            -print

          echo "=== FEX files ==="

          find \
            "$TARGET/lib/wine" \
            -maxdepth 2 \
            -type f \
            | sort


      # ============================================================
      # 26. Wine runtime 完整性
      # ============================================================

      - name: 验证 Wine runtime
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          for f in \
            wine \
            wineserver \
            wineboot \
            winecfg \
            regedit; do

            if [ ! -f "$TARGET/bin/$f" ] &&
               [ ! -L "$TARGET/bin/$f" ]; then

              echo "::error::缺少 $f"
              exit 1

            fi

          done

          test -f "$TARGET/share/wine/nls/locale.nls"

          test -d "$TARGET/lib/wine/aarch64-windows"

          test -d "$TARGET/lib/wine/aarch64-unix"

          echo "Wine runtime validation OK"


      # ============================================================
      # 27. Wine ELF 检查
      # ============================================================

      - name: 检查 Wine ELF
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          file "$TARGET/bin/wine"
          file "$TARGET/bin/wineserver"

          readelf -h "$TARGET/bin/wine" | \
            grep -E \
            'Class:|Machine:|Type:'


      # ============================================================
      # 28. 生成 manifest
      # ============================================================

      - name: 生成构建 manifest
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          cat > "$TARGET/BUILD-MANIFEST.txt" << EOF
          ==========================================
          Wine ARM64 WOW64 Build Manifest
          ==========================================

          Wine:
            describe = ${WINE_DESCRIBE}
            commit   = ${WINE_COMMIT}
            short    = ${WINE_COMMIT_SHORT}

          FEX:
            requested = ${FEX_REF}
            describe  = ${FEX_DESCRIBE}
            commit    = ${FEX_COMMIT}
            short     = ${FEX_COMMIT_SHORT}

          llvm-mingw:
            date = ${LLVMMINGW_DATE}
            name = ${LLVMMINGW_NAME}

          Build:
            branch = ${{ github.event.inputs.wine_branch || 'staging' }}
            type   = ${{ github.event.inputs.build_type || 'wow64' }}
            preloader = ${{ github.event.inputs.preloader || 'on' }}
            android_execmem_patch = ${{ github.event.inputs.android_execmem_patch || 'off' }}
            address_space_patch = ${{ github.event.inputs.address_space_patch || 'off' }}

          Host:
            Debian = 12
            host   = x86_64
            target = aarch64

          PE architectures:
            i386
            x86_64
            aarch64
            arm64ec

          FEX runtime:
            libwow64fex.dll
            libarm64ecfex.dll
            aarch64-unix UnixLib

          GitHub:
            workflow = ${{ github.workflow }}
            sha      = ${{ github.sha }}
            run_id   = ${{ github.run_id }}

          ==========================================
          EOF


      # ============================================================
      # 29. Termux README
      # ============================================================

      - name: 生成 Termux 部署说明
        run: |
          set -eux

          TARGET="/tmp/wine-install-wow64"

          cat > "$TARGET/README-TERMUX.txt" << EOF
          ==========================================
          Wine ARM64 WOW64 for Termux glibc
          ==========================================

          Build:
            ${BUILD_NAME}

          Wine:
            ${WINE_DESCRIBE}
            commit: ${WINE_COMMIT}

          FEX:
            ${FEX_DESCRIBE}
            commit: ${FEX_COMMIT}

          llvm-mingw:
            ${LLVMMINGW_NAME}

          ==========================================
          安装
          ==========================================

          建议：

          /data/data/com.termux/files/usr/glibc/opt/${BUILD_NAME}

          保持目录结构完整。

          ==========================================
          环境变量
          ==========================================

          export WINE_DIR=/data/data/com.termux/files/usr/glibc/opt/${BUILD_NAME}

          export PATH="\$WINE_DIR/bin:\$PATH"

          export LD_LIBRARY_PATH="\$WINE_DIR/lib:/data/data/com.termux/files/usr/glibc/lib"

          export WINEDLLPATH="\$WINE_DIR/lib/wine"

          export WINEPREFIX="\$HOME/.wine"

          export WINEESYNC=0

          export DISPLAY=:0

          ==========================================
          FEX
          ==========================================

          ARM64EC:
            lib/wine/aarch64-windows/libarm64ecfex.dll

          WOW64:
            lib/wine/aarch64-windows/libwow64fex.dll

          UnixLib:
            lib/wine/aarch64-unix/

          ==========================================
          machine-id
          ==========================================

          F=/data/data/com.termux/files/usr/glibc/etc/machine-id

          [ -s "\$F" ] || \
            head -c 16 /dev/urandom | \
            od -An -tx1 | \
            tr -d ' \n' > "\$F"

          ==========================================
          图形
          ==========================================

          export DISPLAY=:0

          Termux:X11：

          DISPLAY=:0

          Vulkan / DXVK：

          根据你的 Termux Turnip 环境自行设置：

          VK_ICD_FILENAMES=...
          MESA_LOADER_DRIVER_OVERRIDE=zink

          ==========================================
          注意
          ==========================================

          1. WINEESYNC 建议关闭。

          2. Android/Termux 下 /tmp 通常不能直接作为 Wine runtime
             的可靠临时目录，本构建已针对部分 Wine / server 路径
             使用 Termux tmp。

          3. 如果出现：

             libwow64fex.dll
             libarm64ecfex.dll
             fexcore
             UnixLib

             相关崩溃，首先检查 Wine/FEX commit 是否匹配。

          4. FEX 32-bit Windows backend 目前仍属于需要实际游戏验证
             的部分，不要假设所有 Win32 程序都和 Win64 ARM64EC
             程序具有相同兼容性。

          5. 如果遇到 Android seccomp SIGSYS，可以重新构建：

             preloader = off

          6. 如果遇到 Android EXECMEM / SELinux 相关问题，可以尝试：

             android_execmem_patch = on

          7. 地址空间 workaround 默认关闭。
             如果特定 Android 环境出现地址空间 mmap 问题，
             再使用：

             address_space_patch = on

          ==========================================
          EOF


      # ============================================================
      # 30. 打包
      # ============================================================

      - name: 准备打包
        run: |
          set -eux

          PACKAGE_NAME="${BUILD_NAME}"

          rm -rf wine-package

          mkdir -p \
            "wine-package/${PACKAGE_NAME}"

          cp -a \
            /tmp/wine-install-wow64/. \
            "wine-package/${PACKAGE_NAME}/"


      - name: 创建 tar.xz
        run: |
          set -eux

          PACKAGE_NAME="${BUILD_NAME}"

          tar -cJf \
            "${PACKAGE_NAME}.tar.xz" \
            -C wine-package \
            "$PACKAGE_NAME"

          ls -lh \
            "${PACKAGE_NAME}.tar.xz"


      # ============================================================
      # 31. checksum
      # ============================================================

      - name: Generate checksums
        run: |
          set -eux

          sha256sum \
            *.tar.xz \
            > checksums.txt

          cat checksums.txt


      # ============================================================
      # 32. Artifact
      # ============================================================

      - name: Upload Wine artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wine-${{ github.event.inputs.wine_branch || 'staging' }}-${{ github.event.inputs.wine_version || 'latest' }}-ARM64-WOW64
          path: |
            *.tar.xz
            checksums.txt
          retention-days: 30


      # ============================================================
      # 33. GitHub Release
      # ============================================================

      - name: 发布 Wine Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.BUILD_NAME }}

          name: Wine ARM64 WOW64 ${{ env.WINE_DESCRIBE }}

          body: |
            # Wine ARM64 WOW64 for Termux glibc

            ## Wine

            - Version: ${{ env.WINE_DESCRIBE }}
            - Commit: ${{ env.WINE_COMMIT }}
            - Branch: ${{ github.event.inputs.wine_branch || 'staging' }}

            ## FEX

            - Requested: ${{ env.FEX_REF }}
            - Version: ${{ env.FEX_DESCRIBE }}
            - Commit: ${{ env.FEX_COMMIT }}

            ## Architecture

            - Host: x86_64 Debian 12
            - Target: ARM64
            - Windows PE:
              - i386
              - x86_64
              - aarch64
              - arm64ec

            ## FEX

            - libwow64fex.dll
            - libarm64ecfex.dll
            - FEX aarch64 UnixLib

            ## Features

            - ARM64 native Wine
            - Wine WOW64
            - ARM64EC
            - FEX x86/x64 emulation backend
            - Vulkan
            - GStreamer
            - FFmpeg
            - PulseAudio
            - X11
            - Chinese NLS
            - Termux glibc runtime adjustments

            ## Android compatibility switches

            - preloader: ${{ github.event.inputs.preloader || 'on' }}
            - android_execmem_patch: ${{ github.event.inputs.android_execmem_patch || 'off' }}
            - address_space_patch: ${{ github.event.inputs.address_space_patch || 'off' }}

            ## Important

            FEX is built separately for:

            - ARM64EC
            - ARM64 WOW64
            - ARM64 UnixLib

            Wine and FEX commits are recorded in:

            `BUILD-MANIFEST.txt`

          files: |
            ${{ github.workspace }}/${{ env.BUILD_NAME }}.tar.xz
            ${{ github.workspace }}/checksums.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
